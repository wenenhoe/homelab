default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .config/.yamllint]
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint
        stages: [pre-push]
        # Upstream's own manifest sets always_run: true, which silently
        # defeats a files: filter on its own — both overrides are
        # required together, or this still fires on every push
        # regardless of what changed (confirmed against the actual
        # ansible/ansible-lint manifest, not assumed).
        always_run: false
        # Same file set as pr-checks.yml's ansible_lint path-filter —
        # see docs/topics/engineering/ci/doc-checks.md#docs-drift-check and that workflow's own
        # comment on why pyproject.toml/uv.lock aren't included here.
        files: ^(ansible/|\.config/\.ansible-lint$|\.config/\.pre-commit-config\.yaml$)
        # Overrides upstream's own `entry: python3 -m ansiblelint -v
        # --force-color` to force a UTF-8 locale explicitly — ansible-core
        # hard-requires one and errors ("Ansible requires the locale
        # encoding to be UTF-8; Detected None") when the calling process
        # doesn't set LANG/LC_ALL, which some GUI git clients (e.g.
        # lazygit spawning pre-push) don't inherit from a login shell.
        # C.UTF-8 is used over en_US.UTF-8 since it ships with glibc by
        # default — no locale-gen needed on a fresh machine or CI runner.
        entry: env LC_ALL=C.UTF-8 LANG=C.UTF-8 python3 -m ansiblelint -v --force-color
        args: [-c, .config/.ansible-lint, --project-dir, ansible]
        additional_dependencies:
          - ansible
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/docker-compose-linter/pre-commit-dclint
    rev: v3.1.0
    hooks:
      - id: dclint-docker
        # (\.j2)? at the end — same reasoning as renovate.json5's
        # docker-compose managerFilePatterns: compose.yaml.j2 is still
        # a compose file, just also referencing an Ansible var (see
        # docs/topics/deploy/adding-an-app.md). Confirmed dclint parses the embedded
        # {{ }} fine (it's just YAML scalar content) and --fix doesn't
        # touch it.
        files: (docker-)?compose(\..+)?\.ya?ml(\.j2)?$
        args: [--fix, --config, .config/.dclintrc]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        # No .config/ entry: accepted-risk findings here are per-file and
        # justified inline (`# hadolint ignore=DLxxxx # reason`) next to
        # the line they apply to, not a repo-wide ignore list — see
        # docker/caddy/Dockerfile and docker/molecule-dind/Dockerfile.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      # No files: override (unlike dclint-docker/hadolint-docker above):
      # every script here is a real .sh with a #!/usr/bin/env bash
      # shebang, which the default `types: [shell]` already detects.
      # No args either — confirmed clean (default severity, no
      # --external-sources needed: nothing here sources another file)
      # against every .sh in the repo before adding this hook.
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Docker variant so shellcheck/pyflakes are present: without them on
      # PATH actionlint silently skips its `run:` block checks (no error,
      # just fewer findings), and the image bundles both (Dockerfile at
      # this tag). Its entry pins the image tag to this rev, so one
      # Renovate bump moves both.
      - id: actionlint-docker
        args: [-config-file, .config/.actionlint.yaml]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      # args replaces the manifest's own, so --no-progress is repeated.
      - id: zizmor
        args: [--no-progress, --config, .config/zizmor.yml]
  - repo: local
    hooks:
      - id: generate-doc-indexes
        name: generate-doc-indexes
        description: >-
          Regenerates docs/projects/README.md's Index and By initiative
          tables and docs/decisions/README.md's Lineages index from
          frontmatter
          — see tools/doc_scripts/generate_doc_indexes.py. Runs before
          markdownlint/check-doc-drift below, so a bad generation is
          caught the same way a bad hand-edit already is.
        entry: bash -c 'cd tools && python3 -m doc_scripts.generate_doc_indexes' --
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--config, .config/.markdownlint.yaml]
  - repo: local
    hooks:
      - id: check-doc-drift
        name: check-doc-drift
        description: >-
          ansible/molecule-testing/deployment-flow/ci/pipeline.md stay in sync
          with the roles, playbooks, scenarios, and CI jobs they
          describe — see tools/doc_scripts/check_doc_drift.py.
        entry: bash -c 'cd tools && python3 -m doc_scripts.check_doc_drift' --
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
      - id: check-secret-catalog
        name: check-secret-catalog
        description: >-
          Every secret_catalog.yaml entry follows the rules the registry's
          header comment states — see
          tools/ci/gates/secret_catalog_rules.py. Needs only PyYAML.
        entry: bash -c 'cd tools && python3 -m ci.gates.secret_catalog_rules' --
        language: python
        additional_dependencies: [pyyaml]
        files: ^(ansible/inventory/group_vars/all/secret_catalog\.yaml|tools/(utils/secret_catalog|ci/gates/secret_catalog_rules)\.py)$
        pass_filenames: false
      - id: check-app-catalog
        name: check-app-catalog
        description: >-
          Every app in app_catalog.yaml keeps the invariants a merge
          cannot: unique names, backup.volumes within volumes, an
          upstream on every route, each backup setting in its shape, and
          cloud targets and backup-host credentials that exist in the
          inventory - see tools/ci/gates/app_catalog_rules.py. Needs only
          PyYAML.
        entry: bash -c 'cd tools && python3 -m ci.gates.app_catalog_rules' --
        language: python
        additional_dependencies: [pyyaml]
        files: "^(ansible/inventory/(inventory\\.yaml|group_vars/all/(app_catalog|main|secret_catalog)\\.yaml\
          |host_vars/[^/]+\\.yaml)|tools/(utils/(app_catalog|unique_key_yaml)|ci/gates/app_catalog_rules)\\.py)$"
        pass_filenames: false
      - id: check-image-pins
        name: check-image-pins
        description: >-
          Every compose file's and Molecule scenario's ghcr.io/wenenhoe
          image reference matches the tag its Dockerfile makes the build
          workflow publish, and every Dockerfile has an entry in
          tools/ci/images/registry.py. Stdlib-only, so it needs no extra
          dependencies.
        entry: bash -c 'cd tools && python3 -m ci.images.registry check-pins' --
        language: python
        pass_filenames: false
        always_run: true
      - id: check-molecule-image-vars
        name: check-molecule-image-vars
        description: >-
          Molecule playbooks name their helper images through
          molecule_helpers/vars/images/, never as literals, and each
          play loads exactly the image files it uses — see
          tools/ci/images/molecule_vars.py. Stdlib-only, so it needs no
          extra dependencies.
        entry: bash -c 'cd tools && python3 -m ci.images.molecule_vars check' --
        language: python
        pass_filenames: false
        always_run: true
      - id: check-project-scope
        name: check-project-scope
        description: >-
          A commit that works a project doc (frontmatter or a stage status) stays inside that project's
          allowed_paths, read from HEAD - see
          tools/doc_scripts/check_project_scope.py. Looks only at what is
          staged, so it passes trivially under `--all-files` in CI, where
          the project-checks job checks the whole PR instead.
        entry: bash -c 'cd tools && python3 -m doc_scripts.check_project_scope --staged' --
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
      - id: check-project-close
        name: check-project-close
        description: >-
          A commit that deletes a project doc leaves the revision its
          decision: names accepted or still named by another project - see
          tools/doc_scripts/check_project_close.py. Looks only at what is
          staged, so it passes trivially under `--all-files` in CI, where
          the project-checks job checks the whole PR instead.
        entry: bash -c 'cd tools && python3 -m doc_scripts.check_project_close --staged' --
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        always_run: true
