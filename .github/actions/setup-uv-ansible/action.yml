name: Setup uv + Ansible Galaxy collections
description: >-
  Installs uv, optionally checks uv.lock is current, syncs the dev
  environment, and optionally caches + installs Ansible Galaxy
  collections and/or pre-commit's own hook environments. Every CI job
  needing this toolchain used to hand-roll its own copy of this
  sequence with small variations (--locked or not, a lock-check step or
  not, Galaxy collections or not) — this action covers all of those via
  inputs so the step sequence itself has one copy.
  Caller is still responsible for checkout beforehand.

inputs:
  locked:
    description: >-
      Pass --locked to `uv sync` (fail instead of silently re-resolving
      if pyproject.toml/uv.lock disagree with the environment). Use
      "true" for CI jobs that must run against exactly what's committed;
      leave "false" for jobs like pre-commit where that's not the point.
    required: false
    default: "false"
  check-lock:
    description: >-
      Run `uv lock --check` before syncing — fails if uv.lock is stale
      relative to pyproject.toml. Only the uv-lock job needs this.
    required: false
    default: "false"
  install-galaxy-collections:
    description: >-
      Cache (keyed on ansible/requirements.yml +
      ansible/roles/molecule_helpers/role-requirements.yml) and install
      Ansible Galaxy collections via `ansible-galaxy collection install
      -r requirements.yml`, run from the ansible/ directory. Skip for
      jobs that never touch Ansible (pre-commit, uv-lock).
    required: false
    default: "false"
  save-uv-cache:
    description: >-
      Persist this job's uv cache back to the GitHub Actions cache
      (passed straight through to astral-sh/setup-uv's own save-cache
      input). Every job still restores an existing cache regardless of
      this flag — only saving is gated. Leave "false" (the default) for
      ordinary jobs; only the dedicated warm jobs set "true" —
      pr-checks.yml's warm-uv-cache and warm-caches.yml on main — so a
      PR that changes uv.lock/pyproject.toml gets exactly one job
      writing the new cache entry instead of every uv-consuming job
      racing to write it — see docs/ci.md#cache-warming.
    required: false
    default: "false"
  save-galaxy-cache:
    description: >-
      Same one-writer reasoning as save-uv-cache above, for the Ansible
      Galaxy collections cache specifically. Only pr-checks.yml's
      warm-galaxy-cache job and warm-caches.yml set "true". Has no
      effect unless install-galaxy-collections is also "true".
    required: false
    default: "false"
  install-precommit-hooks:
    description: >-
      Restore pre-commit's own hook-environment cache (~/.cache/pre-commit)
      and run `pre-commit install-hooks -c .config/.pre-commit-config.yaml`,
      leaving it built for a later `pre-commit run` step in the same job.
      Skip for jobs that never invoke pre-commit (uv-lock,
      deploy-ordering-check, molecule, compose-boot-test).
    required: false
    default: "false"
  save-precommit-cache:
    description: >-
      Same one-writer reasoning as save-uv-cache/save-galaxy-cache above,
      for pre-commit's own hook-environment cache specifically. Only
      pr-checks.yml's warm-pre-commit-cache job and warm-caches.yml
      set "true". Has no effect unless install-precommit-hooks is also
      "true".
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        save-cache: ${{ inputs.save-uv-cache }}

    # Fails if pyproject.toml and uv.lock have drifted apart — catches a
    # lockfile-maintenance PR that didn't actually regenerate the lock,
    # or a manual edit that broke resolution.
    - name: Check lock file is current
      if: inputs.check-lock == 'true'
      shell: bash
      run: uv lock --check

    - name: Sync dev environment
      shell: bash
      run: uv sync --group dev${{ inputs.locked == 'true' && ' --locked' || '' }}

    # Restore-only: same reasoning as the Galaxy collections block
    # below. cache-primary-key (not a second hashFiles(...) call) is
    # what the save step below reuses, so the key expression has
    # exactly one copy.
    - name: Restore pre-commit hook environments cache
      id: pre-commit-cache-restore
      if: inputs.install-precommit-hooks == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.config/.pre-commit-config.yaml') }}

    # Builds/completes whatever the restore above didn't already
    # provide — a no-op per hook already present, so this is cheap on a
    # cache hit and does real work only against a genuinely new
    # .pre-commit-config.yaml. Docker-image-language hooks
    # (hadolint-docker, dclint-docker) have no persistent environment
    # for this to build in the first place (confirmed against a real
    # ~/.cache/pre-commit: their repo dirs stay under 2MB regardless,
    # unlike ansible-lint's isolated `ansible` venv at ~500MB) — the
    # image itself is Docker's own layer cache, untouched by this one.
    - name: Install pre-commit hook environments
      if: inputs.install-precommit-hooks == 'true'
      shell: bash
      run: uv run pre-commit install-hooks -c .config/.pre-commit-config.yaml

    # cache-hit != 'true' skips a pointless re-upload when the restore
    # above already found this exact key.
    - name: Save pre-commit hook environments cache
      if: >-
        inputs.install-precommit-hooks == 'true' &&
        inputs.save-precommit-cache == 'true' &&
        steps.pre-commit-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.pre-commit-cache-restore.outputs.cache-primary-key }}

    # Restore-only: every caller does this, matrix entries included, so
    # it must never attempt to write — concurrent restores of the same
    # key are fine, concurrent *saves* of the same key are the race
    # save-galaxy-cache below exists to avoid. cache-primary-key (not a
    # second hashFiles(...) call) is what the save step below reuses, so
    # the key expression has exactly one copy.
    - name: Restore Ansible Galaxy collections cache
      id: galaxy-cache-restore
      if: inputs.install-galaxy-collections == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ansible/collections
        key: >-
          ansible-galaxy-${{ runner.os }}-${{
            hashFiles('ansible/requirements.yml', 'ansible/roles/molecule_helpers/role-requirements.yml')
          }}

    - name: Install Ansible Galaxy collections
      if: inputs.install-galaxy-collections == 'true'
      shell: bash
      run: uv run ansible-galaxy collection install -r requirements.yml
      working-directory: ansible

    # cache-hit != 'true' skips a pointless re-upload when the restore
    # above already found this exact key — only a genuinely new key
    # (i.e. a real requirements.yml/role-requirements.yml change) needs
    # saving at all.
    - name: Save Ansible Galaxy collections cache
      if: >-
        inputs.install-galaxy-collections == 'true' &&
        inputs.save-galaxy-cache == 'true' &&
        steps.galaxy-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ansible/collections
        key: ${{ steps.galaxy-cache-restore.outputs.cache-primary-key }}
