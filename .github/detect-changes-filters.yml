# dorny/paths-filter's filter rules for pr-checks.yml's detect-changes
# job — pulled out of that job's `filters: |` block so it's diffable and
# reviewable on its own instead of living only inside workflow YAML (same
# reasoning as .github/scripts/wait-for-compose-health.sh's own header
# comment). See docs/ci.md#change-scoped-not-a-full-sweep for what each
# output actually gates.
uv_lock:
  - 'pyproject.toml'
  - 'uv.lock'
any_compose:
  - 'docker/**/compose*.yaml'
# Gates deploy-ordering-check — see docs/ci.md#deploy-ordering-check
# for what it catches and why each path below is in scope.
deploy_ordering:
  - 'ansible/inventory/**'
  - 'ansible/playbooks/**'
  - 'ansible/roles/secrets/**'
  - 'ansible/roles/restore/**'
  - 'pyproject.toml'
  - 'uv.lock'
# Gates whether the job runs at all — the hook itself always
# scans the full ansible/ tree regardless of which files in
# it changed. Not pyproject.toml/uv.lock: the hook's own
# additional_dependencies: [ansible] runs in an isolated
# venv, unrelated to this repo's uv-managed ansible-core pin.
ansible_lint:
  - 'ansible/**'
  - '.config/.ansible-lint'
  - '.config/.pre-commit-config.yaml'
# Gates trivy-scan's Ansible misconfig job below — narrower
# than ansible_lint on purpose (ansible/** only, no lint
# config), since a change to .ansible-lint or pre-commit's
# own config doesn't change what Trivy would find.
trivy_ansible:
  - 'ansible/**'
# ansible/tests/ and tools/tests/ have no molecule/ scenario
# of their own (see docs/ci.md#change-scoped-not-a-full-sweep)
# — these are plain controller-side Python, covered by
# ansible/tests/ and tools/tests/ instead.
python_unit_tests:
  # restore_all.py is the only script left here, now at
  # ansible/scripts/ - its test (test_restore_all.py)
  # lives in ansible/tests/, already its own trigger path
  # below; this one catches changes to the script itself.
  # bootstrap_secrets.py/audit_secrets.py/the two
  # restore_*_from_backup.py scripts (merged into one)/
  # dump_vault_to_file_cache.py/diff_vault_backups.py all
  # moved to tools/openbao_utils/ (ADR 0032, docs/decisions/
  # 0032-where-openbao-utility-scripts-live/revision-000.md) - covered by
  # the tools/openbao_utils/** trigger below instead.
  - 'ansible/scripts/*.py'
  - 'tools/cloud_credentials/**'
  - 'tools/openbao_utils/**'
  - 'tools/utils/**'
  - 'ansible/molecule-coverage/molecule_cov/**'
  # Sibling of molecule_cov/ above - test_callback_plugin.py
  # imports it directly via sys.path, same pattern.
  - 'ansible/molecule-coverage/callback_plugins/**'
  - 'ansible/tests/**'
  - 'tools/tests/**'
  # tools/tests/doc_scripts/ imports these directly via
  # sys.path.
  - '.github/scripts/*.py'
  # Not under ansible/ — imported via sys.path in
  # ansible/tests/test_r2_read_watcher.py (see that file's
  # own docstring for why).
  - 'docker/openbao/watcher/r2_read_watcher.py'
  - 'pyproject.toml'
  - 'uv.lock'
