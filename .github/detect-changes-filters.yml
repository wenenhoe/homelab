# dorny/paths-filter's filter rules for pr-checks.yml's detect-changes
# job — pulled out of that job's `filters: |` block so it's diffable and
# reviewable on its own instead of living only inside workflow YAML (same
# reasoning as the other CI logic that lives in files of its own, not in
# a `run:` block). See docs/topics/engineering/ci/change-scoping.md#change-scoped-not-a-full-sweep for what each
# output actually gates.
# uv_lock, deploy_ordering and python_unit_tests are further narrowed by
# ci.scope.effective_changes: a match only counts if some matched file
# changed for real, not just in a comment or formatting.
uv_lock:
  - 'pyproject.toml'
  - 'uv.lock'
# Gates deploy-ordering-check — see docs/topics/engineering/ci/gates.md#deploy-ordering-check
# for what it catches and why each path below is in scope.
deploy_ordering:
  - 'ansible/inventory/**'
  - 'ansible/playbooks/**'
  - 'ansible/roles/secrets/**'
  - 'ansible/roles/restore/**'
  # The job's two playbook runs and the verdict on the second, the
  # fixtures it seeds first, and the loader they read the catalog with.
  - 'tools/ci/gates/deploy_ordering.py'
  - 'tools/ci/fixtures/**'
  - 'tools/utils/secret_catalog.py'
  - 'tools/utils/unique_key_yaml.py'
  - 'pyproject.toml'
  - 'uv.lock'
# Gates whether the job runs at all — the hook itself always
# scans the full ansible/ tree regardless of which files in
# it changed. Not pyproject.toml/uv.lock: the hook's own
# additional_dependencies: [ansible] runs in an isolated
# venv, unrelated to this repo's uv-managed ansible-core pin.
ansible_lint:
  - 'ansible/**'
  - '.config/.ansible-lint'
  - '.config/.pre-commit-config.yaml'
# Gates trivy-scan's Ansible misconfig job below — narrower
# than ansible_lint on purpose (ansible/** only, no lint
# config), since a change to .ansible-lint or pre-commit's
# own config doesn't change what Trivy would find.
trivy_ansible:
  - 'ansible/**'
# ansible/tests/ and tools/tests/ have no molecule/ scenario
# of their own (see docs/topics/engineering/ci/change-scoping.md#change-scoped-not-a-full-sweep)
# — these are plain controller-side Python, covered by
# ansible/tests/ and tools/tests/ instead.
python_unit_tests:
  # restore_all.py is the only script left here, now at
  # ansible/scripts/ - its test (test_restore_all.py)
  # lives in ansible/tests/, already its own trigger path
  # below; this one catches changes to the script itself.
  # bootstrap_secrets.py/audit_secrets.py/the two
  # restore_*_from_backup.py scripts (merged into one)/
  # dump_vault_to_file_cache.py/diff_vault_backups.py all
  # moved to tools/openbao_utils/ (ADR 0032, docs/decisions/
  # 0032-where-openbao-utility-scripts-live/revision-000.md) - covered by
  # the tools/openbao_utils/** trigger below instead.
  - 'ansible/scripts/*.py'
  - 'tools/cloud_credentials/**'
  - 'tools/openbao_utils/**'
  - 'tools/cd_agent/**'
  - 'tools/utils/**'
  # CI logic that detect-changes and the other workflows run (see
  # docs/topics/engineering/ci/change-scoping.md#molecule-watch-sets), so a change to it is tested here.
  - 'tools/ci/**'
  # The table test_molecule_shards.py checks against the scenarios on disk.
  - '.github/molecule-shards.yml'
  - 'ansible/molecule-coverage/molecule_cov/**'
  # Sibling of molecule_cov/ above - test_callback_plugin.py
  # imports it directly via sys.path, same pattern.
  - 'ansible/molecule-coverage/callback_plugins/**'
  # The filters ansible/ansible.cfg loads for every play; their tests are
  # in ansible/tests/, already a trigger below.
  - 'ansible/filter_plugins/**'
  # Shared module code and the modules in a role's library/; their tests are
  # in ansible/tests/, which pyproject.toml's pythonpath lets import them.
  - 'ansible/module_utils/**'
  - 'ansible/roles/*/library/**'
  - 'ansible/tests/**'
  - 'tools/tests/**'
  # The documentation-workflow checks (ADR 0037); tools/tests/doc_scripts/
  # tests them.
  - 'tools/doc_scripts/**'
  # Not under ansible/ — imported via sys.path in
  # ansible/tests/test_r2_read_watcher.py (see that file's
  # own docstring for why).
  - 'docker/openbao/watcher/r2_read_watcher.py'
  - 'pyproject.toml'
  - 'uv.lock'
# Gates release-checksums: the registry, the verifier and the committed keys,
# and the files that hold the pins it checks — see
# docs/topics/engineering/ci/release-checksum-check.md. Not narrowed by
# ci.scope.effective_changes: the check reads no comments, but a pin file is
# small and the run is cheap, so any change to one is worth a look.
release_checksums:
  - 'tools/ci/checksums/**'
  - 'ansible/roles/cd_agent/defaults/main.yaml'
  - 'ansible/roles/openbao_cli/defaults/main.yaml'
  - 'tools/coderabbit-review/Dockerfile'
# Gates mermaid-check: any markdown file, and the check itself, whose file
# holds the pinned image, so a bump of it is tried against every diagram — see
# docs/topics/engineering/ci/doc-checks.md#mermaid-render-check. Not narrowed by
# ci.scope.effective_changes: a doc change is never a no-op.
mermaid_check:
  - '**/*.md'
  - 'tools/doc_scripts/check_mermaid.py'
