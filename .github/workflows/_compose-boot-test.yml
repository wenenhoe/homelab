name: Reusable - Compose boot test

# Not directly triggerable — called via `uses:` from pr-checks.yml's
# compose-boot-test job (scoped to changed apps, via detect-changes) and
# boot-test-all.yml's compose-boot-test-all job (every app).
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      apps:
        description: >-
          JSON array of app names (each a docker/<app> directory) to
          boot-test, one matrix job per entry. Caller is responsible for
          producing this list (e.g. detect-changes' compose_apps output,
          or boot-test-all.yml's list-apps).
        required: true
        type: string

jobs:
  compose-boot-test:
    if: inputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(inputs.apps) }}
    # Dummy values for env vars referenced by one or more compose files.
    # Harmless no-ops for apps that don't reference a given var — docker
    # compose only substitutes what's actually used. None of these are
    # real credentials: everything here is either non-secret runtime
    # config (TIMEZONE) or only gates one optional feature, confirmed by
    # reading each compose file's own comments/healthcheck target before
    # adding it here — see the individual compose files for that
    # reasoning if extending this list for a new app.
    env:
      TIMEZONE: "UTC"
      COBALT_API_URL: "http://localhost:9000" # gates cobalt's tunneling feature only, not its own healthcheck
      APP_URL: "localhost"
      WEB_APP_URL: "localhost"
      API_KEY: "ci-dummy-key"
      TELEGRAM_TOKEN: "ci-dummy-token"
      TELEGRAM_CHAT_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create shared external network
        run: docker network create caddy-proxy || true

      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"
          install-galaxy-collections: "true"

      # Runs the real compose role's preinit+init tasks (volume creation +
      # config/script seeding — see ansible/roles/compose/tasks/init.yaml
      # and ansible/playbooks/ci_boot_test.yaml) against the actual
      # app_registry.yaml, instead of a bespoke bash step per app.
      #
      # ci-inventory/ is a dedicated CI-only inventory
      # (ansible/ci-inventory/) — bypasses ansible.cfg's default
      # inventory.yaml entirely, whose all:vars: sets a non-standard sudo
      # binary and SSH-only settings meant for real remote hosts, not this
      # runner. Needed group_vars (main.yaml, app_registry.yaml) and CI
      # placeholders (ci_dummy_vars.yaml) are loaded explicitly via
      # vars_files in ci_boot_test.yaml — see its own comments for why.
      #
      # compose_deploy_dir must be passed as -e here (Ansible precedence)
      # rather than relying on the group_vars default.
      - name: Seed ${{ matrix.app }} via the real compose role
        run: |
          uv run ansible-playbook -i ci-inventory/inventory.yaml --connection=local \
            playbooks/ci_boot_test.yaml \
            -e app_name=${{ matrix.app }} \
            -e compose_deploy_dir=/tmp/compose-deploy
        working-directory: ansible

      # lldap-only: see .github/scripts/seed-lldap-ci-cert.sh for why this
      # avoids needing a real DigitalOcean DNS-01 credential in CI.
      - name: Seed a self-signed cert for lldap
        if: matrix.app == 'lldap'
        run: .github/scripts/seed-lldap-ci-cert.sh /tmp/compose-deploy/lldap/.env

      - name: Bring the stack up
        run: docker compose -f "/tmp/compose-deploy/${{ matrix.app }}/compose.yaml" up -d

      # Bring the stack up failing means Wait for healthy state (which
      # normally dumps logs on an unhealthy service) never runs, and Tear
      # down (if: always()) wipes the container right after — without
      # this, the crash reason is gone before anyone can see it.
      - name: DEBUG dump logs if Bring the stack up failed
        if: failure()
        run: docker compose -f "/tmp/compose-deploy/${{ matrix.app }}/compose.yaml" logs

      - name: Wait for healthy state (or, if none defined, that it stayed running)
        run: .github/scripts/wait-for-compose-health.sh "/tmp/compose-deploy/${{ matrix.app }}/compose.yaml"

      - name: Tear down
        if: always()
        run: docker compose -f "/tmp/compose-deploy/${{ matrix.app }}/compose.yaml" down -v
