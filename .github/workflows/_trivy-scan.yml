name: Trivy scan (reusable)

# Shared scan logic for pr-checks.yml (change-scoped) and
# trivy-scheduled.yml (weekly, unscoped) — same workflow_call pattern as
# _compose-boot-test.yml, one copy of the scan steps instead of two
# drifting by hand. See docs/ci.md#trivy-security-scans.
#
# Image CVE scanning and the Vulnerability Dashboard (_trivy-dashboard.yml)
# that aggregated it used to live here too, in a few different forms —
# scoped to compose changes, diff-aware, then ungated on every PR —
# before being dropped entirely. Nearly all of that fleet's findings
# were third-party CVEs pending an upstream rebuild, not something this
# repo could act on regardless of where the scan ran, how often, or how
# results were displayed. Ansible misconfig and secrets stay because a
# finding in either is something this repo actually controls and would
# fix. See docs/ci.md#trivy-security-scans for the full reasoning.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      run-ansible:
        description: 'Run the Ansible misconfiguration scan'
        type: boolean
        default: false
      run-secrets:
        description: 'Run the repo-wide secret scan'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ansible-misconfig-scan:
    if: inputs.run-ansible
    runs-on: ubuntu-latest
    # Trivy's ansible scanner never reads ansible.cfg's `roles_path` —
    # confirmed against pkg/iac/scanners/ansible/parser/parser.go
    # (resolveRolePath): it only checks a `roles/` dir sitting next to
    # the playbook file itself, or this env var. This repo's roles live
    # at the project root (ansible/roles), a sibling of
    # ansible/playbooks/ rather than nested under it, so without this,
    # every `include_role`/`roles:` in every playbook silently fails to
    # resolve ("role \"x\" not found") and the scan covers almost none
    # of this repo's real task content. Job-level (not step-level) so it
    # reaches the trivy-action composite's own process regardless of
    # composite-action env-inheritance behavior. See
    # docs/ci.md#trivy-security-scans.
    env:
      DEFAULT_ROLES_PATH: ${{ github.workspace }}/ansible/roles
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two things this config does that trivy-action has no first-class
      # input for:
      # 1. misconfiguration.scanners: narrows to just the ansible
      #    scanner (--misconfig-scanners ansible).
      # 2. ansible.playbooks: Trivy's own playbook auto-discovery only
      #    lists YAML files sitting directly in the project root
      #    (non-recursive `ReadDir`) — it never finds anything under a
      #    playbooks/ subdirectory, so without this list the scan
      #    silently covers zero playbooks. Generated from the actual
      #    directory listing rather than hand-maintained, so a new
      #    playbook file is covered automatically instead of needing a
      #    matching edit here (import-only fragments like
      #    bootstrap-secrets.yaml get listed too since they're also
      #    real .yaml files here — harmless, just re-evaluates their
      #    tasks under their own entry alongside their host playbook).
      #
      # Generated inline rather than committed, so the secret scan job
      # below can't also auto-discover it if Trivy's cwd-based config
      # lookup ever changes.
      - name: Write ansible-only misconfig-scanners config
        run: |
          {
            echo "misconfiguration:"
            echo "  scanners:"
            echo "    - ansible"
            echo "ansible:"
            echo "  playbooks:"
            for f in ansible/playbooks/*.yaml ansible/playbooks/*.yml; do
              [ -f "$f" ] || continue
              echo "    - \"${f#ansible/}\""
            done
          } > /tmp/trivy-ansible.yaml
          cat /tmp/trivy-ansible.yaml

      - name: Trivy Ansible misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ansible
          trivy-config: /tmp/trivy-ansible.yaml
          format: sarif
          output: trivy-ansible-misconfig.sarif
          exit-code: '0' # report-only for now — see docs/ci.md#trivy-security-scans
          trivyignores: .config/.trivyignore

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-ansible-misconfig.sarif
          category: trivy-ansible-misconfig

  secret-scan:
    if: inputs.run-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          exit-code: '0' # report-only for now — see docs/ci.md#trivy-security-scans
          trivyignores: .config/.trivyignore

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets
