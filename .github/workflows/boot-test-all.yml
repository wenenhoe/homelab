name: Boot-test every compose app

# workflow_dispatch only, deliberately — this is a full sweep across every
# app, not a per-PR check (that's pr-checks.yml's compose-boot-test job,
# scoped to only what changed via detect-changes). A real "test
# everything" button in GitHub's Actions UI.
#
# The actual seed/boot/wait/teardown steps live in the shared
# _compose-boot-test.yml reusable workflow — same one pr-checks.yml's
# compose-boot-test calls — so there's nothing left here to drift out of
# sync by hand.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

jobs:
  list-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List every compose app except the excluded ones
        id: list
        run: |
          # Exclusion list + per-app reasoning lives in
          # .github/compose-boot-test-exclusions.txt — the single source
          # of truth shared with pr-checks.yml's detect-changes and
          # compose-syntax-check.
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)
          apps=$(find docker -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -vE "^($excluded)\$" \
            | sort \
            | jq -R . | jq -sc .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Testing apps: $apps"

  compose-boot-test-all:
    needs: list-apps
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.list-apps.outputs.apps }}
