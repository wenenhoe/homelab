name: Boot-test every compose app

# workflow_dispatch only, deliberately — this is a full sweep across every
# app, not a per-PR check (that's pr-checks.yml's compose-boot-test job,
# scoped to only what changed via detect-changes). A real "test
# everything" button in GitHub's Actions UI.
#
# The actual seed/boot/wait/teardown steps live in the shared
# _compose-boot-test.yml reusable workflow — same one pr-checks.yml's
# compose-boot-test calls — so there's nothing left here to drift out of
# sync by hand. Unlike a PR it boots the *published* images
# (build-dockerfiles: false): this is the check that what a deploy pulls
# exists and works, including a compose pin whose tag was never pushed.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: boot-test-all
  cancel-in-progress: false

jobs:
  list-apps:
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      # Exclusion list + per-app reasoning lives in
      # .github/compose-boot-test-exclusions.txt, read by
      # tools/ci/scope/compose_apps.py — the one place every compose-app
      # list is built.
      - name: List every compose app except the excluded ones
        id: list
        run: uv run python -m ci.scope.compose_apps all
        working-directory: tools

  compose-boot-test-all:
    needs: list-apps
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.list-apps.outputs.apps }}
      build-dockerfiles: false
