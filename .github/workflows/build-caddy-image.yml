name: Build & push Caddy image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    # Weekly, same time-of-day as renovate.yml's daily cron (20:00 UTC =
    # 04:00 Asia/Singapore). Catches upstream `caddy:2.11.4`/`apk add curl`
    # security patches that land without the Dockerfile's text changing,
    # which the push trigger below would otherwise miss.
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-caddy-image
  cancel-in-progress: false

jobs:
  # Only meaningful for the push trigger — schedule/workflow_dispatch runs
  # always rebuild regardless of what changed. Same dorny/paths-filter
  # pattern as pr-checks.yml's detect-changes job; unset `base:` on a push
  # trigger defaults to comparing against the most recent commit on the
  # same branch before the push, which is what we want here.
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Dockerfile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dockerfile:
              - 'ansible/roles/caddy/files/Dockerfile'

  build-and-push:
    needs: detect-changes
    if: >-
      always() &&
      needs.detect-changes.result != 'failure' &&
      needs.detect-changes.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.dockerfile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tags by the final stage's Caddy version, matching
      # docker/caddy/compose.yaml's image: line — Renovate's dockerfile
      # manager bumps this FROM line, so the tag always reflects what's
      # actually in the Dockerfile.
      - name: Resolve image tag from the Dockerfile's final FROM line
        id: version
        run: |
          version=$(grep -E '^FROM caddy:[^-]+$' ansible/roles/caddy/files/Dockerfile | tail -1 | cut -d: -f2)
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull/no-cache only on the weekly schedule run — a change-triggered
      # push already has a fresh base image and gains nothing from
      # discarding layer cache. workflow_dispatch behaves like the push
      # case (uses cache) since it's normally a "rebuild now for a reason
      # I know about" trigger, not a blind refresh.
      #
      # platforms: linux/amd64 is explicit, not left to the runner's
      # default — the fleet is amd64-only (see docs/caddy.md), and an
      # explicit platform keeps that true regardless of what architecture
      # a future runner defaults to.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ansible/roles/caddy/files
          file: ansible/roles/caddy/files/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/wenenhoe/caddy-digitalocean:${{ steps.version.outputs.tag }}
