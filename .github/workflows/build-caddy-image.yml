name: Build & push Caddy image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    # Weekly, same time-of-day as renovate.yml's daily cron (20:00 UTC =
    # 04:00 Asia/Singapore). Catches upstream `caddy:2.11.4`/`apk add curl`
    # security patches that land without docker/caddy/Dockerfile's text
    # changing, which the push trigger below would otherwise miss.
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-caddy-image
  cancel-in-progress: false

jobs:
  # Only meaningful for the push trigger — schedule/workflow_dispatch runs
  # always rebuild regardless of what changed. Same dorny/paths-filter
  # pattern as pr-checks.yml's detect-changes job; unset `base:` on a push
  # trigger defaults to comparing against the most recent commit on the
  # same branch before the push, which is what we want here.
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Dockerfile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dockerfile:
              - 'docker/caddy/Dockerfile'

  build-and-push:
    needs: detect-changes
    if: >-
      always() &&
      needs.detect-changes.result != 'failure' &&
      needs.detect-changes.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.dockerfile == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's name and its tag (the final stage's Caddy version)
      # come from ci.images.registry; `pre-commit`'s check-image-pins holds
      # docker/caddy/compose.yaml's image: line equal to it. Stdlib-only, so
      # plain python3 runs it — no dependencies installed in a job that
      # holds a package-write token.
      - name: Resolve image tags
        id: image
        run: python3 -m ci.images.registry tags caddy
        working-directory: tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # pull/no-cache only on the weekly schedule run — a change-triggered
      # push already has a fresh base image and gains nothing from
      # discarding layer cache. workflow_dispatch behaves like the push
      # case (uses cache) since it's normally a "rebuild now for a reason
      # I know about" trigger, not a blind refresh.
      #
      # platforms: linux/amd64 is explicit, not left to the runner's
      # default — the fleet is amd64-only (see docs/topics/services/caddy.md), and an
      # explicit platform keeps that true regardless of what architecture
      # a future runner defaults to.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/caddy
          file: docker/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.image.outputs.tags }}
