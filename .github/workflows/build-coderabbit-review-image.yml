name: Build & push CodeRabbit review image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'tools/coderabbit-review/Dockerfile'
  schedule:
    # Weekly, same slot as build-caddy-image.yml's schedule trigger — see
    # that workflow for why a schedule is needed alongside the push
    # trigger. Here it picks up base-OS security fixes only: the CLI
    # version and its hash change only when the Dockerfile's text does.
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-coderabbit-review-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile is the one place the CLI version is declared; the
      # resolver rejects a malformed or duplicated ARG before it can reach
      # `tags:`. It emits :<cli-version> and :latest.
      - name: Resolve image tags
        id: image
        run: python3 -m ci.images.registry tags coderabbit-review
        working-directory: tools

      # :<cli-version> is what a consumer points at to back out a bad
      # release; :latest is what coderabbit-review.sh runs. The weekly
      # rebuild refreshes the OS layer under the current version's tag.
      #
      # pull/no-cache only on the weekly schedule — same reasoning as
      # build-caddy-image.yml.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/coderabbit-review
          file: tools/coderabbit-review/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.image.outputs.tags }}
