name: Build & push CodeRabbit review image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    # Weekly, same slot as build-caddy-image.yml's schedule trigger — see
    # that workflow for why a schedule is needed alongside the push
    # trigger. Here it picks up base-OS security fixes only: the CLI
    # version and its hash change only when the Dockerfile's text does.
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-coderabbit-review-image
  cancel-in-progress: false

jobs:
  # Same reasoning and pattern as build-caddy-image.yml's detect-changes.
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Dockerfile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dockerfile:
              - 'tools/coderabbit-review/Dockerfile'

  build-and-push:
    needs: detect-changes
    if: >-
      always() &&
      needs.detect-changes.result != 'failure' &&
      needs.detect-changes.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.dockerfile == 'true')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile is the one place the CLI version is declared. It is
      # validated before it reaches `tags:` so a malformed or duplicated ARG
      # fails the run instead of publishing a mistagged image.
      - name: Resolve CLI version
        id: cli
        run: |
          line="$(grep -E '^ARG CODERABBIT_VERSION=' tools/coderabbit-review/Dockerfile || true)"
          if [ "$(printf '%s\n' "$line" | wc -l)" -ne 1 ] \
              || ! printf '%s' "$line" | grep -Eq '^ARG CODERABBIT_VERSION=[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected exactly one 'ARG CODERABBIT_VERSION=X.Y.Z' in the Dockerfile, got: '$line'" >&2
            exit 1
          fi
          echo "version=${line#ARG CODERABBIT_VERSION=}" >> "$GITHUB_OUTPUT"

      # :<cli-version> is what a consumer points at to back out a bad
      # release; :latest is what coderabbit-review.sh runs. The weekly
      # rebuild refreshes the OS layer under the current version's tag.
      #
      # pull/no-cache only on the weekly schedule — same reasoning as
      # build-caddy-image.yml.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/coderabbit-review
          file: tools/coderabbit-review/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ghcr.io/wenenhoe/coderabbit-review:latest
            ghcr.io/wenenhoe/coderabbit-review:${{ steps.cli.outputs.version }}
