name: Build & push Molecule DinD image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    # Weekly, same slot as build-caddy-image.yml's schedule trigger — see
    # that workflow for why a schedule is needed alongside the push
    # trigger. Here it catches upstream docker-ce/fuse-overlayfs security
    # patches, and geerlingguy/docker-ubuntu2604-ansible:latest moving,
    # neither of which changes this Dockerfile's own text.
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-molecule-dind-image
  cancel-in-progress: false

jobs:
  # Same reasoning and pattern as build-caddy-image.yml's detect-changes.
  # ansible/roles/docker/tasks/main.yaml is included too: it's what this
  # Dockerfile is meant to mirror (see the Dockerfile's own top comment),
  # so a change there should at least force a rebuild even though nothing
  # re-checks the two stayed in sync.
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Dockerfile or mirrored-role changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'docker/molecule-dind/Dockerfile'
              - 'ansible/roles/docker/tasks/main.yaml'

  build-and-push:
    needs: detect-changes
    if: >-
      always() &&
      needs.detect-changes.result != 'failure' &&
      needs.detect-changes.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No upstream version to tag by (base image floats on :latest) —
      # unlike caddy/wastebin, this image is test scaffolding, not a
      # deployed app, so a single mutable :latest tag matches how
      # geerlingguy/docker-ubuntu2604-ansible:latest is already
      # referenced by every DinD molecule.yml today.
      #
      # pull/no-cache only on the weekly schedule — same reasoning as
      # build-caddy-image.yml.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/molecule-dind
          file: docker/molecule-dind/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/wenenhoe/molecule-dind:latest
