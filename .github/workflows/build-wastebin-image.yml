name: Build & push wastebin image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'docker/wastebin/Dockerfile'
  schedule:
    # Weekly, same slot as build-caddy-image.yml's schedule trigger — see
    # that workflow for why a schedule is needed alongside the push
    # trigger (catches upstream busybox:1.37.0-musl patches that land
    # without docker/wastebin/Dockerfile's text changing).
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-wastebin-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image's name and its tag (the upstream wastebin version) come
      # from ci.images.registry; see build-caddy-image.yml for why this is
      # plain python3 and what holds compose.yaml's pin equal to it.
      - name: Resolve image tags
        id: image
        run: python3 -m ci.images.registry tags wastebin
        working-directory: tools

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same pull/no-cache-on-schedule-only and explicit-amd64 reasoning
      # as build-caddy-image.yml.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/wastebin
          file: docker/wastebin/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.image.outputs.tags }}
