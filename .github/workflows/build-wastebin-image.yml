name: Build & push wastebin image

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  schedule:
    # Weekly, same slot as build-caddy-image.yml's schedule trigger — see
    # that workflow for why a schedule is needed alongside the push
    # trigger (catches upstream busybox:1.37.0-musl patches that land
    # without docker/wastebin/Dockerfile's text changing).
    - cron: "0 20 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-wastebin-image
  cancel-in-progress: false

jobs:
  # Same reasoning and pattern as build-caddy-image.yml's detect-changes.
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Dockerfile changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            dockerfile:
              - 'docker/wastebin/Dockerfile'

  build-and-push:
    needs: detect-changes
    if: >-
      always() &&
      needs.detect-changes.result != 'failure' &&
      needs.detect-changes.result != 'cancelled' &&
      (github.event_name != 'push' || needs.detect-changes.outputs.dockerfile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tags by the upstream wastebin version, matching
      # docker/wastebin/compose.yaml's image: line — Renovate's dockerfile
      # manager bumps this FROM line, so the tag always reflects what's
      # actually in the Dockerfile.
      - name: Resolve image tag from the Dockerfile's first FROM line
        id: version
        run: |
          version=$(grep -E '^FROM quxfoo/wastebin:[^ ]+$' docker/wastebin/Dockerfile | cut -d: -f2)
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same pull/no-cache-on-schedule-only and explicit-amd64 reasoning
      # as build-caddy-image.yml.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/wastebin
          file: docker/wastebin/Dockerfile
          platforms: linux/amd64
          push: true
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/wenenhoe/wastebin:${{ steps.version.outputs.tag }}
