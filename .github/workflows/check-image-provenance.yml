name: Check image provenance

# Once a week, and on demand. A pinned digest is checked when its reference
# changes (pr-checks.yml's provenance job); this asks each publisher again, so
# a signature or attestation that disappeared, or an identity that changed, is
# noticed even when no pin did.
# See docs/topics/engineering/ci/image-provenance-check.md.
#
# The minute is off the hour to stay clear of the top-of-the-hour crowd on
# GitHub's scheduler. It follows check-image-tags.yml and
# check-release-checksums.yml on Sunday, and Renovate (Mon/Thu window, see
# renovate.yml) is furthest away then.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "13 4 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-image-provenance
  cancel-in-progress: false

jobs:
  check-image-provenance:
    runs-on: ubuntu-26.04
    # Bounds the retries and the cosign image pull: a full run takes minutes
    # at most when the registries and GitHub answer.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib-only, so plain python3 (no uv, no dependencies). gh and docker
      # come with the runner image, and docker runs the pinned cosign image.
      # The workflow's own read-only token is what `gh attestation verify`
      # authenticates with; no other secret.
      - name: Check every pinned image digest against its publisher
        run: python3 -m ci.provenance.verify
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
