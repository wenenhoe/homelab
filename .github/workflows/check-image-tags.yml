name: Check image tags exist

# Once a week, and on demand. Renovate only proposes tags that exist, so a tag
# an upstream later removes or renames goes unnoticed until a deploy fails to
# pull it. This asks each registry whether every image this repo pins is still
# there — see docs/topics/engineering/ci/image-tag-check.md.
#
# Weekly on purpose: a couple of HEAD requests per image (43 images on
# ghcr.io and Docker Hub today), spaced out and retried politely
# (tools/ci/images/remote.py), so rate limiting is not a concern at this
# frequency. The minute is off the hour to stay clear of the
# top-of-the-hour crowd on GitHub's scheduler; Sunday is the day Renovate
# (Mon/Thu window, see renovate.yml) is furthest away.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: check-image-tags
  cancel-in-progress: false

jobs:
  check-image-tags:
    runs-on: ubuntu-26.04
    # Bounds the retries and the cooldown pass: a full run is well under a
    # minute when the registries answer.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib-only, so plain python3 (no uv, no dependencies, no secrets):
      # every request is anonymous.
      - name: Check every pinned image tag still exists
        run: python3 -m ci.images.remote check
        working-directory: tools
