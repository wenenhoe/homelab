name: PR checks

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scopes the expensive jobs below to what this PR actually touched —
  # see docs/topics/engineering/ci/change-scoping.md#change-scoped-not-a-full-sweep.
  detect-changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      uv_lock: ${{ steps.effective.outputs.uv_lock }}
      deploy_ordering: ${{ steps.effective.outputs.deploy_ordering }}
      ansible_lint: ${{ steps.filter.outputs.ansible_lint }}
      trivy_ansible: ${{ steps.filter.outputs.trivy_ansible }}
      release_checksums: ${{ steps.filter.outputs.release_checksums }}
      mermaid_check: ${{ steps.filter.outputs.mermaid_check }}
      python_unit_tests: ${{ steps.effective.outputs.python_unit_tests }}
      roles: ${{ steps.spike_roles.outputs.roles }} # SPIKE: was steps.roles.outputs.roles
      shards: ${{ steps.shards.outputs.shards }}
      compose_apps: ${{ steps.compose.outputs.apps }}
      dockerfiles: ${{ steps.compose.outputs.dockerfiles }}
      excluded_compose: ${{ steps.compose.outputs.excluded_compose }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect simple file-category changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/detect-changes-filters.yml
          # The matched files feed the `effective` step below.
          list-files: json

      # Unlocked and not `needs: warm-uv-cache`, for the same reasons as
      # warm-uv-cache above: a stale lockfile must surface as uv-lock's own
      # failure, not fail this job and skip everything behind it.
      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      # uv_lock, deploy_ordering and python_unit_tests stay false when
      # every file that matched only changed a comment or formatting (or
      # `[tool.ruff]`) — see docs/topics/engineering/ci/change-scoping.md#comments-and-formatting-dont-queue-molecule.
      # The job outputs above read this step, not `filter`. ansible_lint
      # and trivy_ansible are deliberately not gated: they read comments
      # (`# noqa`, `#trivy:ignore`). release_checksums isn't either: its run
      # is cheap and a pin file is small.
      - name: Drop no-op changes from the gated filters
        id: effective
        run: >-
          uv run python -m ci.scope.effective_changes
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          uv_lock deploy_ordering python_unit_tests
        working-directory: tools
        env:
          UV_LOCK_FILES: ${{ steps.filter.outputs.uv_lock_files }}
          DEPLOY_ORDERING_FILES: ${{ steps.filter.outputs.deploy_ordering_files }}
          PYTHON_UNIT_TESTS_FILES: ${{ steps.filter.outputs.python_unit_tests_files }}

      - name: Determine which ansible roles to test
        id: roles
        run: uv run python -m ci.scope.molecule_scope "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

      # The roles above, with the large ones split into the shards
      # .github/molecule-shards.yml lists; fails if that table disagrees
      # with the scenarios on disk.
      # SPIKE: run every role that has a Molecule scenario, whatever the PR touched.
      - name: Spike - force every role
        id: spike_roles
        run: |
          roles=$(printf '%s\n' ansible/roles/*/molecule | cut -d/ -f3 | jq -R . | jq -sc .)
          echo "roles=$roles" >> "$GITHUB_OUTPUT"

      - name: Split the roles into molecule legs
        id: shards
        env:
          ROLES: ${{ steps.spike_roles.outputs.roles }} # SPIKE
        run: uv run python -m ci.scope.molecule_shards
        working-directory: tools

      # One step for all three: compose apps to boot-test, Dockerfiles to
      # build and excluded-app compose files to syntax-check
      # (tools/ci/scope/compose_apps.py; the exclusion list it reads is
      # .github/compose-boot-test-exclusions.txt).
      - name: Determine which compose stacks to boot-test, Dockerfiles to build and compose files to syntax-check
        id: compose
        run: >-
          uv run python -m ci.scope.compose_apps changed
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

  # Single-writer cache population — see docs/topics/engineering/ci/pipeline.md#cache-warming for why
  # this exists as its own job rather than letting every uv-consuming job
  # below populate the cache itself. Unconditional (no needs:, no if:) so
  # it self-heals a cold/evicted cache on any PR, not just ones
  # detect-changes flags as touching uv.lock/pyproject.toml.
  #
  # locked is deliberately left at its "false" default here, not "true":
  # this job only exists to warm the shared uv package cache, not to
  # enforce lockfile strictness — that's uv-lock's own job, below, which
  # must keep failing on its own merits. If this job used --locked, a
  # genuinely stale lockfile would fail *this* job, and every job below
  # that needs it would report skipped instead of run — burying uv-lock's
  # specific diagnostic under a wall of unrelated skips.
  warm-uv-cache:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv (writes the shared cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          save-uv-cache: "true"

  # Same one-writer reasoning as warm-uv-cache above, for the Ansible
  # Galaxy collections cache. A separate job, not folded into
  # warm-uv-cache: unrelated command (ansible-galaxy, not uv sync),
  # unrelated cache, no reason to couple their failure/timing. This job's
  # own uv sync doesn't wait on warm-uv-cache (no needs: between them) —
  # on a cold cache it just resolves uv's packages a second time in
  # parallel rather than saving them again itself (save-uv-cache stays at
  # its "false" default here), which is cheaper than serializing the two.
  warm-galaxy-cache:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv + Ansible Galaxy collections (writes the shared Galaxy cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"
          save-galaxy-cache: "true"

  # Same one-writer reasoning as warm-galaxy-cache above, for
  # pre-commit's own hook environments (~/.cache/pre-commit) — rebuilt
  # from scratch by both pre-commit-checks and ansible-lint below,
  # dominated by ansible-lint's own isolated `ansible` venv (measured
  # ~500MB) — see docs/topics/engineering/ci/pipeline.md#cache-warming. `pre-commit install-hooks`
  # only builds environments, it never runs a hook, so this job needs
  # nothing (Docker included) that only running the hooks would.
  warm-pre-commit-cache:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv (builds and writes the shared pre-commit hook cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"
          save-precommit-cache: "true"

  # Unconditional — see docs/topics/engineering/ci/change-scoping.md#change-scoped-not-a-full-sweep. needs
  # warm-uv-cache (not detect-changes, which this job deliberately
  # bypasses) purely so it restores a warm cache rather than racing to
  # populate one itself — see docs/topics/engineering/ci/pipeline.md#cache-warming.
  pre-commit-checks:
    needs: [warm-uv-cache, warm-pre-commit-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the PR's commits, not just the tree
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"

      - name: Run commit-stage hooks against all files
        # Without a token zizmor silently drops its audits that query
        # GitHub (impostor commits, known-vulnerable actions, stale pins)
        # and prints one WARN line. gitleaks only scans what is staged,
        # which is nothing here, so the step below does its job.
        env:
          SKIP: gitleaks
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Scan the PR's commits for secrets
        run: >-
          python3 -m ci.scan.gitleaks_range
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

  # Both checks diff from the merge-base of the PR's base and head (not the
  # base tip itself), so a branch that is behind doesn't see main's newer
  # commits as its own.
  project-checks:
    needs: warm-uv-cache
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base needs both histories
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      # A PR that touches a project doc must stay inside that project's
      # allowed_paths - see docs/topics/engineering/ci/doc-checks.md#project-scope-check.
      - name: Check the PR stays inside its project's allowed_paths
        run: >-
          uv run python -m doc_scripts.check_project_scope
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

      # A PR that deletes a project doc must leave the revision its decision:
      # names accepted or still named by another project - see
      # docs/topics/engineering/ci/doc-checks.md#project-close-check.
      - name: Check the PR doesn't orphan a deleted project's decision
        run: >-
          uv run python -m doc_scripts.check_project_close
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

  # Split from pre-commit-checks: ansible-lint is pinned to stages:
  # [pre-push], which --hook-stage pre-commit above doesn't run.
  ansible-lint:
    needs: [detect-changes, warm-uv-cache, warm-pre-commit-cache]
    if: needs.detect-changes.outputs.ansible_lint == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"

      - name: Run push-stage hooks against all files
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-push --show-diff-on-failure

  uv-lock:
    needs: [detect-changes, warm-uv-cache]
    if: needs.detect-changes.outputs.uv_lock == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-lock catches an unregenerated lockfile; locked additionally
      # realizes the environment, catching a resolvable-but-broken
      # combination (e.g. a version since yanked) that --check alone won't.
      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          check-lock: "true"
          locked: "true"

  # Plain controller-side Python, not an Ansible role — no molecule/
  # scenario applies (see docs/topics/engineering/molecule-testing.md). Every provider HTTP
  # call and rclone invocation is mocked; nothing here needs network
  # access or Galaxy collections.
  python-unit-tests:
    needs: [detect-changes, warm-uv-cache]
    if: needs.detect-changes.outputs.python_unit_tests == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"

      - name: Run unit tests
        run: uv run pytest ansible/tests/ tools/tests/ -v

  # Regression coverage for the ansible_host resolution ordering —
  # see docs/topics/engineering/ci/gates.md#deploy-ordering-check for what it catches and why.
  deploy-ordering-check:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.deploy_ordering == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # restore.yaml's own role calls community.docker modules
      # unconditionally (no tags: to skip past it), unlike everything
      # else in this job, so Galaxy collections must be installed.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"
          install-galaxy-collections: "true"

      # Mirrors openbao_utils/bootstrap.py's output — throwaway CI values, see
      # docs/topics/engineering/ci/gates.md#deploy-ordering-check. Driven off the real
      # secret_catalog.yaml at CI-run time (see
      # tools/ci/fixtures/preseed_manual_secrets.py's docstring for why)
      # rather than a hand-maintained list of printf lines here — the
      # previous approach needed a new line added every time a new manual
      # secret was registered, with nothing enforcing that it actually
      # happened.
      - name: Pre-seed manual secrets (mirrors openbao_utils/bootstrap.py)
        run: uv run python -m ci.fixtures.preseed_manual_secrets
        working-directory: tools

      # This job has no real OpenBao/step-ca target, so any OpenBao-stored
      # secret_catalog entry would make vault_login.yaml run and fail
      # (secret_catalog isn't stubbed here on purpose, see
      # ci-deploy-ordering-inventory.yaml's own header). See
      # tools/ci/fixtures/file_cache_catalog.py's docstring for why the
      # override keeps only the file-cache entries, selected from the real
      # catalog at CI-run time. Vault reachability itself is covered by the
      # `secrets` role's own vault_backed/rotate_secret Molecule scenarios —
      # this job only tests ordering.
      - name: Limit secret_catalog to its file-cache entries for this job's own two invocations
        run: uv run python -m ci.fixtures.file_cache_catalog /tmp/ci-secret-catalog-no-vault.json
        working-directory: tools

      # Both playbook runs, and the verdict on the second, live in
      # tools/ci/gates/deploy_ordering.py (its docstring says why each
      # flag is there); the verdict logic is unit-tested. It runs
      # ansible-playbook from ansible/ itself.
      - name: Run deploy.yaml against the CI ordering-check inventory
        run: uv run python -m ci.gates.deploy_ordering deploy
        working-directory: tools

      # Regression check for restore.yaml's two-file invocation pattern
      # specifically (see docs/topics/engineering/ci/gates.md#deploy-ordering-check) — not for
      # restore's own logic, which Molecule already covers.
      - name: Run restore.yaml's two-file invocation against the CI ordering-check inventory
        run: uv run python -m ci.gates.deploy_ordering restore
        working-directory: tools

  molecule:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.roles != '[]'
    name: molecule (${{ matrix.shard.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect-changes.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Molecule installs molecule_helpers/requirements.yml and
      # role-requirements.yml itself per .config/molecule/config.yml; the
      # cache key hashes both along with ansible/requirements.yml.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"

      # An empty scenarios list runs every scenario of the role.
      - name: Run molecule test — ${{ matrix.shard.name }}
        env:
          MATRIX_ROLE: ${{ matrix.shard.role }}
          MATRIX_SCENARIOS: ${{ matrix.shard.scenarios }}
          MOLECULE_TIMINGS_FILE: ${{ runner.temp }}/timings-${{ matrix.shard.name }}.tsv # SPIKE
          MOLECULE_TRACE_DIR: ${{ runner.temp }}/trace-${{ matrix.shard.name }} # SPIKE
        run: |
          args=()
          for scenario in $MATRIX_SCENARIOS; do args+=(-s "$scenario"); done
          uv run ./scripts/molecule-test-all.sh "$MATRIX_ROLE" "${args[@]}"
        working-directory: ansible

      # if: always() - partial coverage from a mid-run failure is still
      # worth reporting. The molecule-coverage job merges every leg's data.
      - name: Pack coverage data
        if: always()
        env:
          SHARD: ${{ matrix.shard.name }}
        run: |
          mkdir -p ansible/molecule-coverage/.data
          tar -czf "$RUNNER_TEMP/coverage-$SHARD.tar.gz" -C ansible/molecule-coverage/.data .

      # SPIKE: hand this leg's per-scenario seconds to the spike-timings job.
      - name: Spike - upload scenario timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/timings-${{ matrix.shard.name }}.tsv
          if-no-files-found: ignore

      # SPIKE: hand this leg's timestamped scenario output to the spike-timings job.
      - name: Spike - upload scenario traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/trace-${{ matrix.shard.name }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/coverage-${{ matrix.shard.name }}.tar.gz
          retention-days: 1

  # Not a matrix job, so it can be required through matrix-jobs-gate like any
  # other: it always runs, and its steps do nothing when no role was queued.
  # Merges the coverage data of every molecule leg and gates each tested role
  # against its floor in thresholds.yaml.
  molecule-coverage:
    needs: [detect-changes, warm-uv-cache, molecule]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs.roles != '[]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        if: needs.detect-changes.outputs.roles != '[]'
        uses: ./.github/actions/setup-uv-ansible

      - name: Download coverage data
        if: needs.detect-changes.outputs.roles != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      # A role's shards each hold different scenarios' JSONL, so extracting
      # them into one directory is the union the report computes over.
      # set -o pipefail is required: this runner's default shell is
      # `bash -e`, not `-eo pipefail`, so without it a failure upstream of
      # `| tee` is masked by tee's exit 0. Every role is reported before the
      # step fails, so one low role doesn't hide another.
      - name: Coverage report + gate
        if: needs.detect-changes.outputs.roles != '[]'
        env:
          ROLES: ${{ needs.detect-changes.outputs.roles }}
        run: |
          set -o pipefail
          mkdir -p .data
          for archive in "$RUNNER_TEMP"/coverage/*.tar.gz; do tar -xzf "$archive" -C .data; done
          status=0
          for role in $(jq -r '.[]' <<<"$ROLES"); do
            uv run python3 -m molecule_cov.cli inventory "../roles/$role" --coverage-dir .data
            uv run python3 -m molecule_cov.cli report \
              --coverage-dir .data --role "$role" \
              --thresholds-file thresholds.yaml \
              | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"
        working-directory: ansible/molecule-coverage

  # Shared logic — see docs/topics/engineering/ci/gates.md#compose-boot-test.
  compose-boot-test:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.compose_apps != '[]'
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.detect-changes.outputs.compose_apps }}

  # Builds each changed Dockerfile without pushing it and smoke-tests the
  # image — the published image is only built after merge. See
  # docs/topics/engineering/ci/gates.md#dockerfile-changes. A matrix job, so it's aggregated by
  # matrix-jobs-gate below rather than required directly.
  dockerfile-build-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfiles != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.dockerfiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tools/ci/images/build.py is stdlib-only, so plain python3 runs it
      # and this job needs no uv.
      - name: Build and smoke-test ${{ matrix.app }}'s image
        env:
          MATRIX_APP: ${{ matrix.app }}
        run: python3 -m ci.images.build build-check "$MATRIX_APP"
        working-directory: tools

  # Shows that each pinned release checksum is the one its publisher signed or
  # lists (ADR 0077) — see docs/topics/engineering/ci/release-checksum-check.md.
  # Not a matrix job, so it can be required directly: a PR that changes no pin
  # reports it skipped.
  release-checksums:
    needs: detect-changes
    if: needs.detect-changes.outputs.release_checksums == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib-only, so plain python3 (no uv). gpg and gh come with the
      # runner image; the read-only token is what `gh attestation verify`
      # authenticates with.
      - name: Check every pinned release checksum against its publisher
        run: python3 -m ci.checksums.verify
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}

  # Renders every Mermaid block in the repo's markdown with the pinned
  # mermaid-cli image (ADR 0078) — see docs/topics/engineering/ci/doc-checks.md#mermaid-render-check.
  # Not a matrix job, so it can be required directly: a PR that changes no
  # markdown reports it skipped.
  mermaid-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.mermaid_check == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stdlib-only, so plain python3 (no uv). Docker comes with the runner
      # image; the check pulls the mermaid-cli image itself.
      - name: Render every Mermaid block
        run: python3 -m doc_scripts.check_mermaid
        working-directory: tools

  # Fallback for stacks the boot-test job deliberately excludes: only the
  # excluded apps are checked, since anything compose-boot-test covers gets
  # a stronger check there. See docs/topics/engineering/ci/gates.md#compose-boot-test.
  compose-syntax-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.excluded_compose != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs both the base and head commits
          persist-credentials: false

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Validate every changed excluded-app compose file parses
        run: >-
          uv run python -m ci.scope.compose_apps syntax-check
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
        working-directory: tools

  # See docs/topics/engineering/security-scanning.md#trivy-security-scans.
  trivy-scan:
    needs: detect-changes
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-scan.yml
    with:
      run-ansible: ${{ needs.detect-changes.outputs.trivy_ansible == 'true' }}

  # SPIKE: reads the finished run and reports where the time went. Not for merging.
  spike-timings:
    needs:
      - detect-changes
      - warm-uv-cache
      - warm-galaxy-cache
      - warm-pre-commit-cache
      - pre-commit-checks
      - project-checks
      - ansible-lint
      - uv-lock
      - python-unit-tests
      - deploy-ordering-check
      - molecule
      - molecule-coverage
      - compose-boot-test
      - dockerfile-build-check
      - release-checksums
      - mermaid-check
      - compose-syntax-check
      - trivy-scan
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Download scenario timings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: timings-*
          path: timings
          merge-multiple: true

      - name: Download scenario traces
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trace-*
          path: traces
          merge-multiple: true

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m ci.spike.molecule_timings "$GITHUB_WORKSPACE/timings" "$GITHUB_WORKSPACE/traces"
        working-directory: tools

  # Fixed-name required-check aggregator for the three matrix jobs above —
  # see docs/topics/engineering/ci/pipeline.md#requiring-checks-before-merge for why a matrix job
  # can't be marked required directly. if: always() so a skipped
  # upstream job doesn't skip this one too.
  matrix-jobs-gate:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache, molecule, molecule-coverage, compose-boot-test, dockerfile-build-check]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Only tools/ci is needed, and only its stdlib — plain python3, no
      # uv. A checkout that fails fails the gate, which blocks the merge.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false

      # The verdict is tools/ci/gates/matrix_gate.py: the matrix jobs (named
      # in MATRIX_JOBS, kept equal to the jobs that use a matrix by a test)
      # report skipped both when nothing changed and when an upstream job
      # failed, so every other job in `needs` must be exactly `success` and
      # only the matrix jobs may be skipped.
      - name: Fail unless upstream jobs passed and matrix jobs did not fail
        env:
          NEEDS: ${{ toJSON(needs) }}
          MATRIX_JOBS: molecule compose-boot-test dockerfile-build-check
        run: python3 -m ci.gates.matrix_gate
        working-directory: tools
