name: PR checks

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scopes the expensive jobs below to what this PR actually touched —
  # see docs/ci.md#change-scoped-not-a-full-sweep.
  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      uv_lock: ${{ steps.filter.outputs.uv_lock }}
      any_compose: ${{ steps.filter.outputs.any_compose }}
      deploy_ordering: ${{ steps.filter.outputs.deploy_ordering }}
      ansible_lint: ${{ steps.filter.outputs.ansible_lint }}
      trivy_ansible: ${{ steps.filter.outputs.trivy_ansible }}
      python_unit_tests: ${{ steps.filter.outputs.python_unit_tests }}
      roles: ${{ steps.roles.outputs.roles }}
      compose_apps: ${{ steps.compose.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect simple file-category changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/detect-changes-filters.yml

      - name: Determine which ansible roles to test
        id: roles
        run: .github/scripts/detect-changed-roles.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Determine which compose stacks to boot-test
        id: compose
        run: .github/scripts/detect-changed-compose-apps.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Single-writer cache population — see docs/ci.md#cache-warming for why
  # this exists as its own job rather than letting every uv-consuming job
  # below populate the cache itself. Unconditional (no needs:, no if:) so
  # it self-heals a cold/evicted cache on any PR, not just ones
  # detect-changes flags as touching uv.lock/pyproject.toml.
  #
  # locked is deliberately left at its "false" default here, not "true":
  # this job only exists to warm the shared uv package cache, not to
  # enforce lockfile strictness — that's uv-lock's own job, below, which
  # must keep failing on its own merits. If this job used --locked, a
  # genuinely stale lockfile would fail *this* job, and every job below
  # that needs it would report skipped instead of run — burying uv-lock's
  # specific diagnostic under a wall of unrelated skips.
  warm-uv-cache:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (writes the shared cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          save-uv-cache: "true"

  # Same one-writer reasoning as warm-uv-cache above, for the Ansible
  # Galaxy collections cache. A separate job, not folded into
  # warm-uv-cache: unrelated command (ansible-galaxy, not uv sync),
  # unrelated cache, no reason to couple their failure/timing. This job's
  # own uv sync doesn't wait on warm-uv-cache (no needs: between them) —
  # on a cold cache it just resolves uv's packages a second time in
  # parallel rather than saving them again itself (save-uv-cache stays at
  # its "false" default here), which is cheaper than serializing the two.
  warm-galaxy-cache:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv + Ansible Galaxy collections (writes the shared Galaxy cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"
          save-galaxy-cache: "true"

  # Same one-writer reasoning as warm-galaxy-cache above, for
  # pre-commit's own hook environments (~/.cache/pre-commit) — rebuilt
  # from scratch by both pre-commit-checks and ansible-lint below,
  # dominated by ansible-lint's own isolated `ansible` venv (measured
  # ~500MB) — see docs/ci.md#cache-warming. `pre-commit install-hooks`
  # only builds environments, it never runs a hook, so this job needs
  # nothing (Docker included) that only running the hooks would.
  warm-pre-commit-cache:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (builds and writes the shared pre-commit hook cache)
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"
          save-precommit-cache: "true"

  # Unconditional — see docs/ci.md#change-scoped-not-a-full-sweep. needs
  # warm-uv-cache (not detect-changes, which this job deliberately
  # bypasses) purely so it restores a warm cache rather than racing to
  # populate one itself — see docs/ci.md#cache-warming.
  pre-commit-checks:
    needs: [warm-uv-cache, warm-pre-commit-cache]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"

      - name: Run commit-stage hooks against all files
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-commit --show-diff-on-failure

  # A PR that touches a project doc must stay inside that project's
  # allowed_paths - see docs/ci.md#project-scope-check. Diffs from the
  # merge-base of the PR's base and head (not the base tip itself), so a
  # branch that is behind doesn't see main's newer commits as its own.
  project-scope:
    needs: warm-uv-cache
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base needs both histories

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Check the PR stays inside its project's allowed_paths
        run: >-
          uv run python .github/scripts/check-project-scope.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  # A PR that deletes a project doc must leave the revision its decision:
  # names accepted or still named by another project - see
  # docs/ci.md#project-close-check. Diffs from the merge-base, like
  # project-scope, so main's newer commits aren't read as this PR's own.
  project-close:
    needs: warm-uv-cache
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base needs both histories

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Check the PR doesn't orphan a deleted project's decision
        run: >-
          uv run python .github/scripts/check-project-close.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  # Split from pre-commit-checks: ansible-lint is pinned to stages:
  # [pre-push], which --hook-stage pre-commit above doesn't run.
  ansible-lint:
    needs: [detect-changes, warm-uv-cache, warm-pre-commit-cache]
    if: needs.detect-changes.outputs.ansible_lint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-precommit-hooks: "true"

      - name: Run push-stage hooks against all files
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-push --show-diff-on-failure

  uv-lock:
    needs: [detect-changes, warm-uv-cache]
    if: needs.detect-changes.outputs.uv_lock == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-lock catches an unregenerated lockfile; locked additionally
      # realizes the environment, catching a resolvable-but-broken
      # combination (e.g. a version since yanked) that --check alone won't.
      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          check-lock: "true"
          locked: "true"

  # Plain controller-side Python, not an Ansible role — no molecule/
  # scenario applies (see docs/molecule-testing.md). Every provider HTTP
  # call and rclone invocation is mocked; nothing here needs network
  # access or Galaxy collections.
  python-unit-tests:
    needs: [detect-changes, warm-uv-cache]
    if: needs.detect-changes.outputs.python_unit_tests == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"

      - name: Run unit tests
        run: uv run pytest ansible/tests/ tools/tests/ -v

  # Regression coverage for the ansible_host resolution ordering incident —
  # see docs/ci.md#deploy-ordering-check for what it catches and why.
  deploy-ordering-check:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.deploy_ordering == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # restore.yaml's own role calls community.docker modules
      # unconditionally (no tags: to skip past it), unlike everything
      # else in this job, so Galaxy collections must be installed.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"
          install-galaxy-collections: "true"

      # Mirrors openbao_utils/bootstrap.py's output — throwaway CI values, see
      # docs/ci.md#deploy-ordering-check. Driven off the real
      # secrets_registry.yaml at CI-run time (see the script's own
      # docstring for why) rather than a hand-maintained list of printf
      # lines here — the previous approach needed a new line added
      # every time a new manual secret was registered, with nothing
      # enforcing that it actually happened.
      - name: Pre-seed manual secrets (mirrors openbao_utils/bootstrap.py)
        run: uv run python3 .github/scripts/preseed-manual-secrets-for-ci.py

      # Track A stage 4 gave most secrets_registry entries a
      # vault_scope, but this job has no real OpenBao/step-ca target —
      # without this, vault_login.yaml now actually runs (secrets_registry
      # isn't stubbed here on purpose, see ci-deploy-ordering-inventory.yaml's
      # own header) and fails loudly, since no AppRole is provisioned in
      # this job and even a dummy one would still try to reach a
      # nonexistent `security` host. See the script's own docstring for
      # why this strips vault_scope from the real registry at CI-run
      # time rather than hand-maintaining a separate stub that could
      # drift from it. Vault reachability itself is already covered for
      # real by the `secrets` role's own vault_backed/rotate_secret
      # Molecule scenarios — this job only ever tested ordering.
      - name: Strip vault_scope from secrets_registry for this job's own two invocations
        run: uv run python3 .github/scripts/strip-vault-scope-for-ci.py /tmp/ci-secrets-registry-no-vault.json

      # --tags matches nothing real, so provisioning is filtered out while
      # Gathering Facts and secrets tasks (tags: [always]) still run.
      # --limit includes localhost: Play 0 targets hosts: localhost
      # specifically, which --limit prod alone would skip entirely.
      - name: Run deploy.yaml against the CI ordering-check inventory
        run: |
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/deploy.yaml \
            --tags ci-deploy-ordering-check-tag-matches-nothing \
            --limit ci-managed-host,localhost \
            -e compose_deploy_dir=/tmp/compose-deploy-ordering-check \
            -e @/tmp/ci-secrets-registry-no-vault.json
        working-directory: ansible

      # Regression check for restore.yaml's two-file invocation pattern
      # specifically (see docs/ci.md#deploy-ordering-check) — not for
      # restore's own logic, which Molecule already covers. Points at a
      # nonexistent archive on purpose: reaching that failure proves
      # ansible_host resolved without needing a real restore. The log
      # grep below distinguishes that expected failure from the
      # ansible_host/secrets_generated regression this step exists to catch.
      - name: Run restore.yaml's two-file invocation against the CI ordering-check inventory
        run: |
          set +e
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/bootstrap-secrets.yaml playbooks/restore.yaml \
            --limit ci-managed-host,localhost \
            -e restore_app=ci-ordering-check-app \
            -e restore_archive_local_path=/nonexistent/ci-ordering-check-archive.tar.gz \
            -e 'restore_volumes=["ci_ordering_check_data"]' \
            -e @/tmp/ci-secrets-registry-no-vault.json \
            > /tmp/restore-ordering-check.log 2>&1
          rc=$?
          cat /tmp/restore-ordering-check.log

          if grep -qE "remote_addr|secrets_generated.*undefined" /tmp/restore-ordering-check.log; then
            echo "::error::ansible_host never resolved for restore.yaml's two-file invocation — the ordering regression this check exists to catch."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected a failure at the archive-existence check (nonexistent path) — succeeded instead, meaning something unrelated changed."
            exit 1
          fi

          if ! grep -q "not found on the controller" /tmp/restore-ordering-check.log; then
            echo "::error::Failed, but not with the expected archive-not-found message — see log above."
            exit 1
          fi

          echo "OK: reached the expected, safe archive-not-found failure — ansible_host resolved correctly."
        working-directory: ansible

  molecule:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.roles != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.detect-changes.outputs.roles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Also pulls molecule_helpers/role-requirements.yml per
      # .config/molecule/config.yml — cache key hashes both files.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"

      - name: Run molecule test — ${{ matrix.role }}
        run: uv run ./scripts/molecule-test-all.sh "${{ matrix.role }}"
        working-directory: ansible

      # if: always() - partial coverage from a mid-run failure is still
      # worth reporting. set -o pipefail is required here specifically:
      # this runner's default shell is `bash -e`, not `-eo pipefail`, so
      # without it a failure upstream of `| tee` is masked by tee's exit 0.
      - name: Coverage report + gate — ${{ matrix.role }}
        if: always()
        run: |
          set -o pipefail
          uv run python3 -m molecule_cov.cli inventory "../roles/${{ matrix.role }}" \
            --coverage-dir .data
          uv run python3 -m molecule_cov.cli report \
            --coverage-dir .data --role "${{ matrix.role }}" \
            --thresholds-file thresholds.yaml \
            | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ansible/molecule-coverage

  # Shared logic — see docs/ci.md#compose-boot-test.
  compose-boot-test:
    needs: [detect-changes, warm-uv-cache, warm-galaxy-cache]
    if: needs.detect-changes.outputs.compose_apps != '[]'
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.detect-changes.outputs.compose_apps }}

  # Fallback for stacks the boot-test job deliberately excludes
  compose-syntax-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_compose == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the raw `git diff $BASE $HEAD` below

      - name: Validate every changed compose file parses
        run: |
          # Only the apps compose-boot-test skips — anything it already
          # covers gets a stronger check there, no need to duplicate it
          # here. Same source file as detect-changes' compose step above,
          # so there's nothing to keep "in sync" by hand anymore.
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^docker/.*/compose.*\.yaml$' \
            | grep -E "^docker/($excluded)/" || true)
          [ -z "$changed" ] && { echo "No excluded-app compose files changed."; exit 0; }
          for f in $changed; do
            [ -f "$f" ] || continue # deleted, not modified — nothing to validate
            echo "=== $f ==="
            dir=$(dirname "$f")
            # An explicit env_file: entry must exist for `config --quiet`
            # to pass, unlike the implicit top-level .env — an empty stub
            # is enough since only syntax is being validated here.
            stub_created=0
            if [ ! -e "$dir/.env" ]; then
              touch "$dir/.env"
              stub_created=1
            fi
            if docker compose -f "$f" config --quiet; then
              rc=0
            else
              rc=$?
            fi
            [ "$stub_created" -eq 1 ] && rm -f "$dir/.env"
            [ "$rc" -eq 0 ] || exit "$rc"
          done

  # See docs/security-scanning.md#trivy-security-scans.
  trivy-scan:
    needs: detect-changes
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-scan.yml
    with:
      run-ansible: ${{ needs.detect-changes.outputs.trivy_ansible == 'true' }}
      run-secrets: true

  # Fixed-name required-check aggregator for the two matrix jobs above —
  # see docs/ci.md#requiring-checks-before-merge for why a matrix job
  # can't be marked required directly. if: always() so a skipped
  # upstream job doesn't skip this one too.
  matrix-jobs-gate:
    needs: [molecule, compose-boot-test]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if molecule or compose-boot-test actually failed
        run: |
          for r in "${{ needs.molecule.result }}" "${{ needs.compose-boot-test.result }}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not pass (result: $r)."
              exit 1
            fi
          done
