name: PR checks

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scoping: molecule and compose-boot-test are the two expensive jobs, so
  # everything downstream runs only against what this PR actually touched
  # instead of the full suite every time. dorny/paths-filter reports both
  # simple booleans (uv lock, deploy ordering) and the specific role/app
  # names touched, which the matrix jobs below consume directly.
  # pre-commit-checks/ansible-lint run unconditionally on every PR
  # instead — see those jobs below.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      uv_lock: ${{ steps.filter.outputs.uv_lock }}
      any_compose: ${{ steps.filter.outputs.any_compose }}
      deploy_ordering: ${{ steps.filter.outputs.deploy_ordering }}
      roles: ${{ steps.roles.outputs.roles }}
      compose_apps: ${{ steps.compose.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect simple file-category changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            uv_lock:
              - 'pyproject.toml'
              - 'uv.lock'
            any_compose:
              - 'docker/**/compose*.yaml'
            # Anything that could reintroduce the ansible_host ->
            # ddns_domain -> main_domain -> secrets_generated ordering
            # regression deploy-ordering-check exists to catch — see
            # docs/ci.md#deploy-ordering-check. ansible/inventory/**
            # covers both inventory.yaml itself and group_vars/all/
            # main.yaml + secrets_registry.yaml, which is deliberately
            # broad: a change to either is exactly the shape of change
            # that caused the original regression. ansible/roles/restore/**
            # is here too: the job's second check exercises restore.yaml's
            # own two-file invocation pattern specifically, which a
            # restore-role-only change could break without touching
            # anything else in this list.
            deploy_ordering:
              - 'ansible/inventory/**'
              - 'ansible/playbooks/**'
              - 'ansible/roles/secrets/**'
              - 'ansible/roles/restore/**'

      - name: Determine which ansible roles to test
        id: roles
        run: |
          # Any file changed under ansible/roles/<role>/ maps to that one
          # role. ansible/requirements.yml (or the molecule_helpers copy)
          # is a repo-wide Galaxy collection bump — anything could depend
          # on it, so that one specific file maps to every role instead of
          # just its own directory.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD")

          roles=()
          if echo "$changed" | grep -qE '^ansible/(requirements\.yml|roles/molecule_helpers/requirements\.yml)$'; then
            for d in ansible/roles/*/molecule; do
              [ -d "$d" ] || continue
              roles+=("$(basename "$(dirname "$d")")")
            done
          else
            while IFS= read -r role; do
              [ -d "ansible/roles/$role/molecule" ] || continue
              roles+=("$role")
            done < <(echo "$changed" | grep -oE '^ansible/roles/[^/]+' | sed 's#ansible/roles/##' | sort -u)
          fi

          json=$(printf '%s\n' "${roles[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "roles=$json" >> "$GITHUB_OUTPUT"
          echo "Testing roles: $json"

      - name: Determine which compose stacks to boot-test
        id: compose
        run: |
          # Exclusion list + per-app reasoning lives in
          # .github/compose-boot-test-exclusions.txt — the single source
          # of truth shared with compose-syntax-check below and
          # boot-test-all.yml's list-apps.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD")
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)

          apps=$(echo "$changed" \
            | grep -oE '^docker/[^/]+/compose\.yaml$' \
            | sed -E 's#docker/([^/]+)/compose\.yaml#\1#' \
            | grep -vE "^($excluded)\$" \
            | sort -u)

          json=$(printf '%s\n' "$apps" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Boot-testing: $json"

  # Always runs, unlike the other jobs below — this is the actual
  # enforcement gate for every commit-stage hook (see
  # .config/.pre-commit-config.yaml's default_stages), not scoped to
  # what changed, since any file in the repo could be touched by one of
  # these. Also doubles as the test for "does a new hook version need a
  # newer pre-commit CLI than uv.lock resolves" — a broken hook config
  # fails right here.
  pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Install pre-commit hook environments
        run: uv run pre-commit install-hooks

      - name: Run commit-stage hooks against all files
        run: uv run pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure

  # Split from pre-commit-checks above because ansible-lint is the one
  # hook pinned to stages: [pre-push] (see .config/.pre-commit-config.yaml)
  # — pre-commit run --all-files alone does not include push-stage hooks,
  # it needs --hook-stage pre-push explicitly. No install-galaxy-collections
  # needed: ansible-lint's own additional_dependencies: [ansible] already
  # bundles community.docker/ansible.posix into its isolated hook venv.
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Install pre-commit hook environments
        run: uv run pre-commit install-hooks

      - name: Run push-stage hooks against all files
        run: uv run pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  uv-lock:
    needs: detect-changes
    if: needs.detect-changes.outputs.uv_lock == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-lock catches a lockfile-maintenance PR that didn't actually
      # regenerate the lock, or a manual edit that broke resolution.
      # locked additionally realizes the environment, which catches
      # resolvable-but-broken combinations --check alone might not (e.g.
      # a resolved version that's since been yanked).
      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          check-lock: "true"
          locked: "true"

  # Regression coverage for an incident where ansible_host (inventory.yaml)
  # was wired to resolve through a role-generated fact (secrets_generated)
  # without anything in CI ever exercising that chain — every other check
  # either bypasses ansible_host resolution entirely (ci-inventory.yaml's
  # single ansible_connection: local host, no ansible_host templating at
  # all) or tests the secrets role against a synthetic per-scenario
  # inventory that never touches the real one. See
  # docs/ci.md#deploy-ordering-check for the full writeup.
  #
  # Runs the REAL deploy.yaml (not a copy — a parallel copy is exactly
  # what let ci-inventory's simplification drift out of sync with
  # production in the first place) against a purpose-built CI inventory
  # that mirrors inventory.yaml's ansible_host -> ddns_domain ->
  # main_domain -> secrets_generated chain and managed_hosts/controller
  # group split closely enough to genuinely exercise both, while staying
  # CI-safe: ansible_connection: local everywhere (no real SSH/network),
  # and --tags matching nothing real so Docker/Caddy/compose-app/BIND9/
  # backup-agent provisioning never actually runs — only secrets
  # generation, propagation, and the ansible_host resolution it gates
  # (Gathering Facts against the CI-safe "managed" host) do.
  deploy-ordering-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_ordering == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install-galaxy-collections is required specifically for
      # restore.yaml's own role, which uses
      # community.docker.docker_compose_v2/docker_container/docker_volume
      # unconditionally (no tags: to skip past it the way the deploy.yaml
      # check's --tags trick does for everything else in this job) —
      # confirmed live: without it, even a deliberately-failing restore
      # invocation errors out earlier than intended with "couldn't
      # resolve module/action 'community.docker.docker_compose_v2'",
      # before ever reaching the archive-existence check this job's
      # restore step actually means to exercise.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"
          install-galaxy-collections: "true"

      # Mirrors what a real operator's `python3 ansible/bootstrap_secrets.py`
      # run produces on the controller before a first deploy — every
      # format: manual entry in secrets_registry.yaml needs its cache file
      # to exist before the secrets role's own "fail loudly if missing"
      # guard lets the play past it. Values are throwaway CI placeholders,
      # same non-secret status as ci-inventory/group_vars/all/
      # ci_dummy_vars.yaml's — beszel-hub-key/beszel-agent-token are
      # allow_blank: true in the registry, so empty files are the correct
      # (not just convenient) way to pre-seed those two specifically.
      - name: Pre-seed manual secrets (mirrors bootstrap_secrets.py)
        run: |
          mkdir -p ansible/files/secrets
          printf '%s' 'ci.invalid' > ansible/files/secrets/main-domain
          printf '%s' 'ci-dummy-do-key' > ansible/files/secrets/digitalocean-api-key
          printf '%s' 'ci@invalid.example' > ansible/files/secrets/letsencrypt-email
          printf '%s' 'ci-dummy-telegram-token' > ansible/files/secrets/telegram-token
          printf '%s' '0' > ansible/files/secrets/telegram-chat-id
          printf '%s' 'localhost' > ansible/files/secrets/wetty-ssh-host
          printf '%s' '' > ansible/files/secrets/beszel-hub-key
          printf '%s' '' > ansible/files/secrets/beszel-agent-token

      # --tags matches nothing real in deploy.yaml (initial-setup/images/
      # infra are the only real values) — every provisioning task gets
      # filtered out, while Gathering Facts (never tag-gated) and every
      # secrets-role/preinit task (explicitly tags: [always] — see
      # ansible/roles/secrets/tasks/*.yaml) still run. --limit
      # ci-managed-host,localhost mirrors the real --limit prod,localhost
      # requirement documented in bootstrap-secrets.yaml — Play 0 targets
      # hosts: localhost specifically, which --limit prod alone would
      # filter to zero hosts and silently skip.
      - name: Run deploy.yaml against the CI ordering-check inventory
        run: |
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/deploy.yaml \
            --tags ci-deploy-ordering-check-tag-matches-nothing \
            --limit ci-managed-host,localhost \
            -e compose_deploy_dir=/tmp/compose-deploy-ordering-check
        working-directory: ansible

      # restore.yaml can't import bootstrap-secrets.yaml as a leading play
      # the way deploy.yaml/cleanup.yaml/maintenance.yaml do (see its own
      # header) — it requires the two-file invocation instead. This step
      # is the regression check for THAT specific pattern, not for
      # restore's own validation/confirmation logic, which is already
      # thoroughly covered by ansible/roles/restore's own Molecule
      # scenarios (default, multi_volume, validation_failure,
      # confirmation_declined) — see docs/molecule-testing.md.
      #
      # Deliberately triggers the archive-existence check's failure
      # branch (a real, nonexistent path) rather than trying to complete
      # an actual restore: that's the safe way to prove the whole chain
      # up to and including a role-level task actually executing against
      # the CI-safe host works, without needing a real archive or coming
      # anywhere near the confirmation gate / destructive steps. A run
      # that instead fails on 'remote_addr'/secrets_generated (the
      # original regression's signature) means ansible_host never
      # resolved and this step must fail loudly and specifically about
      # that, not just report "the playbook failed" (which an archive-
      # not-found failure ALSO produces, and would otherwise mask this
      # exact regression recurring here specifically).
      - name: Run restore.yaml's two-file invocation against the CI ordering-check inventory
        run: |
          set +e
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/bootstrap-secrets.yaml playbooks/restore.yaml \
            --limit ci-managed-host,localhost \
            -e restore_app=ci-ordering-check-app \
            -e restore_archive_local_path=/nonexistent/ci-ordering-check-archive.tar.gz \
            -e 'restore_volumes=["ci_ordering_check_data"]' \
            > /tmp/restore-ordering-check.log 2>&1
          rc=$?
          cat /tmp/restore-ordering-check.log

          if grep -qE "remote_addr|secrets_generated.*undefined" /tmp/restore-ordering-check.log; then
            echo "::error::ansible_host never resolved for restore.yaml's two-file invocation — the ordering regression this check exists to catch."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected a failure at the archive-existence check (nonexistent path) — succeeded instead, meaning something unrelated changed."
            exit 1
          fi

          if ! grep -q "not found on the controller" /tmp/restore-ordering-check.log; then
            echo "::error::Failed, but not with the expected archive-not-found message — see log above."
            exit 1
          fi

          echo "OK: reached the expected, safe archive-not-found failure — ansible_host resolved correctly."
        working-directory: ansible

  molecule:
    needs: detect-changes
    if: needs.detect-changes.outputs.roles != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.detect-changes.outputs.roles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ansible/requirements.yml is the top-level install target;
      # molecule's own per-scenario dependency phase (see
      # .config/molecule/config.yml) additionally pulls
      # molecule_helpers/role-requirements.yml — the composite action's
      # cache key already hashes both.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"

      - name: Run molecule test — ${{ matrix.role }}
        run: uv run ./molecule-test-all.sh "${{ matrix.role }}"
        working-directory: ansible

  # Actual steps live in _compose-boot-test.yml — shared with
  # boot-test-all.yml's compose-boot-test-all so the seed/boot/wait/
  # teardown logic has exactly one copy instead of two drifting in
  # lockstep by hand.
  compose-boot-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.compose_apps != '[]'
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.detect-changes.outputs.compose_apps }}

  # Fallback for stacks the boot-test job deliberately excludes
  compose-syntax-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the raw `git diff $BASE $HEAD` below

      - name: Validate every changed compose file parses
        run: |
          # Only the apps compose-boot-test skips — anything it already
          # covers gets a stronger check there, no need to duplicate it
          # here. Same source file as detect-changes' compose step above,
          # so there's nothing to keep "in sync" by hand anymore.
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^docker/.*/compose.*\.yaml$' \
            | grep -E "^docker/($excluded)/" || true)
          [ -z "$changed" ] && { echo "No excluded-app compose files changed."; exit 0; }
          for f in $changed; do
            echo "=== $f ==="
            dir=$(dirname "$f")
            # docker compose treats an explicit env_file: entry as required
            # to exist by default (unlike the implicit top-level .env,
            # which silently no-ops if absent). Apps like lldap reference a
            # real .env that's Ansible-templated at deploy time from
            # secrets_registry.yaml (see app_registry.yaml's configs:
            # entry) and correctly never committed. `config --quiet` only
            # needs the file to exist to validate syntax/interpolation, not
            # to hold real values, so an empty stub is sufficient here —
            # same "harmless CI placeholder" pattern as
            # _compose-boot-test.yml's job-level env: block.
            stub_created=0
            if [ ! -e "$dir/.env" ]; then
              touch "$dir/.env"
              stub_created=1
            fi
            if docker compose -f "$f" config --quiet; then
              rc=0
            else
              rc=$?
            fi
            [ "$stub_created" -eq 1 ] && rm -f "$dir/.env"
            [ "$rc" -eq 0 ] || exit "$rc"
          done
