name: PR checks

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Scopes the expensive jobs below to what this PR actually touched —
  # see docs/ci.md#change-scoped-not-a-full-sweep.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      uv_lock: ${{ steps.filter.outputs.uv_lock }}
      any_compose: ${{ steps.filter.outputs.any_compose }}
      deploy_ordering: ${{ steps.filter.outputs.deploy_ordering }}
      ansible_lint: ${{ steps.filter.outputs.ansible_lint }}
      trivy_ansible: ${{ steps.filter.outputs.trivy_ansible }}
      python_unit_tests: ${{ steps.filter.outputs.python_unit_tests }}
      roles: ${{ steps.roles.outputs.roles }}
      compose_apps: ${{ steps.compose.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect simple file-category changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            uv_lock:
              - 'pyproject.toml'
              - 'uv.lock'
            any_compose:
              - 'docker/**/compose*.yaml'
            # Gates deploy-ordering-check — see docs/ci.md#deploy-ordering-check
            # for what it catches and why each path below is in scope.
            deploy_ordering:
              - 'ansible/inventory/**'
              - 'ansible/playbooks/**'
              - 'ansible/roles/secrets/**'
              - 'ansible/roles/restore/**'
              - 'pyproject.toml'
              - 'uv.lock'
            # Gates whether the job runs at all — the hook itself always
            # scans the full ansible/ tree regardless of which files in
            # it changed. Not pyproject.toml/uv.lock: the hook's own
            # additional_dependencies: [ansible] runs in an isolated
            # venv, unrelated to this repo's uv-managed ansible-core pin.
            ansible_lint:
              - 'ansible/**'
              - '.config/.ansible-lint'
              - '.config/.pre-commit-config.yaml'
            # Gates trivy-scan's Ansible misconfig job below — narrower
            # than ansible_lint on purpose (ansible/** only, no lint
            # config), since a change to .ansible-lint or pre-commit's
            # own config doesn't change what Trivy would find.
            trivy_ansible:
              - 'ansible/**'
            # ansible/tests/ has no molecule/ scenario of its own (see
            # docs/ci.md#change-scoped-not-a-full-sweep) — these are plain
            # controller-side Python, covered by ansible/tests/ instead.
            python_unit_tests:
              - 'ansible/create_cloud_credentials.py'
              - 'ansible/create_rotation_keys.py'
              - 'ansible/molecule-coverage/molecule_cov/**'
              - 'ansible/tests/**'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Determine which ansible roles to test
        id: roles
        run: |
          # Any file under ansible/roles/<role>/ maps to that role, except
          # three repo-wide cases below that queue every role instead —
          # see docs/ci.md#change-scoped-not-a-full-sweep for why.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD")

          roles=()
          if echo "$changed" | grep -qE '^ansible/requirements\.yml$|^ansible/roles/molecule_helpers/|^pyproject\.toml$|^uv\.lock$'; then
            for d in ansible/roles/*/molecule; do
              [ -d "$d" ] || continue
              roles+=("$(basename "$(dirname "$d")")")
            done
          else
            while IFS= read -r role; do
              [ -d "ansible/roles/$role/molecule" ] || continue
              roles+=("$role")
            done < <(echo "$changed" | grep -oE '^ansible/roles/[^/]+' | sed 's#ansible/roles/##' | sort -u)
          fi

          json=$(printf '%s\n' "${roles[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "roles=$json" >> "$GITHUB_OUTPUT"
          echo "Testing roles: $json"

      - name: Determine which compose stacks to boot-test
        id: compose
        run: |
          # Exclusion list + per-app reasoning lives in
          # .github/compose-boot-test-exclusions.txt — the single source
          # of truth shared with compose-syntax-check below and
          # boot-test-all.yml's list-apps.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD")
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)

          # -f drops deleted compose files (git diff lists them too) —
          # same guard the 'roles' step above applies via -d.
          apps=()
          while IFS= read -r app; do
            [ -f "docker/$app/compose.yaml" ] || continue
            apps+=("$app")
          done < <(echo "$changed" \
            | grep -oE '^docker/[^/]+/compose\.yaml$' \
            | sed -E 's#docker/([^/]+)/compose\.yaml#\1#' \
            | grep -vE "^($excluded)\$" \
            | sort -u)

          json=$(printf '%s\n' "${apps[@]:-}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Boot-testing: $json"

  # Unconditional — see docs/ci.md#change-scoped-not-a-full-sweep.
  pre-commit-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Install pre-commit hook environments
        run: uv run pre-commit install-hooks -c .config/.pre-commit-config.yaml

      - name: Run commit-stage hooks against all files
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-commit --show-diff-on-failure

  # Split from pre-commit-checks: ansible-lint is pinned to stages:
  # [pre-push], which --hook-stage pre-commit above doesn't run.
  ansible-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.ansible_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible

      - name: Install pre-commit hook environments
        run: uv run pre-commit install-hooks -c .config/.pre-commit-config.yaml

      - name: Run push-stage hooks against all files
        run: uv run pre-commit run -c .config/.pre-commit-config.yaml --all-files --hook-stage pre-push --show-diff-on-failure

  uv-lock:
    needs: detect-changes
    if: needs.detect-changes.outputs.uv_lock == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-lock catches an unregenerated lockfile; locked additionally
      # realizes the environment, catching a resolvable-but-broken
      # combination (e.g. a version since yanked) that --check alone won't.
      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          check-lock: "true"
          locked: "true"

  # Plain controller-side Python, not an Ansible role — no molecule/
  # scenario applies (see docs/molecule-testing.md). Every provider HTTP
  # call and rclone invocation is mocked; nothing here needs network
  # access or Galaxy collections.
  python-unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.python_unit_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"

      - name: Run unit tests
        run: uv run pytest tests/ -v
        working-directory: ansible

  # Regression coverage for the ansible_host resolution ordering incident —
  # see docs/ci.md#deploy-ordering-check for what it catches and why.
  deploy-ordering-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_ordering == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # restore.yaml's own role calls community.docker modules
      # unconditionally (no tags: to skip past it), unlike everything
      # else in this job, so Galaxy collections must be installed.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          locked: "true"
          install-galaxy-collections: "true"

      # Mirrors bootstrap_secrets.py's output — throwaway CI values, see
      # docs/ci.md#deploy-ordering-check. beszel-hub-key/-agent-token are
      # allow_blank: true in the registry, so empty is correct, not lazy.
      - name: Pre-seed manual secrets (mirrors bootstrap_secrets.py)
        run: |
          mkdir -p ansible/files/secrets
          printf '%s' 'ci.invalid' > ansible/files/secrets/main-domain
          printf '%s' 'ci-dummy-do-key' > ansible/files/secrets/digitalocean-api-key
          printf '%s' 'ci@invalid.example' > ansible/files/secrets/letsencrypt-email
          printf '%s' 'ci-dummy-telegram-token' > ansible/files/secrets/telegram-token
          printf '%s' '0' > ansible/files/secrets/telegram-chat-id
          printf '%s' 'localhost' > ansible/files/secrets/wetty-ssh-host
          printf '%s' '' > ansible/files/secrets/beszel-hub-key
          printf '%s' '' > ansible/files/secrets/beszel-agent-token
          # telegram-topic-id-* are allow_blank: true in the registry too
          # (Topics is an optional feature — see docs/telegram-notifications.md),
          # same reasoning as beszel-hub-key/-agent-token just above.
          printf '%s' '' > ansible/files/secrets/telegram-topic-id-updates
          printf '%s' '' > ansible/files/secrets/telegram-topic-id-monitoring
          printf '%s' '' > ansible/files/secrets/telegram-topic-id-backups
          printf '%s' '' > ansible/files/secrets/telegram-topic-id-certs
          printf '%s' 'ci-dummy-r2-write-access-key' > ansible/files/secrets/cloudflare-r2-write-access-key
          printf '%s' 'ci-dummy-r2-write-secret-key' > ansible/files/secrets/cloudflare-r2-write-secret-key
          printf '%s' 'ci-dummy-r2-read-access-key' > ansible/files/secrets/cloudflare-r2-read-access-key
          printf '%s' 'ci-dummy-r2-read-secret-key' > ansible/files/secrets/cloudflare-r2-read-secret-key
          printf '%s' 'ci-dummy-r2-account-id' > ansible/files/secrets/cloudflare-r2-account-id
          printf '%s' 'ci-dummy-b2-write-access-key' > ansible/files/secrets/backblaze-b2-write-access-key
          printf '%s' 'ci-dummy-b2-write-secret-key' > ansible/files/secrets/backblaze-b2-write-secret-key
          printf '%s' 'ci-dummy-b2-read-access-key' > ansible/files/secrets/backblaze-b2-read-access-key
          printf '%s' 'ci-dummy-b2-read-secret-key' > ansible/files/secrets/backblaze-b2-read-secret-key
          printf '%s' 'ci-dummy-b2-region' > ansible/files/secrets/backblaze-b2-region
          # uptime-kuma-push-url-* are allow_blank: true too - each
          # monitor's URL doesn't exist until created by hand in Kuma's
          # own UI (see docs/uptime-kuma.md), same reasoning as
          # telegram-topic-id-*/beszel-hub-key/-agent-token above.
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cloud-sync
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cert-renewer-lldap
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cert-expiry-security
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cert-expiry-storage
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cert-expiry-play
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-cert-expiry-services
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-backup-services
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-backup-play
          printf '%s' '' > ansible/files/secrets/uptime-kuma-push-url-backup-security
          printf '%s' 'ci-dummy-oci-write-access-key' > ansible/files/secrets/oci-write-access-key
          printf '%s' 'ci-dummy-oci-write-secret-key' > ansible/files/secrets/oci-write-secret-key
          printf '%s' 'ci-dummy-oci-read-access-key' > ansible/files/secrets/oci-read-access-key
          printf '%s' 'ci-dummy-oci-read-secret-key' > ansible/files/secrets/oci-read-secret-key
          printf '%s' 'ci-dummy-oci-namespace' > ansible/files/secrets/oci-namespace
          printf '%s' 'ci-dummy-oci-region' > ansible/files/secrets/oci-region

      # --tags matches nothing real, so provisioning is filtered out while
      # Gathering Facts and secrets tasks (tags: [always]) still run.
      # --limit includes localhost: Play 0 targets hosts: localhost
      # specifically, which --limit prod alone would skip entirely.
      - name: Run deploy.yaml against the CI ordering-check inventory
        run: |
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/deploy.yaml \
            --tags ci-deploy-ordering-check-tag-matches-nothing \
            --limit ci-managed-host,localhost \
            -e compose_deploy_dir=/tmp/compose-deploy-ordering-check
        working-directory: ansible

      # Regression check for restore.yaml's two-file invocation pattern
      # specifically (see docs/ci.md#deploy-ordering-check) — not for
      # restore's own logic, which Molecule already covers. Points at a
      # nonexistent archive on purpose: reaching that failure proves
      # ansible_host resolved without needing a real restore. The log
      # grep below distinguishes that expected failure from the
      # ansible_host/secrets_generated regression this step exists to catch.
      - name: Run restore.yaml's two-file invocation against the CI ordering-check inventory
        run: |
          set +e
          uv run ansible-playbook \
            -i inventory/ci-deploy-ordering-inventory.yaml \
            playbooks/bootstrap-secrets.yaml playbooks/restore.yaml \
            --limit ci-managed-host,localhost \
            -e restore_app=ci-ordering-check-app \
            -e restore_archive_local_path=/nonexistent/ci-ordering-check-archive.tar.gz \
            -e 'restore_volumes=["ci_ordering_check_data"]' \
            > /tmp/restore-ordering-check.log 2>&1
          rc=$?
          cat /tmp/restore-ordering-check.log

          if grep -qE "remote_addr|secrets_generated.*undefined" /tmp/restore-ordering-check.log; then
            echo "::error::ansible_host never resolved for restore.yaml's two-file invocation — the ordering regression this check exists to catch."
            exit 1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::error::Expected a failure at the archive-existence check (nonexistent path) — succeeded instead, meaning something unrelated changed."
            exit 1
          fi

          if ! grep -q "not found on the controller" /tmp/restore-ordering-check.log; then
            echo "::error::Failed, but not with the expected archive-not-found message — see log above."
            exit 1
          fi

          echo "OK: reached the expected, safe archive-not-found failure — ansible_host resolved correctly."
        working-directory: ansible

  molecule:
    needs: detect-changes
    if: needs.detect-changes.outputs.roles != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.detect-changes.outputs.roles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Also pulls molecule_helpers/role-requirements.yml per
      # .config/molecule/config.yml — cache key hashes both files.
      - name: Setup uv + Ansible Galaxy collections
        uses: ./.github/actions/setup-uv-ansible
        with:
          install-galaxy-collections: "true"

      - name: Run molecule test — ${{ matrix.role }}
        run: uv run ./molecule-test-all.sh "${{ matrix.role }}"
        working-directory: ansible

      # if: always() - partial coverage from a mid-run failure is still
      # worth reporting. set -o pipefail is required here specifically:
      # this runner's default shell is `bash -e`, not `-eo pipefail`, so
      # without it a failure upstream of `| tee` is masked by tee's exit 0.
      - name: Coverage report + gate — ${{ matrix.role }}
        if: always()
        run: |
          set -o pipefail
          uv run python3 -m molecule_cov.cli inventory "../roles/${{ matrix.role }}" \
            --coverage-dir .data
          uv run python3 -m molecule_cov.cli report \
            --coverage-dir .data --role "${{ matrix.role }}" \
            --thresholds-file thresholds.yaml \
            | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ansible/molecule-coverage

  # Shared logic — see docs/ci.md#compose-boot-test.
  compose-boot-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.compose_apps != '[]'
    uses: ./.github/workflows/_compose-boot-test.yml
    with:
      apps: ${{ needs.detect-changes.outputs.compose_apps }}

  # Fallback for stacks the boot-test job deliberately excludes
  compose-syntax-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for the raw `git diff $BASE $HEAD` below

      - name: Validate every changed compose file parses
        run: |
          # Only the apps compose-boot-test skips — anything it already
          # covers gets a stronger check there, no need to duplicate it
          # here. Same source file as detect-changes' compose step above,
          # so there's nothing to keep "in sync" by hand anymore.
          excluded=$(grep -vE '^\s*#|^\s*$' .github/compose-boot-test-exclusions.txt | paste -sd'|' -)
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^docker/.*/compose.*\.yaml$' \
            | grep -E "^docker/($excluded)/" || true)
          [ -z "$changed" ] && { echo "No excluded-app compose files changed."; exit 0; }
          for f in $changed; do
            [ -f "$f" ] || continue # deleted, not modified — nothing to validate
            echo "=== $f ==="
            dir=$(dirname "$f")
            # An explicit env_file: entry must exist for `config --quiet`
            # to pass, unlike the implicit top-level .env — an empty stub
            # is enough since only syntax is being validated here.
            stub_created=0
            if [ ! -e "$dir/.env" ]; then
              touch "$dir/.env"
              stub_created=1
            fi
            if docker compose -f "$f" config --quiet; then
              rc=0
            else
              rc=$?
            fi
            [ "$stub_created" -eq 1 ] && rm -f "$dir/.env"
            [ "$rc" -eq 0 ] || exit "$rc"
          done

  # See docs/security-scanning.md#trivy-security-scans.
  trivy-scan:
    needs: detect-changes
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-scan.yml
    with:
      run-ansible: ${{ needs.detect-changes.outputs.trivy_ansible == 'true' }}
      run-secrets: true

  # Fixed-name required-check aggregator for the two matrix jobs above —
  # see docs/ci.md#requiring-checks-before-merge for why a matrix job
  # can't be marked required directly. if: always() so a skipped
  # upstream job doesn't skip this one too.
  matrix-jobs-gate:
    needs: [molecule, compose-boot-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if molecule or compose-boot-test actually failed
        run: |
          for r in "${{ needs.molecule.result }}" "${{ needs.compose-boot-test.result }}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not pass (result: $r)."
              exit 1
            fi
          done
