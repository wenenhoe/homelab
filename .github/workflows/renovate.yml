name: Renovate

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  schedule:
    # 17:37 UTC = 01:37 Asia/Singapore, every day, inside renovate.json5's
    # 0-5 PR-creation window with ~4h22m of buffer before it closes at
    # 05:59. This only controls when the Renovate *process* runs, not when
    # it's allowed to open new PRs — that's the separate `schedule` in
    # renovate.json5. Running daily means: (1) vulnerabilityAlerts (which
    # bypass that schedule entirely) land same-day, and (2) open PR
    # branches get rebased daily against main, since `updateNotScheduled`
    # defaults to true (branch *updates* aren't schedule-gated — only new
    # branch/PR *creation* is).
    #
    # Not set to the window's start (00:00 SGT): active work can still be
    # pushed to main up to ~01:30-02:00 SGT, and running before that risks
    # Renovate rebasing branches against a commit that's about to be
    # superseded. A non-zero minute (:37, not :00 or :30) also avoids the
    # top-of-hour/half-hour load spikes GitHub's own scheduler is prone to.
    # 01:37 still clears the observed scheduled-run lag on this workflow
    # (1h44m-2h20m) well before the window's 05:59 close — see the
    # schedule-window-compliance step below for what catches it if that
    # stops being true.
    - cron: "37 17 * * *"

# Least privilege: Renovate authenticates to GitHub separately via
# RENOVATE_TOKEN (a PAT — see docs/renovate-setup.md for scopes), so the
# ambient GITHUB_TOKEN this run gets only needs to check the repo out. It
# never opens PRs, writes branches, or touches anything itself.
permissions:
  contents: read

# Prevents two runs (a schedule tick + a manual workflow_dispatch, or two
# manual triggers) from racing against the same repo state.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>"
        with:
          renovate-version: "44.69.6"
          token: ${{ secrets.RENOVATE_TOKEN }}

      # renovate.json5's schedule only allows new branch/PR creation Mon/Thu
      # 00:00-05:59 Asia/Singapore. GitHub's scheduled-run start lags the
      # cron tick unpredictably (observed 1h44m-2h20m on this workflow), so
      # a Mon/Thu run can land past 05:59 and silently skip PR creation for
      # that cycle while this job still reports success. `if: always()`
      # plus failing here (rather than folding this into the step above)
      # keeps that distinct from an actual Renovate failure, and surfaces
      # it via GitHub's default failed-workflow notification.
      - name: Check schedule-window compliance
        if: always()
        run: |
          dow=$(TZ=Asia/Singapore date +%u)  # 1=Mon .. 7=Sun
          hour=$(TZ=Asia/Singapore date +%-H)
          now=$(TZ=Asia/Singapore date)
          if { [ "$dow" = "1" ] || [ "$dow" = "4" ]; } && [ "$hour" -ge 6 ]; then
            echo "::error::Run started $now SGT, past the 05:59 PR-creation window — no new PRs opened this cycle."
            exit 1
          fi
