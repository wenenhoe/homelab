name: Renovate

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  schedule:
    # 17:37 UTC = 01:37 Asia/Singapore, every day, inside renovate.json5's
    # 0-5 PR-creation window with ~4h22m of buffer before it closes at
    # 05:59. This only controls when the Renovate *process* runs, not when
    # it's allowed to open new PRs — that's the separate `schedule` in
    # renovate.json5. Running daily means: (1) vulnerabilityAlerts (which
    # bypass that schedule entirely) land same-day, and (2) open PR
    # branches get rebased daily against main, since `updateNotScheduled`
    # defaults to true (branch *updates* aren't schedule-gated — only new
    # branch/PR *creation* is).
    #
    # Not set to the window's start (00:00 SGT): active work can still be
    # pushed to main up to ~01:30-02:00 SGT, and running before that risks
    # Renovate rebasing branches against a commit that's about to be
    # superseded. A non-zero minute (:37, not :00 or :30) also avoids the
    # top-of-hour/half-hour load spikes GitHub's own scheduler is prone to.
    # 01:37 still clears the observed scheduled-run lag on this workflow
    # (1h44m-2h20m) well before the window's 05:59 close — see the
    # schedule-window-compliance step below for what catches it if that
    # stops being true.
    - cron: "37 17 * * *"

# Least privilege: Renovate authenticates to GitHub as its own GitHub App
# (ADR 0076; see docs/topics/engineering/ci/renovate.md for its permissions),
# minting a one-hour installation token on each run, so the ambient
# GITHUB_TOKEN this run gets only needs to check the repo out. It never opens
# PRs, writes branches, or touches anything itself.
permissions:
  contents: read

# Prevents two runs (a schedule tick + a manual workflow_dispatch, or two
# manual triggers) from racing against the same repo state.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge in the next step needs main's and maintenance's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Record the workflow start time
        id: started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The token of the Renovate GitHub App, installed on this repository
      # alone. It lasts an hour and is revoked when the job ends. Its
      # permissions are the ones renovate.md lists, so a token minted here
      # holds nothing the app was not installed with. The app is a bypass
      # actor of the maintenance and develop rulesets and of nothing on main.
      - name: Create the Renovate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-statuses: write
          permission-vulnerability-alerts: read

      # Renovate opens its pull requests into maintenance (ADR 0076), so
      # maintenance has to contain main first: a fast-forward, or a merge commit
      # when the two have diverged, never a rewrite or a force push. A conflict
      # fails this step and leaves maintenance as it was. It has no
      # `continue-on-error` and the Renovate step has no `if:`, so a failure
      # here stops the run before Renovate sees a maintenance that is behind.
      # The default GITHUB_TOKEN is refused on maintenance, so the push uses
      # the app token, handed to git as a header for this one command rather
      # than stored in the checkout's config.
      - name: Realign maintenance with main
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_NAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: |
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::${header#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$header"
          python3 -m ci.branches.realign --name "$GIT_NAME" --email "$GIT_EMAIL"
        working-directory: tools

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>"
          # The custom datasources in renovate.json5 that read GitHub's release
          # API are not given the platform token, and unauthenticated calls
          # share GitHub's 60-an-hour limit with every other runner on the IP.
          RENOVATE_HOST_RULES: ${{ format('[{{"matchHost":"api.github.com","token":"{0}"}}]', steps.app-token.outputs.token) }}
        with:
          renovate-version: "44.181.5@sha256:611eac05a6ee11c06d23157ae2ca11364f5b4a096c12d7f82a65aec2b6ec8a48"
          token: ${{ steps.app-token.outputs.token }}

      # renovate.json5's schedule only allows new branch/PR creation Mon/Thu
      # 00:00-05:59 Asia/Singapore. GitHub's scheduled-run start lags the
      # cron tick unpredictably (observed 1h44m-2h20m on this workflow), so
      # a Mon/Thu *scheduled* run can land past 05:59 and silently skip PR
      # creation for that cycle while this job still reports success.
      # Scoped to `github.event_name == 'schedule'`: a manual
      # workflow_dispatch run isn't waiting on a cron tick, so it has no
      # missed window to detect, and would otherwise fail this check on any
      # Mon/Thu run past 06:00 SGT regardless of why it was triggered.
      # `if: always()` plus failing here (rather than folding this into the
      # step above) keeps that distinct from an actual Renovate failure,
      # and surfaces it via GitHub's default failed-workflow notification.
      - name: Check schedule-window compliance
        if: always() && github.event_name == 'schedule'
        env:
          STARTED_EPOCH: ${{ steps.started.outputs.epoch }}
        # The window and timezone are read from renovate.json5 by
        # tools/ci/gates/renovate_window.py, so editing the schedule there
        # changes what this checks; stdlib-only, so plain python3 runs it.
        run: python3 -m ci.gates.renovate_window "$STARTED_EPOCH"
        working-directory: tools
