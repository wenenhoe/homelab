name: Renovate

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  schedule:
    # 20:00 UTC = 04:00 Asia/Singapore, every day. This only controls when
    # the Renovate *process* runs, not when it's allowed to open new PRs —
    # that's the separate, narrower `schedule` in renovate.json5. Running
    # daily means: (1) vulnerabilityAlerts (which bypass renovate.json5's
    # schedule entirely) land same-day instead of waiting for the next PR
    # window, and (2) already-open PR branches get rebased daily against
    # main, since Renovate's `updateNotScheduled` defaults to true (branch
    # *updates* aren't schedule-gated — only new branch/PR *creation* is).
    - cron: "0 20 * * *"

# Least privilege: Renovate authenticates to GitHub separately via
# RENOVATE_TOKEN (a PAT — see docs/renovate-setup.md for scopes), so the
# ambient GITHUB_TOKEN this run gets only needs to check the repo out. It
# never opens PRs, writes branches, or touches anything itself.
permissions:
  contents: read

# Prevents two runs (a schedule tick + a manual workflow_dispatch, or two
# manual triggers) from racing against the same repo state.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>"
        with:
          renovate-version: "44.35.4"
          token: ${{ secrets.RENOVATE_TOKEN }}
