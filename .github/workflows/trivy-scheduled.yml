name: Trivy scheduled scan

# Weekly, unscoped re-run of the two Trivy checks this repo keeps (see
# docs/security-scanning.md#trivy-security-scans) so a new misconfig check added to
# Trivy itself still gets caught even when nothing in this repo
# changed — pr-checks.yml's trivy-scan job only runs the Ansible check
# when a PR actually touches ansible/.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  schedule:
    # 20:00 UTC Sunday = 04:00 Asia/Singapore Monday — same UTC-anchored
    # cron style as renovate.yml, timed to land ahead of the work week.
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  trivy-scan:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-scan.yml
    with:
      run-ansible: true
      run-secrets: true
