name: Trivy scheduled scan

# Weekly, unscoped re-run of all three Trivy checks (see
# docs/ci.md#trivy-security-scans) so a CVE disclosed after the last
# compose/ansible change still gets caught even when nothing in this
# repo changed — pr-checks.yml's trivy-scan job still only runs the
# Ansible misconfig check when a PR actually touches ansible/**; image
# CVE and secret scanning run on every PR already.

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}
  schedule:
    # 20:00 UTC Sunday = 04:00 Asia/Singapore Monday — same UTC-anchored
    # cron style as renovate.yml, timed to land ahead of the work week.
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  trivy-scan:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_trivy-scan.yml
    with:
      run-images: true
      run-ansible: true
      run-secrets: true
      upload-json: true

  # Separate reusable workflow (not a job inside _trivy-scan.yml) so
  # pr-checks.yml's call to that workflow never needs `issues: write` —
  # see _trivy-dashboard.yml's own header comment for why. Artifacts
  # from trivy-scan's jobs are visible here since they're scoped to the
  # workflow run, not to which reusable workflow file uploaded them.
  dashboard:
    needs: trivy-scan
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/_trivy-dashboard.yml
