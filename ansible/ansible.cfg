[defaults]
inventory = inventory/inventory.yaml
roles_path = roles
# Resolved against this file's directory. Molecule scenarios load it too,
# because .config/molecule/config.yml sets ANSIBLE_CONFIG to this file.
filter_plugins = filter_plugins
# Resolved the same way as filter_plugins. A module imports shared code from
# here as ansible.module_utils.<name>.
module_utils = module_utils
host_key_checking = True
stdout_callback = default
display_ok_hosts = no
display_skipped_hosts = no
callback_result_format = yaml

[ssh_connection]
pipelining = True

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False
