---
# CI-only placeholders, loaded explicitly by ci_boot_test.yaml's
# vars_files (last, so it overrides main.yaml — inventory group_vars/all
# auto-loading is lower precedence than a play's vars_files). Real
# playbook runs (deploy.yaml etc.) point at ansible/inventory/ instead
# and never reference this file.
#
# Lives under its own ci-inventory/ tree rather than ansible/playbooks/:
# ansible-lint treats every .yaml under playbooks/ as a playbook, so a
# bare vars dict there is a syntax-check failure.
#
# Every value below exists in production via a `manual` secrets_registry
# entry, a per-host host_vars file, or manual post-bootstrap setup
# (Beszel's key/token). None of that machinery runs in this single-host,
# no-inventory CI run, so every value here is a throwaway placeholder —
# never a real secret, discarded when the CI job's volumes are torn down.
# Adding an app to the Ansible-seeded CI path: check its
# docker/<app>/configs/*.j2 for any variable not already a real
# group_vars/all default (grep the template, then check
# ansible/inventory/group_vars/all/main.yaml) — add anything missing here,
# don't invent a workaround elsewhere.
# ---------------------------------------------------------------------------

# Normally a `manual`-format secrets_registry.yaml entry
# (main.yaml: main_domain: "{{ secrets_generated['main-domain'] }}").
# lab_domain/ddns_domain (main.yaml) derive from this, so defining it
# flatly here is enough to make those resolve too.
main_domain: "ci.invalid"

# Normally per-host (ansible/inventory/host_vars/*.yaml — e.g. play.yaml's
# "play.{{ lab_domain }}"). One flat value is fine here: CI never resolves
# DNS against it, it only needs to render into a config file.
caddy_domain: "svc.ci.invalid"

# beszel_hub_url's real definition (main.yaml) reads
# hostvars['security'].caddy_domain, which doesn't exist in a single-host
# CI run — override it flatly instead of faking a multi-host inventory.
beszel_hub_url: "http://ci-dummy-beszel-hub:8090"
# Normally unset by default until manual post-bootstrap setup (see
# docs/beszel.md) — CI needs *some* value for beszel-agent's config to
# render at all. Must be a real, structurally valid SSH public key, not
# an arbitrary string — beszel-agent's Go SSH parser rejects malformed
# input at startup (confirmed: "Failed to load public keys: failed to
# parse key: ..., error: ssh: no key found"), which apparently kills the
# process rather than just logging a warning, which is what actually
# caused its healthcheck to fail. Generated once via
# `ssh-keygen -t ed25519 -f /tmp/k -N '' -C ci-dummy@ci.invalid`, a
# throwaway keypair — the private half was discarded, this public key
# has never signed anything and authenticates nothing real.
beszel_hub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK1qzZTpouhFnR76Ftn+/xMHL7Tj8rHgYCcVoCfbWse+ ci-dummy@ci.invalid"
beszel_agent_token: "ci-dummy-beszel-agent-token"

cobalt_host: "cobalt"

# lldap's env.j2 needs these three — real values are Ansible-generated
# (secrets role), which doesn't run in this single-app CI path. lldap
# itself never validates them against anything else in a fresh CI stack,
# so throwaway strings are enough.
lldap_jwt_secret: "ci-dummy-lldap-jwt-secret"
lldap_key_seed: "ci-dummy-lldap-key-seed"
lldap_ldap_user_pass: "ci-dummy-lldap-user-pass"

telegram_token: "ci-dummy-telegram-token"
telegram_chat_id: "0"
# diun's env.j2 renders this (topic-routed chat ID) instead of
# telegram_chat_id directly — see docs/telegram-notifications.md.
telegram_chatid_updates: "0"

shlink_short_host: "short"
shlink_web_host: "shlink"
# Normally generated once by the `secrets` role (deploy.yaml Play 1) and
# read back from secrets_generated — see group_vars/all/main.yaml. That
# role never runs in this single-app CI path (ci_boot_test.yaml only
# mirrors preinit.yaml + init.yaml), so main.yaml's
# shlink_api_key: "{{ secrets_generated['shlink-api-key'] }}" would be
# undefined here. Overridden flatly instead, same pattern as
# tinyauth_ldap_observer_password and the lldap_* secrets above —
# seaweedfs is the only app left excluded whose configs would otherwise
# need one of these too (see .github/compose-boot-test-exclusions.txt).
shlink_api_key: "ci-dummy-shlink-api-key"

lldap_host: "lldap"
tinyauth_ldap_observer_password: "ci-dummy-observer-password"

step_ca_password: "ci-dummy-step-ca-password"
step_ca_provisioner_password: "ci-dummy-step-ca-provisioner-password"
