---
# Play 1 — System setup on all hosts (no containers started yet).
# Covers docker engine and the app_registry resolve, which is all Play 2/3
# need from here: bind9 and caddy just need compose_apps already resolved
# in hostvars, not any per-app files on disk yet — those are provisioned
# just before each app actually starts (its own play for caddy/bind9, or
# Play 4 for everything else).
#
# NOTE on vars_prompt and --tags: Ansible evaluates vars_prompt for a play
# during play setup, before any task-level tag filtering happens - so
# every prompt below still fires even for a narrowly-tagged run like
# --tags images, regardless of whether anything in this play ends up
# matching that tag. There's no play-level `tags:` that changes this. For
# a non-interactive or narrowly-tagged run, pre-supply the values Ansible
# already knows how to skip prompting for instead:
#   ansible-playbook deploy.yaml --tags images -e @secrets.yaml
# where secrets.yaml (gitignored) sets whichever of these vars you don't
# want to be asked for. See README.md's tags section.
- name: System setup
  hosts: all
  gather_facts: true
  become: true
  vars_prompt:
    - name: main_domain
      prompt: "Enter the main domain"
    - name: digitalocean_api_key
      prompt: "Enter the DigitalOcean API Key"
      private: true
      confirm: true
    - name: letsencrypt_email
      prompt: "Enter the email for LetsEncrypt"
      private: false
    - name: telegram_token
      prompt: "Enter the Telegram Token for Diun"
      private: true
    - name: telegram_chat_id
      prompt: "Enter the Telegram Chat ID for Diun"
      private: true
    - name: wetty_ssh_host
      prompt: "Enter the default Wetty SSH Host"
      private: false
    - name: tinyauth_ldap_observer_password
      prompt: "Enter the Tinyauth LDAP Observer password"
      private: true
      confirm: true
    - name: beszel_hub_key
      prompt: "Enter the Beszel Hub Key"
      private: true
    - name: beszel_agent_token
      prompt: "Enter the Beszel Agent Token"
      private: true
  tasks:
    - name: Include docker install role
      ansible.builtin.include_role:
        name: docker
      tags:
        - initial-setup

    - name: Include compose's preinit.yaml
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml
      tags:
        - always # every role below reads the resolved compose_apps this sets

# Play 2 — Caddy generates its config, builds its image, and deploys/
# restarts itself, so it's already routing before anything else comes up
# behind it.
- name: Deploy Caddy
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Include caddy role
      ansible.builtin.include_role:
        name: caddy
      tags:
        - images
        - infra

# Play 3 — DNS config written and the bind9 container deployed/restarted
# before any other container starts, and before this host's Docker daemon
# is pointed at it for resolution. hostvars for all app hosts is already
# populated from play 1.
- name: Configure BIND9 on the DNS host
  hosts: dns
  gather_facts: false
  become: true
  tasks:
    - name: Include bind9 role
      ansible.builtin.include_role:
        name: bind9
      tags:
        - images
        - infra

# Play 4 — Every remaining compose app is provisioned and started now that
# DNS is already serving the zones and caddy is already routing. bind9 and
# caddy are excluded here since they resolved/provisioned/deployed
# themselves in Play 1 / Play 2 / Play 3.
- name: Deploy Compose apps
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Include compose_app role
      ansible.builtin.include_role:
        name: compose_app
      tags:
        - images
