---
server_timezone: Asia/Singapore

lab_domain: "lan.{{ main_domain }}"
ddns_domain: "internal.{{ main_domain }}"

docker_users:
  - "{{ ansible_user }}"

project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
compose_source_dir: "{{ (project_root ~ '/docker') | realpath }}"
compose_deploy_dir: /opt/stacks

tinyauth_host: sso

# ---------------------------------------------------------------------------
# Beszel — hub + agent monitoring.
#
# beszel_hub_key / beszel_agent_token are unknown until after the hub's
# first boot (it generates its own ED25519 keypair, and a universal token
# is created by hand in Settings > Tokens). Leave them blank on the first
# `deploy.yaml` run — beszel-agent will sit in a harmless auth-retry loop
# until these are filled in and the playbook is re-run. See docs/beszel.md.
# ---------------------------------------------------------------------------
beszel_hub_host: beszel
beszel_hub_url: "https://{{ beszel_hub_host }}.{{ hostvars['security'].caddy_domain }}"
# beszel_hub_key: ""
# beszel_agent_token: ""

# ---------------------------------------------------------------------------
# Offsite backup (stage 1 DR) — see docs/disaster-recovery.md.
seaweedfs_s3_access_key: "{{ lookup('password', project_root ~ '/ansible/files/secrets/seaweedfs-s3-access-key chars=hexdigits length=32') }}"
seaweedfs_s3_secret_key: "{{ lookup('password', project_root ~ '/ansible/files/secrets/seaweedfs-s3-secret-key chars=hexdigits length=64') }}"
# ---------------------------------------------------------------------------
offsite_backup_s3_bucket: homelab-backups
offsite_backup_s3_endpoint: "https://s3.{{ hostvars['storage'].caddy_domain }}"
offsite_backup_cron: "0 4 * * *"
offsite_backup_retention_days: 7

# minecraft's offsite job reads the `backups` volume, which is ALREADY a
# 7-day rolling window maintained on-host by itzg/mc-backup (see
# docs/disaster-recovery.md for the full reasoning) — a much lower
# off-host retention avoids paying a 7x disk multiplier for near-duplicate
# content, and the cron is offset 30min after mc-backup's own
# "0 4 * * *" so it never archives a tar mid-write.
minecraft_offsite_backup_cron: "30 4 * * *"
minecraft_offsite_backup_retention_days: 2

# ---------------------------------------------------------------------------
# App registry — single source of truth for everything about an app that
# does NOT vary by host: dirs to create, scripts/configs to deploy, and its
# docker upstream.
#
# `configs` is the single list for anything that needs Jinja rendering —
# a .env file is just a normal configs entry with dest: .env and
# force: false (so a re-run never clobbers secrets already on disk).
# Sources live on the controller at
# {{ compose_source_dir }}/{{ app_name }}/configs/{{ item.src }}.
#
# Per-host files (host_vars/*.yaml) only need to list which apps to deploy
# and, for routable apps, the caddy host label(s) — keyed the same way the
# registry keys its routes (`default` for single-route apps, a descriptive
# key like `short`/`web` for multi-route apps like shlink).
# ---------------------------------------------------------------------------
app_registry:
  caddy:
    volumes:
      - name: caddyfile
      - name: data
      - name: config
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  beszel-hub:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "beszel-hub:8090"
        auth: false   # agents auth via TOKEN/KEY handshake, not Tinyauth/LDAP

  beszel-agent:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: true   # deliberate deviation from force:false — .env must
                      # re-render once beszel_hub_key/beszel_agent_token
                      # are filled in post-bootstrap (see docs/beszel.md)
        no_log: true

  bind9:
    volumes:
      - name: config
      - name: cache
      - name: records
      - name: run
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  bentopdf:
    caddy:
      default:
        upstream: "bentopdf:8080"

  cobalt:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    caddy:
      default:
        upstream: "cobalt:9000"
        auth: false

  dashy:
    volumes:
      - name: data
    configs:
      - src: conf.yaml.j2
        dest: "data/conf.yml"
    caddy:
      default:
        upstream: "dashy:8080"
        auth: false

  kms:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "kms-gui:3000"

  openspeedtest:
    caddy:
      default:
        upstream: "openspeedtest:3000"

  shlink:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    # Two containers front one "app": the short-link redirector and the
    # web UI. Host files pair these up by key and supply the hostname.
    caddy:
      short:
        upstream: "shlink:8080"
      web:
        upstream: "shlink-web-client:8080"

  seaweedfs:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
      - src: s3-identity.json.j2
        dest: "data/s3-identity.json"
        mode: "0600"
        force: false
        no_log: true
    caddy:
      s3:
        upstream: "seaweedfs:8333"
        auth: false   # SigV4-authenticated machine traffic, not a Tinyauth session
      filer:
        upstream: "seaweedfs:8888"

  wastebin:
    volumes:
      - name: data
    backup:
      volumes: [data]
    caddy:
      default:
        upstream: "wastebin:8088"

  wetty:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    caddy:
      default:
        upstream: "wetty:3000"

  diun:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  tinyauth:
    volumes:
      - name: data
    configs:
      - src: config.yaml.j2
        dest: "data/config.yaml"
        no_log: true
    backup:
      volumes: [data]
      stop_during_backup: true
    # tinyauth isn't routed through the *.{{ caddy_domain }} wildcard vhost
    # like everything else - it fronts its own top-level auth domain, so
    # Caddyfile.j2 handles it as a special case and just needs its upstream.
    upstream: "tinyauth:3000"

  lldap:
    volumes:
      - name: data
      - name: certs
      - name: creds
      - name: letsencrypt_conf
        legacy_path: letsencrypt/conf
      - name: letsencrypt_lib
        legacy_path: letsencrypt/lib
      - name: scripts
    scripts:
      - deploy-hook.sh
      - entrypoint.sh
      - restart-lldap.py
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    backup:
      # scripts excluded — Ansible-rendered/reproducible, not real state (see docs/volumes.md)
      volumes: [data, certs, creds, letsencrypt_conf, letsencrypt_lib]
    caddy:
      default:
        upstream: "lldap:17170"
        auth: false

  minecraft:
    volumes:
      - name: data
      - name: backups
      - name: bluemap_config
        legacy_path: bluemap/config
      - name: bluemap_web
        legacy_path: bluemap/web
      - name: bluemap_data
        legacy_path: bluemap/data
      - name: extras
    scripts:
      - run_upgrade.sh
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
      - src: modrinth-mods.txt
        dest: extras/modrinth-mods.txt
    backup:
      # Only `backups` — already RCON-quiesced by the backups service above.
      # Never `data` (risks a mid-write world file) or bluemap_*/extras
      # (regenerable render cache / Ansible-managed — see docs/volumes.md).
      volumes: [backups]
      # Overrides — see the "conflicting overrides" validation in the
      # backup_agent role: safe here because minecraft is the only app on
      # `play` with backup volumes, so there's nothing to conflict with.
      retention_days: "{{ minecraft_offsite_backup_retention_days }}"
      cron: "{{ minecraft_offsite_backup_cron }}"
    caddy:
      default:
        upstream: "bluemap:8100"

  dockge:
    volumes:
      - name: data
    caddy:
      default:
        upstream: "dockge:5001"
