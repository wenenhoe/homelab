---
# ---------------------------------------------------------------------------
# App registry — single source of truth for everything about an app that
# does NOT vary by host: dirs to create, scripts/configs to deploy, and its
# docker upstream.
#
# `configs` is the single list for anything that needs Jinja rendering —
# a .env file is just a normal configs entry with dest: .env and
# force: false (so a re-run never clobbers secrets already on disk).
# Sources live on the controller at
# {{ compose_source_dir }}/{{ app_name }}/configs/{{ item.src }}.
#
# Per-host files (host_vars/*.yaml) only need to list which apps to deploy
# and, for routable apps, the caddy host label(s) — keyed the same way the
# registry keys its routes (`default` for single-route apps, a descriptive
# key like `short`/`web` for multi-route apps like shlink).
# ---------------------------------------------------------------------------
app_registry:
  caddy:
    volumes:
      - name: caddyfile
      - name: data
      - name: config
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  beszel-hub:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "beszel-hub:8090"
        auth: false   # agents auth via TOKEN/KEY handshake, not Tinyauth/LDAP

  beszel-agent:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: true   # deliberate deviation from force:false — .env must
                      # re-render once beszel_hub_key/beszel_agent_token
                      # are filled in post-bootstrap (see docs/beszel.md)
        no_log: true

  bind9:
    volumes:
      - name: config
      - name: cache
      - name: records
      - name: run
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  bentopdf:
    caddy:
      default:
        upstream: "bentopdf:8080"

  cobalt:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    caddy:
      default:
        upstream: "cobalt:9000"
        auth: false

  dashy:
    volumes:
      - name: data
    configs:
      - src: conf.yaml.j2
        dest: "data/conf.yml"
    caddy:
      default:
        upstream: "dashy:8080"
        auth: false

  kms:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "kms-gui:3000"

  openspeedtest:
    caddy:
      default:
        upstream: "openspeedtest:3000"

  shlink:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    # Two containers front one "app": the short-link redirector and the
    # web UI. Host files pair these up by key and supply the hostname.
    caddy:
      short:
        upstream: "shlink:8080"
      web:
        upstream: "shlink-web-client:8080"

  seaweedfs:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
      - src: s3-identity.json.j2
        dest: "data/s3-identity.json"
        mode: "0600"
        force: false
        no_log: true
    caddy:
      s3:
        upstream: "seaweedfs:8333"
        auth: false   # SigV4-authenticated machine traffic, not a Tinyauth session
      filer:
        upstream: "seaweedfs:8888"

  wastebin:
    volumes:
      - name: data
    backup:
      volumes: [data]
    caddy:
      default:
        upstream: "wastebin:8088"

  wetty:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    caddy:
      default:
        upstream: "wetty:3000"

  diun:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false

  tinyauth:
    volumes:
      - name: data
    configs:
      - src: config.yaml.j2
        dest: "data/config.yaml"
        no_log: true
    backup:
      volumes: [data]
      stop_during_backup: true
    # tinyauth isn't routed through the *.{{ caddy_domain }} wildcard vhost
    # like everything else - it fronts its own top-level auth domain, so
    # Caddyfile.j2 handles it as a special case and just needs its upstream.
    upstream: "tinyauth:3000"

  lldap:
    volumes:
      - name: data
      - name: certs
      - name: creds
      - name: letsencrypt_conf
        legacy_path: letsencrypt/conf
      - name: letsencrypt_lib
        legacy_path: letsencrypt/lib
      - name: scripts
    scripts:
      - deploy-hook.sh
      - entrypoint.sh
      - restart-lldap.py
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
    backup:
      # scripts excluded — Ansible-rendered/reproducible, not real state (see docs/volumes.md)
      volumes: [data, certs, creds, letsencrypt_conf, letsencrypt_lib]
    caddy:
      default:
        upstream: "lldap:17170"
        auth: false

  minecraft:
    volumes:
      - name: data
      - name: backups
      - name: bluemap_config
        legacy_path: bluemap/config
      - name: bluemap_web
        legacy_path: bluemap/web
      - name: bluemap_data
        legacy_path: bluemap/data
      - name: extras
    scripts:
      - run_upgrade.sh
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        force: false
      - src: modrinth-mods.txt
        dest: extras/modrinth-mods.txt
    backup:
      # Only `backups` — already RCON-quiesced by the backups service above.
      # Never `data` (risks a mid-write world file) or bluemap_*/extras
      # (regenerable render cache / Ansible-managed — see docs/volumes.md).
      volumes: [backups]
      # Overrides — see the "conflicting overrides" validation in the
      # backup_agent role: safe here because minecraft is the only app on
      # `play` with backup volumes, so there's nothing to conflict with.
      retention_days: "{{ minecraft_offsite_backup_retention_days }}"
      cron: "{{ minecraft_offsite_backup_cron }}"
    caddy:
      default:
        upstream: "bluemap:8100"

  dockge:
    volumes:
      - name: data
    caddy:
      default:
        upstream: "dockge:5001"
