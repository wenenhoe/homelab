---
# App registry — single source of truth for everything about an app that
# does NOT vary by host: dirs, scripts/configs to deploy, and its docker
# upstream. `configs` is the list for anything needing Jinja rendering —
# a .env file is just a configs entry with dest: .env.
#
# Configs default to `force: true` (overwrite on drift). Set `force:
# false` only when the destination holds real state Ansible can't
# reconstruct (an app writing back to its own config) — nothing here
# needs it currently; comment why if you add one.
#
# Set `no_log: true` on anything rendering a real secret, or `--diff`
# prints it in plaintext — see docs/secrets.md.
#
# Sources live at {{ compose_source_dir }}/{{ app_name }}/configs/{{ item.src }}.
# Per-host files (host_vars/*.yaml) only list which apps to deploy and,
# for routable apps, the caddy host label(s).
app_registry:
  caddy:
    volumes:
      - name: caddyfile
      - name: data
      - name: config
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true

  beszel-hub:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true   # APP_URL leaks the domain
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "beszel-hub:8090"
        auth: false   # agents auth via TOKEN/KEY handshake, not Tinyauth/LDAP

  beszel-agent:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true

  bind9:
    volumes:
      - name: config
      - name: cache
      - name: records
      - name: run

  bentopdf:
    caddy:
      default:
        upstream: "bentopdf:8080"

  cobalt:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true   # COBALT_API_URL leaks the domain
    caddy:
      default:
        upstream: "cobalt:9000"
        auth: false

  dashy:
    volumes:
      - name: data
    configs:
      - src: conf.yaml.j2
        dest: "data/conf.yml"
    caddy:
      default:
        upstream: "dashy:8080"
        auth: false

  kms:
    volumes:
      - name: data
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "kms-gui:3000"

  librespeed:
    caddy:
      default:
        upstream: "librespeed:8080"

  shlink:
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true
    # Two containers front one "app": the short-link redirector and the
    # web UI. Host files pair these up by key and supply the hostname.
    caddy:
      short:
        upstream: "shlink:8080"
      web:
        upstream: "shlink-web-client:8080"

  seaweedfs:
    volumes:
      - name: data
    configs:
      - src: s3-identity.json.j2
        dest: "data/s3-identity.json"
        mode: "0600"
        no_log: true
    caddy:
      s3:
        upstream: "seaweedfs:8333"
        auth: false   # SigV4-authenticated machine traffic, not a Tinyauth session
      filer:
        upstream: "seaweedfs:8888"

  wastebin:
    volumes:
      - name: data
    backup:
      volumes: [data]
    caddy:
      default:
        upstream: "wastebin:8088"

  diun:
    volumes:
      - name: data
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true

  tinyauth:
    volumes:
      - name: data
    configs:
      - src: config.yaml.j2
        dest: "data/config.yaml"
        no_log: true
    backup:
      volumes: [data]
      stop_during_backup: true
    # tinyauth isn't routed through the *.{{ caddy_domain }} wildcard vhost
    # like everything else - it fronts its own top-level auth domain, so
    # Caddyfile.j2 handles it as a special case and just needs its upstream.
    upstream: "tinyauth:3000"

  lldap:
    volumes:
      - name: data
      - name: certs
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true
    backup:
      volumes: [data, certs]
    caddy:
      default:
        upstream: "lldap:17170"
        auth: false

  step-ca:
    volumes:
      - name: data
      - name: scripts
    scripts:
      - entrypoint.sh
    configs:
      - src: env.j2
        dest: .env
        mode: "0600"
        no_log: true
    backup:
      volumes: [data]
    # No caddy: entry — reachable directly on caddy-proxy by container
    # name (step-ca:9000), the same no-Caddy-frontend pattern bind9
    # uses. See docs/step-ca.md.

  minecraft:
    volumes:
      - name: data
      - name: backups
      - name: bluemap_config
        legacy_path: bluemap/config
      - name: bluemap_web
        legacy_path: bluemap/web
      - name: bluemap_data
        legacy_path: bluemap/data
      - name: extras
    scripts:
      - run_upgrade.sh
      - run_restore.sh
    configs:
      - src: modrinth-mods.txt
        dest: extras/modrinth-mods.txt
      - src: bluemap-core.conf
        dest: bluemap_config/core.conf
    backup:
      # Only `backups` — already RCON-quiesced by the backups service above.
      # Never `data` (risks a mid-write world file) or bluemap_*/extras
      # (regenerable render cache / Ansible-managed — see docs/volumes.md).
      volumes: [backups]
      # itzg/mc-backup already gzips this volume's contents itself, so a
      # second gzip pass here would just be compressing a .tar.gz again
      # for no size benefit — see docs/disaster-recovery.md.
      compression: none
      # Overrides cloud_sync_default_targets (group_vars/all/main.yaml)
      # — additional clouds beyond SeaweedFS only; SeaweedFS itself is
      # never listed here, it's implicit for every backed-up app. See
      # docs/disaster-recovery.md's "Cloud target selection" for why
      # minecraft gets OCI instead of the R2+B2 default.
      extra_cloud_targets: [oci]
    caddy:
      default:
        upstream: "bluemap:8100"

  uptime-kuma:
    volumes:
      - name: data
    backup:
      volumes: [data]
      stop_during_backup: true
    caddy:
      default:
        upstream: "uptime-kuma:3001"
        # Push-monitor pings (plain HTTP GETs from cert-renewer@,
        # cert-expiry-check, cloud_sync, etc. on every host) are
        # machine-to-machine, not a browser session - same reasoning as
        # beszel-hub's auth: false. Tinyauth's forward_auth would
        # redirect those GETs to a login page instead of letting them
        # reach Kuma, silently breaking every push monitor. Kuma's own
        # login still gates the dashboard itself. See docs/uptime-kuma.md.
        auth: false
