---
server_timezone: Asia/Singapore

# main_domain is a `manual`-format secrets_registry entry (not sensitive,
# just routed through the same mechanism) — see docs/secrets.md.
main_domain: "{{ secrets_generated['main-domain'] }}"

lab_domain: "lan.{{ main_domain }}"
ddns_domain: "internal.{{ main_domain }}"

docker_users:
  - "{{ ansible_user }}"

project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
compose_source_dir: "{{ (project_root ~ '/docker') | realpath }}"
compose_deploy_dir: /opt/stacks

tinyauth_host: sso

beszel_hub_host: beszel
beszel_hub_url: "https://{{ beszel_hub_host }}.{{ hostvars['security'].caddy_domain }}"

# Every value below is sourced from secrets_generated (secrets role, Play 0
# of deploy.yaml), driven by secrets_registry.yaml. See docs/secrets.md.
# New entry: add to secrets_registry.yaml, then a line here referencing
# secrets_generated['<registry-key>'] — unless it's only ever needed on
# one specific host (no other host's template/role references it), in
# which case it belongs in that host's own host_vars file instead. See
# docs/secrets.md and the seaweedfs/lldap/tinyauth/step-ca/shlink
# entries already split out that way for the pattern to follow.

# --- Generated by Ansible itself (hex/uuid4) ---
step_ca_provisioner_password: "{{ secrets_generated['step-ca-provisioner-password'] }}"

# Not a secret - the provisioner's own label. Shared so docker/step-ca's
# own bootstrap and every consumer requesting a cert from it (lldap_cert,
# and any future one) reference the same value instead of each hardcoding
# their own copy that could silently drift apart.
step_ca_provisioner_name: internal-services

# --- Supplied manually, outside Ansible ---
digitalocean_api_key: "{{ secrets_generated['digitalocean-api-key'] }}"  # caddy's certbot DNS-01
letsencrypt_email: "{{ secrets_generated['letsencrypt-email'] }}"

telegram_token: "{{ secrets_generated['telegram-token'] }}"
telegram_chat_id: "{{ secrets_generated['telegram-chat-id'] }}"

# Raw per-concern topic IDs (no chat-id prefix) — used directly by
# consumers that call the Telegram Bot API themselves instead of going
# through shoutrrr/diun's own "chat:topic" convenience syntax (Telegram's
# real sendMessage endpoint takes chat_id and message_thread_id as two
# separate params). Three such consumers today, all built on the shared
# telegram_notify library role — see docs/telegram-notifications.md.
telegram_topic_id_updates: "{{ secrets_generated['telegram-topic-id-updates'] }}"
telegram_topic_id_monitoring: "{{ secrets_generated['telegram-topic-id-monitoring'] }}"
telegram_topic_id_backups: "{{ secrets_generated['telegram-topic-id-backups'] }}"
telegram_topic_id_certs: "{{ secrets_generated['telegram-topic-id-certs'] }}"

# One bot/group (above), routed to a different forum topic per concern —
# see docs/telegram-notifications.md for the full scheme and how to get
# a topic's ID. Each var appends ":<topic_id>" to the shared chat ID,
# Telegram's own addressing format for a specific topic within a chat;
# blank topic ID (unset secret) falls back to the chat ID alone. Only
# the shoutrrr-based consumers (diun, backup_agent, Beszel) use these —
# the raw-curl consumers (cert renewal, cloud-sync) read
# telegram_chat_id/telegram_topic_id_* directly instead, see above.
telegram_chatid_updates: "{{ telegram_chat_id }}{{ ':' ~ telegram_topic_id_updates if telegram_topic_id_updates else '' }}"
telegram_chatid_monitoring: "{{ telegram_chat_id }}{{ ':' ~ telegram_topic_id_monitoring if telegram_topic_id_monitoring else '' }}"
telegram_chatid_backups: "{{ telegram_chat_id }}{{ ':' ~ telegram_topic_id_backups if telegram_topic_id_backups else '' }}"

# Unknown until after beszel-hub's first boot (self-generated ED25519
# keypair; token created by hand in Settings > Tokens). allow_blank: true
# in the registry means "" here is expected on first deploy — beszel-agent
# sits in a harmless auth-retry loop until filled in and redeployed. See
# docs/beszel.md.
beszel_hub_key: "{{ secrets_generated['beszel-hub-key'] }}"
beszel_agent_token: "{{ secrets_generated['beszel-agent-token'] }}"

offsite_backup_s3_bucket: homelab-backups
offsite_backup_s3_endpoint: "s3.{{ hostvars['storage'].caddy_domain }}"
offsite_backup_s3_proto: "https"
# 30 4 * * * (not 0 4): runs 30min after itzg/mc-backup's own "0 4 * * *"
# cron (docker/minecraft/compose.yaml), so the `backups` volume is never
# archived mid-write. See docs/disaster-recovery.md.
offsite_backup_cron: "30 4 * * *"
offsite_backup_retention_days: 7
