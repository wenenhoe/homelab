---
server_timezone: Asia/Singapore

# main_domain — every other value below that's derived from a domain name
# depends on this resolving first. It's a `manual`-format secrets_registry
# entry (see the big block further down), not because it's sensitive, but
# because it used to be a vars_prompt entry and there's no reason to keep
# a second, separate mechanism just for the couple of values that aren't
# secrets. See docs/secrets.md.
main_domain: "{{ secrets_generated['main-domain'] }}"

lab_domain: "lan.{{ main_domain }}"
ddns_domain: "internal.{{ main_domain }}"

docker_users:
  - "{{ ansible_user }}"

project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
compose_source_dir: "{{ (project_root ~ '/docker') | realpath }}"
compose_deploy_dir: /opt/stacks

tinyauth_host: sso

beszel_hub_host: beszel
beszel_hub_url: "https://{{ beszel_hub_host }}.{{ hostvars['security'].caddy_domain }}"

# ---------------------------------------------------------------------------
# Every value below is sourced from secrets_generated — populated once by
# the `secrets` role (Play 1 of deploy.yaml, tagged `always`), driven by
# secrets_registry.yaml. See that file and docs/secrets.md
# for the full mechanism, including the three formats
# (hex/uuid4/manual). Adding a new one: add an entry to
# secrets_registry.yaml, then a line like these referencing
# secrets_generated['<registry-key>'].
#
# --- Generated by Ansible itself (hex/uuid4) --------------------------
# seaweedfs_s3_access_key/seaweedfs_s3_secret_key — offsite backup (stage 1
# DR), see docs/disaster-recovery.md.
seaweedfs_s3_access_key: "{{ secrets_generated['seaweedfs-s3-access-key'] }}"
seaweedfs_s3_secret_key: "{{ secrets_generated['seaweedfs-s3-secret-key'] }}"

# lldap's own bootstrap secrets — docker/lldap/configs/env.j2.
lldap_jwt_secret: "{{ secrets_generated['lldap-jwt-secret'] }}"
lldap_key_seed: "{{ secrets_generated['lldap-key-seed'] }}"
lldap_ldap_user_pass: "{{ secrets_generated['lldap-ldap-user-pass'] }}"

# shlink's API key — docker/shlink/configs/env.j2. Deliberately kept a real
# UUID4 (shlink's own convention for this value), not collapsed into a hex
# token — see secrets_registry.yaml.
shlink_api_key: "{{ secrets_generated['shlink-api-key'] }}"

# tinyauth's LDAP observer bind password — docker/tinyauth/configs/config.yaml.j2.
# IMPORTANT: this value alone does not make tinyauth's LDAP bind work — the
# "observer" account itself must be created in lldap (no scripted path for
# that today) with this same password. See docs/secrets.md's
# "Syncing the LDAP observer account password".
tinyauth_ldap_observer_password: "{{ secrets_generated['tinyauth-ldap-observer-password'] }}"

# --- Supplied manually, outside Ansible (replaces the old vars_prompt) ---
# digitalocean_api_key/letsencrypt_email — caddy's and lldap's certbot
# DNS-01 plugin (docker/caddy/configs/env.j2, docker/lldap/configs/env.j2).
digitalocean_api_key: "{{ secrets_generated['digitalocean-api-key'] }}"
letsencrypt_email: "{{ secrets_generated['letsencrypt-email'] }}"

# telegram_token/telegram_chat_id — Diun's update notifications.
telegram_token: "{{ secrets_generated['telegram-token'] }}"
telegram_chat_id: "{{ secrets_generated['telegram-chat-id'] }}"

# wetty_ssh_host — Wetty's web terminal default SSH target.
wetty_ssh_host: "{{ secrets_generated['wetty-ssh-host'] }}"

# beszel_hub_key/beszel_agent_token — unknown until after beszel-hub's own
# first boot (it generates its own ED25519 keypair, and a universal token
# is created by hand in Settings > Tokens). secrets_registry.yaml marks
# both `allow_blank: true`, so bootstrap_secrets.py writes an empty cache
# file for these instead of demanding a value that can't exist yet —
# resolving to "" here is expected and fine on a first deploy: beszel-agent
# just sits in a harmless auth-retry loop until these are filled in (`echo
# '<value>' > ansible/files/secrets/beszel-hub-key`, same for
# beszel-agent-token) and the playbook re-run. See docs/beszel.md.
beszel_hub_key: "{{ secrets_generated['beszel-hub-key'] }}"
beszel_agent_token: "{{ secrets_generated['beszel-agent-token'] }}"
# ---------------------------------------------------------------------------

offsite_backup_s3_bucket: homelab-backups
offsite_backup_s3_endpoint: "s3.{{ hostvars['storage'].caddy_domain }}"
offsite_backup_s3_proto: "https"
# 30 4 * * * (not 0 4) so every backup_agent instance — including
# minecraft's, which now inherits this default rather than overriding it —
# runs 30min after itzg/mc-backup's own on-host "0 4 * * *" cron
# (docker/minecraft/compose.yaml). That gap is what guarantees the
# `backups` volume is never archived mid-write; collapsing everyone onto
# this single schedule keeps that guarantee without needing a per-app
# override. See docs/disaster-recovery.md.
offsite_backup_cron: "30 4 * * *"
offsite_backup_retention_days: 7
