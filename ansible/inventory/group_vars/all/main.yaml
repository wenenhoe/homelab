---
server_timezone: Asia/Singapore

# main_domain is a `manual`-format secrets_registry entry (not sensitive,
# just routed through the same mechanism) — see docs/secrets.md.
main_domain: "{{ secrets_generated['main-domain'] }}"

lab_domain: "lan.{{ main_domain }}"
ddns_domain: "internal.{{ main_domain }}"

docker_users:
  - "{{ ansible_user }}"

project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
compose_source_dir: "{{ (project_root ~ '/docker') | realpath }}"
compose_deploy_dir: /opt/stacks

tinyauth_host: sso
# false in every real deployment — lldap's LDAPS cert is a real
# step-ca-issued one (see docs/lldap.md), trusted via SSL_CERT_FILE
# (docker/tinyauth/compose.yaml), so hostname verification should
# always succeed. Templated (not hardcoded in config.yaml.j2) purely so
# tinyauth's own Molecule scenario can point this at a throwaway
# self-signed cert without forking the template — see
# ansible/roles/tinyauth/molecule/default's host_vars.
tinyauth_ldap_insecure: false

beszel_hub_host: beszel
beszel_hub_url: "https://{{ beszel_hub_host }}.{{ hostvars['security'].caddy_domain }}"

# Every value below is sourced from secrets_generated (secrets role, Play 0
# of deploy.yaml), driven by secrets_registry.yaml. See docs/secrets.md.
# New entry: add to secrets_registry.yaml, then a line here referencing
# secrets_generated['<registry-key>'].

# --- Generated by Ansible itself (hex/uuid4) ---
seaweedfs_s3_access_key: "{{ secrets_generated['seaweedfs-s3-access-key'] }}"  # docs/disaster-recovery.md
seaweedfs_s3_secret_key: "{{ secrets_generated['seaweedfs-s3-secret-key'] }}"

lldap_jwt_secret: "{{ secrets_generated['lldap-jwt-secret'] }}"          # docker/lldap/configs/env.j2
lldap_key_seed: "{{ secrets_generated['lldap-key-seed'] }}"
lldap_ldap_user_pass: "{{ secrets_generated['lldap-ldap-user-pass'] }}"

shlink_api_key: "{{ secrets_generated['shlink-api-key'] }}"  # docker/shlink, kept as real UUID4 — see secrets_registry.yaml

step_ca_password: "{{ secrets_generated['step-ca-password'] }}"                      # docker/step-ca/configs/env.j2
step_ca_provisioner_password: "{{ secrets_generated['step-ca-provisioner-password'] }}"

# Not a secret - the provisioner's own label. Shared so docker/step-ca's
# own bootstrap and every consumer requesting a cert from it (lldap_cert,
# and any future one) reference the same value instead of each hardcoding
# their own copy that could silently drift apart.
step_ca_provisioner_name: internal-services

# Value alone doesn't make tinyauth's LDAP bind work — the "observer"
# account must also be created in lldap with this same password. See
# docs/secrets.md's "Syncing the LDAP observer account password".
tinyauth_ldap_observer_password: "{{ secrets_generated['tinyauth-ldap-observer-password'] }}"

# --- Supplied manually, outside Ansible ---
digitalocean_api_key: "{{ secrets_generated['digitalocean-api-key'] }}"  # caddy's certbot DNS-01
letsencrypt_email: "{{ secrets_generated['letsencrypt-email'] }}"

telegram_token: "{{ secrets_generated['telegram-token'] }}"  # diun notifications
telegram_chat_id: "{{ secrets_generated['telegram-chat-id'] }}"

# Unknown until after beszel-hub's first boot (self-generated ED25519
# keypair; token created by hand in Settings > Tokens). allow_blank: true
# in the registry means "" here is expected on first deploy — beszel-agent
# sits in a harmless auth-retry loop until filled in and redeployed. See
# docs/beszel.md.
beszel_hub_key: "{{ secrets_generated['beszel-hub-key'] }}"
beszel_agent_token: "{{ secrets_generated['beszel-agent-token'] }}"

offsite_backup_s3_bucket: homelab-backups
offsite_backup_s3_endpoint: "s3.{{ hostvars['storage'].caddy_domain }}"
offsite_backup_s3_proto: "https"
# 30 4 * * * (not 0 4): runs 30min after itzg/mc-backup's own "0 4 * * *"
# cron (docker/minecraft/compose.yaml), so the `backups` volume is never
# archived mid-write. See docs/disaster-recovery.md.
offsite_backup_cron: "30 4 * * *"
offsite_backup_retention_days: 7

# --- Offsite backup targets (self-hosted + cloud) ---
# Each app_registry `backup:` block picks which of these it fans out to
# via `cloud_targets` (defaults to cloud_backup_default_targets below if
# omitted). seaweedfs is just another entry here — see
# docs/disaster-recovery.md for why nothing in backup_agent special-cases
# it. force_path_style is left on for every entry, R2/B2/OCI included —
# all three document path-style addressing as supported, and it's the
# safer default for non-AWS S3-compatible endpoints in general. Verify
# against `mc`/`aws s3 ls` against a real bucket before first use if a
# provider's behavior here is ever in doubt.
cloud_backup_targets:
  seaweedfs:
    endpoint: "{{ offsite_backup_s3_endpoint }}"
    proto: "{{ offsite_backup_s3_proto }}"
    bucket: "{{ offsite_backup_s3_bucket }}"
    access_key: "{{ seaweedfs_s3_access_key }}"
    secret_key: "{{ seaweedfs_s3_secret_key }}"
  r2:
    endpoint: "{{ secrets_generated['cloudflare-r2-account-id'] }}.r2.cloudflarestorage.com"
    proto: https
    bucket: homelab-backups
    access_key: "{{ secrets_generated['cloudflare-r2-access-key'] }}"
    secret_key: "{{ secrets_generated['cloudflare-r2-secret-key'] }}"
  b2:
    endpoint: "s3.us-west-004.backblazeb2.com"  # verify your bucket's actual region — see docs/disaster-recovery.md
    proto: https
    bucket: homelab-backups
    access_key: "{{ secrets_generated['backblaze-b2-access-key'] }}"
    secret_key: "{{ secrets_generated['backblaze-b2-secret-key'] }}"
  oci:
    endpoint: "{{ secrets_generated['oci-namespace'] }}.compat.objectstorage.{{ secrets_generated['oci-region'] }}.oraclecloud.com"
    proto: https
    bucket: homelab-backups
    access_key: "{{ secrets_generated['oci-access-key'] }}"
    secret_key: "{{ secrets_generated['oci-secret-key'] }}"

# Small config-app archives (everything except minecraft) go to
# SeaweedFS plus both free-tier clouds for offsite redundancy. Minecraft
# overrides this in app_registry.yaml — see docs/disaster-recovery.md's
# "Cloud target selection" for why it gets OCI instead of R2/B2.
cloud_backup_default_targets: [seaweedfs, r2, b2]
