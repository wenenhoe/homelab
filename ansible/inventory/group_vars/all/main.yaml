---
server_timezone: Asia/Singapore

# main_domain is a `source: manual` secret_catalog entry (not sensitive,
# just routed through the same mechanism) — see docs/topics/secrets/secrets.md.
main_domain: "{{ secrets_generated['main-domain'] }}"

lab_domain: "lan.{{ main_domain }}"
ddns_domain: "internal.{{ main_domain }}"

docker_users:
  - "{{ ansible_user }}"

project_root: "{{ (playbook_dir ~ '/../..') | realpath }}"
compose_source_dir: "{{ (project_root ~ '/docker') | realpath }}"
compose_deploy_dir: /opt/stacks

# rejectattr('name', 'in', ...)'d out of compose_app's generic Play 4
# loop — each of these deploys itself instead (Play 2/Play 3, or an
# extra task ahead of the generic loop within Play 4 itself), because
# each needs something the generic loop can't do: caddy/bind9 need
# custom config generation between volume-init and compose-up; openbao
# needs its data volume chowned to the image's own non-root user
# before it ever starts (see roles/openbao's own comment for why that
# couldn't just be another compose service). See docs/topics/deploy/deployment-flow.md.
compose_self_managed_apps:
  - bind9
  - caddy
  - openbao

# Every app's full definition: its host's compose_apps over the catalog.
# A templated variable rather than a set_fact, so any host's value is
# readable through hostvars without that host's play having run
# (ADR 0065).
resolved_apps: "{{ compose_apps | resolve_apps(app_catalog) }}"

# What a host backs up, every setting resolved, and which hosts back up
# anything (ADR 0068). Lazy for the same reason as resolved_apps.
backup_plan: "{{ resolved_apps | backup_plan(backup_defaults) }}"
backup_hosts: "{{ groups['managed_hosts'] | backup_hosts(hostvars) }}"

tinyauth_host: sso

beszel_hub_host: beszel
beszel_hub_url: "https://{{ beszel_hub_host }}.{{ hostvars['security'].caddy_domain }}"

gatus_host: gatus
gatus_url: "https://{{ gatus_host }}.{{ hostvars['security'].caddy_domain }}"

# Every job whose silence has to raise an alert: one Gatus external
# endpoint each, rendered by docker/gatus/configs/config.yaml.j2, with its
# own generated token (secret_catalog.yaml's gatus-token-<id>, scoped to
# the host the job runs on) in heartbeat_job_tokens below.
#   id              endpoint name; the secret is gatus-token-<id>
#   group           the Telegram topic the alert lands in: the topic is
#                   telegram_topic_id_<group>, and the job is pushed to
#                   <group>_<id>
#   period_minutes  how often the job pushes
#   slack_minutes   added to the period for the heartbeat interval;
#                   defaults to backup_freshness_buffer_hours
# Gatus notices a dead job between one and two intervals after its last
# push (docs/topics/monitoring/gatus.md).
heartbeat_jobs:
  # check-freshness.timer: hourly, host-side.
  - {id: backup-security, group: backups, period_minutes: 60}
  - {id: backup-services, group: backups, period_minutes: 60}
  - {id: backup-play, group: backups, period_minutes: 60}
  # cloud-sync.timer: daily, see host_vars/storage.yaml.
  - {id: cloud-sync, group: backups, period_minutes: 1440}
  # r2-read-watcher-heartbeat.timer: every 10 minutes. A 15-minute interval
  # gives an alert 15 to 30 minutes after a stop (docs/topics/secrets/openbao-r2-read-watcher.md).
  - {id: r2-read-watcher, group: backups, period_minutes: 10, slack_minutes: 5}
  # cert-expiry-check.timer: daily, on every app host.
  - {id: cert-expiry-security, group: certs, period_minutes: 1440}
  - {id: cert-expiry-storage, group: certs, period_minutes: 1440}
  - {id: cert-expiry-play, group: certs, period_minutes: 1440}
  - {id: cert-expiry-services, group: certs, period_minutes: 1440}
  # cert-renewer@'s daily liveness push (ADR 0072).
  - {id: cert-renewer-lldap, group: certs, period_minutes: 1440}
  - {id: cert-renewer-openbao, group: certs, period_minutes: 1440}

# Job id -> its push token. A job with no gatus-token-<id> catalog entry
# fails the render rather than getting an empty token.
heartbeat_job_tokens: >-
  {{ dict(heartbeat_jobs | map(attribute='id')
     | zip(heartbeat_jobs | map(attribute='id')
           | map('regex_replace', '^', 'gatus-token-')
           | map('extract', secrets_generated))) }}

# Job id -> the URL it POSTs its heartbeat to (docs/topics/monitoring/gatus.md).
heartbeat_push_urls: >-
  {{ dict(heartbeat_jobs | map(attribute='id')
     | zip(heartbeat_jobs | map(attribute='group')
           | zip(heartbeat_jobs | map(attribute='id'))
           | map('join', '_')
           | map('regex_replace', '^', gatus_url ~ '/api/v1/endpoints/')
           | map('regex_replace', '$', '/external?success=true'))) }}

# Every value below is sourced from secrets_generated (secrets role, Play 0
# of deploy.yaml), driven by secret_catalog.yaml. See docs/topics/secrets/secrets.md.
# New entry: add to secret_catalog.yaml, then a line here referencing
# secrets_generated['<catalog-key>'] — unless it's only ever needed on
# one specific host (no other host's template/role references it), in
# which case it belongs in that host's own host_vars file instead. See
# docs/topics/secrets/secrets.md and the seaweedfs/lldap/tinyauth/step-ca/shlink
# entries already split out that way for the pattern to follow.

# --- Generated by Ansible itself (hex/uuid4) ---
step_ca_provisioner_password: "{{ secrets_generated['step-ca-provisioner-password'] }}"

# Not a secret - the provisioner's own label. Shared so docker/step-ca's
# own bootstrap and every consumer requesting a cert from it
# (step_ca_cert's lldap and openbao instances, and any future one)
# reference the same value instead of each hardcoding their own copy
# that could silently drift apart.
step_ca_provisioner_name: internal-services

# --- Supplied manually, outside Ansible ---
digitalocean_api_key: "{{ secrets_generated['digitalocean-api-key'] }}"  # caddy's certbot DNS-01
letsencrypt_email: "{{ secrets_generated['letsencrypt-email'] }}"

telegram_token: "{{ secrets_generated['telegram-token'] }}"
telegram_chat_id: "{{ secrets_generated['telegram-chat-id'] }}"

# Raw per-concern topic IDs (no chat-id prefix) — used directly by
# consumers that call the Telegram Bot API themselves instead of going
# through shoutrrr's own "chat:topic" convenience syntax (Telegram's
# real sendMessage endpoint takes chat_id and message_thread_id as two
# separate params). Three such consumers today, all built on the shared
# telegram_notify library role — see docs/topics/monitoring/telegram-notifications.md.
telegram_topic_id_monitoring: "{{ secrets_generated['telegram-topic-id-monitoring'] }}"
telegram_topic_id_backups: "{{ secrets_generated['telegram-topic-id-backups'] }}"
telegram_topic_id_certs: "{{ secrets_generated['telegram-topic-id-certs'] }}"

# One bot/group (above), routed to a different forum topic per concern —
# see docs/topics/monitoring/telegram-notifications.md for the full scheme and how to get
# a topic's ID. Each var appends ":<topic_id>" to the shared chat ID,
# Telegram's own addressing format for a specific topic within a chat;
# blank topic ID (unset secret) falls back to the chat ID alone. Only
# the shoutrrr-based consumers (backup_agent, Beszel) use these —
# the raw-curl consumers (cert renewal, cloud-sync) read
# telegram_chat_id/telegram_topic_id_* directly instead, see above.
telegram_chatid_monitoring: "{{ telegram_chat_id }}{{ ':' ~ telegram_topic_id_monitoring if telegram_topic_id_monitoring else '' }}"
telegram_chatid_backups: "{{ telegram_chat_id }}{{ ':' ~ telegram_topic_id_backups if telegram_topic_id_backups else '' }}"

# Unknown until after beszel-hub's first boot (self-generated ED25519
# keypair; token created by hand in Settings > Tokens). allow_blank: true
# in the catalog means "" here is expected on first deploy — beszel-agent
# sits in a harmless auth-retry loop until filled in and redeployed. See
# docs/topics/monitoring/beszel.md.
beszel_hub_key: "{{ secrets_generated['beszel-hub-key'] }}"
beszel_agent_token: "{{ secrets_generated['beszel-agent-token'] }}"

seaweedfs_s3_bucket: homelab-backups
seaweedfs_s3_endpoint: "s3.{{ hostvars['storage'].caddy_domain }}"
seaweedfs_s3_proto: "https"

# Backup settings for an app whose `backup:` block leaves them out; the
# keys are the block's own keys (ADR 0068).
backup_defaults:
  # 30 4 * * * (not 0 4): runs 30min after itzg/mc-backup's own "0 4 * * *"
  # cron (docker/minecraft/compose.yaml), so the `backups` volume is never
  # archived mid-write. See docs/topics/disaster-recovery/backup.md.
  cron: "30 4 * * *"
  retention_days: 7
  compression: gz
  stop_during_backup: false
  # Small config-app archives (everything except minecraft) go to both
  # free-tier clouds for offsite redundancy. minecraft overrides this in
  # app_catalog.yaml — see docs/topics/disaster-recovery/cloud-sync.md for why it gets OCI
  # instead. Each name must be a key of
  # host_vars/storage.yaml's cloud_sync_targets.
  cloud_targets: [r2, b2]

# Slack added on top of each app's own cron-derived interval before the
# freshness check (docs/topics/monitoring/gatus.md) stops pushing - covers
# backup duration plus scheduling jitter, not the interval itself. The
# interval comes from each app's own resolved cron (the
# cron_period_hours filter in ansible/filter_plugins/) so it can never
# drift from whatever cron actually says - see
# backup_agent/tasks/build_schedules.yaml.
backup_freshness_buffer_hours: 2
