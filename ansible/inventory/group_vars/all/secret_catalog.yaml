---
# Central catalog of every secret the `secrets` role handles. Each entry
# states how its value is produced (`source`) and where it is kept
# (`store`), so no tool infers either. Add an entry here, then reference
# secrets_generated['<key>'] from a var in main.yaml. See docs/topics/secrets/secrets.md.
# The rules below are checked by the check-secret-catalog pre-commit
# hook (tools/ci/gates/secret_catalog_rules.py), so a wrong combination
# fails before merge, not at deploy or rotation time.
#
# Do NOT add externally-issued credentials or anything an app generates
# for itself post-boot — those are `source: manual` entries below, not a
# reason to skip this catalog.
#
# source: hex    — random hex string of `length` characters. Requires `length`.
# source: uuid4  — real RFC 4122 v4 UUID.
# source: manual — Ansible can't generate this; must exist before
#                  deploy.yaml needs it (by hand, or `cd tools &&
#                  python3 -m openbao_utils.bootstrap`). Missing → deploy.yaml
#                  fails loudly using `description` below. Present-but-empty
#                  is valid, not an error. `allow_blank: true` lets
#                  openbao_utils/bootstrap.py store an empty placeholder instead
#                  of re-prompting, for values (Beszel's) that don't exist
#                  until after first boot. `sensitive` controls masked
#                  input in openbao_utils/bootstrap.py.
#
# store — REQUIRED on every entry, with no default. One of:
#   openbao         — Vault KV v2 at `secret/data/<scope>/<key>` (mount
#                     `secret`, key = this entry's own catalog name).
#   controller_file — the controller-side file cache (ansible/files/secrets/).
#   Ansible can only generate into OpenBao, so every hex/uuid4 entry is
#   `openbao`. Exactly two categories of `manual` entry are
#   `controller_file`, both because Vault access itself depends on them:
#     - main-domain: needed to resolve ansible_host (including security's,
#       and therefore OpenBao's own hostname) before Vault is reachable
#       at all — moving it into Vault is circular, not just inconvenient.
#     - openbao-controller-role-id / -secret-id: the AppRole credential
#       Ansible authenticates to Vault WITH. Same circularity — Vault
#       can't hold the key that unlocks itself.
#
# scope — REQUIRED with `store: openbao`, forbidden with `controller_file`.
#   The KV path prefix, one of:
#     hosts/<security|services|storage|play>   — mirrors host_vars/<host>.yaml
#     hosts/all/<concern>                       — mirrors group_vars/all/main.yaml,
#                                                  grouped by consumer (telegram,
#                                                  beszel, caddy-acme, step-ca, ...)
#     cloud_credentials/leaf                    — see below
#   See docs/decisions/0021-secret-path-layout-for-secrets-with-no-host-owner/revision-000.md
#   for why this maps onto 0022's already-Accepted `hosts/*` policy grant
#   rather than a new top-level path. Explicit per entry, not inferred
#   from which file currently references it — a future host_vars/main.yaml
#   reorganization shouldn't silently relocate a secret in Vault.
#
#   Every cloudflare-r2-* / backblaze-b2-* / oci-* entry below has
#   scope: cloud_credentials/leaf — the top-level path
#   tools/cloud_credentials/*.py's own scoped("leaf") already writes
#   to (see cache.py), not a hosts/*-scoped path. It's a real
#   `scope` value like any other, just a different top-level
#   prefix than hosts/* — kept distinct per ADR 0021's own reasoning
#   for cloud_credentials/{leaf,rotation}: a future cd-agent rotation
#   AppRole needs read/write here on its own schedule, with no
#   equivalent grant on hosts/*.
#
# Other rules: `length` only on hex; `description` required on manual;
# `allow_blank` and `sensitive` only on manual.
#
# Naming: kebab-case. seaweedfs-s3-*-key-admin was seaweedfs-s3-access-key/
# seaweedfs-s3-secret-key before an earlier migration — if you're updating
# an existing controller from that era, rename its cache files to match
# (preserves the actual credential value; skip this and a fresh one
# silently generates instead — harmless, since nothing outside Ansible's
# management depends on the exact value, but throws away the old one for
# no reason):
#   cd ansible/files/secrets/
#   mv seaweedfs-s3-access-key seaweedfs-s3-access-key-admin
#   mv seaweedfs-s3-secret-key seaweedfs-s3-secret-key-admin
# Do this BEFORE deploying, not after.
secret_catalog:
  seaweedfs-s3-access-key-admin:
    source: hex
    length: 32
    store: openbao
    scope: hosts/storage
  seaweedfs-s3-secret-key-admin:
    source: hex
    length: 64
    store: openbao
    scope: hosts/storage
  # Read/List only, whole bucket — cloud_sync (storage-only) relays
  # already-encrypted objects out to R2/B2/OCI, never writes back to
  # SeaweedFS. Deliberately separate from the admin pair above even
  # though both live on `storage`: if this one leaks on its own, it
  # can't touch existing backups. See docs/topics/disaster-recovery/backup.md.
  seaweedfs-s3-access-key-cloud-sync-reader:
    source: hex
    length: 32
    store: openbao
    scope: hosts/storage
  seaweedfs-s3-secret-key-cloud-sync-reader:
    source: hex
    length: 64
    store: openbao
    scope: hosts/storage
  # One pair per host in backup_hosts (group_vars/all/main.yaml: the hosts
  # with a non-empty backup_plan) — each scoped in
  # docker/seaweedfs/configs/s3-identity.json.j2 to write/read/list only
  # its own hostname-prefixed objects. A host that gains its first backed-up
  # app needs a matching pair added here AND its own
  # seaweedfs_s3_access_key/secret_key in its host_vars file.
  seaweedfs-s3-access-key-services:
    source: hex
    length: 32
    store: openbao
    scope: hosts/services
  seaweedfs-s3-secret-key-services:
    source: hex
    length: 64
    store: openbao
    scope: hosts/services
  seaweedfs-s3-access-key-security:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  seaweedfs-s3-secret-key-security:
    source: hex
    length: 64
    store: openbao
    scope: hosts/security
  seaweedfs-s3-access-key-play:
    source: hex
    length: 32
    store: openbao
    scope: hosts/play
  seaweedfs-s3-secret-key-play:
    source: hex
    length: 64
    store: openbao
    scope: hosts/play
  lldap-jwt-secret:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  lldap-key-seed:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  lldap-ldap-user-pass:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  shlink-api-key:
    source: uuid4
    store: openbao
    scope: hosts/services
  tinyauth-ldap-observer-password:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  step-ca-password:
    source: hex
    length: 32
    store: openbao
    scope: hosts/security
  # Global (group_vars/all/main.yaml), not host_vars/security.yaml, even
  # though step-ca only runs on security — other future step-ca
  # consumers on other hosts may need it (see main.yaml's own comment).
  step-ca-provisioner-password:
    source: hex
    length: 32
    store: openbao
    scope: hosts/all/step-ca

  # --- manual: replaces every remaining vars_prompt entry in deploy.yaml ---
  main-domain:
    source: manual
    store: controller_file
    sensitive: false
    description: "The main domain for this homelab (e.g. example.com) — lab_domain/ddns_domain derive from it."
    # Permanent file-cache exception, see header comment.
  digitalocean-api-key:
    source: manual
    sensitive: true
    store: openbao
    scope: hosts/all/caddy-acme
    description: "DigitalOcean API key — used by caddy's DNS-01 plugin to issue TLS certs."
  letsencrypt-email:
    source: manual
    sensitive: false
    store: openbao
    scope: hosts/all/caddy-acme
    description: "Email address for Let's Encrypt account registration/expiry notices."
  telegram-token:
    source: manual
    sensitive: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram bot token for Diun's update notifications."
  telegram-chat-id:
    source: manual
    sensitive: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram chat ID for Diun's update notifications."
  beszel-hub-key:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/all/beszel
    description: >-
      Beszel hub's public ED25519 key. Doesn't exist until AFTER beszel-hub's
      own first boot — generated by the hub itself, copied from its web UI
      (Settings > Keys). See docs/topics/monitoring/beszel.md. Safe to leave blank for the
      first deploy; beszel-agent just sits in a harmless auth-retry loop
      until this is filled in and redeployed.
  beszel-agent-token:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/all/beszel
    description: >-
      Beszel universal agent token. Doesn't exist until AFTER beszel-hub's
      own first boot — created by hand in its web UI (Settings > Tokens).
      See docs/topics/monitoring/beszel.md. Same first-deploy-blank-is-fine behavior as
      beszel-hub-key.

  # --- Uptime Kuma push monitors — see docs/topics/monitoring/uptime-kuma.md ---
  # allow_blank: true for the same reason as beszel-hub-key/
  # beszel-agent-token: the URL (including its token) only exists after
  # the matching Push monitor is created by hand in Kuma's own UI.
  uptime-kuma-push-url-cloud-sync:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/storage
    description: >-
      Push URL for the "storage — cloud_sync" monitor in Uptime Kuma
      (Settings shown when creating/editing the monitor). Blank is fine
      for the first deploy — the pusher unit just fails on its own
      (curl: no URL specified, visible via `journalctl -u
      uptime-kuma-push-cloud-sync`) without affecting cloud-sync's own
      success/failure status or its existing OnFailure= alert, until
      this is filled in and redeployed.

  uptime-kuma-push-url-cert-renewer-lldap:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/security
    description: >-
      Push URL for lldap's cert-renewal monitor in Uptime Kuma. Same
      blank-is-fine shape as uptime-kuma-push-url-cloud-sync above — see
      docs/topics/monitoring/uptime-kuma.md's note on cert-renewer@'s OnSuccess= only
      firing on an actual renewal (roughly once a day at step-ca's
      default 24h cert lifetime), not every 15-minute timer tick.

  uptime-kuma-push-url-cert-renewer-openbao:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/security
    description: >-
      Push URL for openbao's cert-renewal monitor in Uptime Kuma. Same
      blank-is-fine shape as uptime-kuma-push-url-cert-renewer-lldap
      above.

  # --- OpenBao controller AppRole (ADR 0020) ---
  # allow_blank: true because nothing consumes these yet until this
  # entry's role_id/secret_id are copied in by hand per
  # docs/topics/secrets/openbao-auth.md's runbook. Permanent file-cache exceptions
  # (`store: controller_file`) — see this file's header comment: these are
  # the credential Ansible authenticates to Vault WITH.
  openbao-controller-role-id:
    source: manual
    store: controller_file
    sensitive: false
    allow_blank: true
    description: >-
      OpenBao AppRole role_id for the "controller" role. Not secret on
      its own — role_id is a public identifier, not a credential — but
      cached the same way for consistency. Generate via
      docs/topics/secrets/openbao-auth.md's runbook.
  openbao-controller-secret-id:
    source: manual
    store: controller_file
    sensitive: true
    allow_blank: true
    description: >-
      OpenBao AppRole secret_id for the "controller" role — the actual
      credential half of the pair. Generate via docs/topics/secrets/openbao-auth.md's
      runbook. secret_id_ttl is 90 days; regenerate via the same
      runbook before it expires or after any suspected exposure.

  # One per host — cert-expiry-check runs on every app_host
  # independently (see docs/topics/monitoring/telegram-notifications.md), so each host's
  # check is its own Push monitor with its own URL, not a shared one.
  uptime-kuma-push-url-cert-expiry-security:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/security
    description: "Push URL for security's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-storage:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/storage
    description: "Push URL for storage's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-play:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/play
    description: "Push URL for play's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-services:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/services
    description: "Push URL for services's cert-expiry-check monitor in Uptime Kuma."

  # backup_agent's freshness-check push — one per host that runs
  # backup_agent, not one per app (see docs/topics/monitoring/uptime-kuma.md): every
  # app's credential is already scoped to this host's own {host}-*
  # prefix, so one push per host covers every app on it, and a future
  # app added to an *existing* host needs no new entry here at all.
  uptime-kuma-push-url-backup-services:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/services
    description: "Push URL for services's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."
  uptime-kuma-push-url-backup-play:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/play
    description: "Push URL for play's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."
  uptime-kuma-push-url-backup-security:
    source: manual
    sensitive: true
    allow_blank: true
    store: openbao
    scope: hosts/security
    description: "Push URL for security's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."

  # --- Telegram forum-topic routing — see docs/topics/monitoring/telegram-notifications.md ---
  # One shared bot (telegram-token/telegram-chat-id above), different
  # topic per concern. allow_blank: true because the group's Topics
  # feature is optional — a blank value falls back to posting in the
  # group's main stream instead of a topic (see main.yaml).
  telegram-topic-id-updates:
    source: manual
    sensitive: false
    allow_blank: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram forum-topic ID for image-update notifications (diun)."
  telegram-topic-id-monitoring:
    source: manual
    sensitive: false
    allow_blank: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram forum-topic ID for host/container monitoring alerts (Beszel)."
  telegram-topic-id-backups:
    source: manual
    sensitive: false
    allow_blank: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram forum-topic ID for backup-job notifications (docker-volume-backup)."
  telegram-topic-id-certs:
    source: manual
    sensitive: false
    allow_blank: true
    store: openbao
    scope: hosts/all/telegram
    description: "Telegram forum-topic ID for certificate-renewal failure alerts."

  # --- Cloud backup targets — see docs/topics/disaster-recovery/backup.md ---
  # Two credentials per provider (write for cloud_sync, read for the
  # controller-side restore-discovery script that will consume these
  # later) instead of one — see docs/topics/secrets/cloud-credentials/creation.md for how
  # these six are created and .../scoping.md for exactly what each is scoped to.
  #
  # scope: cloud_credentials/leaf on every entry in this section
  # (through oci-region below): all written by tools/cloud_credentials/
  # *.py's own scoped("leaf") (cache.py), the same top-level Vault path
  # this points at — not a hosts/*-scoped path, and not inferred from
  # this role's own hex/uuid4 generation, since nothing here is
  # generated by this role. See this file's header comment.
  cloudflare-r2-write-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token access key ID, bucket-scoped, Object Read & Write — see docs/topics/secrets/cloud-credentials/scoping.md."
  cloudflare-r2-write-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-write-access-key."
  cloudflare-r2-read-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token access key ID, bucket-scoped, Object Read only — see docs/topics/secrets/cloud-credentials/scoping.md."
  cloudflare-r2-read-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-read-access-key."
  cloudflare-r2-account-id:
    source: manual
    sensitive: false
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare account ID — forms the R2 S3 endpoint <id>.r2.cloudflarestorage.com."
  backblaze-b2-write-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key ID, bucket-scoped, listFiles+writeFiles (no deleteFiles) — see docs/topics/secrets/cloud-credentials/scoping.md."
  backblaze-b2-write-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key, matching backblaze-b2-write-access-key."
  backblaze-b2-read-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key ID, bucket-scoped, listFiles+readFiles only — see docs/topics/secrets/cloud-credentials/scoping.md."
  backblaze-b2-read-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key, matching backblaze-b2-read-access-key."
  backblaze-b2-region:
    source: manual
    sensitive: false
    store: openbao
    scope: cloud_credentials/leaf
    description: >-
      Backblaze B2 bucket's region ID (e.g. us-west-004) — B2 Console >
      Buckets > Bucket Details. Forms the S3-compatible endpoint
      s3.<region>.backblazeb2.com.
  # --- OpenBao snapshot push target — see docs/topics/secrets/openbao-backup-restore.md ---
  # Standing write leaf for the openbao-snapshots bucket, separate from
  # the break-glass read-only restore credential (ADR 0017) — that one
  # is never cached here by design. No deleteFiles/admin capability;
  # same no-delete shape as the pair above. Same scope, same
  # cloud_credentials/*.py reasoning as the rest of this section.
  cloudflare-r2-openbao-snapshot-write-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token access key ID, scoped to openbao-snapshots, Object Write — see docs/topics/secrets/cloud-credentials/scoping.md."
  cloudflare-r2-openbao-snapshot-write-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-openbao-snapshot-write-access-key."
  backblaze-b2-openbao-snapshot-write-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key ID, scoped to openbao-snapshots, listFiles+writeFiles (no deleteFiles) — see
      docs/topics/secrets/cloud-credentials/scoping.md."
  backblaze-b2-openbao-snapshot-write-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "Backblaze B2 application key, matching backblaze-b2-openbao-snapshot-write-access-key."
  oci-write-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: >-
      OCI Customer Secret Key access key, write-only
      (OBJECT_CREATE+OBJECT_OVERWRITE+OBJECT_INSPECT, no delete) — see
      docs/topics/secrets/cloud-credentials/scoping.md.
  oci-write-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "OCI Customer Secret Key secret, matching oci-write-access-key."
  oci-read-access-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "OCI Customer Secret Key access key, read-only (OBJECT_READ+OBJECT_INSPECT only) — see docs/topics/secrets/cloud-credentials/scoping.md."
  oci-read-secret-key:
    source: manual
    sensitive: true
    store: openbao
    scope: cloud_credentials/leaf
    description: "OCI Customer Secret Key secret, matching oci-read-access-key."
  oci-namespace:
    source: manual
    sensitive: false
    store: openbao
    scope: cloud_credentials/leaf
    description: "OCI Object Storage namespace (Console: Administration > Tenancy Details, or `oci os ns get`) — forms the S3-compatible endpoint."
  oci-region:
    source: manual
    sensitive: false
    store: openbao
    scope: cloud_credentials/leaf
    description: "OCI region hosting the homelab-backups bucket, e.g. ap-singapore-1 — forms the S3-compatible endpoint."
