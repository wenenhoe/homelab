---
# ---------------------------------------------------------------------------
# Central registry of every secret the `secrets` role generates-once-and-
# caches on the controller. Mirrors app_registry.yaml's own role: one place
# listing every managed item and its generation spec, consumed everywhere
# else by reference (ansible/roles/secrets/tasks/, group_vars/all/main.yaml).
#
# Adding a NEW internally-generatable secret: add an entry here, then
# reference secrets_generated['<key>'] from wherever it's needed (usually a
# new var in main.yaml, in turn referenced by a docker/<app>/configs/*.j2
# template). Nothing else to wire up — see docs/secrets.md.
#
# Do NOT add externally-issued credentials here (DigitalOcean API key,
# Telegram bot token, LetsEncrypt email, etc.) or anything an app generates
# for itself post-boot (Beszel's hub key/agent token) — those stay as
# vars_prompt entries in deploy.yaml. This registry is only for values we
# generate ourselves and have no external source of truth to reconcile
# against.
#
# format: hex  — a random string, cached via ansible.builtin.password.
#                 length: required, the number of characters.
# format: uuid4 — a real RFC 4122 version-4 UUID. password's charset-based
#                 generation can't produce correct version/variant bits, so
#                 this format is handled by real generate-once-and-cache
#                 task logic instead (see ensure_secret.yaml). No `length`.
# format: manual — Ansible cannot generate this value at all (an
#                 externally-issued credential, or plain non-interactive
#                 config that used to be a vars_prompt entry). The cache
#                 file must be created out-of-band before deploy.yaml
#                 needs it — by hand, or via `python3 ansible/
#                 bootstrap_secrets.py` (the easier way; walks every
#                 missing manual entry interactively, one time). If the
#                 file is missing entirely, deploy.yaml fails loudly and
#                 tells you exactly what to create and why (the
#                 `description` field below is what that message shows).
#                 An EXISTING file with EMPTY content is a valid value
#                 (resolves to ""), not an error — this is what lets
#                 beszel_hub_key/beszel_agent_token start out blank (they
#                 genuinely don't exist until after beszel-hub's own first
#                 boot, see docs/beszel.md) without failing every run
#                 until you fill them in. `allow_blank: true` on those two
#                 entries only controls bootstrap_secrets.py's prompting —
#                 it lets the script write an empty placeholder instead of
#                 re-prompting for a value that can't exist yet. Every
#                 other manual entry has no `allow_blank`, so the script
#                 re-prompts until something non-empty is given (a blank
#                 DigitalOcean API key, for instance, would silently break
#                 cert issuance with no clear error otherwise).
#                 `sensitive: true/false` mirrors the old vars_prompt
#                 `private:` flag — controls whether bootstrap_secrets.py
#                 masks the value while you type it.
#                 `description` is required for every manual entry — it's
#                 the only human-readable context left, now that there's
#                 no vars_prompt `prompt:` text.
#
# Naming: kebab-case. seaweedfs-s3-access-key / seaweedfs-s3-secret-key
# match the filenames already on disk under ansible/files/secrets/ on real
# controllers today — do not rename those two, or their existing cached
# values are orphaned (a fresh value gets generated under the new filename,
# and every backup_agent/storage host that already trusts the old one goes
# out of sync). Every other key is free to follow the same convention from
# a clean slate.
# ---------------------------------------------------------------------------
secrets_registry:
  seaweedfs-s3-access-key: { format: hex, length: 32 }
  seaweedfs-s3-secret-key: { format: hex, length: 64 }
  lldap-jwt-secret: { format: hex, length: 32 }
  lldap-key-seed: { format: hex, length: 32 }
  lldap-ldap-user-pass: { format: hex, length: 32 }
  shlink-api-key: { format: uuid4 }
  tinyauth-ldap-observer-password: { format: hex, length: 32 }

  # --- manual: replaces every remaining vars_prompt entry in deploy.yaml ---
  main-domain:
    format: manual
    sensitive: false
    description: "The main domain for this homelab (e.g. example.com) — lab_domain/ddns_domain derive from it."
  digitalocean-api-key:
    format: manual
    sensitive: true
    description: "DigitalOcean API key — used by caddy's and lldap's certbot DNS-01 plugin to issue TLS certs."
  letsencrypt-email:
    format: manual
    sensitive: false
    description: "Email address for Let's Encrypt account registration/expiry notices."
  telegram-token:
    format: manual
    sensitive: true
    description: "Telegram bot token for Diun's update notifications."
  telegram-chat-id:
    format: manual
    sensitive: true
    description: "Telegram chat ID for Diun's update notifications."
  wetty-ssh-host:
    format: manual
    sensitive: false
    description: "Default SSH host Wetty's web terminal connects to."
  beszel-hub-key:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel hub's public ED25519 key. Doesn't exist until AFTER beszel-hub's
      own first boot — generated by the hub itself, copied from its web UI
      (Settings > Keys). See docs/beszel.md. Safe to leave blank for the
      first deploy; beszel-agent just sits in a harmless auth-retry loop
      until this is filled in and redeployed.
  beszel-agent-token:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel universal agent token. Doesn't exist until AFTER beszel-hub's
      own first boot — created by hand in its web UI (Settings > Tokens).
      See docs/beszel.md. Same first-deploy-blank-is-fine behavior as
      beszel-hub-key.
