---
# Central registry of every secret the `secrets` role generates-once-
# and-caches on the controller. Add an entry here, then reference
# secrets_generated['<key>'] from a var in main.yaml. See docs/secrets.md.
#
# Do NOT add externally-issued credentials or anything an app generates
# for itself post-boot — those are `format: manual` entries below, not a
# reason to skip this registry.
#
# format: hex    — random string via ansible.builtin.password. Requires `length`.
# format: uuid4  — real RFC 4122 v4 UUID (password's charset can't produce
#                  the fixed version/variant bits — see ensure_secret.yaml).
# format: manual — Ansible can't generate this; cache file must exist
#                  before deploy.yaml needs it (by hand, or `python3
#                  ansible/bootstrap_secrets.py`). Missing file → deploy.yaml
#                  fails loudly using `description` below. Existing-but-empty
#                  is valid, not an error. `allow_blank: true` lets
#                  bootstrap_secrets.py write an empty placeholder instead
#                  of re-prompting, for values (Beszel's) that don't exist
#                  until after first boot. `sensitive` controls masked
#                  input in bootstrap_secrets.py.
#
# Naming: kebab-case. seaweedfs-s3-*-key-admin was seaweedfs-s3-access-key/
# seaweedfs-s3-secret-key until this migration — if you're updating an
# existing controller, rename its cache files to match (preserves the
# actual credential value; skip this and a fresh one silently generates
# instead — harmless, since nothing outside Ansible's management depends
# on the exact value, but throws away the old one for no reason):
#   cd ansible/files/secrets/
#   mv seaweedfs-s3-access-key seaweedfs-s3-access-key-admin
#   mv seaweedfs-s3-secret-key seaweedfs-s3-secret-key-admin
# Do this BEFORE deploying, not after.
secrets_registry:
  seaweedfs-s3-access-key-admin: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-admin: { format: hex, length: 64 }
  # Read/List only, whole bucket — cloud_sync (storage-only) relays
  # already-encrypted objects out to R2/B2/OCI, never writes back to
  # SeaweedFS. Deliberately separate from the admin pair above even
  # though both live on `storage`: if this one leaks on its own, it
  # can't touch existing backups. See docs/disaster-recovery.md.
  seaweedfs-s3-access-key-cloud-sync-reader: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-cloud-sync-reader: { format: hex, length: 64 }
  # One pair per host in seaweedfs_backup_hosts (group_vars/all/main.yaml)
  # — each scoped in docker/seaweedfs/configs/s3-identity.json.j2 to
  # write/read/list only its own hostname-prefixed objects. Adding a
  # host to seaweedfs_backup_hosts needs a matching pair added here too.
  seaweedfs-s3-access-key-services: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-services: { format: hex, length: 64 }
  seaweedfs-s3-access-key-security: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-security: { format: hex, length: 64 }
  seaweedfs-s3-access-key-play: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-play: { format: hex, length: 64 }
  lldap-jwt-secret: { format: hex, length: 32 }
  lldap-key-seed: { format: hex, length: 32 }
  lldap-ldap-user-pass: { format: hex, length: 32 }
  shlink-api-key: { format: uuid4 }
  tinyauth-ldap-observer-password: { format: hex, length: 32 }
  step-ca-password: { format: hex, length: 32 }
  step-ca-provisioner-password: { format: hex, length: 32 }

  # --- manual: replaces every remaining vars_prompt entry in deploy.yaml ---
  main-domain:
    format: manual
    sensitive: false
    description: "The main domain for this homelab (e.g. example.com) — lab_domain/ddns_domain derive from it."
  digitalocean-api-key:
    format: manual
    sensitive: true
    description: "DigitalOcean API key — used by caddy's DNS-01 plugin to issue TLS certs."
  letsencrypt-email:
    format: manual
    sensitive: false
    description: "Email address for Let's Encrypt account registration/expiry notices."
  telegram-token:
    format: manual
    sensitive: true
    description: "Telegram bot token for Diun's update notifications."
  telegram-chat-id:
    format: manual
    sensitive: true
    description: "Telegram chat ID for Diun's update notifications."
  beszel-hub-key:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel hub's public ED25519 key. Doesn't exist until AFTER beszel-hub's
      own first boot — generated by the hub itself, copied from its web UI
      (Settings > Keys). See docs/beszel.md. Safe to leave blank for the
      first deploy; beszel-agent just sits in a harmless auth-retry loop
      until this is filled in and redeployed.
  beszel-agent-token:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel universal agent token. Doesn't exist until AFTER beszel-hub's
      own first boot — created by hand in its web UI (Settings > Tokens).
      See docs/beszel.md. Same first-deploy-blank-is-fine behavior as
      beszel-hub-key.

  # --- Cloud backup targets — see docs/disaster-recovery.md ---
  cloudflare-r2-access-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token access key ID, scoped to the homelab-backups bucket (Object Read & Write)."
  cloudflare-r2-secret-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-access-key."
  cloudflare-r2-account-id:
    format: manual
    sensitive: false
    description: "Cloudflare account ID — forms the R2 S3 endpoint <id>.r2.cloudflarestorage.com."
  backblaze-b2-access-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key ID, scoped to the homelab-backups bucket."
  backblaze-b2-secret-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key, matching backblaze-b2-access-key."
  oci-access-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key access key, scoped to the homelab-backups bucket via a bucket-restricted IAM policy."
  oci-secret-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key secret, matching oci-access-key."
  oci-namespace:
    format: manual
    sensitive: false
    description: "OCI Object Storage namespace (Console: Administration > Tenancy Details, or `oci os ns get`) — forms the S3-compatible endpoint."
  oci-region:
    format: manual
    sensitive: false
    description: "OCI region hosting the homelab-backups bucket, e.g. ap-singapore-1 — forms the S3-compatible endpoint."
