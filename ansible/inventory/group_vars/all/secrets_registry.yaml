---
# Central registry of every secret the `secrets` role generates-once-
# and-caches on the controller. Add an entry here, then reference
# secrets_generated['<key>'] from a var in main.yaml. See docs/secrets.md.
#
# Do NOT add externally-issued credentials or anything an app generates
# for itself post-boot — those are `format: manual` entries below, not a
# reason to skip this registry.
#
# format: hex    — random string via ansible.builtin.password. Requires `length`.
# format: uuid4  — real RFC 4122 v4 UUID (password's charset can't produce
#                  the fixed version/variant bits — see ensure_secret.yaml).
# format: manual — Ansible can't generate this; cache file must exist
#                  before deploy.yaml needs it (by hand, or `python3
#                  ansible/bootstrap_secrets.py`). Missing file → deploy.yaml
#                  fails loudly using `description` below. Existing-but-empty
#                  is valid, not an error. `allow_blank: true` lets
#                  bootstrap_secrets.py write an empty placeholder instead
#                  of re-prompting, for values (Beszel's) that don't exist
#                  until after first boot. `sensitive` controls masked
#                  input in bootstrap_secrets.py.
#
# Naming: kebab-case. seaweedfs-s3-*-key-admin was seaweedfs-s3-access-key/
# seaweedfs-s3-secret-key until this migration — if you're updating an
# existing controller, rename its cache files to match (preserves the
# actual credential value; skip this and a fresh one silently generates
# instead — harmless, since nothing outside Ansible's management depends
# on the exact value, but throws away the old one for no reason):
#   cd ansible/files/secrets/
#   mv seaweedfs-s3-access-key seaweedfs-s3-access-key-admin
#   mv seaweedfs-s3-secret-key seaweedfs-s3-secret-key-admin
# Do this BEFORE deploying, not after.
secrets_registry:
  seaweedfs-s3-access-key-admin: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-admin: { format: hex, length: 64 }
  # Read/List only, whole bucket — cloud_sync (storage-only) relays
  # already-encrypted objects out to R2/B2/OCI, never writes back to
  # SeaweedFS. Deliberately separate from the admin pair above even
  # though both live on `storage`: if this one leaks on its own, it
  # can't touch existing backups. See docs/disaster-recovery.md.
  seaweedfs-s3-access-key-cloud-sync-reader: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-cloud-sync-reader: { format: hex, length: 64 }
  # One pair per host in seaweedfs_backup_hosts (group_vars/all/main.yaml)
  # — each scoped in docker/seaweedfs/configs/s3-identity.json.j2 to
  # write/read/list only its own hostname-prefixed objects. Adding a
  # host to seaweedfs_backup_hosts needs a matching pair added here too.
  seaweedfs-s3-access-key-services: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-services: { format: hex, length: 64 }
  seaweedfs-s3-access-key-security: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-security: { format: hex, length: 64 }
  seaweedfs-s3-access-key-play: { format: hex, length: 32 }
  seaweedfs-s3-secret-key-play: { format: hex, length: 64 }
  lldap-jwt-secret: { format: hex, length: 32 }
  lldap-key-seed: { format: hex, length: 32 }
  lldap-ldap-user-pass: { format: hex, length: 32 }
  shlink-api-key: { format: uuid4 }
  tinyauth-ldap-observer-password: { format: hex, length: 32 }
  step-ca-password: { format: hex, length: 32 }
  step-ca-provisioner-password: { format: hex, length: 32 }

  # --- manual: replaces every remaining vars_prompt entry in deploy.yaml ---
  main-domain:
    format: manual
    sensitive: false
    description: "The main domain for this homelab (e.g. example.com) — lab_domain/ddns_domain derive from it."
  digitalocean-api-key:
    format: manual
    sensitive: true
    description: "DigitalOcean API key — used by caddy's DNS-01 plugin to issue TLS certs."
  letsencrypt-email:
    format: manual
    sensitive: false
    description: "Email address for Let's Encrypt account registration/expiry notices."
  telegram-token:
    format: manual
    sensitive: true
    description: "Telegram bot token for Diun's update notifications."
  telegram-chat-id:
    format: manual
    sensitive: true
    description: "Telegram chat ID for Diun's update notifications."
  beszel-hub-key:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel hub's public ED25519 key. Doesn't exist until AFTER beszel-hub's
      own first boot — generated by the hub itself, copied from its web UI
      (Settings > Keys). See docs/beszel.md. Safe to leave blank for the
      first deploy; beszel-agent just sits in a harmless auth-retry loop
      until this is filled in and redeployed.
  beszel-agent-token:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Beszel universal agent token. Doesn't exist until AFTER beszel-hub's
      own first boot — created by hand in its web UI (Settings > Tokens).
      See docs/beszel.md. Same first-deploy-blank-is-fine behavior as
      beszel-hub-key.

  # --- Uptime Kuma push monitors — see docs/uptime-kuma.md ---
  # allow_blank: true for the same reason as beszel-hub-key/
  # beszel-agent-token: the URL (including its token) only exists after
  # the matching Push monitor is created by hand in Kuma's own UI.
  uptime-kuma-push-url-cloud-sync:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Push URL for the "storage — cloud_sync" monitor in Uptime Kuma
      (Settings shown when creating/editing the monitor). Blank is fine
      for the first deploy — the pusher unit just fails on its own
      (curl: no URL specified, visible via `journalctl -u
      uptime-kuma-push-cloud-sync`) without affecting cloud-sync's own
      success/failure status or its existing OnFailure= alert, until
      this is filled in and redeployed.

  uptime-kuma-push-url-cert-renewer-lldap:
    format: manual
    sensitive: true
    allow_blank: true
    description: >-
      Push URL for lldap's cert-renewal monitor in Uptime Kuma. Same
      blank-is-fine shape as uptime-kuma-push-url-cloud-sync above — see
      docs/uptime-kuma.md's note on cert-renewer@'s OnSuccess= only
      firing on an actual renewal (roughly once a day at step-ca's
      default 24h cert lifetime), not every 15-minute timer tick.

  # One per host — cert-expiry-check runs on every app_host
  # independently (see docs/telegram-notifications.md), so each host's
  # check is its own Push monitor with its own URL, not a shared one.
  uptime-kuma-push-url-cert-expiry-security:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for security's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-storage:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for storage's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-play:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for play's cert-expiry-check monitor in Uptime Kuma."
  uptime-kuma-push-url-cert-expiry-services:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for services's cert-expiry-check monitor in Uptime Kuma."

  # backup_agent's freshness-check push — one per host that runs
  # backup_agent, not one per app (see docs/uptime-kuma.md): every
  # app's credential is already scoped to this host's own {host}-*
  # prefix, so one push per host covers every app on it, and a future
  # app added to an *existing* host needs no new entry here at all.
  uptime-kuma-push-url-backup-services:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for services's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."
  uptime-kuma-push-url-backup-play:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for play's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."
  uptime-kuma-push-url-backup-security:
    format: manual
    sensitive: true
    allow_blank: true
    description: "Push URL for security's backup-freshness monitor in Uptime Kuma (covers every backup-enabled app on this host)."

  # --- Telegram forum-topic routing — see docs/telegram-notifications.md ---
  # One shared bot (telegram-token/telegram-chat-id above), different
  # topic per concern. allow_blank: true because the group's Topics
  # feature is optional — a blank value falls back to posting in the
  # group's main stream instead of a topic (see main.yaml).
  telegram-topic-id-updates:
    format: manual
    sensitive: false
    allow_blank: true
    description: "Telegram forum-topic ID for image-update notifications (diun)."
  telegram-topic-id-monitoring:
    format: manual
    sensitive: false
    allow_blank: true
    description: "Telegram forum-topic ID for host/container monitoring alerts (Beszel)."
  telegram-topic-id-backups:
    format: manual
    sensitive: false
    allow_blank: true
    description: "Telegram forum-topic ID for backup-job notifications (docker-volume-backup)."
  telegram-topic-id-certs:
    format: manual
    sensitive: false
    allow_blank: true
    description: "Telegram forum-topic ID for certificate-renewal failure alerts."

  # --- Cloud backup targets — see docs/disaster-recovery.md ---
  # Two credentials per provider (write for cloud_sync, read for the
  # controller-side restore-discovery script that will consume these
  # later) instead of one — see docs/cloud-credential-creation.md for
  # how these six are created and exactly what each is scoped to.
  cloudflare-r2-write-access-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token access key ID, bucket-scoped, Object Read & Write — see docs/cloud-credential-creation.md."
  cloudflare-r2-write-secret-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-write-access-key."
  cloudflare-r2-read-access-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token access key ID, bucket-scoped, Object Read only — see docs/cloud-credential-creation.md."
  cloudflare-r2-read-secret-key:
    format: manual
    sensitive: true
    description: "Cloudflare R2 API token secret access key, matching cloudflare-r2-read-access-key."
  cloudflare-r2-account-id:
    format: manual
    sensitive: false
    description: "Cloudflare account ID — forms the R2 S3 endpoint <id>.r2.cloudflarestorage.com."
  backblaze-b2-write-access-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key ID, bucket-scoped, listFiles+writeFiles (no deleteFiles) — see docs/cloud-credential-creation.md."
  backblaze-b2-write-secret-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key, matching backblaze-b2-write-access-key."
  backblaze-b2-read-access-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key ID, bucket-scoped, listFiles+readFiles only — see docs/cloud-credential-creation.md."
  backblaze-b2-read-secret-key:
    format: manual
    sensitive: true
    description: "Backblaze B2 application key, matching backblaze-b2-read-access-key."
  backblaze-b2-region:
    format: manual
    sensitive: false
    description: >-
      Backblaze B2 bucket's region ID (e.g. us-west-004) — B2 Console >
      Buckets > Bucket Details. Forms the S3-compatible endpoint
      s3.<region>.backblazeb2.com.
  oci-write-access-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key access key, write-only (OBJECT_CREATE+OBJECT_INSPECT, no delete) — see docs/cloud-credential-creation.md."
  oci-write-secret-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key secret, matching oci-write-access-key."
  oci-read-access-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key access key, read-only (OBJECT_READ+OBJECT_INSPECT only) — see docs/cloud-credential-creation.md."
  oci-read-secret-key:
    format: manual
    sensitive: true
    description: "OCI Customer Secret Key secret, matching oci-read-access-key."
  oci-namespace:
    format: manual
    sensitive: false
    description: "OCI Object Storage namespace (Console: Administration > Tenancy Details, or `oci os ns get`) — forms the S3-compatible endpoint."
  oci-region:
    format: manual
    sensitive: false
    description: "OCI region hosting the homelab-backups bucket, e.g. ap-singapore-1 — forms the S3-compatible endpoint."
