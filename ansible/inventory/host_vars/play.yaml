---
caddy_domain: "play.{{ lab_domain }}"

# Scoped in docker/seaweedfs/configs/s3-identity.json.j2 to this host's
# own `play-*` objects only — see docs/disaster-recovery.md.
seaweedfs_s3_access_key: "{{ secrets_generated['seaweedfs-s3-access-key-play'] }}"
seaweedfs_s3_secret_key: "{{ secrets_generated['seaweedfs-s3-secret-key-play'] }}"

# backup_agent's freshness-check push URL, one for the whole host — see
# docs/uptime-kuma.md.
backup_freshness_push_url: "{{ secrets_generated['uptime-kuma-push-url-backup-play'] }}"

compose_apps:
  - name: caddy

  - name: beszel-agent

  - name: minecraft
    caddy:
      default:
        host: bluemap

  - name: diun

# ---------------------------------------------------------------------------
# BIND9 — per-host zone config
# ---------------------------------------------------------------------------

dns_ddns_target: "play.{{ ddns_domain }}."

dns_zones:
  - zone: "{{ caddy_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101   # overwritten at render time by the role
    extra_records:
      - { name: "@", type: NS, value: "ns1.{{ caddy_domain }}." }
      - { name: "ns1", type: A, value: "127.0.0.1" }
      - { name: "mc", type: CNAME, value: "{{ dns_ddns_target }}"}
