---
caddy_domain: "svc.{{ lab_domain }}"

# Scoped in docker/seaweedfs/configs/s3-identity.json.j2 to this host's
# own `services-*` objects only — see docs/disaster-recovery.md.
seaweedfs_s3_access_key: "{{ secrets_generated['seaweedfs-s3-access-key-services'] }}"
seaweedfs_s3_secret_key: "{{ secrets_generated['seaweedfs-s3-secret-key-services'] }}"

# shlink's own env.j2 is the only consumer — see docs/secrets.md on why
# some secrets live here instead of group_vars/all/main.yaml.
shlink_api_key: "{{ secrets_generated['shlink-api-key'] }}"  # kept as real UUID4 — see secrets_registry.yaml

cobalt_host: cobalt
shlink_short_host: short
shlink_web_host: shlink

# Full FQDN each app needs for its own self-referential config (telling
# it its own public URL) — computed once here rather than concatenating
# {{ x_host }}.{{ caddy_domain }} at every docker/<app>/compose.yaml.j2
# use site. Domain-only (no scheme) for shlink's two, since one of its
# three use sites (DEFAULT_DOMAIN) needs a bare domain, not a URL —
# https:// gets prefixed at the two sites that need it instead of baking
# it in here and being wrong for the third.
cobalt_url: "https://{{ cobalt_host }}.{{ caddy_domain }}"
shlink_short_domain: "{{ shlink_short_host }}.{{ caddy_domain }}"
shlink_web_domain: "{{ shlink_web_host }}.{{ caddy_domain }}"

compose_apps:
  - name: caddy

  - name: bind9

  - name: beszel-agent

  - name: bentopdf
    caddy:
      default:
        host: bentopdf

  - name: cobalt
    caddy:
      default:
        host: "{{ cobalt_host }}"

  - name: dashy
    caddy:
      default:
        host: dashy

  - name: kms
    caddy:
      default:
        host: kms

  - name: librespeed
    caddy:
      default:
        host: speedtest

  - name: shlink
    caddy:
      short:
        host: "{{ shlink_short_host }}"
      web:
        host: "{{ shlink_web_host }}"

  - name: wastebin
    caddy:
      default:
        host: wastebin

  - name: diun

# ---------------------------------------------------------------------------
# BIND9 — per-host zone config
# ---------------------------------------------------------------------------

# OPNsense DDNS record this host resolves to.
dns_ddns_target: "services.{{ ddns_domain }}."

# Zone name mirrors the caddy_domain so all Caddy-fronted service FQDNs
# (host + '.' + caddy_domain) fall inside this zone automatically.
dns_zones:
  - zone: "{{ caddy_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101   # overwritten at render time by the role
    extra_records:
      - { name: "@", type: NS, value: "ns1.{{ caddy_domain }}." }
      - { name: "ns1", type: A, value: "127.0.0.1" }
