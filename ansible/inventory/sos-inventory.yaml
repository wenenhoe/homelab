---
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3.14
    ansible_ssh_private_key_file: ~/.ssh/proxmox_vm_servers
    ansible_become_exe: /usr/bin/sudo.ws
    # sudo-rs (Ubuntu's default sudo since 25.10) does not fully replace
    # the prompt Ansible matches on for become, so a bare sudo password
    # request can hang until timeout. Upstream fix ansible/ansible#86175
    # shipped in ansible-core 2.19.10 and was reverted in that same
    # release; not confirmed fixed as of ansible-core 2.21. Tracking:
    # https://bugs.launchpad.net/bugs/2122414

  children:
    sos:
      hosts:
        tailscale:
          ansible_host: 192.168.20.2
          ansible_user: tsadmin
        services:
          ansible_host: 192.168.20.3
          ansible_user: svcadmin
        play:
          ansible_host: 192.168.20.4
          ansible_user: playadmin
        security:
          ansible_host: 192.168.20.5
          ansible_user: secadmin
        storage:
          ansible_host: 192.168.20.6
          ansible_user: storeadmin
