---
# Secrets bootstrap, before anything else in any playbook that touches a
# real host. Every real host's ansible_host in inventory.yaml resolves
# through ddns_domain -> main_domain -> secrets_generated['main-domain'],
# so secrets_generated has to exist before Ansible ever needs a live
# connection to a real host — including the *implicit* "Gathering Facts"
# task any later play runs automatically before its own first explicit
# task. Folding this into that play (even as its first task) doesn't
# help: gather_facts happens before any task in a play runs, task order
# within the play doesn't change that.
#
# secrets_generated is now a fact of "localhost" only, not of each real
# host — group_vars/all/*.yaml auto-loads for the implicit
# localhost the same as for any other inventory host (confirmed live),
# so the secrets role itself works unmodified, but every real host that
# needs secrets_generated (starting with the next play's own Gathering
# Facts, which needs it for ansible_host) still needs its OWN copy. The
# propagation task below handles that: delegate_to a real host +
# delegate_facts: true works safely here specifically because set_fact
# is a local action with no connection requirement of its own —
# confirmed live that this does NOT trigger the same eager-remote_addr-
# resolution problem the plain include_role/include_tasks case does
# (delegate_to on a real, unresolvable host only becomes a problem when
# the action itself needs a live connection; set_fact never does).
#
# --limit note: this play's own host pattern is localhost, which is NOT
# a member of the managed_hosts/app_hosts/etc. groups other plays target
# — a run limited to e.g. --limit managed_hosts resolves this play to
# zero hosts and Ansible silently skips it (an empty host list is not an
# error), which then fails downstream exactly the way this whole file
# exists to prevent. Include localhost explicitly in --limit alongside
# whatever real group/host you're targeting, e.g. --limit
# managed_hosts,localhost. See docs/deployment-flow.md.
- name: Secrets
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Include secrets role
      ansible.builtin.include_role:
        name: secrets
      tags:
        - always # every downstream config template reads secrets_generated this sets

    # Plain `secrets_generated`, not `hostvars['localhost'][...]`: this
    # play's own target already IS localhost (hosts: localhost above),
    # so both resolve the same value here — but see main.yaml's own
    # identical task (Track A stage 4) for why the plain form is the
    # one that's actually correct in general: delegate_to: localhost
    # without delegate_facts: true stores a fact on the play's own
    # target host, not literally on localhost, and that only coincides
    # with "localhost" because this specific play targets it directly.
    - name: Propagate secrets_generated onto every real host's own hostvars
      ansible.builtin.set_fact:
        secrets_generated: "{{ secrets_generated }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"
      tags:
        - always

    # secrets_vault_ca_path (see vault_login.yaml's own header comment
    # for why cleanup can't live inside the shared secrets role itself):
    # this play is the true outermost boundary for every real,
    # production use (deploy.yaml/cleanup.yaml/maintenance.yaml all
    # import this same play as their own Play 0) — nothing after it
    # ever needs another Vault query, so this is where the per-run
    # root-cert tempfile actually gets removed. when: secrets_vault_needed
    # — otherwise secrets_vault_ca_path was never set, and referencing
    # it directly would fail on an undefined variable instead of just
    # having nothing to clean up.
    - name: Remove this run's per-run root-cert tempfile
      ansible.builtin.file:
        path: "{{ secrets_vault_ca_path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: secrets_vault_needed
      # Fresh every run, by design (ADR 0025) — not a meaningful state
      # change to report, same reasoning as vault_login.yaml's own
      # tempfile-creation task.
      changed_when: false
      tags:
        - always
