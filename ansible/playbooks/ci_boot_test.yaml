---
# CI-only: seeds and stages exactly one compose app's volumes/configs using
# the real compose role, so pr-checks.yml's compose-boot-test job doesn't
# have to hand-reimplement per-app seeding logic in bash.
#
# Mirrors ansible/playbooks/deploy.yaml's Play 1 (preinit) + init.yaml,
# with two deliberate differences:
#   - No `docker` role include — the GitHub Actions runner already has
#     Docker running natively, unlike deploy.yaml's real remote hosts.
#   - No deploy.yaml (the actual `docker compose up -d`) — the calling
#     workflow does that itself, so it keeps its own healthcheck-wait loop
#     unchanged regardless of which app is being tested.
#
# Run with: ansible-playbook ansible/playbooks/ci_boot_test.yaml \
#             -e app_name=<app> -e compose_deploy_dir=/tmp/compose-deploy
#
# Used for every app compose-boot-test exercises (.github/workflows/pr-checks.yml)
# — bind9/caddy/seaweedfs/lldap are excluded there already, for their own
# documented reasons (real DNS-01 creds, LDAP TLS, etc.), unrelated to this.
#
# Adding a *new* app to the registry that needs a config template variable
# not already a real group_vars/all default: add it to ci_dummy_vars.yaml,
# not as a one-off here.
- name: CI boot-test prep — seed one app's volumes via the real compose role
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all/main.yaml"
    - "{{ playbook_dir }}/../inventory/group_vars/all/app_registry.yaml"
    # Loaded last so it can override main.yaml's real (but here-unresolvable
    # — e.g. hostvars-dependent) values with CI-safe flat placeholders.
    # Deliberately an explicit vars_files entry here, NOT relied on via
    # ci-inventory's own group_vars/all auto-loading: Ansible's precedence
    # order puts inventory group_vars/all (tier 4) BELOW play vars_files
    # (tier 14) — auto-loading alone would lose to main.yaml above, not
    # override it. Multiple vars_files entries merge in list order within
    # the same tier, so listing this one last is what makes it win. (It
    # also happens to sit at a real group_vars/all path for
    # ansible-lint's benefit — see its own header comment.)
    - "{{ playbook_dir }}/../ci-inventory/group_vars/all/ci_dummy_vars.yaml"
  vars:
    ansible_user: "{{ ansible_user_id }}"
    # compose_deploy_dir is deliberately NOT set here — play vars: is
    # LOWER Ansible precedence than the vars_files: above (main.yaml
    # defines its own compose_deploy_dir: /opt/stacks, production's real
    # default), so a play-vars override here would silently lose to that.
    # Passed as -e compose_deploy_dir=... instead (extra-vars: highest
    # precedence, always wins) — see the ansible-playbook invocation in
    # pr-checks.yml / boot-test-all.yml. Required, not optional: this
    # playbook will write into /opt/stacks if it's ever omitted.
    compose_apps:
      - name: "{{ app_name }}"
  tasks:
    - name: Fail fast if app_name wasn't supplied
      ansible.builtin.assert:
        that: app_name is defined
        fail_msg: "Pass -e app_name=<app>, e.g. -e app_name=minecraft"

    - name: Fail fast if compose_deploy_dir wasn't supplied as an extra-var
      ansible.builtin.assert:
        # "is defined" alone would always pass here — main.yaml's
        # vars_files fallback (/opt/stacks) counts as defined too, which
        # is exactly the bug this is meant to catch. Checking against
        # that known production value is a heuristic, not a proper
        # origin-check (no clean way to ask "was this an extra-var"
        # inside a task), but it directly catches the real failure mode:
        # forgetting -e compose_deploy_dir=... and silently inheriting
        # production's path.
        that: compose_deploy_dir != '/opt/stacks'
        fail_msg: >-
          compose_deploy_dir is /opt/stacks (main.yaml's production
          default) — pass -e compose_deploy_dir=/tmp/compose-deploy
          explicitly, or this writes into the wrong place and "Bring the
          stack up" fails with "no such file or directory".

    - name: Resolve compose_apps against the real app registry
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml

    - name: Seed volumes and stage configs (mirrors deploy.yaml's init step)
      ansible.builtin.include_role:
        name: compose
        tasks_from: init.yaml
      vars:
        compose_app_item: "{{ compose_apps[0] }}"
