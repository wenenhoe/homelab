---
# Two independent phases:
#   Play 1 — finds stacks under compose_deploy_dir (and/or still running)
#            that are no longer listed in this host's compose_apps, and
#            tears each one down via compose role's cleanup.yaml.
#   Play 2 — for stacks that ARE still listed, prunes any volume docker
#            still labels for that app but that its current app_registry
#            entry no longer declares (compose role's
#            cleanup_stale_volumes.yaml). See docs/cleanup.md.
#
# Expects:
#   compose_apps        — this host's app list (host_vars), pre- or
#                         post-registry-merge; Play 1 only uses `.name`,
#                         Play 2 resolves it fully via preinit.yaml
#   compose_deploy_dir  — from inventory/group_vars/all/main.yaml
#
# Reads (roles/compose/defaults/main.yaml):
#   compose_cleanup_remove_content        — Play 1 default keep/remove policy
#   compose_cleanup_app_overrides         — Play 1 per-app keep/remove overrides
#   compose_cleanup_stale_volume_remove   — Play 2 keep/remove policy
#   compose_cleanup_dry_run               — report only, no changes (both plays)
#
# Defined below, in this file's own Play 1 vars — not a role default,
# despite being part of the same cleanup config family — see that var's
# own comment for why:
#   compose_cleanup_exclude               — directories under
#                                           compose_deploy_dir that are never
#                                           compose_apps entries at all
#                                           (backup_agent, cloud_sync) and so
#                                           must never be treated as orphaned
#
# Usage:
#   ansible-playbook cleanup.yaml --check --diff              # see what --check would do
#   ansible-playbook cleanup.yaml -e compose_cleanup_dry_run=true
#   ansible-playbook cleanup.yaml --limit services,localhost
#   (localhost required in --limit — see bootstrap-secrets.yaml, imported below)
#
# Content policy (keep vs. delete an orphaned app's directory) is controlled
# by compose_cleanup_remove_content / compose_cleanup_app_overrides in
# roles/compose/defaults/main.yaml — see comments there.

# Play 0 — Secrets. Needed here too, not just deploy.yaml: app_hosts'
# ansible_host resolves through secrets_generated (see
# bootstrap-secrets.yaml for the full why), and this playbook targets
# real hosts by name just like deploy.yaml does.
- name: Play 0 - Secrets
  ansible.builtin.import_playbook: bootstrap-secrets.yaml

- name: Clean up orphaned compose stacks
  hosts: app_hosts
  gather_facts: false
  become: true
  vars:
    # Not a role default (roles/compose/defaults/main.yaml) despite
    # being part of the same cleanup config family — confirmed live:
    # role defaults are only in scope once that role has actually been
    # *included* somewhere in the current play, and this play's own
    # orphan-detection task below references this var before the
    # compose role is ever included in this play (that only happens
    # later, in the teardown step, conditionally, only if orphans were
    # found) — a role default there is simply undefined when needed,
    # failing the whole play outright rather than being silently wrong.
    # backup_agent's is the more serious of the two to get right: it
    # actually runs a real docker compose stack, so an unexcluded run
    # would bring the backup pipeline's own container down via
    # community.docker.docker_compose_v2: state: absent — not gated by
    # compose_cleanup_remove_content at all, that only governs the
    # directory/volume decision *after* the stack's already stopped.
    # Add here, by directory name under compose_deploy_dir, if another
    # role ever needs the same exemption.
    compose_cleanup_exclude:
      - backup-agent
      - cloud-sync
  tasks:
    - name: Determine apps still wanted on this host
      ansible.builtin.set_fact:
        compose_cleanup_wanted_apps: "{{ compose_apps | map(attribute='name') | list }}"

    - name: Find stack directories currently on disk
      ansible.builtin.find:
        paths: "{{ compose_deploy_dir }}"
        file_type: directory
        recurse: false
      register: compose_cleanup_found_dirs

    - name: List running docker compose projects
      ansible.builtin.command: docker compose ls --format json
      changed_when: false
      failed_when: false
      register: compose_cleanup_compose_ls

    - name: Work out which stacks are orphaned (on disk or running, not in compose_apps, not exempt)
      ansible.builtin.set_fact:
        compose_cleanup_orphaned_stacks: >-
          {{
            (
              (compose_cleanup_found_dirs.files | map(attribute='path') | map('basename') | list)
              + (
                  (compose_cleanup_compose_ls.stdout | default('[]') | from_json | default([]))
                  | map(attribute='Name') | list
                )
            ) | unique | difference(compose_cleanup_wanted_apps) | difference(compose_cleanup_exclude) | sort
          }}

    - name: Report - nothing to clean up on this host
      ansible.builtin.debug:
        msg: "No orphaned stacks under {{ compose_deploy_dir }} on {{ inventory_hostname }}."
      when: compose_cleanup_orphaned_stacks | length == 0

    - name: Report - orphaned stacks found on this host
      ansible.builtin.debug:
        msg: >-
          Orphaned on {{ inventory_hostname }} (deployed but not in compose_apps):
          {{ compose_cleanup_orphaned_stacks }}
      when: compose_cleanup_orphaned_stacks | length > 0

    - name: Tear down each orphaned stack
      ansible.builtin.include_role:
        name: compose
        tasks_from: cleanup.yaml
      loop: "{{ compose_cleanup_orphaned_stacks }}"
      loop_control:
        loop_var: compose_cleanup_stack

# Play 2 — Stale volumes on stacks that are still deployed (as opposed to
# Play 1's fully orphaned stacks). Needs compose_apps resolved against
# app_registry (preinit.yaml) to see each app's *current* .volumes list —
# Play 1 above only ever needed .name, so it never resolves this.
- name: Prune stale volumes on active stacks
  hosts: app_hosts
  gather_facts: false
  become: true
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml

    - name: Prune each app's stale volumes
      ansible.builtin.include_role:
        name: compose
        tasks_from: cleanup_stale_volumes.yaml
      loop: "{{ compose_apps }}"
      loop_control:
        loop_var: compose_stale_volume_app
        label: "{{ compose_stale_volume_app.name }}"
