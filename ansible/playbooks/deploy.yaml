---
# Play 0 — Secrets, extracted into its own file (bootstrap-secrets.yaml)
# since cleanup.yaml/maintenance.yaml need the exact same play.
# reset-network.yaml does NOT need it — see that playbook's own header.
# See bootstrap-secrets.yaml for the full rationale/constraints.
- name: Play 0 - Secrets
  ansible.builtin.import_playbook: bootstrap-secrets.yaml

# Play 1 — System setup on every managed (real) host. Covers docker
# engine and the app_registry resolve — bind9/caddy only need
# compose_apps resolved in hostvars here, per-app files come later.
# hosts: managed_hosts, not hosts: all — all also includes the
# controller (see inventory.yaml), which must never get Docker
# installed on it or a container deployed to it.
- name: System setup
  hosts: managed_hosts
  gather_facts: true
  become: true
  tasks:
    - name: Include docker install role
      ansible.builtin.include_role:
        name: docker
      tags:
        - initial-setup

    - name: Include qemu_guest_agent install role
      ansible.builtin.include_role:
        name: qemu_guest_agent
      tags:
        - initial-setup

    - name: Include compose's preinit.yaml
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml
      tags:
        - always # every role below reads the resolved compose_apps this sets

# Play 2 — Caddy builds/deploys/restarts itself so it's already routing
# before anything else comes up behind it.
- name: Deploy Caddy
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include caddy role
      ansible.builtin.include_role:
        name: caddy
      tags:
        - images
        - infra

    # Runs in the same play/hosts as caddy above, right after it - needs
    # this host's own compose_apps resolved (Play 1) and its own
    # caddy_domain, nothing from any other host. See
    # docs/telegram-notifications.md.
    - name: Include caddy_cert_expiry role
      ansible.builtin.include_role:
        name: caddy_cert_expiry
      tags:
        - infra

# Play 3 — DNS config written and bind9 deployed/restarted before any
# other container starts or this host's Docker daemon points at it.
- name: Configure BIND9 on the DNS host
  hosts: dns
  gather_facts: false
  become: true
  tasks:
    - name: Include bind9 role
      ansible.builtin.include_role:
        name: bind9
      tags:
        - images
        - infra

# Play 4 — Every remaining compose app, now that DNS/caddy are up.
# bind9/caddy are excluded — they deployed themselves in Play 2/3.
- name: Deploy Compose apps
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include compose_app role
      ansible.builtin.include_role:
        name: compose_app
      tags:
        - images

# Play 5 — Ensure the offsite-backup bucket exists. Runs after
# SeaweedFS deploys (Play 4), before backup_agent uploads to it (Play 6)
# — SeaweedFS doesn't auto-create buckets on first PUT. See
# ansible/roles/seaweedfs_bucket.
- name: Ensure offsite-backup bucket exists
  hosts: storage
  gather_facts: false
  become: true
  tasks:
    - name: Include seaweedfs_bucket role
      ansible.builtin.include_role:
        name: seaweedfs_bucket
      tags:
        - images

# Play 6 — Wire step-ca into its first two consumers. Runs after
# lldap/step-ca/tinyauth all deploy (Play 4, on `security`):
# step_ca_client needs a running step-ca to read its root cert from;
# lldap_cert needs a running lldap to issue into and step_ca_client's
# cached root; tinyauth_ca_trust needs a running tinyauth to seed into
# and the same cached root. No ordering constraint between the latter
# two — sequenced arbitrarily, both after the shared prerequisite.
- name: Wire lldap and tinyauth into step-ca
  hosts: security
  gather_facts: false
  become: true
  tasks:
    - name: Include step_ca_client role
      ansible.builtin.include_role:
        name: step_ca_client
      tags:
        - images

    - name: Include lldap_cert role
      ansible.builtin.include_role:
        name: lldap_cert
      tags:
        - images

    - name: Include tinyauth_ca_trust role
      ansible.builtin.include_role:
        name: tinyauth_ca_trust
      tags:
        - images

# Play 7 — Ensure lldap's observer account exists (tinyauth's LDAP bind
# depends on it). Runs after lldap's own deploy (Play 4, on `security`),
# after Play 6 for no particular ordering reason of its own (the two are
# independent — this only needs lldap's web port, not its LDAPS cert) —
# placed here to mirror Play 5's "runs right after the thing it depends
# on" shape. tinyauth itself may already be mid-restart-loop from Play 4
# at this point (compose_apps lists it before lldap on `security`) —
# restart: unless-stopped means it picks up the now-real observer
# account on its next attempt without any extra ordering here.
- name: Ensure lldap's observer account exists
  hosts: security
  gather_facts: false
  become: true
  tasks:
    - name: Include lldap_bootstrap role
      ansible.builtin.include_role:
        name: lldap_bootstrap
      tags:
        - images

# Play 8 — Offsite backup agent. Runs last among the managed_hosts
# plays deliberately: it mounts other apps' volumes as `external:
# true`, which requires each app's own Play 4 ensure_volume step to
# have already created them. Play 9 (storage-only) runs after this one.
- name: Deploy offsite backup agent
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include backup_agent role
      ansible.builtin.include_role:
        name: backup_agent
      tags:
        - images

# Play 9 — Cloud sync. storage only, unlike Play 8 — reads every backup
# host's app_registry-declared extra_cloud_targets via hostvars rather
# than depending on those hosts' own plays having already run in this
# same invocation (host_vars are static inventory data either way), so
# ordering after Play 8 isn't a hard dependency — it's just the natural
# place for "the next stage of the backup pipeline" to live. See
# docs/disaster-recovery.md.
- name: Deploy cloud sync
  hosts: storage
  gather_facts: false
  become: true
  tasks:
    - name: Include cloud_sync role
      ansible.builtin.include_role:
        name: cloud_sync
      tags:
        - images
