---
# Play 0 — Secrets, extracted into its own file (bootstrap-secrets.yaml)
# since cleanup.yaml/maintenance.yaml need the exact same play.
# reset-network.yaml does NOT need it — see that playbook's own header.
# See bootstrap-secrets.yaml for the full rationale/constraints.
- name: Play 0 - Secrets
  ansible.builtin.import_playbook: bootstrap-secrets.yaml

# Play 1 — System setup on every managed (real) host. Covers docker
# engine and the stacks directory; per-app files come later.
# hosts: managed_hosts, not hosts: all — all also includes the
# controller (see inventory.yaml), which must never get Docker
# installed on it or a container deployed to it.
- name: System setup
  hosts: managed_hosts
  gather_facts: true
  become: true
  tasks:
    - name: Include docker install role
      ansible.builtin.include_role:
        name: docker
      tags:
        - initial-setup

    - name: Include qemu_guest_agent install role
      ansible.builtin.include_role:
        name: qemu_guest_agent
      tags:
        - initial-setup

    - name: Include compose's preinit.yaml
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml
      tags:
        - always # the stacks directory every role below writes into

# Play 2 — Caddy builds/deploys/restarts itself so it's already routing
# before anything else comes up behind it.
- name: Deploy Caddy
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include caddy role
      ansible.builtin.include_role:
        name: caddy
      tags:
        - images
        - infra

    # Runs in the same play/hosts as caddy above, right after it - needs
    # this host's own resolved_apps and its own
    # caddy_domain, nothing from any other host. See
    # docs/topics/monitoring/telegram-notifications.md.
    - name: Include caddy_cert_expiry role
      ansible.builtin.include_role:
        name: caddy_cert_expiry
      tags:
        - infra

# Play 3 — DNS config written and bind9 deployed/restarted before any
# other container starts or this host's Docker daemon points at it.
- name: Configure BIND9 on the DNS host
  hosts: dns
  gather_facts: false
  become: true
  tasks:
    - name: Include bind9 role
      ansible.builtin.include_role:
        name: bind9
      tags:
        - images
        - infra

# Play 4 — Every remaining compose app, now that DNS/caddy are up.
# bind9/caddy are excluded — they deployed themselves in Play 2/3.
# openbao is excluded too, but deploys itself right here instead of its
# own separate play — nothing else in this play depends on it being up
# first or vice versa, unlike caddy/bind9, so a whole extra play (and
# renumbering every one after it) bought nothing. See roles/openbao.
- name: Deploy Compose apps
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include openbao role
      ansible.builtin.include_role:
        name: openbao
      tags:
        - images

    - name: Include compose_app role
      ansible.builtin.include_role:
        name: compose_app
      tags:
        - images

# Play 5 — Ensure the SeaweedFS backup bucket exists. Runs after
# SeaweedFS deploys (Play 4), before backup_agent uploads to it (Play 6)
# — SeaweedFS doesn't auto-create buckets on first PUT. See
# ansible/roles/seaweedfs_bucket.
- name: Ensure SeaweedFS backup bucket exists
  hosts: storage
  gather_facts: false
  become: true
  tasks:
    - name: Include seaweedfs_bucket role
      ansible.builtin.include_role:
        name: seaweedfs_bucket
      tags:
        - images

# Play 6 — Wire step-ca into its consumers. Runs after
# lldap/step-ca/tinyauth/openbao all deploy (Play 4, on `security`):
# step_ca_client needs a running step-ca to read its root cert from;
# step_ca_cert's two instances each need their own app already running
# to issue into, plus step_ca_client's cached root; tinyauth_ca_trust
# needs a running tinyauth to seed into and the same cached root. No
# ordering constraint between those three — sequenced arbitrarily, all
# after the shared prerequisite. See docs/topics/services/step-ca.md for why lldap and
# openbao differ on cert dir, renew action, and chown. openbao_cli runs
# last and isn't arbitrary: it needs openbao's own step_ca_cert instance
# to have already issued and installed its leaf cert.
- name: Wire lldap, tinyauth, and openbao into step-ca
  hosts: security
  gather_facts: false
  become: true
  tasks:
    - name: Include step_ca_client role
      ansible.builtin.include_role:
        name: step_ca_client
      tags:
        - images

    - name: Include step_ca_cert role for lldap
      ansible.builtin.include_role:
        name: step_ca_cert
      vars:
        step_ca_cert_app_name: lldap
        step_ca_cert_common_name: "{{ lldap_host }}"
        step_ca_cert_container_cert_dir: /data/certs
        step_ca_cert_uptime_kuma_push_url: "{{ uptime_kuma_push_url_cert_renewer_lldap }}"
      tags:
        - images

    - name: Include tinyauth_ca_trust role
      ansible.builtin.include_role:
        name: tinyauth_ca_trust
      tags:
        - images

    - name: Include step_ca_cert role for openbao
      ansible.builtin.include_role:
        name: step_ca_cert
      vars:
        step_ca_cert_app_name: openbao
        step_ca_cert_common_name: openbao
        step_ca_cert_container_cert_dir: /openbao/certs
        step_ca_cert_renew_action: signal
        step_ca_cert_chown_image: "openbao/openbao:2.7.1"
        step_ca_cert_chown_user: openbao
        step_ca_cert_uptime_kuma_push_url: "{{ uptime_kuma_push_url_cert_renewer_openbao }}"
      tags:
        - images

    # Runs last in this play — needs openbao's own leaf cert (just
    # above) already issued and serving, since it proves real TLS
    # end to end. See ansible/roles/openbao_cli.
    - name: Include openbao_cli role
      ansible.builtin.include_role:
        name: openbao_cli
      tags:
        - images

# Play 7 — Ensure lldap's observer account exists (tinyauth's LDAP bind
# depends on it). Runs after lldap's own deploy (Play 4, on `security`),
# after Play 6 for no particular ordering reason of its own (the two are
# independent — this only needs lldap's web port, not its LDAPS cert) —
# placed here to mirror Play 5's "runs right after the thing it depends
# on" shape. tinyauth itself may already be mid-restart-loop from Play 4
# at this point (compose_apps lists it before lldap on `security`) —
# restart: unless-stopped means it picks up the now-real observer
# account on its next attempt without any extra ordering here.
- name: Ensure lldap's observer account exists
  hosts: security
  gather_facts: false
  become: true
  tasks:
    - name: Include lldap_bootstrap role
      ansible.builtin.include_role:
        name: lldap_bootstrap
      tags:
        - images

# Play 8 — Backup agent. Runs last among the managed_hosts
# plays deliberately: it mounts other apps' volumes as `external:
# true`, which requires each app's own Play 4 ensure_volume step to
# have already created them. Play 9 (storage-only) runs after this one.
- name: Deploy backup agent
  hosts: managed_hosts # not all — see inventory.yaml's controller group / Play 1's comment
  gather_facts: false
  become: true
  tasks:
    - name: Include backup_agent role
      ansible.builtin.include_role:
        name: backup_agent
      tags:
        - images

# Play 9 — Cloud sync. storage only, unlike Play 8 — reads every backup
# host's backup_plan via hostvars rather than depending on those hosts'
# own plays having already run in this same invocation (host_vars are
# static inventory data either way), so ordering after Play 8 isn't a
# hard dependency — it's just the natural place for "the next stage of
# the backup pipeline" to live. See docs/topics/disaster-recovery/backup.md.
- name: Deploy cloud sync
  hosts: storage
  gather_facts: false
  become: true
  tasks:
    - name: Include cloud_sync role
      ansible.builtin.include_role:
        name: cloud_sync
      tags:
        - images

# Play 10 — One report for the whole run: every host's apps by outcome,
# caddy, bind9 and openbao included, read from the compose_app_results each
# host accumulated since Play 2. Last, so it sees all of them; localhost,
# so it prints once rather than once per host. A host that failed earlier
# still has its results, and its apps with none are listed as unfinished.
# When every host in a single play fails, Ansible ends the run there and
# this play never starts — compose_app's own failure message names the
# failed apps for that case.
#
# Tagged images and infra, like the tasks that record the results, and
# not `always`: the CI ordering check runs this playbook with a tag that
# matches nothing, and the report would have no results to read there.
# Targets localhost like Play 0, so a --limit needs `localhost` too.
- name: Report deploy results
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Group every host's apps by outcome
      ansible.builtin.set_fact:
        deploy_results_by_host: "{{ groups['managed_hosts'] | deploy_report(hostvars) }}"
      tags:
        - images
        - infra

    # display_ok_hosts=no hides routine "ok" results, this one included;
    # changed_when routes it through the branch that's never hidden.
    - name: Report every host's deploy results
      ansible.builtin.debug:
        msg: "{{ deploy_results_by_host }}"
      changed_when: true
      when: deploy_results_by_host | length > 0
      tags:
        - images
        - infra
