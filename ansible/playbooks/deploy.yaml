---
# Play 1 — System setup on all hosts (no containers started yet). Covers
# docker engine and the app_registry resolve — bind9/caddy only need
# compose_apps resolved in hostvars here, per-app files come later.
#
# NOTE: vars_prompt is evaluated during play setup, before task-level tag
# filtering — every prompt below fires even under a narrow --tags images
# run. For non-interactive/tagged runs, pre-supply the values instead:
#   ansible-playbook deploy.yaml --tags images -e @secrets.yaml
# (secrets.yaml is gitignored). See README.md's tags section.
- name: System setup
  hosts: all
  gather_facts: true
  become: true
  vars_prompt:
    - name: main_domain
      prompt: "Enter the main domain"
    - name: digitalocean_api_key
      prompt: "Enter the DigitalOcean API Key"
      private: true
      confirm: true
    - name: letsencrypt_email
      prompt: "Enter the email for LetsEncrypt"
      private: false
    - name: telegram_token
      prompt: "Enter the Telegram Token for Diun"
      private: true
    - name: telegram_chat_id
      prompt: "Enter the Telegram Chat ID for Diun"
      private: true
    - name: wetty_ssh_host
      prompt: "Enter the default Wetty SSH Host"
      private: false
    - name: tinyauth_ldap_observer_password
      prompt: "Enter the Tinyauth LDAP Observer password"
      private: true
      confirm: true
    - name: beszel_hub_key
      prompt: "Enter the Beszel Hub Key"
      private: true
    - name: beszel_agent_token
      prompt: "Enter the Beszel Agent Token"
      private: true
  tasks:
    - name: Include docker install role
      ansible.builtin.include_role:
        name: docker
      tags:
        - initial-setup

    - name: Include compose's preinit.yaml
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml
      tags:
        - always # every role below reads the resolved compose_apps this sets

# Play 2 — Caddy builds/deploys/restarts itself so it's already routing
# before anything else comes up behind it.
- name: Deploy Caddy
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Include caddy role
      ansible.builtin.include_role:
        name: caddy
      tags:
        - images
        - infra

# Play 3 — DNS config written and bind9 deployed/restarted before any
# other container starts or this host's Docker daemon points at it.
- name: Configure BIND9 on the DNS host
  hosts: dns
  gather_facts: false
  become: true
  tasks:
    - name: Include bind9 role
      ansible.builtin.include_role:
        name: bind9
      tags:
        - images
        - infra

# Play 4 — Every remaining compose app, now that DNS/caddy are up.
# bind9/caddy are excluded — they deployed themselves in Play 2/3.
- name: Deploy Compose apps
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Include compose_app role
      ansible.builtin.include_role:
        name: compose_app
      tags:
        - images

# Play 5 — Ensure the offsite-backup bucket exists (stage 1 DR). Runs
# after SeaweedFS deploys (Play 4), before backup_agent uploads to it
# (Play 6) — SeaweedFS doesn't auto-create buckets on first PUT, confirmed
# via a real production failure. See ansible/roles/seaweedfs_bucket.
- name: Ensure offsite-backup bucket exists
  hosts: storage
  gather_facts: false
  become: true
  tasks:
    - name: Include seaweedfs_bucket role
      ansible.builtin.include_role:
        name: seaweedfs_bucket
      tags:
        - images

# Play 6 — Offsite backup agent (stage 1 DR). Runs last deliberately: it
# mounts other apps' volumes as `external: true`, which requires each
# app's own Play 4 ensure_volume step to have already created them.
- name: Deploy offsite backup agent
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Include backup_agent role
      ansible.builtin.include_role:
        name: backup_agent
      tags:
        - images
