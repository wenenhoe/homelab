---
# Play 0 — Secrets. Needed here too, not just deploy.yaml: this
# playbook's hosts: managed_hosts resolves ansible_host through
# secrets_generated (see bootstrap-secrets.yaml for the full why).
# Without this, the implicit Gathering Facts step below fails before
# "Update and Upgrade Servers" ever gets a chance to run.
# managed_hosts, not all — all also includes the controller (see
# inventory.yaml), which should never get apt/fwupd run against it the
# way this playbook runs it against real servers.
# Usage: ansible-playbook maintenance.yaml --limit prod,localhost
# (localhost required in --limit — see bootstrap-secrets.yaml)
- name: Play 0 - Secrets
  ansible.builtin.import_playbook: bootstrap-secrets.yaml

- name: Update and Upgrade Servers
  hosts: managed_hosts
  become: true
  roles:
    - apt
    - fwupd
