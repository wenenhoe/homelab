---
# Play 0 — Secrets. Needed here too, not just deploy.yaml: every
# patched_hosts member (managed_hosts and network_infra alike) resolves
# ansible_host through secrets_generated (see bootstrap-secrets.yaml
# for the full why). Without this, the implicit Gathering Facts step
# below fails before "Update and Upgrade Servers" ever gets a chance
# to run.
# patched_hosts, not all — all also includes the controller (see
# inventory.yaml), which should never get apt/fwupd run against it the
# way this playbook runs it against real servers.
# Usage: ansible-playbook maintenance.yaml --limit patched_hosts,localhost
# (localhost required in --limit — see bootstrap-secrets.yaml)
- name: Play 0 - Secrets
  ansible.builtin.import_playbook: bootstrap-secrets.yaml

- name: Update and Upgrade Servers
  hosts: patched_hosts
  become: true
  roles:
    - apt
    - fwupd

# Play 2 — Proxmox guest-agent presence, network_infra only.
# managed_hosts already gets qemu_guest_agent from deploy.yaml's Play 1
# (bundled with the docker install there); not duplicated here since
# that would run the same idempotent task against the same hosts from
# two separate playbooks for no benefit. network_infra has no
# equivalent play in deploy.yaml (it never reaches deploy.yaml at all —
# see inventory.yaml's network_infra comment), so this is its only
# home. See docs/network-infra.md.
- name: Ensure Proxmox guest agent on network infrastructure hosts
  hosts: network_infra
  become: true
  roles:
    - qemu_guest_agent
