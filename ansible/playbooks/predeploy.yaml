---
# Play 1 of deploy.yaml, runnable on its own. It reads no secret, so it needs
# no Play 0 and no OpenBao: a host whose address comes from the generated
# inventory (tofu-hosts.yaml) can be brought to "Docker and the stacks
# directory exist" while the secrets store is not reachable, which is
# the state of a rebuilt `security`. Hosts addressed by name still need
# bootstrap-secrets.yaml ahead of it, since their ansible_host resolves
# through secrets_generated.
#
#   ansible-playbook playbooks/predeploy.yaml --limit security
#
# Play 1 — System setup on every managed (real) host. Covers docker
# engine and the stacks directory; per-app files come later.
# hosts: managed_hosts, not hosts: all — all also includes the
# controller (see inventory.yaml), which must never get Docker
# installed on it or a container deployed to it.
- name: System setup
  hosts: managed_hosts
  gather_facts: true
  become: true
  tasks:
    - name: Include docker install role
      ansible.builtin.include_role:
        name: docker
      tags:
        - initial-setup

    - name: Include qemu_guest_agent install role
      ansible.builtin.include_role:
        name: qemu_guest_agent
      tags:
        - initial-setup

    - name: Include compose's preinit.yaml
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml
      tags:
        - always # the stacks directory every role below writes into
