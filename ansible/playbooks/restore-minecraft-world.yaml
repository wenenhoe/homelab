---
# Phase 2 of a minecraft restore, after playbooks/restore.yaml has
# reconstituted minecraft_backups (phase 1). Runs
# docker/minecraft/scripts/run_restore.sh -y on `play`, which empties
# ./data and unpacks the newest tar in ./backups into it via
# itzg/mc-backup's restore-tar-backup entrypoint — deliberately kept out of the
# `restore` role itself, see that script's own header and
# docs/topics/disaster-recovery/restore.md.
#
# restore_all.py always runs phase 1 immediately before this, after its own
# batch confirmation, and passes restore_world_confirm=true. Standalone use
# (e.g. an ordinary same-day rollback with no backup archive involved)
# should call docker/minecraft/scripts/run_restore.sh directly on `play`
# instead, which asks for confirmation itself.
#
# Required -e vars:
#   restore_world_confirm — must be explicitly `true`; no default
#
# REQUIRES bootstrap-secrets.yaml passed on the SAME command line ahead
# of this file, same reason as playbooks/restore.yaml.
#
# Usage:
#   ansible-playbook playbooks/bootstrap-secrets.yaml \
#     playbooks/restore-minecraft-world.yaml \
#     -i inventory/inventory.yaml -i inventory/tofu-hosts.yaml --limit play,localhost \
#     -e restore_world_confirm=true

- name: Run minecraft's on-host world restore script
  hosts: play
  gather_facts: false
  become: true
  strategy: linear
  tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: restore_world_confirm | default(false) | bool
        fail_msg: >-
          Refusing to run without -e restore_world_confirm=true — this
          empties minecraft_data and replaces it with the newest backup in
          minecraft_backups.

    - name: Run run_restore.sh -y
      ansible.builtin.command:
        cmd: "{{ compose_deploy_dir }}/minecraft/scripts/run_restore.sh -y"
      changed_when: true
