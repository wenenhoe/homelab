---
# Restore one app's volume(s) from an offsite backup archive.
#
# Doesn't talk to SeaweedFS or GPG directly — pull the object out of the
# `homelab-backups` bucket and `gpg --decrypt` it with the offline
# private key first (see docs/disaster-recovery.md), then hand this
# playbook the resulting plain .tar.gz.
#
# A decrypted archive may contain more apps than the one you're
# restoring, since backup_agent aggregates multiple apps per group — this
# only extracts directories matching restore_volumes. restore_app
# controls which app's compose stack gets stopped/redeployed around it.
#
# All logic lives in ansible/roles/restore; this is a thin sequencer. It
# MUST stay a single play (hosts: managed_hosts, not all — all includes
# the controller, never a valid restore target) — see that role's
# tasks/main.yaml header for why a separate validation play isn't safe.
#
# REQUIRES bootstrap-secrets.yaml passed on the SAME command line ahead
# of this file: hosts: managed_hosts resolves ansible_host through
# secrets_generated, but the bootstrap can't be a second play in this
# file for the same single-play reason above. Passing it as a separate
# file works because Ansible facts persist across every playbook file in
# one invocation, same as across plays within a file.
#
# Usage:
#   ansible-playbook playbooks/bootstrap-secrets.yaml playbooks/restore.yaml \
#     -i inventory/inventory.yaml --limit services,localhost \
#     -e restore_app=kms \
#     -e restore_archive_local_path=/home/you/services-stop-group-2026-07-29T04-00-00.tar.gz \
#     -e restore_volumes='["kms_data"]'
#
# For lldap (multiple volumes in one archive):
#   -e restore_app=lldap \
#   -e restore_archive_local_path=/home/you/security-no-stop-group-....tar.gz \
#   -e restore_volumes='["lldap_data","lldap_certs","lldap_creds","lldap_letsencrypt_conf","lldap_letsencrypt_lib"]'
#
# What it does, per targeted volume: copies the archive to the target,
# stops the app's compose stack, extracts the full archive into a scratch
# volume, locates the directory matching the volume's name wherever it
# sits (not assuming an exact prefix), copies it over the real volume,
# tears down the scratch volume/archive copy, and redeploys.
#
# Destructive by design (overwrites current volume contents) — the pause
# step requires explicit confirmation before anything happens.

- name: Restore an app's volume(s) from an offsite backup archive
  hosts: managed_hosts
  gather_facts: false
  become: true
  # linear for predictable, one-host-at-a-time output on a destructive,
  # human-operated procedure (not required for correctness — see
  # roles/restore/tasks/main.yaml).
  strategy: linear
  tasks:
    - name: Run the restore role
      ansible.builtin.include_role:
        name: restore
