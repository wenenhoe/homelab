---
# Ad hoc playbook: rotates one generated secret to a fresh value.
# Doesn't run the redeploy that picks the new value up — see
# docs/secrets-rotation.md for which --limit group each secret actually
# needs; it's rarely just one host, and getting it wrong silently leaves
# the old value live on whichever hosts didn't get redeployed.
#
# Only handles format: hex and format: uuid4 entries in
# secrets_registry.yaml — the ones Ansible can regenerate on its own.
# format: manual entries (API keys, Beszel's post-boot values, every
# cloud backup credential) have no value this playbook could generate;
# see bootstrap_secrets.py for those instead.
#
# Vault-backed and file-cache-backed secrets rotate differently:
#   - Vault-backed (has a vault_scope): writes a fresh value in place
#     with cas=<current version> — an update, not a delete-then-recreate.
#     controller's AppRole policy grants create/read/update on
#     secret/data/hosts/*, deliberately NOT delete (docs/openbao-auth.md's
#     stage-3 runbook proves this), so there's no delete-based path
#     available even if one were wanted.
#   - File-cache-backed (main-domain, the controller AppRole credential
#     pair, every cloud-credential entry): unchanged from before Track A
#     — deletes the cached file, and the next deploy.yaml run regenerates
#     it fresh.
#
# Required -e vars:
#   secret_name — exact key from secrets_registry.yaml, kebab-case
#   confirm     — must be explicitly `true`; no default
#
# Usage:
#   ansible-playbook playbooks/rotate-secret.yaml \
#     -e secret_name=tinyauth-ldap-observer-password -e confirm=true

- name: Rotate one generated secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Require an explicit secret_name
      ansible.builtin.assert:
        that: secret_name is defined
        fail_msg: "Pass -e secret_name=<key-from-secrets_registry.yaml>"

    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm | default(false) | bool
        fail_msg: >-
          Refusing to run without confirm=true — this replaces the
          current value. Whatever currently uses it keeps working until
          you redeploy, then breaks until that redeploy finishes
          regenerating and re-syncing it everywhere it's needed.

    - name: Confirm this key exists in the registry
      ansible.builtin.assert:
        that: secret_name in secrets_registry
        fail_msg: >-
          "{{ secret_name }}" isn't in secrets_registry.yaml. Check the
          exact key (kebab-case) against
          ansible/inventory/group_vars/all/secrets_registry.yaml.

    - name: Refuse to touch a manual secret
      ansible.builtin.assert:
        that: secrets_registry[secret_name].format in ['hex', 'uuid4']
        fail_msg: >-
          "{{ secret_name }}" is format: manual — Ansible can't generate a
          replacement value for it. Rotating it means obtaining a new
          value from wherever it actually comes from (see its
          `description` in secrets_registry.yaml), then running
          `python3 ansible/bootstrap_secrets.py` to store it — not this
          playbook.

    # =====================================================================
    # --- Vault-backed: fresh value, written in place with cas=<version> -
    # =====================================================================
    - name: "Rotate a Vault-backed secret [block] - {{ secret_name }}"
      when: secrets_registry[secret_name].vault_scope is defined
      block:
        - name: Log into OpenBao as the controller AppRole
          ansible.builtin.include_role:
            name: secrets
            tasks_from: vault_login.yaml

        - name: "Read this secret's current Vault state"
          ansible.builtin.include_role:
            name: secrets
            tasks_from: read_vault_kv.yaml
          vars:
            secrets_item_name: "{{ secret_name }}"

        - name: Fail clearly if there's nothing to rotate
          ansible.builtin.fail:
            msg: >-
              No value found in OpenBao at
              {{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }} —
              "{{ secret_name }}" has never been generated yet. Nothing to
              rotate; a normal deploy.yaml run will generate it fresh.
          when: secrets_vault_read.status == 404

        - name: "Generate a fresh replacement value - {{ secret_name }}"
          ansible.builtin.include_role:
            name: secrets
            tasks_from: generate_vault_value.yaml
          vars:
            secrets_item_name: "{{ secret_name }}"

        - name: "Write the fresh value with cas=<current version> - {{ secret_name }}"
          ansible.builtin.uri:
            url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ secrets_vault_token }}"
            ca_path: "{{ secrets_vault_ca_path }}"
            body_format: json
            body:
              data:
                value: "{{ secrets_vault_generated_value }}"
              options:
                cas: "{{ secrets_vault_read.json.data.metadata.version }}"
            status_code: [200]
          no_log: true

      always:
        - name: Remove this run's temp root-cert file, if one was fetched
          ansible.builtin.file:
            path: "{{ secrets_vault_ca_path }}"
            state: absent
          when: secrets_vault_ca_path is defined

    # =====================================================================
    # --- File-cache-backed: delete, next deploy.yaml regenerates --------
    # =====================================================================
    - name: "Rotate a file-cache-backed secret [block] - {{ secret_name }}"
      when: secrets_registry[secret_name].vault_scope is not defined
      block:
        - name: "Compute this secret's cache path"
          ansible.builtin.set_fact:
            rotate_secret_cache_path: "{{ project_root }}/ansible/files/secrets/{{ secret_name }}"

        - name: Confirm a cached value actually exists to rotate
          ansible.builtin.stat:
            path: "{{ rotate_secret_cache_path }}"
          register: rotate_secret_stat

        - name: Fail clearly if there's nothing to rotate
          ansible.builtin.fail:
            msg: >-
              No cached value found at {{ rotate_secret_cache_path }} —
              "{{ secret_name }}" has never been generated yet. Nothing to
              rotate; a normal deploy.yaml run will generate it fresh.
          when: not rotate_secret_stat.stat.exists

        - name: "Delete the cached value"
          ansible.builtin.file:
            path: "{{ rotate_secret_cache_path }}"
            state: absent

    - name: Show the redeploy command this secret actually needs
      ansible.builtin.debug:
        msg: >-
          Rotated. "{{ secret_name }}" has no valid old value anywhere
          until you redeploy — check docs/secrets-rotation.md's table for
          which --limit group it needs (it's rarely just one host), then
          run: ansible-playbook playbooks/deploy.yaml --limit <group>,localhost
