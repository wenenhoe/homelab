---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Confirm host is Debian-based (matches the role's own assertion)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "Test host is not Debian-based — the role's own assert should have failed converge already."

    - name: Dry-run the role's own upgrade type to check whether anything is still upgradable
      ansible.builtin.apt:
        upgrade: "{{ apt_upgrade_type | default('safe') }}"
        update_cache: true
      check_mode: true
      register: apt_upgrade_check

    - name: Assert the role fully upgraded the system
      ansible.builtin.assert:
        that:
          - not apt_upgrade_check.changed
        fail_msg: "A dry-run upgrade still reports changes after the apt role ran: {{ apt_upgrade_check.stdout | default('') }}"

    # converge.yml leaves the marker itself and removes it again, so one still
    # here means the second include ran with a reboot pending. The role never
    # reboots in this scenario: patch_reboot_allowed is false, and a real
    # reboot isn't tested in a separate scenario either (see
    # docs/topics/engineering/ci/gates.md#molecule-coverage-gate): a privileged
    # container's `reboot` syscall isn't scoped to the container - it reboots
    # the underlying Docker host's own kernel (confirmed against a real,
    # reported case: moby/moby issue #21929), which is a genuine hazard to
    # whoever runs `molecule test` for it, not just an inconvenience to work
    # around.
    - name: Confirm no reboot-required marker is left behind
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: apt_verify_reboot_required
      failed_when: apt_verify_reboot_required.stat.exists
