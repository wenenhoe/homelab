---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Confirm host is Debian-based (matches the role's own assertion)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: "Test host is not Debian-based — the role's own assert should have failed converge already."

    - name: Dry-run a full upgrade to check whether anything is still upgradable
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      check_mode: true
      register: apt_upgrade_check

    - name: Assert the role fully upgraded the system
      ansible.builtin.assert:
        that:
          - not apt_upgrade_check.changed
        fail_msg: "A dry-run dist-upgrade still reports changes after the apt role ran: {{ apt_upgrade_check.stdout | default('') }}"
