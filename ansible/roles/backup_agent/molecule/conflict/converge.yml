---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers. Unused in this scenario
    # (validation fails before that task is ever reached), kept for
    # consistency with the other scenarios.
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"
    offsite_backup_s3_bucket: molecule-test-backups
    offsite_backup_s3_endpoint: "unused-in-this-scenario:8333"
    offsite_backup_s3_proto: "http"
    offsite_backup_cron: "0 4 * * *"
    offsite_backup_retention_days: 7
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key

    # Both apps are in the stop-during-backup group, but disagree on
    # retention_days (7 via the global default vs. an explicit 3
    # override) — this is exactly the conflict backup_agent's validation
    # is meant to catch, and it should never get as far as rendering
    # compose.yaml or touching any volume.
    app_registry:
      conflict_app_a:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
      conflict_app_b:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
          retention_days: 3
    compose_apps:
      - name: conflict_app_a
      - name: conflict_app_b
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: bootstrap_docker.yaml

    - name: Install python3-requests
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    # No compose_app/volume/SeaweedFS setup needed here — the conflict is
    # caught by backup_agent's validation tasks, which run before it ever
    # renders compose.yaml or touches a volume.
    - name: "Run backup_agent [block / rescue] (conflicting retention_days is deliberate, failure is expected)"
      block:
        - name: Run backup_agent
          ansible.builtin.include_role:
            name: backup_agent
      rescue:
        - name: Leave a marker proving the validation actually caught the conflict
          ansible.builtin.copy:
            dest: /tmp/backup_agent_conflict_halt_marker
            content: "conflict caught as expected\n"
            mode: "0644"
