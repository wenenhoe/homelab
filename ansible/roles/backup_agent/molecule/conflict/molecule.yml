---
# Same Docker-in-Docker setup as the default scenario. No SeaweedFS/S3
# target needed here — this scenario never gets past the validation
# tasks, so nothing ever tries to upload anything.
driver:
  name: docker
platforms:
  - name: backup-agent-conflict-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
