---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
  tasks:
    - name: Confirm the conflict was actually caught as expected
      ansible.builtin.stat:
        path: /tmp/backup_agent_conflict_halt_marker
      register: backup_agent_conflict_marker
      failed_when: not backup_agent_conflict_marker.stat.exists

    - name: Confirm backup_agent never got as far as rendering compose.yaml
      ansible.builtin.stat:
        path: "{{ compose_deploy_dir }}/backup-agent/compose.yaml"
      register: backup_agent_conflict_compose
      failed_when: backup_agent_conflict_compose.stat.exists

    - name: Confirm no backup-agent containers were ever created
      community.docker.docker_host_info:
        containers: true
        containers_all: true
        containers_filters:
          name: backup-agent
      register: backup_agent_conflict_containers
      failed_when: backup_agent_conflict_containers.containers | length > 0
