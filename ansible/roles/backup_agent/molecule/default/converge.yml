---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers, not a per-scenario copy
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"

    # --- backup_agent's own required global vars ---
    # A fast cron here (not production's 4am schedule) so verify.yml
    # doesn't wait until 4am for a real cron-triggered run — see the
    # note further down on why this has to be real cron and not a
    # manual trigger. Set as input to the role, not patched into its
    # output afterward: mutating a rendered file post-hoc would fight
    # the role's own idempotent re-render on every single converge run
    # (confirmed the hard way — an earlier version of this file did
    # exactly that via `ansible.builtin.replace` + a manual container
    # restart, and both permanently failed the `idempotence` step).
    offsite_backup_cron: "* * * * *"
    offsite_backup_retention_days: 7

    # env.j2 now renders NOTIFICATION_URLS from these — see
    # docs/telegram-notifications.md.
    # shoutrrr's telegram service reconstructs "token" from the URL's
    # userinfo as username + ":" + password and validates it against
    # ^[0-9]+:[a-zA-Z0-9_-]+$ — a token without that digits:alnum shape
    # fails NOTIFICATION_URLS's sender setup at every single scheduled
    # run, never reaching the actual backup logic (confirmed live: this
    # value used to be "molecule-dummy-telegram-token", which doesn't
    # embed a ":" at all, and every cron tick logged "error creating
    # sender: ... telegram: failed to initialize service"). A real bot
    # token from BotFather already has this shape, so production is
    # unaffected — only this placeholder needed to match it.
    telegram_token: "123456789:molecule-dummy-token"
    telegram_chatid_backups: "molecule-dummy-chat-id"
    # telegram_notify's install.yaml also needs this — the bare chat
    # ID, distinct from telegram_chatid_backups above (that one's
    # backup_agent's own shoutrrr-formatted "chat_id:topic_id" string).
    telegram_chat_id: "molecule-dummy-chat-id"
    # telegram_notify's install.yaml (included from backup_agent's own
    # tasks/main.yaml, for freshness-check failures) needs this — a
    # different var from telegram_chatid_backups above, which is
    # backup_agent's own direct shoutrrr config, not our telegram_notify
    # role. Blank, same "not configured yet" happy path used everywhere
    # else in this repo.
    telegram_topic_id_backups: ""

    # A real SeaweedFS instance (started below) stands in for the actual
    # target, with a real -s3.config identity, so this exercises real
    # upload/auth wiring, not just "the container is running". This
    # scenario's credential is deliberately shared by every app on the
    # host — real hosts get one path-scoped identity each
    # (docker/seaweedfs/configs/s3-identity.json.j2), which is a
    # property of that template, not of backup_agent itself; nothing
    # here would catch a scoping regression there. See
    # docs/disaster-recovery.md for that coverage instead.
    molecule_test_bucket: molecule-test-backups
    offsite_backup_s3_bucket: "{{ molecule_test_bucket }}"
    offsite_backup_s3_endpoint: "seaweedfs-test:8333"
    offsite_backup_s3_proto: http
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key

    # check-freshness.sh.j2 (included from backup_agent's own
    # tasks/main.yaml) needs these — see docs/uptime-kuma.md. A short
    # threshold so verify.yml doesn't need to wait. One push URL for
    # the whole host now (not per-app) — every app in this scenario
    # gets a real backup uploaded below, so this exercises the "every
    # app fresh, one push fires" path.
    offsite_backup_freshness_hours: 1
    backup_agent_freshness_push_url: "http://uptime-kuma-test.invalid/api/push/molecule-fake-token"

    # happy_app_stop carries docker-volume-backup.stop-during-backup=
    # happy_app_stop on its own container and stop_during_backup: true
    # here — the pairing backup_agent's per-schedule stop label depends
    # on. happy_app_nostop carries neither. happy_app_no_backup declares
    # no `backup:` key at all — mirrors real apps like caddy/beszel-agent/
    # diun, which coexist with backed-up apps: confirms the
    # normalization task's `when: ... | length > 0` skip branch actually
    # excludes it.
    app_registry:
      happy_app_stop:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
      happy_app_nostop:
        volumes:
          - name: data
        backup:
          volumes: [data]
      happy_app_no_backup:
        volumes:
          - name: data
      # Two volumes on one app, mirroring lldap's real backup.volumes:
      # [data, certs] shape — catches BACKUP_SOURCES regressions that
      # only show up once an app has more than one backed-up volume.
      happy_app_multivol:
        volumes:
          - name: data
          - name: certs
        backup:
          volumes: [data, certs]
      # Mirrors minecraft's real backup.compression: none — its source
      # volume is already gzipped upstream (see app_registry.yaml),
      # so the schedule must skip a redundant second compression pass.
      happy_app_precompressed:
        volumes:
          - name: data
        backup:
          volumes: [data]
          compression: none
    compose_apps:
      - name: happy_app_stop
      - name: happy_app_nostop
      - name: happy_app_no_backup
      - name: happy_app_multivol
      - name: happy_app_precompressed
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    # Mirrors Play 4 running before Play 5 in the real deploy.yaml —
    # backup_agent's compose.yaml references these apps' volumes as
    # `external: true`, requiring them to already exist.
    - name: Deploy the synthetic "source" apps so their volumes/containers exist
      ansible.builtin.include_role:
        name: compose_app

    # Seeded before the role's own first run, standing in for a
    # schedule left over from an app that used to exist but doesn't
    # anymore — the actual case the stale-file-removal task in
    # tasks/main.yaml exists to handle. Without this, that task's loop
    # is empty on every real run this scenario exercises (nothing here
    # ever changes app_registry between runs), so its deletion behavior
    # itself was never actually observed to work. Guarded by a marker
    # file so this seeds exactly once, not on molecule's `idempotence`
    # re-run of this same converge.yml — reseeding there would give the
    # removal task real work on every run, landing back in the same
    # non-idempotent trap an earlier version of this role hit.
    - name: Check whether the stale-file seed already ran (guards against reseeding on the idempotence re-run)
      ansible.builtin.stat:
        path: /tmp/backup_agent_molecule_stale_seed_done
      register: backup_agent_stale_seed_marker

    - name: Ensure backup-agent's conf.d directory exists to seed a stale file into (the role creates it too, but hasn't run yet)
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d"
        state: directory
        mode: "0755"
      when: not backup_agent_stale_seed_marker.stat.exists

    - name: Seed a stale schedule file predating this run, simulating a removed app
      ansible.builtin.copy:
        dest: "{{ compose_deploy_dir }}/backup-agent/conf.d/long_gone_app.env"
        content: |
          AWS_S3_BUCKET_NAME=molecule-test-backups
          BACKUP_SOURCES=/backup/long_gone_app_data
        mode: "0600"
      when: not backup_agent_stale_seed_marker.stat.exists

    - name: Record that the seed ran, so the idempotence re-run of this file doesn't repeat it
      ansible.builtin.file:
        path: /tmp/backup_agent_molecule_stale_seed_done
        state: touch
        mode: "0644"
      when: not backup_agent_stale_seed_marker.stat.exists

    # The role under test. Runs before the SeaweedFS target below is even
    # started — its containers only reach AWS_ENDPOINT on cron/manual
    # trigger, not at startup, so this ordering is safe.
    - name: Run backup_agent
      ansible.builtin.include_role:
        name: backup_agent

    # backup_agent's compose stack (and its network) already exists by
    # now — discover it before creating seaweedfs-test, so it can be
    # attached at creation time rather than connected afterward.
    # SeaweedFS likely binds its listener to whichever address is
    # available at startup, so connecting a network later risks it never
    # picking up the new interface (looks like "connection refused" on an
    # otherwise correctly-resolved IP).
    - name: Discover the docker network backup_agent's compose stack created
      community.docker.docker_host_info:
        networks: true
      register: backup_agent_docker_networks

    - name: Extract its name
      ansible.builtin.set_fact:
        backup_agent_network_name: >-
          {{ backup_agent_docker_networks.networks
             | selectattr('Name', 'search', 'backup-agent-net')
             | map(attribute='Name') | list | first }}

    # --- Real S3 target for this scenario --------------------------------
    # See molecule_helpers/tasks/start_seaweedfs_test_target.yaml for what
    # this does and why. Attached to backup_agent's own network at
    # creation time, not connected afterward — see above.
    - name: Start a real SeaweedFS S3 target for this scenario
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_seaweedfs_test_target.yaml
      vars:
        molecule_helpers_seaweedfs_access_key: "{{ seaweedfs_s3_access_key }}"
        molecule_helpers_seaweedfs_secret_key: "{{ seaweedfs_s3_secret_key }}"
        molecule_helpers_seaweedfs_bucket: "{{ molecule_test_bucket }}"
        molecule_helpers_seaweedfs_network_name: "{{ backup_agent_network_name }}"

    # amazon/aws-cli's `s3 mb` needs to reach seaweedfs-test by name, so
    # this persistent utility container joins the same discovered
    # network. Persistent (state: started, never removed), not
    # created-and-torn-down each run: an ephemeral container reports
    # `changed` on both creation and removal every single time by
    # definition, which molecule's idempotence check (this scenario's
    # own test_sequence) correctly flags — there's no way to make
    # ephemeral churn idempotent short of not recreating it.
    # docker_container's own state:started comparison correctly reports
    # unchanged once it already matches, same as any other declarative
    # resource.
    - name: Start a persistent aws-cli utility container to run the bucket-creation command in
      community.docker.docker_container:
        name: backup-agent-bucket-create
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        entrypoint: ["sleep"]
        command: ["infinity"]
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_s3_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_s3_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        state: started
        detach: true

    # community.docker.docker_container with detach:false hard-crashes
    # the whole play ("Module failed", not a normal failed:true result)
    # on ANY nonzero exit from the containerized command — confirmed
    # live, not assumed. That's not an edge case here: aws s3 mb on an
    # already-existing bucket (BucketAlreadyOwnedByYou) itself exits
    # nonzero, which is exactly the idempotence re-run's own path.
    # community.docker.docker_container_exec instead returns a normal
    # result (.rc/.stdout/.stderr) regardless of exit code — the same
    # reliable pattern this repo's own molecule_helpers already
    # established (see its header comment) after hitting the
    # docker_container problem twice before.
    - name: Create the test bucket in SeaweedFS ahead of time
      community.docker.docker_container_exec:
        container: backup-agent-bucket-create
        command: "aws --endpoint-url http://seaweedfs-test:8333 s3 mb s3://{{ molecule_test_bucket }}"
      register: backup_agent_bucket_create
      changed_when: false
      # seaweedfs-test (and its data volume) persists across the
      # idempotence re-run, so the bucket genuinely already exists the
      # second time. Tolerates both BucketAlreadyExists and
      # BucketAlreadyOwnedByYou — anything else (including a genuine
      # auth failure) is a real failure.
      failed_when: >-
        backup_agent_bucket_create.rc != 0
        and 'BucketAlreadyExists' not in (backup_agent_bucket_create.stdout ~ backup_agent_bucket_create.stderr)
        and 'BucketAlreadyOwnedByYou' not in (backup_agent_bucket_create.stdout ~ backup_agent_bucket_create.stderr)
