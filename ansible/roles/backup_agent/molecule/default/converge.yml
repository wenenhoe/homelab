---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers rather than a per-scenario
    # copy (previously duplicated 3x, which is exactly the kind of thing
    # that caused the missing-fixture bug when this scenario was added).
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"

    # --- backup_agent's own required global vars ---
    # A real SeaweedFS instance (started below, same image the real
    # `storage` host runs) stands in for the actual S3 target, with a
    # real -s3.config identity (see below) so this scenario exercises
    # actual upload/auth wiring, not just "the container is running".
    offsite_backup_s3_bucket: molecule-test-backups
    # Bare host:port, no scheme — see the comment on this var in
    # group_vars/all.yaml for why (docker-volume-backup's AWS_ENDPOINT
    # rejects a scheme-prefixed value). The test SeaweedFS target has no
    # TLS, so proto is http here vs. https in production.
    offsite_backup_s3_endpoint: "seaweedfs-test:8333"
    offsite_backup_s3_proto: "http"
    offsite_backup_cron: "0 4 * * *"
    offsite_backup_retention_days: 7
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key

    # happy_app_stop carries docker-volume-backup.stop-during-backup=true
    # on its own container (see files/docker/happy_app_stop/compose.yaml)
    # and is grouped accordingly; happy_app_nostop carries no such label.
    # happy_app_no_backup declares no `backup:` key at all — mirrors real
    # apps like caddy/beszel-agent/diun, which coexist with backed-up
    # apps on every real host but were never covered by this scenario:
    # both other apps here always declared backup.volumes, so the
    # normalization task's `when: ... | length > 0` skip branch had never
    # actually been exercised as false.
    app_registry:
      happy_app_stop:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
      happy_app_nostop:
        volumes:
          - name: data
        backup:
          volumes: [data]
      happy_app_no_backup:
        volumes:
          - name: data
    compose_apps:
      - name: happy_app_stop
      - name: happy_app_nostop
      - name: happy_app_no_backup
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: bootstrap_docker.yaml

    - name: Install python3-requests (docker_container/docker_volume/docker_host_info talk to the API directly)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    # Mirrors Play 4 running before Play 5 in the real deploy.yaml —
    # backup_agent's compose.yaml references these apps' volumes as
    # `external: true`, which requires them to already exist.
    - name: Deploy the two synthetic "source" apps so their volumes/containers exist
      ansible.builtin.include_role:
        name: compose_app

    # Known content to confirm later that the *right* volume's data made
    # it into the *right* group's archive — not just that a backup ran.
    # changed_when: false — this is test setup, not something idempotence
    # should count as a state change.
    - name: Seed known canary content into each app's data volume
      community.docker.docker_container_exec:
        container: "{{ item }}"
        command: "sh -c 'echo molecule-canary-{{ item }} > /data/canary.txt'"
      loop:
        - happy_app_stop
        - happy_app_nostop
      changed_when: false

    # The role under test. Runs before the SeaweedFS target below is even
    # started — its containers don't try to reach AWS_ENDPOINT at startup
    # (only when cron fires or something manually triggers a backup, which
    # verify.yml does), so ordering here is safe.
    - name: Run backup_agent
      ansible.builtin.include_role:
        name: backup_agent

    # By now, backup_agent's compose stack already exists, which means
    # its network does too — discover it BEFORE creating seaweedfs-test,
    # so it can be attached at creation time rather than connected
    # afterward. Creating on the default bridge network first and
    # connecting to the real one only after the process has already
    # started risks SeaweedFS binding its listener to whichever address
    # was available at startup and never picking up an interface added
    # later — consistent with "connection refused" on an otherwise
    # correctly-resolved IP (the packet arrives; nothing's listening
    # there).
    - name: Discover the docker network backup_agent's compose stack created
      community.docker.docker_host_info:
        networks: true
      register: backup_agent_docker_networks

    - name: Extract its name
      ansible.builtin.set_fact:
        backup_agent_network_name: >-
          {{ backup_agent_docker_networks.networks
             | selectattr('Name', 'search', 'backup-agent-net')
             | map(attribute='Name') | list | first }}

    # --- Real S3 target for this scenario --------------------------------
    # A real SeaweedFS instance (same image the actual `storage` host
    # runs) standing in for the real S3 target, so this test exercises
    # actual upload/auth wiring, not just "the containers are running".
    #
    # Anonymous mode (no -s3.config) was a corner cut for expedience —
    # it worked for aws-cli's calls but not docker-volume-backup's, which
    # always signs its S3 requests; SeaweedFS can't validate a signature
    # against zero configured identities ("Signed request requires
    # setting up SeaweedFS S3 authentication"). Production already uses a
    # real -s3.config — mirroring that here properly instead.
    - name: Render an S3 identity config for the test SeaweedFS target
      ansible.builtin.copy:
        dest: /tmp/seaweedfs-test-s3-identity.json
        mode: "0644"
        content: |
          {
            "identities": [
              {
                "name": "molecule-test",
                "credentials": [
                  {
                    "accessKey": "{{ seaweedfs_s3_access_key }}",
                    "secretKey": "{{ seaweedfs_s3_secret_key }}"
                  }
                ],
                "actions": [
                  "Write:{{ offsite_backup_s3_bucket }}",
                  "Read:{{ offsite_backup_s3_bucket }}",
                  "List:{{ offsite_backup_s3_bucket }}",
                  "Tagging:{{ offsite_backup_s3_bucket }}",
                  "Admin:{{ offsite_backup_s3_bucket }}"
                ]
              }
            ]
          }

    # HEALTHCHECK uses wget --spider — confirmed available in this image
    # (Alpine-based; its own Dockerfile installs wget/curl, corroborated
    # by a published chrislusf/seaweedfs compose example using this exact
    # wget --spider pattern against this image family).
    - name: Run a throwaway SeaweedFS S3 target for this scenario
      community.docker.docker_container:
        name: seaweedfs-test
        image: chrislusf/seaweedfs:3.97
        command: "server -dir=/data -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-identity.json"
        volumes:
          - /tmp/seaweedfs-test-s3-identity.json:/etc/seaweedfs/s3-identity.json:ro
        state: started
        detach: true
        networks:
          - name: "{{ backup_agent_network_name }}"
        healthcheck:
          # Filer port (8888), not S3 (8333) — same reasoning as
          # production's healthcheck: S3 now requires real signed
          # credentials (the identity config just added above), so an
          # unauthenticated check there would get rejected the same way
          # the backup upload did before this fix. Filer's root path
          # needs no S3-style signature auth, and S3 depends on filer
          # internally anyway, so it's still a meaningful proxy for "is
          # the whole stack actually up."
          # localhost doesn't reach it — SeaweedFS appears to bind its
          # listeners to its advertised/detected IP (needed for
          # master/filer/volume peer coordination), not loopback. The
          # container's own DNS-registered name resolves to that same
          # real IP via the network it's attached to, and does work.
          test: ["CMD", "wget", "-q", "--spider", "http://seaweedfs-test:8888/"]
          interval: 2s
          timeout: 2s
          retries: 3
          start_period: 2s

    # docker_container_info + .container.State.X is already proven
    # reliable in this test (the StartedAt checks in verify.yml), unlike
    # docker_container's one-off result shape under detach:false, which
    # turned out not to behave the way it was assumed to twice in a row.
    # .State.Health appears as soon as the container starts (status
    # "starting" initially) since a HEALTHCHECK is now configured, so
    # this doesn't have the same "field only exists sometimes" risk.
    - name: Wait for SeaweedFS to report healthy
      community.docker.docker_container_info:
        name: seaweedfs-test
      register: backup_agent_seaweedfs_info
      until: backup_agent_seaweedfs_info.container.State.Health.Status == 'healthy'
      retries: 15
      delay: 2

    # amazon/aws-cli's `s3 mb` needs to reach seaweedfs-test by name, so
    # this one-off container joins the same discovered network.
    - name: Create the test bucket in SeaweedFS ahead of time
      community.docker.docker_container:
        name: backup-agent-bucket-create
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_s3_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_s3_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: "--endpoint-url http://seaweedfs-test:8333 s3 mb s3://{{ offsite_backup_s3_bucket }}"
        detach: false
        cleanup: true
        output_logs: true
      register: backup_agent_bucket_create
      changed_when: false
      # seaweedfs-test (and its data volume) persists across the
      # idempotence re-run of this whole playbook, so the bucket
      # genuinely already exists the second time — that's expected, not
      # a real failure. Two real runs now (this one, and the earlier
      # "Could not connect" one) confirm .msg reliably carries the
      # module's error text, unlike .container.State — see the
      # readiness-check task above for why that one isn't trusted.
      failed_when: >-
        backup_agent_bucket_create is failed
        and 'BucketAlreadyExists' not in (backup_agent_bucket_create.msg | default(''))
