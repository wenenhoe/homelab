---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers, not a per-scenario copy
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"

    # --- backup_agent's own required global vars ---
    # A fast cron here (not production's 4am schedule) so verify.yml
    # doesn't wait until 4am for a real cron-triggered run — see the
    # note further down on why this has to be real cron and not a
    # manual trigger. Set as input to the role, not patched into its
    # output afterward: mutating a rendered file post-hoc would fight
    # the role's own idempotent re-render on every single converge run
    # (confirmed the hard way — an earlier version of this file did
    # exactly that via `ansible.builtin.replace` + a manual container
    # restart, and both permanently failed the `idempotence` step,
    # since the role would reset the file to this var's real value on
    # its next run, which the replace task would then "fix" again).
    offsite_backup_cron: "* * * * *"
    offsite_backup_retention_days: 7

    # A real SeaweedFS instance (started below) stands in for the actual
    # S3 target(s), with a real -s3.config identity, so this exercises
    # real upload/auth wiring, not just "the container is running". Two
    # target *keys* (seaweedfs, seaweedfs2) pointed at the SAME real
    # server/bucket — proves one app fanning out to multiple
    # cloud_targets produces multiple independent schedules/archives;
    # the provider-specific bits of R2/B2/OCI's real endpoints aren't
    # testable in CI without live credentials anyway (see
    # docs/disaster-recovery.md's manual-verification callouts for
    # those), so this only needs to prove the fan-out mechanism itself.
    molecule_test_bucket: molecule-test-backups
    cloud_backup_targets:
      seaweedfs:
        bucket: "{{ molecule_test_bucket }}"
        endpoint: "seaweedfs-test:8333"
        proto: http
        access_key: molecule-test-access-key
        secret_key: molecule-test-secret-key
      seaweedfs2:
        bucket: "{{ molecule_test_bucket }}"
        endpoint: "seaweedfs-test:8333"
        proto: http
        access_key: molecule-test-access-key
        secret_key: molecule-test-secret-key
    cloud_backup_default_targets: [seaweedfs]

    # happy_app_stop carries docker-volume-backup.stop-during-backup=
    # happy_app_stop on its own container and stop_during_backup: true
    # here — the pairing backup_agent's per-schedule stop label depends
    # on. happy_app_nostop carries neither, and fans out to BOTH cloud
    # targets (the multi-target case). happy_app_no_backup declares no
    # `backup:` key at all — mirrors real apps like caddy/beszel-agent/
    # diun, which coexist with backed-up apps: confirms the
    # normalization task's `when: ... | length > 0` skip branch actually
    # excludes it.
    app_registry:
      happy_app_stop:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
      happy_app_nostop:
        volumes:
          - name: data
        backup:
          volumes: [data]
          cloud_targets: [seaweedfs, seaweedfs2]
      happy_app_no_backup:
        volumes:
          - name: data
    compose_apps:
      - name: happy_app_stop
      - name: happy_app_nostop
      - name: happy_app_no_backup
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: bootstrap_docker.yaml

    - name: Install python3-requests (docker_container/docker_volume/docker_host_info talk to the API directly)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    # Mirrors Play 4 running before Play 5 in the real deploy.yaml —
    # backup_agent's compose.yaml references these apps' volumes as
    # `external: true`, requiring them to already exist.
    - name: Deploy the three synthetic "source" apps so their volumes/containers exist
      ansible.builtin.include_role:
        name: compose_app

    # Seeded before the role's own first run, standing in for a
    # schedule left over from an app/cloud_targets combination that
    # used to exist but doesn't anymore — the actual case the
    # stale-file-removal task in tasks/main.yaml exists to handle.
    # Without this, that task's loop is empty on every real run this
    # scenario exercises (nothing here ever changes app_registry
    # between runs), so its deletion behavior itself was never
    # actually observed to work — confirmed via molecule's coverage
    # report, which flagged exactly that gap. Guarded by a marker file
    # so this seeds exactly once, not on molecule's `idempotence`
    # re-run of this same converge.yml — reseeding there would give the
    # removal task real work on every run, which is a different way of
    # landing back in the same non-idempotent trap patch 4 already fixed.
    - name: Check whether the stale-file seed already ran (guards against reseeding on the idempotence re-run)
      ansible.builtin.stat:
        path: /tmp/backup_agent_molecule_stale_seed_done
      register: backup_agent_stale_seed_marker

    - name: Ensure backup-agent's conf.d directory exists to seed a stale file into (the role creates it too, but hasn't run yet)
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d"
        state: directory
        mode: "0755"
      when: not backup_agent_stale_seed_marker.stat.exists

    - name: Seed a stale schedule file predating this run, simulating a removed app/target
      ansible.builtin.copy:
        dest: "{{ compose_deploy_dir }}/backup-agent/conf.d/long_gone_app-seaweedfs.env"
        content: |
          AWS_S3_BUCKET_NAME=molecule-test-backups
          BACKUP_SOURCES=/backup/long_gone_app_data
        mode: "0600"
      when: not backup_agent_stale_seed_marker.stat.exists

    - name: Record that the seed ran, so the idempotence re-run of this file doesn't repeat it
      ansible.builtin.file:
        path: /tmp/backup_agent_molecule_stale_seed_done
        state: touch
        mode: "0644"
      when: not backup_agent_stale_seed_marker.stat.exists

    # The role under test. Runs before the SeaweedFS target below is even
    # started — its containers only reach AWS_ENDPOINT on cron/manual
    # trigger, not at startup, so this ordering is safe.
    - name: Run backup_agent
      ansible.builtin.include_role:
        name: backup_agent

    # backup_agent's compose stack (and its network) already exists by
    # now — discover it before creating seaweedfs-test, so it can be
    # attached at creation time rather than connected afterward.
    # SeaweedFS likely binds its listener to whichever address is
    # available at startup, so connecting a network later risks it never
    # picking up the new interface (looks like "connection refused" on an
    # otherwise correctly-resolved IP).
    - name: Discover the docker network backup_agent's compose stack created
      community.docker.docker_host_info:
        networks: true
      register: backup_agent_docker_networks

    - name: Extract its name
      ansible.builtin.set_fact:
        backup_agent_network_name: >-
          {{ backup_agent_docker_networks.networks
             | selectattr('Name', 'search', 'backup-agent-net')
             | map(attribute='Name') | list | first }}

    # --- Real S3 target for this scenario --------------------------------
    # See molecule_helpers/tasks/start_seaweedfs_test_target.yaml for what
    # this does and why. Attached to backup_agent's own network at
    # creation time, not connected afterward — see above.
    - name: Start a real SeaweedFS S3 target for this scenario
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_seaweedfs_test_target.yaml
      vars:
        molecule_helpers_seaweedfs_access_key: "{{ cloud_backup_targets.seaweedfs.access_key }}"
        molecule_helpers_seaweedfs_secret_key: "{{ cloud_backup_targets.seaweedfs.secret_key }}"
        molecule_helpers_seaweedfs_bucket: "{{ molecule_test_bucket }}"
        molecule_helpers_seaweedfs_network_name: "{{ backup_agent_network_name }}"

    # amazon/aws-cli's `s3 mb` needs to reach seaweedfs-test by name, so
    # this one-off container joins the same discovered network.
    - name: Create the test bucket in SeaweedFS ahead of time
      community.docker.docker_container:
        name: backup-agent-bucket-create
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ cloud_backup_targets.seaweedfs.access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ cloud_backup_targets.seaweedfs.secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: "--endpoint-url http://seaweedfs-test:8333 s3 mb s3://{{ molecule_test_bucket }}"
        detach: false
        cleanup: true
        output_logs: true
      register: backup_agent_bucket_create
      changed_when: false
      # seaweedfs-test (and its data volume) persists across the
      # idempotence re-run, so the bucket genuinely already exists the
      # second time. Tolerates both
      # BucketAlreadyExists and BucketAlreadyOwnedByYou.
      failed_when: >-
        backup_agent_bucket_create is failed
        and 'BucketAlreadyExists' not in (backup_agent_bucket_create.msg | default(''))
        and 'BucketAlreadyOwnedByYou' not in (backup_agent_bucket_create.msg | default(''))
