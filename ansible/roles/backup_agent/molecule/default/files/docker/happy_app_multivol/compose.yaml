name: happy_app_multivol
services:
  happy_app_multivol:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    container_name: happy_app_multivol
    volumes:
      - data:/data
      - certs:/certs
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  data:
    external: true
    name: happy_app_multivol_data
  certs:
    external: true
    name: happy_app_multivol_certs
