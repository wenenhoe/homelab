name: happy_app_multivol
services:
  happy_app_multivol:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: happy_app_multivol
    volumes:
      - data:/data
      - certs:/certs
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  data:
    external: true
    name: happy_app_multivol_data
  certs:
    external: true
    name: happy_app_multivol_certs
