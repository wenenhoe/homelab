name: happy_app_multivol
services:
  happy_app_multivol:
    image: alpine:3.24@sha256:ce9e1e6d23f04a0b7593445a062a9fc73ed52f8260b9396f77a958295ad18ee7
    container_name: happy_app_multivol
    volumes:
      - data:/data
      - certs:/certs
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  data:
    external: true
    name: happy_app_multivol_data
  certs:
    external: true
    name: happy_app_multivol_certs
