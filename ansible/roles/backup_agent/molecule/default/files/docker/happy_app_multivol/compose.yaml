name: happy_app_multivol
services:
  happy_app_multivol:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: happy_app_multivol
    volumes:
      - data:/data
      - certs:/certs
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  data:
    external: true
    name: happy_app_multivol_data
  certs:
    external: true
    name: happy_app_multivol_certs
