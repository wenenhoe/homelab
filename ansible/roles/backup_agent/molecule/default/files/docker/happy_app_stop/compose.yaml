name: happy_app_stop
services:
  happy_app_stop:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    container_name: happy_app_stop
    volumes:
      - data:/data
    command: [ "sh", "-c", "sleep infinity" ]
    labels:
      # Own name, not a shared `true` — see docker/kms/compose.yaml's
      # equivalent comment in the real repo for why.
      - docker-volume-backup.stop-during-backup=happy_app_stop
volumes:
  data:
    external: true
    name: happy_app_stop_data
