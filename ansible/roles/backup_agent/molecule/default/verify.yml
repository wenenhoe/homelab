---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
    molecule_test_bucket: molecule-test-backups
    seaweedfs_access_key: molecule-test-access-key
    seaweedfs_secret_key: molecule-test-secret-key
    # Must match converge.yml's own offsite_backup_freshness_hours —
    # this is a separate play, so that value isn't visible here
    # otherwise. Needed to know the exact rendered threshold to match
    # when forcing it down to 1ms later in verify_freshness_check.yml.
    offsite_backup_freshness_hours: 1
  # Split across files rather than one task list — this scenario's own
  # fixture setup (real cron-triggered backups, real S3 uploads) is too
  # expensive to duplicate across separate Molecule scenarios just for
  # organization, so the split happens here instead, within one
  # converge/verify cycle. All four still share this single play's
  # scope - a fact registered in one file (e.g. backup_agent_network_name
  # in verify_s3_and_gpg.yml) is still visible in files imported after
  # it, same as if this were still one file.
  tasks:
    - name: Structural checks — compose/schedule/env rendering is correct
      ansible.builtin.import_tasks: verify_compose_rendering.yml

    - name: Behavioral — per-schedule stop-label isolation
      ansible.builtin.import_tasks: verify_backup_behavior.yml

    - name: The actual point of all this — did every archive reach S3, encrypted?
      ansible.builtin.import_tasks: verify_s3_and_gpg.yml

    - name: Freshness check — liveness signal for Uptime Kuma
      ansible.builtin.import_tasks: verify_freshness_check.yml
