---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
    molecule_test_bucket: molecule-test-backups
    seaweedfs_access_key: molecule-test-access-key
    seaweedfs_secret_key: molecule-test-secret-key
  tasks:
    # --- Structural checks: rendering is correct -----------------------
    - name: Read back the rendered backup-agent compose.yaml
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/compose.yaml"
      register: backup_agent_compose_raw

    - name: Parse it
      ansible.builtin.set_fact:
        backup_agent_compose_parsed: "{{ backup_agent_compose_raw.content | b64decode | from_yaml }}"

    - name: Confirm the single backup-agent service was rendered, plus the proxy (a stop app is present)
      ansible.builtin.assert:
        that:
          - "'backup-agent' in backup_agent_compose_parsed.services"
          - "'backup-dockerproxy' in backup_agent_compose_parsed.services"
        fail_msg: "Expected services: {{ backup_agent_compose_parsed.services.keys() | list }}"

    - name: Confirm the one container mounts every backed-up app's volumes under its own per-app dir, not happy_app_no_backup's
      vars:
        backup_agent_mounted_volumes: "{{ backup_agent_compose_parsed.services['backup-agent'].volumes }}"
      ansible.builtin.assert:
        that:
          - "'happy_app_stop_data:/backup/happy_app_stop/happy_app_stop_data:ro' in backup_agent_mounted_volumes"
          - "'happy_app_nostop_data:/backup/happy_app_nostop/happy_app_nostop_data:ro' in backup_agent_mounted_volumes"
          - "'happy_app_multivol_data:/backup/happy_app_multivol/happy_app_multivol_data:ro' in backup_agent_mounted_volumes"
          - "'happy_app_multivol_certs:/backup/happy_app_multivol/happy_app_multivol_certs:ro' in backup_agent_mounted_volumes"
          - "'happy_app_no_backup_data:/backup/happy_app_no_backup/happy_app_no_backup_data:ro' not in backup_agent_mounted_volumes"
        fail_msg: >-
          happy_app_no_backup_data appeared despite declaring no backup: key
          — the normalization task's `when` guard isn't excluding it.

    # --- One schedule per app, always SeaweedFS ------------------------
    - name: List the rendered conf.d schedule files
      ansible.builtin.find:
        paths: "{{ compose_deploy_dir }}/backup-agent/conf.d"
      register: backup_agent_conf_d_files

    - name: Confirm exactly the expected schedules exist — no more, no fewer
      ansible.builtin.assert:
        that:
          - (backup_agent_conf_d_files.files | map(attribute='path') | map('basename') | sort) ==
            ['happy_app_multivol.env', 'happy_app_nostop.env', 'happy_app_precompressed.env', 'happy_app_stop.env']
        fail_msg: >-
          Expected happy_app_stop.env, happy_app_nostop.env,
          happy_app_multivol.env, happy_app_precompressed.env, and nothing
          for happy_app_no_backup. Got:
          {{ backup_agent_conf_d_files.files | map(attribute='path') | map('basename') | sort }}
          — if long_gone_app.env is still present, the stale-file-removal
          task (converge.yml seeds it before the role's first run to
          exercise exactly this) isn't actually deleting obsolete
          schedules anymore.

    - name: Read back happy_app_stop's schedule
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d/happy_app_stop.env"
      register: backup_agent_stop_schedule_raw

    - name: Confirm it's scoped to happy_app_stop's own dir and carries its own stop label
      ansible.builtin.assert:
        that:
          - "'BACKUP_SOURCES=/backup/happy_app_stop' in (backup_agent_stop_schedule_raw.content | b64decode)"
          - "'BACKUP_STOP_DURING_BACKUP_LABEL=happy_app_stop' in (backup_agent_stop_schedule_raw.content | b64decode)"

    - name: Read back happy_app_nostop's schedule
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d/happy_app_nostop.env"
      register: backup_agent_nostop_schedule_raw

    - name: Confirm it carries no stop label — happy_app_nostop must never be stopped by its own schedule
      ansible.builtin.assert:
        that:
          - "'BACKUP_STOP_DURING_BACKUP_LABEL=' not in (backup_agent_nostop_schedule_raw.content | b64decode)"
          - "'BACKUP_SOURCES=/backup/happy_app_nostop' in (backup_agent_nostop_schedule_raw.content | b64decode)"

    - name: Read back happy_app_multivol's schedule
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d/happy_app_multivol.env"
      register: backup_agent_multivol_schedule_raw

    - name: Confirm BACKUP_SOURCES is exactly one path with no space in it
      ansible.builtin.assert:
        that:
          - "'BACKUP_SOURCES=/backup/happy_app_multivol' in (backup_agent_multivol_schedule_raw.content | b64decode)"
          - "(backup_agent_multivol_schedule_raw.content | b64decode | regex_findall('BACKUP_SOURCES=(.*)'))[0] is not search(' ')"
        fail_msg: >-
          A space in BACKUP_SOURCES means docker-volume-backup lstats a
          single bogus multi-word path and every run fails — this is the
          actual bug this fixture exists to catch.

    - name: Confirm an app with no compression override still defaults to gz
      ansible.builtin.assert:
        that:
          - "'BACKUP_COMPRESSION=gz' in (backup_agent_multivol_schedule_raw.content | b64decode)"

    - name: Read back happy_app_precompressed's schedule
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d/happy_app_precompressed.env"
      register: backup_agent_precompressed_schedule_raw

    - name: Confirm its compression:none override reached BACKUP_COMPRESSION, and its filename template uses the .Extension verb rather than a hardcoded .tar.gz
      ansible.builtin.assert:
        that:
          - "'BACKUP_COMPRESSION=none' in (backup_agent_precompressed_schedule_raw.content | b64decode)"
          - >-
            (backup_agent_precompressed_schedule_raw.content | b64decode
            | regex_findall('BACKUP_FILENAME=(.*)'))[0]
            is search('\{\{ .Extension \}\}\s*$')
        fail_msg: >-
          Expected BACKUP_COMPRESSION=none and a BACKUP_FILENAME ending in
          the literal `{{ '{{' }} .Extension {{ '}}' }}` verb (not a
          hardcoded .tar.gz) — otherwise this app's archive would be named
          .tar.gz while actually being an uncompressed tar, which breaks
          any manual or scripted decrypt+extract. Got:
          {{ backup_agent_precompressed_schedule_raw.content | b64decode }}

    # --- Shared env carries only what's actually shared -----------------
    - name: Read back the shared env file
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/.env"
      register: backup_agent_shared_env_raw

    - name: Confirm it carries DOCKER_HOST (a stop app is present) and nothing schedule-specific
      ansible.builtin.assert:
        that:
          - "'DOCKER_HOST=tcp://backup-agent-dockerproxy:2375' in (backup_agent_shared_env_raw.content | b64decode)"
          - "'AWS_S3_BUCKET_NAME' not in (backup_agent_shared_env_raw.content | b64decode)"
          - "'BACKUP_STOP_DURING_BACKUP_LABEL=' not in (backup_agent_shared_env_raw.content | b64decode)"

    - name: Confirm the Telegram notification URL was rendered from the role's own vars, not left as a template literal
      ansible.builtin.assert:
        that:
          - >-
            'NOTIFICATION_URLS=telegram://123456789:molecule-dummy-token@telegram?chats=molecule-dummy-chat-id'
            in (backup_agent_shared_env_raw.content | b64decode)

    # --- Both containers actually came up --------------------------------
    - name: Confirm the backup-agent and dockerproxy containers are running
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          name: "{{ item }}"
      register: backup_agent_containers
      failed_when: backup_agent_containers.containers | length == 0
      loop:
        - backup-agent
        - backup-agent-dockerproxy

    # --- Behavioral: per-schedule stop-label isolation --------------------
    # The load-bearing assumption behind collapsing to one container:
    # BACKUP_STOP_DURING_BACKUP_LABEL is matched per schedule file, not
    # once for the whole container. Confirmed live by hand before this
    # test existed (see docs/disaster-recovery.md's Architecture
    # section) — this codifies that check so it can't silently regress
    # on an image version bump.
    - name: Capture happy_app_stop's StartedAt BEFORE any cron-triggered backup
      community.docker.docker_container_info:
        name: happy_app_stop
      register: backup_agent_stop_before

    - name: Discover happy_app_nostop's container id BEFORE (no fixed container_name anymore — see molecule_helpers/fixtures/generic_alpine_app_with_volume)
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label: "com.docker.compose.project=happy_app_nostop"
      register: backup_agent_nostop_lookup_before
      failed_when: backup_agent_nostop_lookup_before.containers | length != 1

    - name: Capture happy_app_nostop's StartedAt BEFORE any cron-triggered backup
      community.docker.docker_container_info:
        name: "{{ backup_agent_nostop_lookup_before.containers[0].Id }}"
      register: backup_agent_nostop_before

    # Real cron (every minute, test-only — see converge.yml), not a
    # manual trigger: v2's manual-trigger CLI has no way to target one
    # specific conf.d schedule, confirmed live (`backup --config-file
    # ...` isn't a real flag), and cron is the actual code path
    # production runs anyway.
    - name: Wait for the test cron to stop+restart happy_app_stop (its own schedule firing)
      community.docker.docker_container_info:
        name: happy_app_stop
      register: backup_agent_stop_after
      until: backup_agent_stop_after.container.State.StartedAt != backup_agent_stop_before.container.State.StartedAt
      retries: 20
      delay: 5

    - name: Discover happy_app_nostop's container id AFTER
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label: "com.docker.compose.project=happy_app_nostop"
      register: backup_agent_nostop_lookup_after
      failed_when: backup_agent_nostop_lookup_after.containers | length != 1

    - name: Capture happy_app_nostop's StartedAt again, after happy_app_stop's schedule fired
      community.docker.docker_container_info:
        name: "{{ backup_agent_nostop_lookup_after.containers[0].Id }}"
      register: backup_agent_nostop_after

    - name: Confirm isolation — happy_app_stop restarted, happy_app_nostop was never touched
      ansible.builtin.assert:
        that:
          - backup_agent_nostop_after.container.State.StartedAt == backup_agent_nostop_before.container.State.StartedAt
        fail_msg: >-
          happy_app_nostop's StartedAt changed (before=
          {{ backup_agent_nostop_before.container.State.StartedAt }}, after=
          {{ backup_agent_nostop_after.container.State.StartedAt }}) even
          though only happy_app_stop's own schedule fired — a schedule
          backing up one app must never stop a container sharing this
          container that wasn't labeled for that app's own schedule.

    # --- The actual point of all this: did every archive really reach S3? ---
    - name: Discover the docker network backup_agent's compose stack created
      community.docker.docker_host_info:
        networks: true
      register: backup_agent_docker_networks

    - name: Extract its name
      ansible.builtin.set_fact:
        backup_agent_network_name: >-
          {{ backup_agent_docker_networks.networks
             | selectattr('Name', 'search', 'backup-agent-net')
             | map(attribute='Name') | list | first }}

    - name: List objects uploaded to the test SeaweedFS bucket, waiting for both schedules
      community.docker.docker_container:
        name: backup-agent-s3-listing
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: "--endpoint-url http://seaweedfs-test:8333 s3 ls s3://{{ molecule_test_bucket }} --recursive"
        detach: false
        cleanup: true
        output_logs: true
      register: backup_agent_s3_listing
      changed_when: false
      until: >-
        ('backup-agent-instance-happy_app_stop-' in backup_agent_s3_listing.container.Output)
        and ('backup-agent-instance-happy_app_nostop-' in backup_agent_s3_listing.container.Output)
        and ('backup-agent-instance-happy_app_multivol-' in backup_agent_s3_listing.container.Output)
        and ('backup-agent-instance-happy_app_precompressed-' in backup_agent_s3_listing.container.Output)
      retries: 12
      delay: 10

    - name: Confirm all expected archives reached S3, including the multi-volume and precompressed apps'
      ansible.builtin.assert:
        that:
          - "'backup-agent-instance-happy_app_stop-' in backup_agent_s3_listing.container.Output"
          - "'backup-agent-instance-happy_app_nostop-' in backup_agent_s3_listing.container.Output"
          - "'backup-agent-instance-happy_app_multivol-' in backup_agent_s3_listing.container.Output"
          - "'backup-agent-instance-happy_app_precompressed-' in backup_agent_s3_listing.container.Output"
        fail_msg: >-
          Expected archives for happy_app_stop, happy_app_nostop,
          happy_app_multivol, and happy_app_precompressed. A missing
          happy_app_multivol archive means its BACKUP_SOURCES run failed;
          a missing happy_app_precompressed archive means its
          BACKUP_COMPRESSION=none run failed — both are the actual bugs
          this fixture exists to catch. Listing:
          {{ backup_agent_s3_listing.container.Output }}

    # Static template text (checked above) only proves the schedule *asked*
    # for no compression — this proves docker-volume-backup actually
    # produced an uncompressed archive, by checking the real object name
    # ls returned rather than assuming BACKUP_FILENAME's .Extension verb
    # resolved the way the docs say it does.
    - name: Confirm happy_app_precompressed's actual uploaded object is a plain .tar.gpg, not .tar.gz.gpg
      ansible.builtin.assert:
        that:
          - >-
            backup_agent_s3_listing.container.Output
            | regex_findall('backup-agent-instance-happy_app_precompressed-\S+')
            | select('search', '\.tar\.gpg$')
            | list | length > 0
          - >-
            backup_agent_s3_listing.container.Output
            | regex_findall('backup-agent-instance-happy_app_precompressed-\S+')
            | select('search', '\.tar\.gz\.gpg$')
            | list | length == 0
        fail_msg: >-
          Expected happy_app_precompressed's uploaded object to end in
          .tar.gpg (BACKUP_COMPRESSION=none, then GPG's own .gpg suffix on
          top), not .tar.gz.gpg — otherwise the filename lies about the
          archive's actual format. Listing:
          {{ backup_agent_s3_listing.container.Output }}

    # --- Encryption: a file existing in S3 says nothing about whether it's
    # actually encrypted — this is the check that would have caught
    # GPG_PUBLIC_KEY_FILE (wrong var name, silently ignored, encryption
    # never engaged) instead of just landing archives in S3 unencrypted. ---
    - name: Create a scratch volume to move the downloaded archive between containers
      community.docker.docker_volume:
        name: backup-agent-gpg-check-scratch
        state: present

    - name: Start a persistent aws-cli utility container to list+download the archive in
      community.docker.docker_container:
        name: backup-agent-gpg-aws
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        volumes:
          - backup-agent-gpg-check-scratch:/scratch
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        entrypoint: ["sleep"]
        command: ["infinity"]
        state: started
        detach: true

    # Re-listing and downloading in one shell invocation (rather than reusing
    # the key captured by the earlier listing task, further up this file)
    # keeps the gap between "find the key" and "use the key" as small as
    # possible. Wrapped in until/retries via docker_container_exec — unlike
    # docker_container with detach:false, this returns a normal .rc instead
    # of hard-crashing the play on the first nonzero exit, so a transient
    # miss (upload/listing propagation lag) gets retried instead of failing
    # the whole run outright.
    - name: List the current newest happy_app_nostop archive and download it, retrying to absorb any propagation lag
      community.docker.docker_container_exec:
        container: backup-agent-gpg-aws
        command: >-
          sh -c "
          key=$(aws --endpoint-url http://seaweedfs-test:8333 s3api list-objects-v2
          --bucket {{ molecule_test_bucket }}
          --prefix backup-agent-instance-happy_app_nostop/
          --query 'sort_by(Contents,&LastModified)[-1].Key' --output text) &&
          aws --endpoint-url http://seaweedfs-test:8333 s3 cp
          s3://{{ molecule_test_bucket }}/$key /scratch/archive.tar.gz
          "
      register: backup_agent_gpg_download
      changed_when: false
      until: backup_agent_gpg_download.rc == 0
      retries: 6
      delay: 5

    - name: Fail with the actual aws-cli output if the download never succeeded
      ansible.builtin.assert:
        that:
          - backup_agent_gpg_download.rc == 0
        fail_msg: >-
          Never managed to list+download a happy_app_nostop archive after
          retrying. stdout: {{ backup_agent_gpg_download.stdout }}
          stderr: {{ backup_agent_gpg_download.stderr }}

    - name: Remove the aws-cli utility container
      community.docker.docker_container:
        name: backup-agent-gpg-aws
        state: absent

    - name: Start a persistent utility container to inspect the downloaded archive in
      community.docker.docker_container:
        name: backup-agent-gpg-check
        image: alpine:3.20
        volumes:
          - backup-agent-gpg-check-scratch:/scratch:ro
        entrypoint: ["sleep"]
        command: ["infinity"]
        state: started
        detach: true

    - name: Confirm the downloaded file is non-empty (rules out an empty/failed download masquerading as an encryption failure below)
      community.docker.docker_container_exec:
        container: backup-agent-gpg-check
        command: "test -s /scratch/archive.tar.gz"
      register: backup_agent_gpg_size_check
      changed_when: false
      failed_when: backup_agent_gpg_size_check.rc != 0

    # docker_container with detach:false hard-crashes the whole play on ANY
    # nonzero exit (same gotcha converge.yml's bucket-create step hits).
    # docker_container_exec avoids that hard crash, but its default
    # failed_when still fails the task itself on nonzero rc — same as
    # converge.yml's bucket-create task, which carries its own explicit
    # failed_when for the same reason. Needed here because a nonzero
    # exit is the EXPECTED, passing outcome; the real pass/fail check is
    # the assert below, not this task.
    - name: Attempt to list the downloaded archive as a plain tar.gz — this must FAIL if it's really GPG-encrypted
      community.docker.docker_container_exec:
        container: backup-agent-gpg-check
        command: "tar -tzf /scratch/archive.tar.gz"
      register: backup_agent_gpg_tar_check
      changed_when: false
      failed_when: false

    - name: Confirm the archive is NOT a readable plain tar.gz (i.e. it really is GPG-encrypted)
      ansible.builtin.assert:
        that:
          - backup_agent_gpg_tar_check.rc != 0
        fail_msg: >-
          `tar -tzf` successfully listed the downloaded archive's contents
          ({{ backup_agent_gpg_tar_check.stdout }}), meaning it's a plain,
          unencrypted tar.gz — GPG encryption isn't actually engaging.
          Check the env var name backup_agent's shared .env renders for
          the public keyring against
          https://offen.github.io/docker-volume-backup/reference/.

    - name: Remove the gpg-check utility container
      community.docker.docker_container:
        name: backup-agent-gpg-check
        state: absent

    - name: Remove the scratch volume
      community.docker.docker_volume:
        name: backup-agent-gpg-check-scratch
        state: absent
