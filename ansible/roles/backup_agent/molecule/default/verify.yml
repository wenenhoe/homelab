---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
    offsite_backup_s3_bucket: molecule-test-backups
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key
  tasks:
    # --- Structural checks: the aggregation actually grouped things right ---
    - name: Read back the rendered backup-agent compose.yaml
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/compose.yaml"
      register: backup_agent_compose_raw

    - name: Parse it
      ansible.builtin.set_fact:
        backup_agent_compose_parsed: "{{ backup_agent_compose_raw.content | b64decode | from_yaml }}"

    - name: Confirm all three services were rendered (proxy + both groups)
      ansible.builtin.assert:
        that:
          - "'backup-dockerproxy' in backup_agent_compose_parsed.services"
          - "'backup-stop-group' in backup_agent_compose_parsed.services"
          - "'backup-no-stop-group' in backup_agent_compose_parsed.services"
        fail_msg: "Expected services: {{ backup_agent_compose_parsed.services.keys() | list }}"

    - name: Confirm each group mounts the RIGHT app's volume, not the other one's
      ansible.builtin.assert:
        that:
          - "'happy_app_stop_data:/backup/happy_app_stop_data:ro' in backup_agent_compose_parsed.services['backup-stop-group'].volumes"
          - "'happy_app_nostop_data:/backup/happy_app_nostop_data:ro' in backup_agent_compose_parsed.services['backup-no-stop-group'].volumes"
          - "'happy_app_nostop_data:/backup/happy_app_nostop_data:ro' not in backup_agent_compose_parsed.services['backup-stop-group'].volumes"
          - "'happy_app_stop_data:/backup/happy_app_stop_data:ro' not in backup_agent_compose_parsed.services['backup-no-stop-group'].volumes"

    # happy_app_no_backup declares no `backup:` key at all (mirrors
    # caddy/beszel-agent/diun on every real host) — confirms the
    # normalization task's skip branch actually excludes it, not just
    # that the run didn't error with it present.
    - name: Confirm happy_app_no_backup is excluded from BOTH groups entirely
      ansible.builtin.assert:
        that:
          - "'happy_app_no_backup_data:/backup/happy_app_no_backup_data:ro' not in backup_agent_compose_parsed.services['backup-stop-group'].volumes"
          - "'happy_app_no_backup_data:/backup/happy_app_no_backup_data:ro' not in backup_agent_compose_parsed.services['backup-no-stop-group'].volumes"
        fail_msg: >-
          happy_app_no_backup_data appeared in a backup-agent group despite
          declaring no backup: key — the normalization task's `when` guard
          isn't actually excluding apps without backup.volumes.

    # --- All three containers actually came up -------------------------------
    - name: Confirm the backup-agent containers are running
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          name: "{{ item }}"
      register: backup_agent_containers
      failed_when: backup_agent_containers.containers | length == 0
      loop:
        - backup-agent-dockerproxy
        - backup-agent-stop-group
        - backup-agent-no-stop-group

    # --- Env files rendered with the right content per group ----------------
    - name: Read back the stop-group env file
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/.env.stop-group"
      register: backup_agent_stop_env_raw

    - name: Read back the no-stop-group env file
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/.env.no-stop-group"
      register: backup_agent_no_stop_env_raw

    - name: Confirm the stop-group env carries the stop label + docker proxy host
      ansible.builtin.assert:
        that:
          - "'BACKUP_STOP_DURING_BACKUP_LABEL=true' in (backup_agent_stop_env_raw.content | b64decode)"
          - "'DOCKER_HOST=tcp://backup-agent-dockerproxy:2375' in (backup_agent_stop_env_raw.content | b64decode)"

    - name: Confirm the no-stop-group env carries NEITHER of those
      ansible.builtin.assert:
        that:
          - "'BACKUP_STOP_DURING_BACKUP_LABEL' not in (backup_agent_no_stop_env_raw.content | b64decode)"
          - "'DOCKER_HOST' not in (backup_agent_no_stop_env_raw.content | b64decode)"

    # --- Behavioral check: does stop-during-backup actually stop/restart? ---
    # StartedAt changing is direct evidence the container was actually
    # stopped and restarted, not just that a label exists in a file.
    - name: Capture happy_app_stop's StartedAt BEFORE triggering a backup
      community.docker.docker_container_info:
        name: happy_app_stop
      register: backup_agent_happy_app_stop_before

    - name: Capture happy_app_nostop's StartedAt BEFORE triggering a backup
      community.docker.docker_container_info:
        name: happy_app_nostop
      register: backup_agent_happy_app_nostop_before

    - name: Manually trigger the stop-group backup (bypasses waiting for cron)
      community.docker.docker_container_exec:
        container: backup-agent-stop-group
        command: backup
      register: backup_agent_stop_group_run

    - name: Manually trigger the no-stop-group backup
      community.docker.docker_container_exec:
        container: backup-agent-no-stop-group
        command: backup
      register: backup_agent_no_stop_group_run

    - name: Confirm both manual backup runs actually succeeded
      ansible.builtin.assert:
        that:
          - backup_agent_stop_group_run.rc == 0
          - backup_agent_no_stop_group_run.rc == 0
        fail_msg: >-
          stop-group rc={{ backup_agent_stop_group_run.rc }}
          stderr={{ backup_agent_stop_group_run.stderr }}
          no-stop-group rc={{ backup_agent_no_stop_group_run.rc }}
          stderr={{ backup_agent_no_stop_group_run.stderr }}

    - name: Capture happy_app_stop's StartedAt AFTER
      community.docker.docker_container_info:
        name: happy_app_stop
      register: backup_agent_happy_app_stop_after

    - name: Capture happy_app_nostop's StartedAt AFTER
      community.docker.docker_container_info:
        name: happy_app_nostop
      register: backup_agent_happy_app_nostop_after

    - name: Confirm happy_app_stop was actually stopped+restarted (StartedAt changed)
      ansible.builtin.assert:
        that:
          - backup_agent_happy_app_stop_before.container.State.StartedAt != backup_agent_happy_app_stop_after.container.State.StartedAt
        fail_msg: >-
          happy_app_stop's StartedAt did not change
          ({{ backup_agent_happy_app_stop_before.container.State.StartedAt }}) — the
          stop-during-backup group did not actually stop it.

    - name: Confirm happy_app_nostop was NEVER touched (StartedAt unchanged)
      ansible.builtin.assert:
        that:
          - backup_agent_happy_app_nostop_before.container.State.StartedAt == backup_agent_happy_app_nostop_after.container.State.StartedAt
        fail_msg: >-
          happy_app_nostop's StartedAt changed — the no-stop group should
          never stop any container.

    # --- The actual point of all this: did the archive really reach S3? ----
    - name: Discover the docker network backup_agent's compose stack created
      community.docker.docker_host_info:
        networks: true
      register: backup_agent_docker_networks

    - name: Extract its name
      ansible.builtin.set_fact:
        backup_agent_network_name: >-
          {{ backup_agent_docker_networks.networks
             | selectattr('Name', 'search', 'backup-agent-net')
             | map(attribute='Name') | list | first }}

    - name: List objects uploaded to the test SeaweedFS bucket
      community.docker.docker_container:
        name: backup-agent-s3-listing
        image: amazon/aws-cli:2.15.0
        networks:
          - name: "{{ backup_agent_network_name }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_s3_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_s3_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: "--endpoint-url http://seaweedfs-test:8333 s3 ls s3://{{ offsite_backup_s3_bucket }} --recursive"
        detach: false
        cleanup: true
        output_logs: true
      register: backup_agent_s3_listing
      changed_when: false

    - name: Confirm an object exists for the stop-group's S3 path
      ansible.builtin.assert:
        that:
          - "'backup-agent-instance-stop-group' in backup_agent_s3_listing.container.Output"
        fail_msg: >-
          No object found under the stop-group's S3 path — the upload
          didn't reach SeaweedFS. Listing:
          {{ backup_agent_s3_listing.container.Output }}

    - name: Confirm an object exists for the no-stop-group's S3 path
      ansible.builtin.assert:
        that:
          - "'backup-agent-instance-no-stop-group' in backup_agent_s3_listing.container.Output"
        fail_msg: >-
          No object found under the no-stop-group's S3 path — the upload
          didn't reach SeaweedFS. Listing:
          {{ backup_agent_s3_listing.container.Output }}
