---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers rather than a per-scenario
    # copy.
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"

    # env.j2 now renders NOTIFICATION_URLS from these — see
    # docs/telegram-notifications.md.
    # Must be digits:alnum-shaped — see default scenario's converge.yml
    # for why (shoutrrr's own token validation, not this repo's).
    telegram_token: "123456789:molecule-dummy-token"
    telegram_chatid_backups: "molecule-dummy-chat-id"
    # telegram_notify's install.yaml also needs this — see default
    # scenario's converge.yml for why it's separate from
    # telegram_chatid_backups above.
    telegram_chat_id: "molecule-dummy-chat-id"
    # telegram_notify's install.yaml (included from backup_agent's own
    # tasks/main.yaml, for freshness-check failures) needs this — see
    # default scenario's converge.yml for why it's separate from
    # telegram_chatid_backups above.
    telegram_topic_id_backups: ""

    # backup_agent's global vars are still required to render env/conf.d
    # files, even though nothing here ever reaches an S3 target — no
    # cron fires, and verify.yml doesn't trigger a backup (upload
    # mechanics already covered by the `default` scenario).
    offsite_backup_cron: "0 4 * * *"
    offsite_backup_retention_days: 7
    offsite_backup_s3_bucket: molecule-test-backups
    offsite_backup_s3_endpoint: "unused-in-this-scenario:8333"
    offsite_backup_s3_proto: http
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key

    # check-freshness.sh.j2 needs these too — rendered unconditionally,
    # regardless of the stop-apps branch this scenario exists to test.
    # Left blank: this scenario doesn't trigger a check run either, same
    # as it doesn't trigger a backup (see the comment below).
    offsite_backup_freshness_hours: 26
    backup_freshness_push_url: ""

    # The one app on this host declares no stop_during_backup at all —
    # the shape no current real host has (services/security both have
    # at least one stop app), but the remaining untested branch:
    # backup_agent_any_stop_apps ends up false.
    app_registry:
      happy_app_solo_nostop:
        volumes:
          - name: data
        backup:
          volumes: [data]
    compose_apps:
      - name: happy_app_solo_nostop
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Deploy the synthetic "source" app so its volume/container exists
      ansible.builtin.include_role:
        name: compose_app

    - name: Run backup_agent
      ansible.builtin.include_role:
        name: backup_agent
