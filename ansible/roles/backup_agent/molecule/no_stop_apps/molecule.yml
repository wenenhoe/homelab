---
# The one conditional left in compose.yaml.j2 after collapsing to a
# single container: whether backup-dockerproxy (and DOCKER_HOST) render
# at all, gated on whether any app on the host opted into
# stop_during_backup. `default` already proves the proxy renders when
# needed (happy_app_stop); this proves it's entirely absent — not just
# unused — when nothing does. Skips SeaweedFS/S3: this tests rendering
# correctness under the shape, not upload mechanics already proven by
# `default`.
driver:
  name: docker
platforms:
  - name: backup-agent-no-stop-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
