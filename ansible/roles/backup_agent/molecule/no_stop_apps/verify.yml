---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
  tasks:
    - name: Read back the rendered backup-agent compose.yaml
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/compose.yaml"
      register: backup_agent_compose_raw

    - name: Parse it
      ansible.builtin.set_fact:
        backup_agent_compose_parsed: "{{ backup_agent_compose_raw.content | b64decode | from_yaml }}"

    - name: Confirm ONLY backup-agent was rendered — the proxy is entirely absent, not just unused
      ansible.builtin.assert:
        that:
          - "'backup-agent' in backup_agent_compose_parsed.services"
          - "'backup-dockerproxy' not in backup_agent_compose_parsed.services"
        fail_msg: >-
          Expected only backup-agent. Got:
          {{ backup_agent_compose_parsed.services.keys() | list }}

    - name: Confirm the shared env has no DOCKER_HOST — nothing here needs the proxy
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/.env"
      register: backup_agent_env_raw

    - name: Assert on it
      ansible.builtin.assert:
        that:
          - "'DOCKER_HOST' not in (backup_agent_env_raw.content | b64decode)"
          - "'NOTIFICATION_URLS=telegram://123456789:molecule-dummy-token@telegram?chats=molecule-dummy-chat-id' in (backup_agent_env_raw.content | b64decode)"

    - name: Confirm the one schedule carries no stop label
      ansible.builtin.slurp:
        path: "{{ compose_deploy_dir }}/backup-agent/conf.d/happy_app_solo_nostop.env"
      register: backup_agent_schedule_raw

    - name: Assert on it
      ansible.builtin.assert:
        that:
          - "'BACKUP_STOP_DURING_BACKUP_LABEL=' not in (backup_agent_schedule_raw.content | b64decode)"

    - name: Confirm backup-agent is running and no dockerproxy container exists at all
      community.docker.docker_host_info:
        containers: true
        containers_all: true
        containers_filters:
          name: backup-agent
      register: backup_agent_no_stop_containers

    - name: Extract the set of running/existing backup-agent-related container names
      ansible.builtin.set_fact:
        backup_agent_no_stop_names: >-
          {{ backup_agent_no_stop_containers.containers
             | map(attribute='Names') | flatten | list }}

    - name: Assert exactly the expected container set
      ansible.builtin.assert:
        that:
          - backup_agent_no_stop_names | select('search', '^/backup-agent$') | list | length == 1
          - backup_agent_no_stop_names | select('search', 'backup-agent-dockerproxy') | list | length == 0
        fail_msg: "Expected only /backup-agent, no dockerproxy. Got: {{ backup_agent_no_stop_names }}"

    # --- Freshness check renders even without the dockerproxy branch ----
    # Light touch only — full behavioral coverage (real trigger, real S3
    # target, both branches) lives in the default scenario. This just
    # confirms the mechanism doesn't implicitly depend on
    # backup_agent_any_stop_apps being true.
    - name: Stat the freshness-check files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: backup_agent_no_stop_freshness_files
      loop:
        - "{{ compose_deploy_dir }}/backup-agent/check-freshness.sh"
        - /etc/systemd/system/check-freshness.service
        - /etc/systemd/system/check-freshness.timer

    - name: Confirm they all exist
      ansible.builtin.assert:
        that:
          - backup_agent_no_stop_freshness_files.results | map(attribute='stat.exists') | list == [true, true, true]
