---
# Same Docker-in-Docker setup as the other scenarios. No SeaweedFS/S3
# target here — this scenario tests whether backup_agent renders
# correctly when the stop-during-backup group is entirely empty (the
# shape `play` actually runs today: only minecraft, no stop-group at
# all), not the upload/stop-restart mechanics — those are already
# covered by the `default` scenario. Duplicating that whole S3 round
# trip here would just re-prove already-proven mechanics under a
# different registry shape.
driver:
  name: docker
platforms:
  - name: backup-agent-no-stop-only-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
