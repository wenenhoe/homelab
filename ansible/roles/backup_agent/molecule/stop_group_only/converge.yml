---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers rather than a per-scenario
    # copy.
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    server_timezone: "Etc/UTC"

    # backup_agent's global vars are still required to render env files,
    # even though nothing in this scenario actually reaches SeaweedFS —
    # no cron fires, and verify.yml never manually triggers a backup
    # here (that mechanic is already covered by the `default` scenario).
    offsite_backup_s3_bucket: molecule-test-backups
    offsite_backup_s3_endpoint: "unused-in-this-scenario:8333"
    offsite_backup_s3_proto: "http"
    offsite_backup_cron: "0 4 * * *"
    offsite_backup_retention_days: 7
    seaweedfs_s3_access_key: molecule-test-access-key
    seaweedfs_s3_secret_key: molecule-test-secret-key

    # Only one app, in the stop-during-backup group — the mirror image
    # of no_stop_group_only. No current host actually has this shape
    # (services/security have both groups populated), but it's the
    # remaining untested branch: backup_agent_no_stop_group ends up
    # empty here, which no other scenario exercises.
    app_registry:
      happy_app_solo_stop:
        volumes:
          - name: data
        backup:
          volumes: [data]
          stop_during_backup: true
    compose_apps:
      - name: happy_app_solo_stop
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: bootstrap_docker.yaml

    - name: Install python3-requests (docker_container/docker_volume/docker_host_info talk to the API directly)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Deploy the synthetic "source" app so its volume/container exists
      ansible.builtin.include_role:
        name: compose_app

    - name: Run backup_agent
      ansible.builtin.include_role:
        name: backup_agent
