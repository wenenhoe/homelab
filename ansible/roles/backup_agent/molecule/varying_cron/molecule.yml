---
# Same lightweight, no-Docker-in-Docker shape as secrets/manual_missing
# and backup_agent's own build_schedules.yaml computation — this
# scenario only exercises pure set_fact/assert tasks (schedule
# normalization plus the cron_period_hours filter), never Docker or the
# rest of the role.
driver:
  name: docker
platforms:
  - name: backup-agent-varying-cron-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
