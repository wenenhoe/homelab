---
# Extracted from main.yaml so this pure computation (no Docker, no side
# effects) is separately includable - see molecule/varying_cron for why:
# it lets that scenario exercise the real normalization/derivation logic
# directly, with no DinD/SeaweedFS infra needed at all.
#
# Any app_registry entry may declare:
#   backup:
#     volumes: [data, certs, ...]      # which volumes to back up
#     stop_during_backup: true|false   # default false
#     retention_days: N                # override of offsite_backup_retention_days
#     cron: "..."                      # override of offsite_backup_cron
#     compression: gz|zst|none         # default "gz"; use "none" when the
#                                       # source volume is already compressed
#
# No separate freshness_hours field - see the "Build the flat list of
# per-app schedules" task below for why one isn't needed.

- name: Reset normalized backup candidate list
  ansible.builtin.set_fact:
    backup_agent_normalized: []

- name: Normalize each app's backup settings (fill in global defaults)
  ansible.builtin.set_fact:
    backup_agent_normalized: >-
      {{
        backup_agent_normalized + [{
          'name': item.name,
          'volumes': item.backup.volumes,
          'stop_during_backup': item.backup.stop_during_backup | default(false),
          'retention_days': item.backup.retention_days | default(offsite_backup_retention_days),
          'cron': item.backup.cron | default(offsite_backup_cron),
          'compression': item.backup.compression | default('gz'),
        }]
      }}
  loop: "{{ compose_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.backup.volumes | default([])) | length > 0

- name: Skip this host entirely — no app here declares any backup volumes
  ansible.builtin.meta: end_host
  when: backup_agent_normalized | length == 0

- name: Note whether any app on this host needs stopping during its own backup
  ansible.builtin.set_fact:
    backup_agent_any_stop_apps: "{{ backup_agent_normalized | selectattr('stop_during_backup') | list | length > 0 }}"

# One dict per app: {app, source, retention, cron, compression,
# stop_label, filename, freshness_hours}. stop_label is '' (template
# omits the line) unless that app opted into stop_during_backup.
# `source` is singular and always one path: BACKUP_SOURCES takes
# exactly one directory, never a list, so every app's volumes are
# mounted under one shared parent dir (compose.yaml.j2) instead of
# being passed as separate sources.
#
# freshness_hours is derived from this same app's own cron (the
# cron_period_hours filter, this role's own filter_plugins/), not a
# separately declared field - a hand-set value here could silently
# drift out of sync the moment cron changes and nobody remembers to
# update both; a derived one can't, because there is nothing second to
# forget. See check-freshness.sh.j2 for where this is consumed.
- name: Build the flat list of per-app schedules
  ansible.builtin.set_fact:
    backup_agent_schedules: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for app in backup_agent_normalized -%}
        {%- set _ = ns.out.append({
              'app': app.name,
              'source': '/backup/' ~ app.name,
              'retention': app.retention_days,
              'cron': app.cron,
              'compression': app.compression,
              'stop_label': app.name if app.stop_during_backup else '',
              'filename': app.name ~ '.env',
              'freshness_hours': (app.cron | cron_period_hours) + offsite_backup_freshness_buffer_hours,
            }) -%}
      {%- endfor -%}
      {{ ns.out }}
