---
# Aggregates SeaweedFS backup targets across every app on this host
# (compose_apps is already resolved per-host by Play 1's preinit). See
# docs/disaster-recovery.md (Architecture) for the full design,
# including why cloud coverage (R2/B2/OCI) lives entirely on `storage`
# (cloud_sync role) and never touches this role or these hosts at all —
# a compromised app host holds only its own narrow, path-scoped
# SeaweedFS write credential (docker/seaweedfs/configs/s3-identity.json.j2),
# never anything cloud-capable.
#
# Any app_registry entry may declare:
#   backup:
#     volumes: [data, certs, ...]      # which volumes to back up
#     stop_during_backup: true|false   # default false
#     retention_days: N                # override of offsite_backup_retention_days
#     cron: "..."                      # override of offsite_backup_cron
#     compression: gz|zst|none         # default "gz"; use "none" when the
#                                       # source volume is already compressed
#
# One docker-volume-backup schedule per app, all sharing one container
# per host. BACKUP_STOP_DURING_BACKUP_LABEL is matched per schedule
# file, not once for the whole container — a schedule backing up app A
# never stops app B regardless of what else shares this container.
# Every stop_during_backup:true app's own compose.yaml carries
# `docker-volume-backup.stop-during-backup=<app-name>` (its own name,
# not a shared `true`) so each app's schedule can target only itself.
#
# A host with zero qualifying apps (e.g. `storage`) is skipped entirely.

- name: Set backup-agent directory facts
  ansible.builtin.set_fact:
    backup_agent_deploy_dir: "{{ compose_deploy_dir }}/backup-agent"

- name: Reset normalized backup candidate list
  ansible.builtin.set_fact:
    backup_agent_normalized: []

- name: Normalize each app's backup settings (fill in global defaults)
  ansible.builtin.set_fact:
    backup_agent_normalized: >-
      {{
        backup_agent_normalized + [{
          'name': item.name,
          'volumes': item.backup.volumes,
          'stop_during_backup': item.backup.stop_during_backup | default(false),
          'retention_days': item.backup.retention_days | default(offsite_backup_retention_days),
          'cron': item.backup.cron | default(offsite_backup_cron),
          'compression': item.backup.compression | default('gz'),
        }]
      }}
  loop: "{{ compose_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.backup.volumes | default([])) | length > 0

- name: Skip this host entirely — no app here declares any backup volumes
  ansible.builtin.meta: end_host
  when: backup_agent_normalized | length == 0

- name: Note whether any app on this host needs stopping during its own backup
  ansible.builtin.set_fact:
    backup_agent_any_stop_apps: "{{ backup_agent_normalized | selectattr('stop_during_backup') | list | length > 0 }}"

# One dict per app: {app, source, retention, cron, compression,
# stop_label, filename}. stop_label is '' (template omits the line)
# unless that app opted into stop_during_backup. `source` is singular
# and always one path: BACKUP_SOURCES takes exactly one directory,
# never a list, so every app's volumes are mounted under one shared
# parent dir (compose.yaml.j2) instead of being passed as separate
# sources.
- name: Build the flat list of per-app schedules
  ansible.builtin.set_fact:
    backup_agent_schedules: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for app in backup_agent_normalized -%}
        {%- set _ = ns.out.append({
              'app': app.name,
              'source': '/backup/' ~ app.name,
              'retention': app.retention_days,
              'cron': app.cron,
              'compression': app.compression,
              'stop_label': app.name if app.stop_during_backup else '',
              'filename': app.name ~ '.env',
            }) -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Ensure backup-agent deploy directory exists
  ansible.builtin.file:
    path: "{{ backup_agent_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure the conf.d directory exists
  ansible.builtin.file:
    path: "{{ backup_agent_deploy_dir }}/conf.d"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Reconciled against the current schedule list, not wiped-and-rebuilt:
# a nuke-and-pave here would make ansible.builtin.template report
# `changed` on every file on every single run regardless of whether its
# content actually differs — a run with zero real config changes would
# never show as a no-op. Only files that no longer correspond to any
# current schedule are removed; everything else is left for the
# `template` tasks below to update (or not) in the normal idempotent way.
# This is also what quietly cleans up any R2/B2/OCI schedule files left
# behind by an older version of this role — they're simply not in the
# expected filename list below anymore.
- name: Discover schedule files already on disk
  ansible.builtin.find:
    paths: "{{ backup_agent_deploy_dir }}/conf.d"
    patterns: "*.env"
  register: backup_agent_existing_schedule_files

- name: Remove stale schedule files (app no longer configured, or an old per-cloud-target file)
  ansible.builtin.file:
    path: "{{ backup_agent_deploy_dir }}/conf.d/{{ item }}"
    state: absent
  loop: >-
    {{ backup_agent_existing_schedule_files.files
       | map(attribute='path') | map('basename')
       | reject('in', backup_agent_schedules | map(attribute='filename') | list)
       | list }}

- name: Render backup-agent compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ backup_agent_deploy_dir }}/compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Render the GPG public key (placeholder until you replace ansible/files/backup-gpg-public-key.asc)
  ansible.builtin.template:
    src: gpg-public-key.asc.j2
    dest: "{{ backup_agent_deploy_dir }}/gpg-public-key.asc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Render the shared env (settings common to every schedule)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ backup_agent_deploy_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  # Now carries NOTIFICATION_URLS (embeds telegram_token) — same
  # no_log rule as any other secret-bearing config, see docs/secrets.md.
  no_log: true

- name: Render one conf.d schedule per app
  ansible.builtin.template:
    src: schedule.env.j2
    dest: "{{ backup_agent_deploy_dir }}/conf.d/{{ item.filename }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  loop: "{{ backup_agent_schedules }}"
  loop_control:
    label: "{{ item.filename }}"
  no_log: true

- name: Pull backup-agent images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ backup_agent_deploy_dir }}"
  tags:
    - images

- name: Deploy backup-agent
  community.docker.docker_compose_v2:
    project_src: "{{ backup_agent_deploy_dir }}"
    state: present
  tags:
    - images

# compose.yaml.j2's own "backup-agent-net" key is not the network's
# actual runtime name — Docker Compose prefixes it with this project's
# name ("backup-agent"), and the exact separator/format isn't something
# to hardcode and assume stable across compose versions. Discovered
# here, not assumed, for the freshness-check container below to join -
# it needs to resolve this stack's own SeaweedFS target the same way
# backup-agent itself does.
- name: Discover the docker network this compose stack created
  community.docker.docker_host_info:
    networks: true
  register: backup_agent_docker_networks

- name: Extract its name
  ansible.builtin.set_fact:
    backup_agent_network_name: >-
      {{ backup_agent_docker_networks.networks
         | selectattr('Name', 'search', 'backup-agent-net')
         | map(attribute='Name') | list | first }}

# --- Freshness check: liveness signal for Uptime Kuma -----------------
# See docs/uptime-kuma.md. Runs host-side, outside the backup-agent
# container entirely - offen/docker-volume-backup's own exec-hook
# labels need Docker `exec` access, which this host's socket-proxy
# deliberately doesn't grant (see compose.yaml.j2's own comment on
# backup_agent_any_stop_apps). Checking S3 object freshness instead
# needs no new privilege at all: it reuses this host's own
# already-scoped SeaweedFS credential (read access is strictly less
# than the write access it already has).

- name: Install Telegram alerting for freshness-check failures
  ansible.builtin.include_role:
    name: telegram_notify
    tasks_from: install.yaml
  vars:
    telegram_notify_unit_name: telegram-notify-backup-freshness
    telegram_notify_description: Telegram alert for a failed backup freshness check
    telegram_notify_message: >-
      Backup freshness check failed on `{{ ansible_facts['hostname'] }}` -
      check `journalctl -u check-freshness.service`
    telegram_notify_topic_id: "{{ telegram_topic_id_backups }}"

- name: Render the freshness-check script
  ansible.builtin.template:
    src: check-freshness.sh.j2
    dest: "{{ backup_agent_deploy_dir }}/check-freshness.sh"
    owner: root
    group: root
    mode: "0700"
  # Embeds seaweedfs_s3_secret_key - same no_log rule as .env above.
  no_log: true

- name: Install the freshness-check systemd service
  ansible.builtin.template:
    src: check-freshness.service.j2
    dest: /etc/systemd/system/check-freshness.service
    mode: "0644"
  notify: Reload systemd

- name: Install the freshness-check systemd timer
  ansible.builtin.template:
    src: check-freshness.timer.j2
    dest: /etc/systemd/system/check-freshness.timer
    mode: "0644"
  notify: Reload systemd

# telegram_notify's own install.yaml deliberately doesn't reload systemd
# or notify a handler itself (see its own header comment) - do it here
# instead, off the results it registers.
- name: Reload systemd if the Telegram notifier unit changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: telegram_notify_env_result.changed or telegram_notify_service_result.changed

# Same reasoning as lldap_cert/cloud_sync/caddy_cert_expiry's identical
# task: "Enable and start" below needs systemd to have already picked
# up the current unit content, which only happens once handlers flush.
- name: Flush handlers so systemd has the current unit definitions
  ansible.builtin.meta: flush_handlers

- name: Enable and start the freshness-check timer
  ansible.builtin.systemd:
    name: check-freshness.timer
    state: started
    enabled: true
