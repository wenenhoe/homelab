---
# Set to false only for non-production testing inside a Docker container
# (e.g. Molecule). Docker bind-mounts /etc/resolv.conf into any container
# using standard networking, so the kernel refuses to replace it with a
# symlink (EBUSY) - a limitation of running inside a container at all, not
# something a real VM/bare-metal host (what this role actually targets)
# ever hits. See network_conf.yaml.
bind9_manage_resolv_conf: true

# A host in the `dns_secondary` group serves the zones the primary transfers
# to it; any other host running this role is the primary and renders the zone
# files itself.
bind9_secondary: "{{ inventory_hostname in groups.get('dns_secondary', []) }}"

# Zone transfers exist only once a secondary does: until then the primary
# refuses them all, and neither host holds the key.
bind9_transfers_enabled: "{{ groups.get('dns_secondary', []) | length > 0 }}"

# The TSIG key's name in named.conf on both servers; its secret is
# `dns_transfer_key`.
bind9_transfer_key_name: dns-transfer

# A dotted-quad IPv4 address with no leading zeros, and one DNS label: a
# letter first, no trailing hyphen, at most 63 characters, the same rule
# tools/tofu_inventory applies to a host name.
bind9_ipv4_re: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
bind9_label_re: '^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'

# Host name -> address, for every inventory host whose `ansible_host` is an
# IPv4 address, which is how the generated inventory addresses a host Tofu
# provisioned. The primary renders each as an A record in the host zone. A
# host addressed by name has its record in its `dns_zones`, so is not here.
bind9_host_addresses: >-
  {%- set result = {} -%}
  {%- for host in groups['all'] | sort -%}
  {%-   set address = hostvars[host].ansible_host | default('') | string -%}
  {%-   if address is regex(bind9_ipv4_re) -%}
  {%-     set _ = result.update({host: address}) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ result }}

# Upstream DNS Docker's own daemon should use for container name
# resolution, merged into /etc/docker/daemon.json's "dns" key by
# network_conf.yaml rather than overwriting the whole file.
bind9_docker_dns_servers:
  - "192.168.20.1"
  - "10.0.0.1"

# The image of the throwaway container that hands the records volume to the
# bind user, the one compose's seed_volume.yaml uses.
bind9_volume_helper_image: "alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"
