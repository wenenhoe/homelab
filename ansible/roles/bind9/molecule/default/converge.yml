---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    # Docker bind-mounts /etc/resolv.conf into this container (standard
    # for any container) — the kernel refuses to replace a bind-mounted
    # file with a symlink, so this task can't be exercised here. See
    # bind9's defaults/main.yaml and network_conf.yaml.
    bind9_manage_resolv_conf: false
    # main_domain, lab_domain, dns_zones, app_registry, compose_apps live
    # in host_vars/bind9-instance.yaml instead — see the comment there.
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Run the bind9 role
      ansible.builtin.include_role:
        name: bind9
