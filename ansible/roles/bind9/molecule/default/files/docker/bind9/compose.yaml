name: bind9

services:
  bind9:
    image: ubuntu/bind9:9.20-26.04_stable
    container_name: bind9
    volumes:
      - config:/etc/bind
      - cache:/var/cache/bind
      - records:/var/lib/bind
      - run:/run/named
    environment:
      - TZ=${TIMEZONE}
    ports:
      - '0.0.0.0:53:53/tcp'
      - '0.0.0.0:53:53/udp'
    command: [ "--args", "dns-server", "-g", "-u", "bind", "-4" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pebble", "health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: bind:bind
volumes:
  config:
    external: true
    name: bind9_config
  cache:
    external: true
    name: bind9_cache
  records:
    external: true
    name: bind9_records
  run:
    external: true
    name: bind9_run
