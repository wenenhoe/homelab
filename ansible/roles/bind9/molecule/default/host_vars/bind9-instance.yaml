---
# Must live here, not in converge.yml's play `vars:`. bind9's own
# "Collect and flatten zones from all app hosts" task reads
# hostvars[host].dns_zones for every host in app_hosts — hostvars[] only
# reliably exposes variables from real inventory sources (host_vars/
# group_vars files), not a play's vars: block, even for a host looking up
# its own data.
main_domain: example.test  # noqa: var-naming[no-role-prefix]
lan_domain: "lan.{{ main_domain }}"  # noqa: var-naming[no-role-prefix]
host_domain: "internal.{{ main_domain }}"  # noqa: var-naming[no-role-prefix]
caddy_domain: "svc.{{ lan_domain }}"  # noqa: var-naming[no-role-prefix]
server_timezone: Asia/Singapore  # noqa: var-naming[no-role-prefix]

host_fqdn: "services.{{ host_domain }}."  # noqa: var-naming[no-role-prefix]
dns_zones:  # noqa: var-naming[no-role-prefix]
  - zone: "{{ caddy_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101 # overwritten at render time by the role
    extra_records:
      - { name: "@", type: NS, value: "ns1.{{ caddy_domain }}." }
      - { name: "ns1", type: A, value: "127.0.0.1" }
  # Host zone: static records only, so no CNAME is generated into it.
  - zone: "{{ host_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101
    extra_records:
      - { name: "@", type: NS, value: "ns1.{{ host_domain }}." }
      - { name: "ns1", type: A, value: "192.0.2.10" }
      - { name: "pve", type: A, value: "192.0.2.20" }
  # Second, non-Caddy zone: exercises bind9_all_zones/bind9_zone_candidates
  # with more than one item (see verify.yml for what this proves - the
  # coverage report's loop count won't reflect it, since these tasks are
  # no_log: true).
  - zone: "iot.{{ lan_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101
    extra_records:
      - { name: "sensor1", type: A, value: "10.20.0.5" }

app_catalog: >-  # noqa: var-naming[no-role-prefix]
  {{
    (lookup('file', playbook_dir ~ '/../../../../inventory/group_vars/all/app_catalog.yaml')
     | from_yaml).app_catalog
    | combine({'testapp': {}})
  }}
# The real app_catalog.yaml's own bind9 entry, extracted rather than
# hand-copied — can't go stale the way a copy can. combine() adds testapp, the synthetic
# fixture app with no real catalog entry to extract. playbook_dir here
# is converge.yml's directory (ansible/roles/bind9/molecule/default/),
# not wherever this file itself lives — confirmed live with a
# standalone Ansible run before trusting it, since lookup() paths inside
# a host_vars file are exactly the kind of thing that looks obviously
# right and silently isn't (see the comment above this block for the
# other host_vars/hostvars[] subtlety already found the hard way here).

# testapp carries its own `routes` entry directly (matching how real
# host_vars declare per-host route labels), so zone.db.j2 has something to
# generate an auto-CNAME for.
compose_apps:  # noqa: var-naming[no-role-prefix]
  - name: bind9
  - name: testapp
    routes:
      default:
        host: testapp
