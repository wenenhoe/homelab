---
# bind9 deploys via compose (Docker-in-Docker like other scenarios) and
# scrapes DNS zone data from every host in app_hosts via hostvars. Real
# production has bind9 on its own dedicated host, separate from the app
# hosts it serves — for a single-instance test, this instance is a
# member of app_hosts itself, so it ends up serving zone data about
# itself. Not a perfect topology match, but exercises the real
# scraping/templating logic.
driver:
  name: docker
platforms:
  - name: bind9-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:8771185a85383c0d75d5245d737c27d34595352565fbb0afb807c2b93aec7cfd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
    groups:
      - app_hosts
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
