---
# bind9 deploys via compose (needs Docker-in-Docker like other scenarios)
# and also scrapes DNS zone data from every host in the app_hosts group via
# hostvars. Real production has bind9 on its own dedicated host, separate
# from the app hosts it serves - for a single-instance test, this instance
# is a member of app_hosts itself, providing its own dns_zones/compose_apps
# (see converge.yml), so it ends up serving zone data about itself. Not a
# perfect topology match, but exercises the real scraping/templating logic.
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/role-requirements.yml
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/requirements.yml
driver:
  name: docker
platforms:
  - name: bind9-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
    groups:
      - app_hosts
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/../../ansible.cfg
    # molecule-coverage rollout (tools/molecule-coverage/) - see that
    # directory's README and
    # ansible/roles/caddy/molecule/default/molecule.yml for the full
    # explanation of these three vars.
    ANSIBLE_CALLBACKS_ENABLED: molecule_coverage
    ANSIBLE_CALLBACK_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/callback_plugins
    MOLECULE_COVERAGE_DIR: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/.data
verifier:
  name: ansible
# The zone-diffing mechanism in bind9/tasks/main.yaml renders each zone's
# candidate content in-memory and only writes it to disk when the
# non-serial content actually differs from what's live - so a second
# converge with no real config change performs no writes at all, and
# idempotence can be checked for real.
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
