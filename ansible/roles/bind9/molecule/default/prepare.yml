---
# Storage driver goes through a systemd drop-in flag here, not
# /etc/docker/daemon.json like the other DinD scenarios. bind9's own
# "Configure Docker daemon" task merges its "dns" key into daemon.json
# every run — writing storage-driver into that same file's own key would
# still leave two tasks racing to own the same file's write, so the CLI
# flag keeps them independent. A CLI flag and daemon.json don't conflict
# as long as they don't set the same key.
#
# fuse-overlayfs itself is baked into ghcr.io/wenenhoe/molecule-dind
# already (docker/molecule-dind/Dockerfile) — this only wires it up via
# the CLI flag daemon.json can't carry here, see above.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Reset coverage data from any previous test run
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: reset_coverage_data.yaml

    - name: Ensure the docker.service systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"

    # The image bakes {"storage-driver": "fuse-overlayfs"} into
    # daemon.json by default (docker/molecule-dind/Dockerfile) on the
    # assumption that bind9's own task overwrites the whole file -
    # true before that task changed to merge into whatever daemon.json
    # already has (see network_conf.yaml's own comment). A merge now
    # preserves that baked-in key, which collides with this same
    # setting delivered via the CLI flag below: dockerd refuses to
    # start when one directive is set both ways, even when the values
    # agree (confirmed against Docker's own docs, not assumed).
    # Removed outright rather than left for bind9's own role to
    # overwrite - that assumption is exactly what broke here once the
    # image's baked-in default and bind9's actual behavior drifted
    # apart; deleting it here doesn't depend on the other staying in
    # sync with it.
    - name: Remove the image's baked-in default daemon.json before the storage driver moves to a CLI flag
      ansible.builtin.file:
        path: /etc/docker/daemon.json
        state: absent

    - name: Force the nested Docker daemon onto the fuse-overlayfs storage driver via a CLI flag
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --storage-driver=fuse-overlayfs
        mode: "0644"

    - name: Reload systemd to pick up the override
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Install dnsutils
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true
      # for verify.yml's live dig query against the running bind9 server.
      # update_cache here because this is the first apt task in the play
      # now that fuse-overlayfs is baked into the image — the image's
      # own apt package lists are deliberately stripped at build time
      # (docker/molecule-dind/Dockerfile), so nothing else refreshes them.

    - name: Ensure systemd-resolved is installed
      ansible.builtin.apt:
        name: systemd-resolved
        state: present
      # Real Ubuntu server installs run this by default - the geerlingguy
      # test image doesn't ship it active, likely because containers
      # normally have Docker manage /etc/resolv.conf directly instead.
      # bind9's own "Disable systemd-resolved DNS Stub Listener" task
      # needs /etc/systemd/resolved.conf to actually exist.

    - name: Ensure systemd-resolved is enabled and started
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: true
        state: started
