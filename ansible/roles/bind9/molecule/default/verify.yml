---
- name: Verify
  hosts: all
  become: true
  vars:
    compose_deploy_dir: /opt/stacks
    bind9_config_dir: "{{ compose_deploy_dir }}/bind9/_staging/config"
  tasks:
    - name: Confirm the bind9 container exists and is running
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label: "com.docker.compose.project=bind9"
      register: bind9_running
      failed_when: bind9_running.containers | length == 0

    - name: Wait for the bind9 container to report healthy
      community.docker.docker_container_info:
        name: bind9
      register: bind9_container_info
      until: (bind9_container_info.container.State.Health.Status | default('')) == 'healthy'
      retries: 15
      delay: 10

    # --- Rendered config content ---------------------------------------------
    - name: Read back named.conf.local
      ansible.builtin.slurp:
        path: "{{ bind9_config_dir }}/named.conf.local"
      register: bind9_named_conf_local_raw

    - name: Confirm the zone stanza was generated
      ansible.builtin.assert:
        that:
          - "'zone \"svc.lan.example.test\"' in (bind9_named_conf_local_raw.content | b64decode)"

    - name: Read back the zone file
      ansible.builtin.slurp:
        path: "{{ bind9_config_dir }}/zones/db.svc.lan.example.test"
      register: bind9_zone_file_raw

    - name: Confirm the static extra_records rendered
      ansible.builtin.assert:
        that:
          - "'ns1.svc.lan.example.test.' in (bind9_zone_file_raw.content | b64decode)"
          - "'127.0.0.1' in (bind9_zone_file_raw.content | b64decode)"

    - name: Confirm the auto-generated CNAME for the routable test app rendered
      ansible.builtin.assert:
        that:
          - "'testapp' in (bind9_zone_file_raw.content | b64decode)"
          - "'CNAME' in (bind9_zone_file_raw.content | b64decode)"
          - "'services.internal.example.test.' in (bind9_zone_file_raw.content | b64decode)"

    # --- Volume seeded from staging -------------------------------------------
    - name: Confirm the config volume was actually seeded
      # slurp reads via the remote host's filesystem, but this content lives
      # inside a Docker named volume, not on the host filesystem directly -
      # a throwaway container is the only way to read it back.
      ansible.builtin.command: >-
        docker run --rm -v bind9_config:/mnt alpine:3.20 cat /mnt/named.conf.local  # noqa: command-instead-of-module
      register: bind9_seeded_config
      changed_when: false
      failed_when: "'zone \"svc.lan.example.test\"' not in bind9_seeded_config.stdout"

    # --- Network side effects --------------------------------------------------
    - name: Read back resolved.conf
      ansible.builtin.slurp:
        path: /etc/systemd/resolved.conf
      register: bind9_resolved_conf_raw

    - name: Confirm the DNS stub listener was disabled
      ansible.builtin.assert:
        that:
          - "'DNSStubListener=no' in (bind9_resolved_conf_raw.content | b64decode)"

    # No resolv.conf-symlink check here: bind9_manage_resolv_conf: false
    # (set in converge.yml) deliberately skips that task in this
    # environment, since Docker bind-mounts /etc/resolv.conf into this
    # container itself and the kernel refuses to replace a bind-mounted
    # file with a symlink. See bind9's defaults/main.yaml for the full
    # reasoning - correctness here is by code review, not execution.

    - name: Read back Docker's daemon.json
      ansible.builtin.slurp:
        path: /etc/docker/daemon.json
      register: bind9_docker_daemon_json_raw

    - name: Confirm bind9 configured Docker's upstream DNS servers
      ansible.builtin.assert:
        that:
          - "'192.168.20.1' in (bind9_docker_daemon_json_raw.content | b64decode | from_json).dns"
          - "'10.0.0.1' in (bind9_docker_daemon_json_raw.content | b64decode | from_json).dns"

    # --- End-to-end: the server actually answers queries correctly -----------
    # No module queries DNS on the *remote* host - community.general.dig is a
    # controller-side lookup plugin, not something that runs against the
    # Molecule instance, so this genuinely needs to be a command here.
    - name: Query the running bind9 server directly for the auto-generated CNAME
      ansible.builtin.command: dig @127.0.0.1 -p 53 +short testapp.svc.lan.example.test CNAME  # noqa: command-instead-of-module
      register: bind9_dig_result
      changed_when: false
      until: bind9_dig_result.stdout | trim == 'services.internal.example.test.'
      retries: 10
      delay: 3
      failed_when: bind9_dig_result.stdout | trim != 'services.internal.example.test.'
