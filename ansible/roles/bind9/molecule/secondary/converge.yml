---
# Each instance's address comes from the other's facts (host_vars/*/dns.yaml),
# so both are gathered before either runs the role.
- name: Gather both instances' facts
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather facts
      ansible.builtin.setup:

# The primary reads every app host's resolved_apps to gather the zones, so
# it has to exist on both before the first of them runs the role. In the
# deploy it is a group variable; here it is set per host.
- name: Resolve compose_apps on both instances
  hosts: dns:dns_secondary
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
  tasks:
    - name: Resolve compose_apps against the app catalog
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

# Two hosts no play here targets, addressed as the generated inventory
# addresses hosts: one by an IPv4 address, which gets a record in the host
# zone, and one by name, which does not. Added to the run rather than to the
# inventory, so no play that targets `all` tries to connect to them.
- name: Add hosts addressed as the generated inventory addresses them
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add a host addressed by an IPv4 address
      ansible.builtin.add_host:
        name: tofu-vm
        ansible_host: 192.0.2.50
      changed_when: false

    - name: Add a host addressed by name
      ansible.builtin.add_host:
        name: tofu-named
        ansible_host: tofu-named.internal.example.test
      changed_when: false

# One host at a time, primary first, so the secondary's first transfer finds
# the primary serving. A transfer that fails is not retried before the SOA
# retry interval, 1H, unless the primary sends a NOTIFY.
- name: Converge the primary, then the secondary
  hosts: dns:dns_secondary
  serial: 1
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    # Docker bind-mounts /etc/resolv.conf into the instance, so the symlink
    # that task makes cannot be created here; see the default scenario's
    # converge.yml.
    bind9_manage_resolv_conf: false
  tasks:
    - name: Run the bind9 role
      ansible.builtin.include_role:
        name: bind9
