---
# The secondary host's own variables, as host_vars/bind9-primary/zones.yaml
# gives the primary's. It declares a zone of its own so the secondary's
# config shows zones aggregated from a host other than the primary.
main_domain: example.test
lan_domain: "lan.{{ main_domain }}"
host_domain: "internal.{{ main_domain }}"
caddy_domain: "store.{{ lan_domain }}"
server_timezone: Asia/Singapore

host_fqdn: "storage.{{ host_domain }}."
dns_zones:
  - zone: "{{ caddy_domain }}"
    ttl: 3600
    soa_email: "hostmaster.{{ main_domain }}."
    serial: 2024010101 # overwritten at render time by the role
    extra_records:
      - { name: "@", type: NS, value: "ns1.{{ caddy_domain }}." }
      - { name: "ns1", type: A, value: "127.0.0.1" }

app_catalog: >-
  {{
    (lookup('file', playbook_dir ~ '/../../../../inventory/group_vars/all/app_catalog.yaml')
     | from_yaml).app_catalog
  }}

compose_apps:
  - name: bind9
