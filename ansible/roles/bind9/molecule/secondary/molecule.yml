---
# A primary and a secondary on two instances, Docker-in-Docker like the
# default scenario: the primary hands its zones over a TSIG key and the
# secondary serves what it received. The instances reach each other by the
# address Docker gives them (see host_vars/*/dns.yaml).
driver:
  name: docker
platforms:
  - name: bind9-primary
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:ab086aa21d8b76b8f1e3e0160036291182f3df9c2569044250ac50ad119083c4
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
    groups:
      - app_hosts
      - dns
  - name: bind9-secondary
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:ab086aa21d8b76b8f1e3e0160036291182f3df9c2569044250ac50ad119083c4
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
    groups:
      - app_hosts
      - dns_secondary
provisioner:
  name: ansible
  playbooks:
    # The default scenario's prepare is host-agnostic: it only readies a
    # nested Docker daemon and installs dig.
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/molecule/default/prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
