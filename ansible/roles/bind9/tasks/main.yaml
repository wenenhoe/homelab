---
# ---------------------------------------------------------------------------
# Role: bind9
# Runs on the dedicated DNS host.  Zone data is scraped from every host in
# the 'app_hosts' group via hostvars — no zone config lives on the DNS host
# itself.  host_vars for app hosts are completely unchanged.
#
# bind9 deploys and (re)starts its own compose app itself, at the end of
# this role, rather than being deployed generically in Play 3 alongside
# every other app. It has to: the "Disable DNS Stub Listener and set Docker
# DNS" task below points the host's Docker daemon at the bind9 container,
# so that container needs to already exist and be current *before* that
# task runs — long before Play 3 (container start) would otherwise get to
# it.
#
# Variable ownership:
#   host_vars/<app-host>.yaml — dns_zones, dns_ddns_target,
#                               caddy_domain, compose_apps
# ---------------------------------------------------------------------------

- name: Set BIND9 directory facts
  ansible.builtin.set_fact:
    bind9_deploy_dir: "{{ compose_deploy_dir }}/bind9"
    bind9_config_dir: "{{ compose_deploy_dir }}/bind9/_staging/config"
  tags:
    - always

- name: Resolve bind9's own compose_apps entry
  ansible.builtin.set_fact:
    bind9_compose_app_item: "{{ compose_apps | selectattr('name', 'equalto', 'bind9') | first }}"
  tags:
    - always

- name: Ensure bind group exists
  ansible.builtin.group:
    name: bind
    state: present
    gid: 9970
  tags:
    - infra

- name: Create bind user and assign to bind group
  ansible.builtin.user:
    name: bind
    state: present
    uid: 9970
    system: true
    create_home: false
    group: bind
  tags:
    - infra

- name: Init bind9's own compose app files and directories
  ansible.builtin.include_role:
    name: compose
    tasks_from: init
  vars:
    compose_app_item: "{{ bind9_compose_app_item }}"

- name: Ensure BIND9 staging config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: bind
    group: bind
    mode: '0755'
  loop:
    - "{{ bind9_config_dir }}"
    - "{{ bind9_config_dir }}/zones"
  tags:
    - infra

- name: Compute DNS serial (Unix epoch)
  ansible.builtin.set_fact:
    bind9_dns_serial: "{{ now(fmt='%s') | int }}"
  tags:
    - infra

# ---------------------------------------------------------------------------
# Scrape every app host's dns_zones via hostvars and flatten into _all_zones.
#
# _all_zones is a list of dicts.  Each entry is one zone and carries all the
# context the templates need so they don't have to reach into hostvars again:
#
#   key             — zone name
#   value           — zone SOA/TTL/extra_records with serial already injected
#   dns_ddns_target — the DDNS target for that host's zone
#   caddy_domain    — used by zone_db.j2 to build + filter FQDNs
#   compose_apps    — service list to derive CNAMEs from
#
# Using a Jinja2 expression in set_fact to do the double iteration in one
# task avoids the two-loop YAML problem entirely.
# ---------------------------------------------------------------------------
- name: Collect and flatten zones from all app hosts
  ansible.builtin.set_fact:
    bind9_all_zones: >-
      {%- set result = [] -%}
      {%- for host in groups['app_hosts'] -%}
        {%- set hv = hostvars[host] -%}
        {%- for zone_data in hv.dns_zones -%}
          {%- set _ = result.append({
            'key':             zone_data.zone,
            'value':           zone_data | combine({'serial': bind9_dns_serial}),
            'dns_ddns_target': hv.dns_ddns_target,
            'caddy_domain':    hv.caddy_domain,
            'compose_apps':    hv.compose_apps
          }) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}
  tags:
    - infra

- name: Generate BIND9 configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ bind9_config_dir }}/{{ item.dest }}"
    owner: bind
    group: bind
    mode: '0644'
  loop:
    - { src: 'named.conf.j2', dest: 'named.conf' }
    - { src: 'named.conf.local.j2', dest: 'named.conf.local' }
  register: bind9_config_files
  tags:
    - infra

# ---------------------------------------------------------------------------
# Smart zone-file deployment — ignore serial changes in the diff so we don't
# reload BIND on every run just because the epoch serial ticked forward.
#
# Strategy:
#   1. Render each zone's candidate content in-memory via the template
#      lookup (no side-car files needed on the remote).
#   2. Read back whatever's live on disk (if anything) via slurp.
#   3. Strip the serial line from both in Jinja and compare; only write
#      (and therefore only report changed) when the non-serial content
#      actually differs.
# ---------------------------------------------------------------------------

- name: Render candidate zone file content in-memory
  ansible.builtin.set_fact:
    bind9_zone_candidates: "{{ (current_list | list) + [{'key': item.key, 'content': rendered}] }}"
  loop: "{{ bind9_all_zones }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    current_list: "{{ bind9_zone_candidates | default([]) }}"
    rendered: >-
      {{ lookup('ansible.builtin.template', 'zone.db.j2', template_vars={
        'zone_name': item.key,
        'zone_data': item.value,
        'dns_ddns_target': item.dns_ddns_target,
        'caddy_domain': item.caddy_domain,
        'zone_compose_apps': item.compose_apps }) }}
  no_log: true
  tags:
    - infra

- name: Read back whatever zone file is currently live, if any
  ansible.builtin.slurp:
    path: "{{ bind9_config_dir }}/zones/db.{{ item.key }}"
  loop: "{{ bind9_zone_candidates }}"
  loop_control:
    label: "{{ item.key }}"
  register: bind9_zone_live
  failed_when: false # missing file is expected on first run, not an error
  no_log: true
  tags:
    - infra

- name: Write zone file when its non-serial content has changed
  ansible.builtin.copy:
    dest: "{{ bind9_config_dir }}/zones/db.{{ item.0.key }}"
    content: "{{ item.0.content }}"
    owner: bind
    group: bind
    mode: '0644'
  loop: "{{ bind9_zone_candidates | zip(bind9_zone_live.results) | list }}"
  loop_control:
    label: "{{ item.0.key }}"
  vars:
    # Matches the SOA serial comment format produced by zone.db.j2:
    #   "        1234567890 ; Serial"
    strip_serial_re: '[0-9]+[ \t]*;[ \t]*Serial'
    live_content: "{{ (item.1.content | b64decode) if (item.1.content is defined) else '' }}"
  when: >-
    (item.1.content is not defined) or
    (item.0.content | regex_replace(strip_serial_re, '') !=
     live_content | regex_replace(strip_serial_re, ''))
  register: bind9_zone_written
  no_log: true
  tags:
    - infra

- name: Set a consolidated DNS change flag
  ansible.builtin.set_fact:
    bind9_dns_changed: >-
      {{
        bind9_config_files.changed or
        (bind9_zone_written.results
         | default([])
         | selectattr('changed', 'equalto', true)
         | list | length > 0)
      }}
  tags:
    - infra

- name: Seed the config volume from staging, now that it's up to date
  ansible.builtin.include_role:
    name: compose
    tasks_from: seed_volume
  vars:
    compose_app_item: "{{ bind9_compose_app_item }}"
    compose_volume_item:
      name: config
  when: bind9_dns_changed | bool
  tags:
    - infra

# Must run before deploying the container below, not after: bind9's
# container binds host port 53 directly, which conflicts with
# systemd-resolved's default stub listener on 127.0.0.53:53 on any host
# that hasn't already had it disabled by a previous run. On a genuinely
# fresh host, deploying first would always fail with "address already in
# use" - this only ever looked fine because real hosts had already
# survived one successful run before anyone tried it from scratch.
- name: Disable DNS Stub Listener and set Docker DNS
  ansible.builtin.import_tasks:
    file: network_conf.yaml

# Handlers only fire at end-of-play by default - without this, the config
# files above get edited but systemd-resolved keeps running (and holding
# port 53) until whatever else happens to flush handlers later, which
# could easily be after the deploy below has already tried and failed.
- name: Flush handlers so systemd-resolved actually stops holding port 53 before we deploy
  ansible.builtin.meta: flush_handlers

# Tagged for both flows: images (recreate picks up a freshly pulled image)
# and infra (restart when only DNS zone/named.conf content changed).
# bind9_dns_changed is only defined when the infra-tagged zone/config tasks
# above actually ran, so it's defaulted here rather than assumed - under
# `--tags images` alone those tasks are skipped and this falls back to
# false.
- name: Deploy and restart bind9 now that its config is ready
  ansible.builtin.include_role:
    name: compose
    tasks_from: deploy
  vars:
    compose_app_item: "{{ bind9_compose_app_item }}"
    compose_app_extra_changed: "{{ bind9_dns_changed | default(false) }}"
  tags:
    - images
    - infra
