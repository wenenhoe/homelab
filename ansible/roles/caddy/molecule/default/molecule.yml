---
# caddy pulls its custom image from GHCR and deploys via compose, needing
# the same Docker-in-Docker setup as the compose scenarios, plus
# python3-requests (its 3 volumes go through ensure_volume.yaml). Needs
# real internet access to reach ghcr.io.
driver:
  name: docker
platforms:
  - name: caddy-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:36d341344d87dba89b0af2793ff5c5a294d87af7ac4273c5185dbc22c80d184c
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
