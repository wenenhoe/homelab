---
# caddy builds a real Docker image (xcaddy + a DNS plugin) and deploys via
# compose, so it needs the same Docker-in-Docker setup as the compose
# scenarios, plus python3-requests (its 3 declared volumes go through
# ensure_volume.yaml, same as the compose "volumes"/"scripts"/"cleanup"
# scenarios). This is the slowest scenario so far — compiling Caddy from
# source typically takes a couple of minutes and needs real internet
# access to fetch Go modules.
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/role-requirements.yml
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/requirements.yml
driver:
  name: docker
platforms:
  - name: caddy-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/../../ansible.cfg
    # molecule-coverage PoC (tools/molecule-coverage/): records task
    # execution/skip events for this scenario. MOLECULE_PROJECT_DIRECTORY
    # is this role's own directory (ansible/roles/caddy), so three levels
    # up reaches the repo root, where tools/ lives. The callback plugin
    # falls back to MOLECULE_PROJECT_DIRECTORY's basename ("caddy") and
    # Molecule's own MOLECULE_SCENARIO_NAME for role/scenario attribution,
    # so no MOLECULE_COVERAGE_ROLE/SCENARIO overrides are needed here.
    #
    # Known limitation: the JSONL file is appended to, not reset, so
    # repeated `molecule test` runs accumulate across invocations. Until
    # a later stage automates this, clear it yourself between runs if you
    # want a clean single-run picture:
    #   rm -f tools/molecule-coverage/.data/caddy/default.jsonl
    ANSIBLE_CALLBACKS_ENABLED: molecule_coverage
    ANSIBLE_CALLBACK_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/callback_plugins
    MOLECULE_COVERAGE_DIR: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/.data
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
