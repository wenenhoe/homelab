---
# caddy builds a real Docker image (xcaddy + a DNS plugin) and deploys via
# compose, needing the same Docker-in-Docker setup as the compose
# scenarios, plus python3-requests (its 3 volumes go through
# ensure_volume.yaml). Slowest scenario so far — compiling Caddy from
# source typically takes a couple of minutes and needs real internet
# access to fetch Go modules.
driver:
  name: docker
platforms:
  - name: caddy-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
