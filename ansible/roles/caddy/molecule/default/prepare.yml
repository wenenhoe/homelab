---
# Runs before converge. See molecule_helpers/tasks/dind_vfs_storage_driver.yaml
# for why the nested Docker daemon needs to be forced onto vfs here.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Force the nested Docker daemon onto the vfs storage driver
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: dind_vfs_storage_driver.yaml

    - name: Install python3-requests
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml
      # docker_volume/docker_host_info (ensure_volume.yaml, for caddy's
      # three declared volumes) talk to the Docker API directly via requests.
