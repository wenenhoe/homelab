---
# Exercises caddy_has_compose_app == false: the caddy role is included,
# but compose_apps has no "caddy" entry at all. tasks/main.yaml supports
# this (see caddy_compose_app_item's {} fallback and the
# caddy_has_compose_app guards) but it was never exercised by the default
# scenario, which always registers caddy — nor by the real fleet, since
# every current host_vars file registers caddy too.
#
# Tracing it through surfaced a real bug: "Seed the caddyfile volume from
# staging" was gated only on caddy_config_changes.changed, not
# caddy_has_compose_app, so it would run with the {} fallback the moment
# the Caddyfile changed (essentially every first run) and blow up on
# compose_app_item.name being undefined. Fixed in tasks/main.yaml by also
# requiring caddy_has_compose_app there.
#
# Expected behaviour post-fix: the Caddyfile still renders to staging
# (doesn't depend on caddy being a compose app), but nothing gets seeded
# into a volume and no caddy container gets deployed.
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    caddy_local_certs: true
    tinyauth_host: sso
    lab_domain: lan.localhost
    caddy_domain: apps.localhost
    # No "caddy" key here at all - this is the point of the scenario.
    compose_apps:
      - name: public_app
        caddy:
          default:
            host: public
            upstream: "public:8080"
            auth: false
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: bootstrap_docker.yaml

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Run the caddy role (deliberately not registered in compose_apps)
      ansible.builtin.include_role:
        name: caddy
