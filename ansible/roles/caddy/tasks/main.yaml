---
- name: Resolve caddy's own compose_apps entry, if present
  ansible.builtin.set_fact:
    caddy_compose_app_matches: "{{ compose_apps | selectattr('name', 'equalto', 'caddy') | list }}"

- name: Record whether caddy is present in compose_apps
  ansible.builtin.set_fact:
    caddy_has_compose_app: "{{ caddy_compose_app_matches | length > 0 }}"
    caddy_compose_app_item: "{{ caddy_compose_app_matches | first if caddy_compose_app_matches | length > 0 else {} }}"

- name: Init caddy's own compose app files and directories
  ansible.builtin.include_role:
    name: compose
    tasks_from: init
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
  when: caddy_has_compose_app

- name: Ensure caddyfile staging directory exists
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Caddyfile from template and host_vars
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_config_changes

- name: Seed the caddyfile volume from staging
  ansible.builtin.include_role:
    name: compose
    tasks_from: seed_volume
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_volume_item:
      name: caddyfile
  when: caddy_config_changes.changed # noqa: no-handler

- name: Create Dockerfile for custom Caddy build
  ansible.builtin.copy:
    dest: "{{ compose_deploy_dir }}/caddy/Dockerfile"
    owner: root
    group: root
    mode: "0644"
    content: |
      FROM caddy:builder AS builder
      RUN xcaddy build --with github.com/caddy-dns/digitalocean
      FROM caddy:latest
      RUN apk add --no-cache curl
      COPY --from=builder /usr/bin/caddy /usr/bin/caddy

- name: Build custom Caddy image locally using standard Dockerfile
  community.docker.docker_image_build:
    name: caddy-digitalocean
    tag: v1.0
    path: "{{ compose_deploy_dir }}/caddy" # Point context to where the Dockerfile lives
    pull: true
    nocache: true
    dockerfile: Dockerfile

- name: Deploy and restart caddy now that its config/image is ready
  ansible.builtin.include_role:
    name: compose
    tasks_from: deploy
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_app_extra_changed: "{{ caddy_config_changes.changed }}"
  when: caddy_has_compose_app
