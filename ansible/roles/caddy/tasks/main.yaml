---
- name: Find caddy's own entry in resolved_apps, if present
  ansible.builtin.set_fact:
    caddy_compose_app_matches: "{{ resolved_apps | selectattr('name', 'equalto', 'caddy') | list }}"
  tags:
    - always

- name: Record whether caddy is present in compose_apps
  ansible.builtin.set_fact:
    caddy_has_compose_app: "{{ caddy_compose_app_matches | length > 0 }}"
    caddy_compose_app_item: "{{ caddy_compose_app_matches | first if caddy_compose_app_matches | length > 0 else {} }}"
  tags:
    - always

- name: Init caddy's own compose app files and directories
  ansible.builtin.include_role:
    name: compose
    tasks_from: init
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
  when: caddy_has_compose_app

- name: Ensure caddyfile staging directory exists
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - infra

- name: Deploy Caddyfile from template and host_vars
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_config_changes
  tags:
    - infra

# Run on every pass, not only when the template changed: a staged file that
# failed validation re-renders unchanged on the next run, and would otherwise
# go unchecked while the previous Caddyfile keeps serving. The image is the one
# the compose file runs, so a plugin the config needs is there.
- name: Read the caddy image the compose file runs
  ansible.builtin.slurp:
    src: "{{ compose_deploy_dir }}/caddy/compose.yaml"
  register: caddy_compose_file
  when: caddy_has_compose_app
  tags:
    - infra

- name: Validate the staged Caddyfile before it can replace the served one
  community.docker.docker_container:
    name: caddy-validate
    image: "{{ (caddy_compose_file.content | b64decode | from_yaml).services.caddy.image }}"
    command: ["caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - "{{ compose_deploy_dir }}/caddy/_staging/caddyfile/Caddyfile:/etc/caddy/Caddyfile:ro"
    # validate provisions the config, which loads or creates the internal CA
    # under Caddy's data directory; the secret is only a placeholder, nothing
    # is issued or contacted.
    env:
      DO_API_TOKEN: validation-only
    tmpfs:
      - /data
      - /config
    network_mode: none
    read_only: true
    # The image's caddy binary carries a file capability for binding low
    # ports; with every capability dropped and no-new-privileges set, the
    # kernel refuses to exec it. The compose file keeps the same one.
    capabilities:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opts:
      - no-new-privileges:true
    detach: false
    cleanup: true
  changed_when: false
  when: caddy_has_compose_app
  tags:
    - infra

- name: Seed the caddyfile volume from staging
  ansible.builtin.include_role:
    name: compose
    tasks_from: seed_volume
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_volume_item:
      name: caddyfile
  when: caddy_has_compose_app and caddy_config_changes.changed # noqa: no-handler
  tags:
    - infra

# Tagged for both images (Compose pulls the GHCR image like any other app)
# and infra (restart when only the Caddyfile changed). caddy_config_changes
# is only set by the infra-tagged task above, so it's defaulted here —
# under `--tags images` alone it falls back to false.
- name: Deploy and restart caddy now that its config/image is ready
  ansible.builtin.include_role:
    name: compose
    tasks_from: deploy
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_app_extra_changed: "{{ caddy_config_changes.changed | default(false) }}"
  when: caddy_has_compose_app
  tags:
    - images
    - infra
