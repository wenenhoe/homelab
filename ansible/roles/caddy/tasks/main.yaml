---
- name: Resolve caddy's own compose_apps entry, if present
  ansible.builtin.set_fact:
    caddy_compose_app_matches: "{{ compose_apps | selectattr('name', 'equalto', 'caddy') | list }}"
  tags:
    - always

- name: Record whether caddy is present in compose_apps
  ansible.builtin.set_fact:
    caddy_has_compose_app: "{{ caddy_compose_app_matches | length > 0 }}"
    caddy_compose_app_item: "{{ caddy_compose_app_matches | first if caddy_compose_app_matches | length > 0 else {} }}"
  tags:
    - always

- name: Init caddy's own compose app files and directories
  ansible.builtin.include_role:
    name: compose
    tasks_from: init
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
  when: caddy_has_compose_app

- name: Ensure caddyfile staging directory exists
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - infra

- name: Deploy Caddyfile from template and host_vars
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ compose_deploy_dir }}/caddy/_staging/caddyfile/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_config_changes
  tags:
    - infra

- name: Seed the caddyfile volume from staging
  ansible.builtin.include_role:
    name: compose
    tasks_from: seed_volume
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_volume_item:
      name: caddyfile
  when: caddy_has_compose_app and caddy_config_changes.changed # noqa: no-handler
  tags:
    - infra

- name: Deploy Dockerfile for custom Caddy build
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ compose_deploy_dir }}/caddy/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  tags:
    - images

- name: Check whether the caddy-digitalocean image already exists
  community.docker.docker_image_info:
    name: caddy-digitalocean:v1.0
  register: caddy_image_info
  tags:
    - images

# The `when` below is separate from `tags:` deliberately: tags control
# reachability (whether --tags images can find this task at all), not
# whether it runs by default. On a host that already has the image, this
# only rebuilds when --tags images was explicitly requested
# (ansible_run_tags is the actual CLI tag list, ['all'] when none given)
# — a plain full run leaves the existing image alone. But that same plain
# run still has to build it the first time on a fresh host, hence the
# image-existence check feeding the other half of this condition.
- name: Build custom Caddy image locally using standard Dockerfile
  community.docker.docker_image_build:
    name: caddy-digitalocean
    tag: v1.0
    path: "{{ compose_deploy_dir }}/caddy" # Point context to where the Dockerfile lives
    pull: true
    nocache: true
    rebuild: always
    dockerfile: Dockerfile
  when: >-
    (caddy_image_info.images | default([]) | length == 0) or
    ('images' in ansible_run_tags)
  tags:
    - images

# Tagged for both images (Compose picks up a rebuilt local image by ID)
# and infra (restart when only the Caddyfile changed). caddy_config_changes
# is only set by the infra-tagged task above, so it's defaulted here —
# under `--tags images` alone it falls back to false.
- name: Deploy and restart caddy now that its config/image is ready
  ansible.builtin.include_role:
    name: compose
    tasks_from: deploy
  vars:
    compose_app_item: "{{ caddy_compose_app_item }}"
    compose_app_extra_changed: "{{ caddy_config_changes.changed | default(false) }}"
  when: caddy_has_compose_app
  tags:
    - images
    - infra
