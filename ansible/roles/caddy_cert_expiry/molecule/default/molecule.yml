---
# Needs a real Caddy target actually serving TLS (see check.sh.j2), so
# this reuses caddy's own default scenario's driver shape - same
# Docker-in-Docker setup, same real GHCR pull.
driver:
  name: docker
platforms:
  - name: caddy-cert-expiry-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:3019b41970da7152988f640e46768641d709d62b1e517b04a2ceab71252092de
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
