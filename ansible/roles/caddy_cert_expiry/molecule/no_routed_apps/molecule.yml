---
# The guard this tests (main.yaml's first two tasks) fires before
# anything Docker/Caddy-related ever runs - pure compose_apps
# introspection, same reasoning apt's own default scenario documents
# for its own lightweight shape. No privileged mode, no systemd, no
# Docker-in-Docker needed.
driver:
  name: docker
platforms:
  - name: caddy-cert-expiry-no-routed-apps-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
