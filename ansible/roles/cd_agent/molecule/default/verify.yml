---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    cd_agent_verify_jobs: [deploy, freshness, rotation]
    cd_agent_verify_users: "{{ cd_agent_verify_jobs | map('regex_replace', '^', 'cd-agent-') | list }}"
    cd_agent_verify_runner_source: "{{ (playbook_dir ~ '/../../../../../tools/cd_agent') | realpath }}"
  tasks:
    # --- The runner is the repository's, and no job can edit it ----------
    - name: Read back the installed runner
      ansible.builtin.slurp:
        src: /opt/cd-agent/lib/cd_agent/run_job.py
      register: cd_agent_verify_runner

    - name: Stat the installed runner
      ansible.builtin.stat:
        path: /opt/cd-agent/lib/cd_agent/run_job.py
      register: cd_agent_verify_runner_stat

    - name: Confirm it matches tools/cd_agent/run_job.py and is root-owned and not group- or world-writable
      ansible.builtin.assert:
        that:
          - (cd_agent_verify_runner.content | b64decode | trim) == (lookup('file', cd_agent_verify_runner_source ~ '/run_job.py') | trim)
          - cd_agent_verify_runner_stat.stat.pw_name == 'root'
          - cd_agent_verify_runner_stat.stat.mode == '0644'

    # --- One distinct, unprivileged, non-login user per job --------------
    - name: Look up the passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Confirm each job has its own system user with no login shell and its state directory as home
      ansible.builtin.assert:
        that:
          - getent_passwd[item] is defined
          - getent_passwd[item][1] | int < 1000
          - getent_passwd[item][4] == '/var/lib/cd-agent/' ~ item | regex_replace('^cd-agent-', '')
          - getent_passwd[item][5] == '/usr/sbin/nologin'
      loop: "{{ cd_agent_verify_users }}"

    - name: Confirm the users do not share a uid
      ansible.builtin.assert:
        that:
          - cd_agent_verify_users | map('extract', getent_passwd, 1) | unique | list | length == cd_agent_verify_jobs | length

    - name: Stat each job's state directory
      ansible.builtin.stat:
        path: "/var/lib/cd-agent/{{ item }}"
      loop: "{{ cd_agent_verify_jobs }}"
      register: cd_agent_verify_state_dirs

    - name: Stat each job's credential directory
      ansible.builtin.stat:
        path: "/etc/cd-agent/credentials/{{ item }}"
      loop: "{{ cd_agent_verify_jobs }}"
      register: cd_agent_verify_credential_dirs

    - name: Stat the credentials root
      ansible.builtin.stat:
        path: /etc/cd-agent/credentials
      register: cd_agent_verify_credentials_root

    - name: Confirm every directory belongs to its own job's user, mode 0700, and the root lets no one list the others
      ansible.builtin.assert:
        that:
          - cd_agent_verify_state_dirs.results | map(attribute='stat.pw_name') | list == cd_agent_verify_users
          - cd_agent_verify_state_dirs.results | map(attribute='stat.mode') | unique | list == ['0700']
          - cd_agent_verify_credential_dirs.results | map(attribute='stat.pw_name') | list == cd_agent_verify_users
          - cd_agent_verify_credential_dirs.results | map(attribute='stat.mode') | unique | list == ['0700']
          - cd_agent_verify_credentials_root.stat.pw_name == 'root'
          - cd_agent_verify_credentials_root.stat.mode == '0711'

    # --- No job's user can read another job's credentials ------------------
    - name: Deliver a credential file into each job's directory, as the AppRole delivery will
      ansible.builtin.copy:
        content: "secret-{{ item }}\n"
        dest: "/etc/cd-agent/credentials/{{ item }}/secret_id"
        owner: "cd-agent-{{ item }}"
        group: "cd-agent-{{ item }}"
        mode: "0400"
      loop: "{{ cd_agent_verify_jobs }}"

    # runuser, not become_user: Ansible cannot hand its temporary files to
    # an unprivileged user without ACL tooling this image does not carry.
    - name: Read every credential file as every job's user, and as nobody
      ansible.builtin.command: "runuser -u {{ item.1 }} -- cat /etc/cd-agent/credentials/{{ item.0 }}/secret_id"
      loop: "{{ cd_agent_verify_jobs | product(cd_agent_verify_users + ['nobody']) | list }}"
      loop_control:
        label: "{{ item.1 }} reads {{ item.0 }}"
      register: cd_agent_verify_reads
      changed_when: false
      failed_when: false

    - name: Confirm only a job's own user could read its credential file
      ansible.builtin.assert:
        that:
          - >-
            cd_agent_verify_reads.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | map('join', ':') | list
            == cd_agent_verify_jobs | zip(cd_agent_verify_users) | map('join', ':') | list
          - >-
            cd_agent_verify_reads.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | list
            == cd_agent_verify_jobs | map('regex_replace', '^', 'secret-') | list
        fail_msg: "Readable by: {{ cd_agent_verify_reads.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

    # --- The jobs run for real: as their user, from a fetched checkout ----
    # Starting a oneshot unit blocks until its run ends and fails if the run does.
    - name: Run the deploy job twice
      ansible.builtin.systemd:
        name: cd-agent-deploy.service
        state: started
      loop: [first, second]

    - name: Read what the deploy job recorded
      ansible.builtin.slurp:
        src: "/var/lib/cd-agent/deploy/{{ item }}"
      loop: [ran.log, deployed]
      register: cd_agent_verify_deploy_files

    - name: Stat the deploy job's record
      ansible.builtin.stat:
        path: /var/lib/cd-agent/deploy/deployed
      register: cd_agent_verify_deployed_stat

    - name: Read the deploy job's journal
      ansible.builtin.command: journalctl -u cd-agent-deploy.service --no-pager -o cat
      register: cd_agent_verify_deploy_journal
      changed_when: false

    # `$$(id -un)` in the unit is `$(id -un)` to the shell: the command ran
    # as its own user. Two starts, one run: the second found the commit
    # already deployed.
    - name: Confirm one run, as the job's user, on the commit now recorded as deployed
      ansible.builtin.assert:
        that:
          - cd_agent_verify_ran.splitlines() | length == 1
          - cd_agent_verify_ran is regex('^cd-agent-deploy [0-9a-f]{40}$')
          - cd_agent_verify_ran.split(' ')[1] == cd_agent_verify_recorded
          - cd_agent_verify_deployed_stat.stat.pw_name == 'cd-agent-deploy'
          - "'already deployed; nothing to do' in cd_agent_verify_deploy_journal.stdout"
        fail_msg: >-
          ran.log: {{ cd_agent_verify_ran }}
          journal: {{ cd_agent_verify_deploy_journal.stdout }}
      vars:
        cd_agent_verify_ran: "{{ cd_agent_verify_deploy_files.results[0].content | b64decode | trim }}"
        cd_agent_verify_recorded: "{{ cd_agent_verify_deploy_files.results[1].content | b64decode | trim }}"

    - name: Run the freshness job
      ansible.builtin.systemd:
        name: cd-agent-freshness.service
        state: started

    - name: Read what the freshness job copied from its own credential file
      ansible.builtin.slurp:
        src: /var/lib/cd-agent/freshness/own.txt
      register: cd_agent_verify_freshness_own

    - name: Stat a record the freshness job must not have written
      ansible.builtin.stat:
        path: /var/lib/cd-agent/freshness/deployed
      register: cd_agent_verify_freshness_deployed

    - name: Confirm the unit read its own credential, and without --on-change recorded nothing
      ansible.builtin.assert:
        that:
          - (cd_agent_verify_freshness_own.content | b64decode | trim) == 'secret-freshness'
          - not cd_agent_verify_freshness_deployed.stat.exists

    - name: Run the job that tries to write outside its state directory and to read another job's credentials
      ansible.builtin.systemd:
        name: cd-agent-rotation.service
        state: started

    - name: Read the probe's report
      ansible.builtin.slurp:
        src: /var/lib/cd-agent/rotation/probe.log
      register: cd_agent_verify_probe

    - name: Confirm the sandbox kept the filesystem read-only outside the state directory and the other job's credential out of reach, and its own was readable
      ansible.builtin.assert:
        that:
          - (cd_agent_verify_probe.content | b64decode).splitlines() == ['fs=readonly', 'other=denied', 'own=secret-rotation', 'user=cd-agent-rotation']
        fail_msg: "probe.log: {{ cd_agent_verify_probe.content | b64decode }}"

    # --- Timers --------------------------------------------------------------
    - name: Read each timer's unit file  # noqa: command-instead-of-module
      ansible.builtin.command: "systemctl cat cd-agent-{{ item }}.timer"
      loop: "{{ cd_agent_verify_jobs }}"
      register: cd_agent_verify_timer_units
      changed_when: false

    - name: Confirm the poll job is a poll and the others are on their calendar
      ansible.builtin.assert:
        that:
          - "'OnUnitInactiveSec=5min' in cd_agent_verify_timer_units.results[0].stdout"
          - "'OnCalendar' not in cd_agent_verify_timer_units.results[0].stdout"
          - "'OnCalendar=Mon *-*-* 04:00:00' in cd_agent_verify_timer_units.results[1].stdout"
          - "'OnCalendar=monthly' in cd_agent_verify_timer_units.results[2].stdout"

    # daemon_reload: false is the module's required-but-inert parameter for a
    # read-only status query; see cloud_sync/molecule/default/verify.yml.
    - name: Query each timer
      ansible.builtin.systemd:
        name: "cd-agent-{{ item }}.timer"
        daemon_reload: false
      loop: "{{ cd_agent_verify_jobs }}"
      register: cd_agent_verify_timers

    - name: Confirm every timer is enabled and active
      ansible.builtin.assert:
        that:
          - cd_agent_verify_timers.results | map(attribute='status.ActiveState') | unique | list == ['active']
          - cd_agent_verify_timers.results | map(attribute='status.UnitFileState') | unique | list == ['enabled']

    # --- sshd: the operator host only ------------------------------------------
    # -T -C evaluates the Match blocks for a connection from the given address.
    - name: Evaluate sshd's effective configuration for the operator host, another host and loopback
      ansible.builtin.command: "/usr/sbin/sshd -T -C user=cdadmin,addr={{ item }},host=probe,laddr=192.168.30.3,lport=22"
      loop: [192.168.30.2, 192.168.30.9, 127.0.0.1]
      register: cd_agent_verify_sshd
      changed_when: false

    - name: Confirm only cdadmin is allowed, and every address but the operator host's is denied outright
      ansible.builtin.assert:
        that:
          - "'allowusers cdadmin' in cd_agent_verify_sshd.results[0].stdout_lines"
          - "'denyusers *' not in cd_agent_verify_sshd.results[0].stdout_lines"
          - "'allowusers cdadmin' in cd_agent_verify_sshd.results[1].stdout_lines"
          - "'denyusers *' in cd_agent_verify_sshd.results[1].stdout_lines"
          - "'denyusers *' in cd_agent_verify_sshd.results[2].stdout_lines"
