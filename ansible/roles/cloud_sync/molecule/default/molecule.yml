---
# Same Docker-in-Docker pattern as every other role's scenarios, plus a
# real SeaweedFS target standing in for both "SeaweedFS itself" (the
# source) and "R2/B2/OCI" (the destinations) — rclone doesn't care that
# they're all the same physical server underneath, only that each is a
# genuine S3-compatible endpoint reachable the way rclone.conf actually
# points at it. Real R2/B2/OCI credentials aren't available in CI
# regardless — this only needs to prove the copy mechanism itself, the
# same reasoning identity_scoping and backup_agent's own multi-target
# tests already used.
driver:
  name: docker
platforms:
  - name: cloud-sync-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
