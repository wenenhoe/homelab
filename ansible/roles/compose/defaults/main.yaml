---
# ---------------------------------------------------------------------------
# compose cleanup (ansible/playbooks/cleanup.yaml) — apps deployed on a host but no
# longer listed in its compose_apps get brought down. Most apps' real data
# now lives in named Docker volumes (see ensure_volume.yaml), not bind
# mounts, so deleting a stack's directory only removes its compose files
# and rendered configs - not its data. The same keep/remove decision below
# now governs both the directory *and* that app's named volumes together,
# so removal is still a deliberate, explicit choice rather than a side
# effect of tidying up a directory. Individual apps can opt in to deletion
# by name.
#
# e.g. specifying the app overrides:
#
# compose_cleanup_app_overrides:
#   old_test_app: true
#   scratch_service: true
# ---------------------------------------------------------------------------
compose_cleanup_remove_content: false
compose_cleanup_app_overrides: {}
compose_cleanup_dry_run: false

# compose_cleanup_exclude does NOT live here despite being part of the
# same cleanup config family — it's defined as a play-level var in
# ansible/playbooks/cleanup.yaml itself instead. Confirmed live (not
# assumed): role defaults are only in scope once that role has actually
# been *included* somewhere in the current play, and Play 1's orphan
# detection references this var in the playbook's own task, before the
# compose role is ever included in that play (that only happens later,
# in the teardown step, conditionally, only if orphans were found) —
# so a role default here is simply invisible when it's needed and the
# whole play fails outright ("is undefined"), not silently wrong.

# Same keep-by-default posture, for volumes a still-deployed app's
# registry entry no longer declares (e.g. a volume renamed/removed from
# app_registry, but the app itself wasn't). No per-app override list yet —
# add one the same way as compose_cleanup_app_overrides if a real app
# needs it.
compose_cleanup_stale_volume_remove: false
