---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    app_registry:
      cleanup_app_a:
        volumes:
          - name: data
      cleanup_app_b: {}
      cleanup_app_c: {}
    compose_apps:
      - name: cleanup_app_a
      - name: cleanup_app_b
      - name: cleanup_app_c
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: docker

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml

    - name: Initialise and deploy each resolved test app
      ansible.builtin.include_role:
        name: compose
        tasks_from: main.yaml
      loop: "{{ compose_apps }}"
      loop_control:
        loop_var: compose_app_item
        label: "{{ compose_app_item.name }}"
