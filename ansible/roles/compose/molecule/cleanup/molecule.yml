---
# Covers what the volumes scenario doesn't: cleanup.yaml's dry-run mode,
# the keep-content path (directory/volumes preserved), compose_cleanup_app_overrides,
# the label-fallback teardown (stack directory already gone before
# cleanup runs), and cleanup_stale_volumes.yaml pruning a labelled volume
# an active app's registry entry no longer declares. Same Docker-in-Docker
# setup as the other compose scenarios.
driver:
  name: docker
platforms:
  - name: compose-cleanup-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
