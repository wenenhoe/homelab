---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force the nested Docker daemon onto the vfs storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"

    - name: Install python3-requests
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
      # docker_volume/docker_host_info, used throughout cleanup.yaml, talk
      # to the Docker API directly via requests.
