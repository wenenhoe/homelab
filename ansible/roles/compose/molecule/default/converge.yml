---
- name: Converge
  hosts: all
  become: true
  vars:
    # Real production vars come from group_vars/host_vars/vars_prompt, none
    # of which apply here — supply a minimal, self-contained equivalent
    # instead of pulling in the real app_registry (which needs real secrets
    # and real docker/<app> directories this scenario doesn't have).
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    app_registry:
      testapp:
        create_dirs:
          - data
        configs:
          - src: env.j2
            dest: .env
            mode: "0600"
            force: true
    compose_apps:
      - name: testapp
  tasks:
    - name: Include docker role (compose assumes Docker is already installed and running)
      ansible.builtin.include_role:
        name: docker

    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: compose
        tasks_from: preinit.yaml

    - name: Initialise and deploy the resolved test app
      ansible.builtin.include_role:
        name: compose
        tasks_from: main.yaml
      vars:
        compose_app_item: "{{ compose_apps[0] }}"
