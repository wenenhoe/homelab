---
# compose deploys via `docker compose`, so — like the docker role scenario —
# this needs genuine Docker-in-Docker: a privileged, systemd-enabled
# container with cgroups exposed. This role doesn't install Docker itself
# (that's the docker role's job), so converge.yml installs it first, the
# same way Play 1 of the real ansible/deploy.yaml does before anything
# compose-related runs.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: compose-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  env:
    # Scenario cwd is ansible/roles/compose/molecule/default — three levels
    # up is ansible/roles, where `include_role` needs to look for both
    # `compose` and `docker` (converge.yml installs docker first).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
verifier:
  name: ansible
