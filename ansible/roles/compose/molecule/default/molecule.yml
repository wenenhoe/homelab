---
# compose deploys via `docker compose`, so this needs genuine
# Docker-in-Docker: a privileged, systemd-enabled container with cgroups
# exposed. This role doesn't install Docker itself; unlike the bare
# geerlingguy base other scenarios still use, ghcr.io/wenenhoe/molecule-dind
# (docker/molecule-dind/Dockerfile) already has Docker, fuse-overlayfs,
# and python3-requests baked in, so converge.yml no longer installs
# Docker itself — it relies on the daemon systemd starts at boot.
driver:
  name: docker
platforms:
  - name: compose-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
