---
# Same reasoning as ansible/roles/docker/molecule/default/prepare.yml: the
# test container's own root filesystem is already overlay-mounted by the
# host's Docker, so the nested daemon can't also use overlay2. Force vfs
# before the docker role (included from converge.yml) starts the service.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force the nested Docker daemon onto the vfs storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"
