---
# Covers init.yaml's script-deployment paths, neither exercised by the
# default or volumes scenarios: direct copy (no matching volume declared)
# and volume-seeded (a "scripts" volume declared, so the script gets
# staged and seeded into it instead). Same Docker-in-Docker setup as the
# other compose scenarios.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: compose-scripts-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  env:
    # Scenario cwd is ansible/roles/compose/molecule/scripts — three levels
    # up is ansible/roles, where `include_role` needs to look for both
    # `compose` and `docker`.
    ANSIBLE_ROLES_PATH: ../../../
verifier:
  name: ansible
