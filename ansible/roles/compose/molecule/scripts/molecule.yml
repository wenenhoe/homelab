---
# Covers init.yaml's script-deployment paths, neither exercised by the
# default or volumes scenarios: direct copy (no matching volume declared)
# and volume-seeded (a "scripts" volume declared).
driver:
  name: docker
platforms:
  - name: compose-scripts-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
