---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force the nested Docker daemon onto the vfs storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"

    - name: Install python3-requests
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
      # docker_volume/docker_host_info (used by ensure_volume.yaml for the
      # scriptapp_seeded app's "scripts" volume) talk to the Docker API
      # directly via requests, unlike docker_compose_v2 which only needs
      # the CLI plugin the docker role already installs.
