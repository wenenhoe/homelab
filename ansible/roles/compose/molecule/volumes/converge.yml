---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    app_catalog:
      volapp:
        volumes:
          - name: data
        configs:
          - src: seeded.txt.j2
            dest: data/seeded.txt
    compose_apps:
      - name: volapp
  tasks:
    - name: Resolve compose_apps against the app catalog
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Initialise and deploy the resolved test app
      ansible.builtin.include_role:
        name: compose
        tasks_from: main.yaml
      vars:
        compose_app_item: "{{ resolved_apps[0] }}"
