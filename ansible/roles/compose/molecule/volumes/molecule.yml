---
# Covers the paths the default scenario deliberately skips: ensure_volume.yaml
# (named volume creation + legacy bind-mount migration), seed_volume.yaml
# (volume-seeded configs), and cleanup.yaml (full stack teardown). Same
# Docker-in-Docker setup as the default scenario and the docker role's own
# scenario — see those for the reasoning.
dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/role-requirements.yml
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/requirements.yml
driver:
  name: docker
platforms:
  - name: compose-volumes-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/../../ansible.cfg
    # molecule-coverage rollout (tools/molecule-coverage/) - see that
    # directory's README and
    # ansible/roles/caddy/molecule/default/molecule.yml for the full
    # explanation of these three vars.
    ANSIBLE_CALLBACKS_ENABLED: molecule_coverage
    ANSIBLE_CALLBACK_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/callback_plugins
    MOLECULE_COVERAGE_DIR: ${MOLECULE_PROJECT_DIRECTORY}/../../../tools/molecule-coverage/.data
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
