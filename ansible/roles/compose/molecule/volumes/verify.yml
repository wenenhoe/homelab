---
- name: Verify
  hosts: all
  become: true
  vars_files:
    - "{{ playbook_dir }}/../../../molecule_helpers/vars/images/alpine.yml"
  vars:
    compose_deploy_dir: /opt/stacks
  tasks:
    # --- Deploy-time assertions -------------------------------------------
    - name: Confirm the compose file was copied to the deploy dir
      ansible.builtin.stat:
        path: "{{ compose_deploy_dir }}/volapp/compose.yaml"
      register: compose_file
      failed_when: not compose_file.stat.exists

    - name: Confirm the named volume exists and carries the expected labels
      community.docker.docker_volume_info:
        name: volapp_data
      register: compose_volume_inspect
      failed_when: >-
        not compose_volume_inspect.exists
        or compose_volume_inspect.volume.Labels['homelab.app'] != 'volapp'
        or compose_volume_inspect.volume.Labels['homelab.volume'] != 'data'

    - name: Confirm the seeded config landed in the volume
      # Reads content stored inside a Docker named volume - a throwaway
      # container is the only way to read that back.
      ansible.builtin.command: >-
        docker run --rm -v volapp_data:/data {{ molecule_helpers_alpine_image }}
        sh -c "cat /data/seeded.txt"  # noqa: command-instead-of-module
      register: compose_volume_contents
      changed_when: false
      failed_when: "'seeded-hello-from-volapp' not in compose_volume_contents.stdout"

    # --- Seeding keeps another user's owner and mode, and can overwrite their file
    # The seed runs as root. Keeping a file's owner and mode after the copy
    # needs CHOWN and FOWNER, keeping a setgid directory's bit needs FSETID,
    # and writing over a 0600 file another user owns needs DAC_OVERRIDE.
    - name: Read back the owner and mode of the staged file the first seed copied
      community.docker.docker_container:
        name: volapp-seed-owner-check
        image: "{{ molecule_helpers_alpine_image }}"
        volumes:
          - volapp_data:/data:ro
        command: "stat -c '%u:%g %a' /data/private/secret.txt"
        detach: false
        cleanup: true
        output_logs: true
      register: compose_seed_first_stat
      changed_when: false

    - name: Confirm the seeded file kept its owner and mode
      ansible.builtin.assert:
        that:
          - compose_seed_first_stat.container.Output | trim == '1000:1000 600'
        fail_msg: >-
          The seeded file is {{ compose_seed_first_stat.container.Output | trim }},
          not 1000:1000 at 0600.

    - name: Stage new content for that file, as a later deploy with changed content would
      ansible.builtin.copy:
        dest: "{{ compose_deploy_dir }}/volapp/_staging/data/private/secret.txt"
        content: "reseeded-private-content\n"
        owner: "1000"
        group: "1000"
        mode: "0600"

    # A setgid directory whose group root is not in: without FSETID the
    # chmod after the chown drops the bit and cp still exits 0.
    - name: Stage a setgid directory owned by another group
      ansible.builtin.file:
        path: "{{ compose_deploy_dir }}/volapp/_staging/data/shared"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "2775"

    - name: Seed the volume again, over the file the first seed left owned by another user
      ansible.builtin.include_role:
        name: compose
        tasks_from: seed_volume.yaml
      vars:
        compose_app_item:
          name: volapp
        compose_volume_item:
          name: data

    - name: Read back the file and its owner and mode after the second seed
      community.docker.docker_container:
        name: volapp-reseed-check
        image: "{{ molecule_helpers_alpine_image }}"
        volumes:
          - volapp_data:/data:ro
        command:
          - sh
          - -c
          - "stat -c '%u:%g %a' /data/private/secret.txt /data/shared; cat /data/private/secret.txt"
        detach: false
        cleanup: true
        output_logs: true
      register: compose_seed_second_read
      changed_when: false

    - name: Confirm the second seed replaced the content and kept the owner and mode
      ansible.builtin.assert:
        that:
          - compose_seed_second_read.container.Output.splitlines() == ['1000:1000 600', '1000:1000 2775', 'reseeded-private-content']
        fail_msg: >-
          After the second seed: {{ compose_seed_second_read.container.Output }}

    # --- Exercise cleanup.yaml ---------------------------------------------
    # Doesn't need to survive a second run the way converge.yml does —
    # verify.yml only runs once, after idempotence — so it's safe to do the
    # actual teardown and assert on it here.
    - name: Run the compose role's cleanup path (full teardown, including volumes)
      ansible.builtin.include_role:
        name: compose
        tasks_from: cleanup.yaml
      vars:
        compose_cleanup_stack: volapp
        compose_cleanup_remove_content: true
        compose_cleanup_dry_run: false

    - name: Confirm the stack's container was brought down
      community.docker.docker_host_info:
        containers: true
        containers_all: true
        containers_filters:
          label: "com.docker.compose.project=volapp"
      register: compose_leftover_containers
      failed_when: compose_leftover_containers.containers | length > 0

    - name: Confirm the stack directory was removed
      ansible.builtin.stat:
        path: "{{ compose_deploy_dir }}/volapp"
      register: compose_stack_dir_after_cleanup
      failed_when: compose_stack_dir_after_cleanup.stat.exists

    - name: Confirm the named volume was removed
      community.docker.docker_volume_info:
        name: volapp_data
      register: compose_volume_after_cleanup
      failed_when: compose_volume_after_cleanup.exists
