---
# ---------------------------------------------------------------------------
# Reusable single-app deployer.
#
# Shared by:
#   - compose_app role    (looped once per non-infra app, Play 3)
#   - caddy / bind9 roles (called directly, right after their own config is
#                          generated, so their container is already up
#                          before anything downstream needs it — bind9 must
#                          be serving before other containers/hosts start,
#                          caddy must be routing before the apps behind it
#                          come up)
#
# Expects:
#   compose_app_item          — one fully-resolved entry from compose_apps
#   compose_app_extra_changed — (optional, default false) set true when
#                                config outside the compose file itself
#                                changed (e.g. Caddyfile, named.conf/zones)
#                                and the container should be restarted even
#                                though docker_compose_v2 sees no diff
#
# Sets:
#   compose_app_deploy_changed — true if anything here actually changed
#                                 (compose itself, the forced restart, or
#                                 the extra-changed trigger). Read by
#                                 compose_app's batch summary.
# ---------------------------------------------------------------------------

- name: Pull latest Docker images ({{ compose_app_item.name }})
  community.docker.docker_compose_v2_pull:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
  when: not (compose_app_item.build | default(false))
  tags:
    - images

- name: Build Docker images ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    build: always
    state: present
  when: compose_app_item.build | default(false)
  tags:
    - images

- name: Deploy with Docker Compose ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: present
  register: compose_app_deploy_up_result
  tags:
    - images

# Separate from the images tag above: this is for when Caddyfile/named.conf/
# zone content changed but the compose file and image didn't, which Compose
# has no way to detect on its own (a rebuilt local image with the same tag
# IS picked up by the "present" task above - Compose recreates whenever the
# image ID a running container was created from no longer matches the
# currently-tagged image, tag notwithstanding).
- name: Restart if its config changed ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: restarted
  when: compose_app_extra_changed | default(false)
  register: compose_app_deploy_restart_result
  tags:
    - infra

- name: Record whether this app changed, for the batch summary
  ansible.builtin.set_fact:
    compose_app_deploy_changed: >-
      {{
        (compose_app_deploy_up_result.changed | default(false))
        or (compose_app_deploy_restart_result.changed | default(false))
        or (compose_app_extra_changed | default(false))
      }}
  tags:
    - images
    - infra
