---
# Reusable single-app deployer. Shared by compose_app (looped per
# non-infra app) and caddy/bind9 (called directly right after their own
# config is generated, so their container is up before anything
# downstream needs it).
#
# Expects compose_app_item (a resolved_apps entry) and optional
# compose_app_extra_changed (set true when config outside the compose
# file changed — e.g. Caddyfile, named.conf/zones — so the container
# should restart even though docker_compose_v2 sees no diff).
#
# Appends this app's result to compose_app_results, which the deploy_report
# filter turns into the end-of-run report (Play 10 of deploy.yaml). Every
# caller reaches it, so caddy, bind9 and openbao are reported alongside the
# apps compose_app loops over.

- name: Pull latest Docker images ({{ compose_app_item.name }})
  community.docker.docker_compose_v2_pull:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
  when: not (compose_app_item.build | default(false))
  tags:
    - images

- name: Build Docker images ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    build: always
    state: present
  when: compose_app_item.build | default(false)
  tags:
    - images

- name: Deploy with Docker Compose ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: present
  register: compose_app_deploy_up_result
  tags:
    - images

# Separate from the images tag above: for when Caddyfile/named.conf/zone
# content changed but the compose file/image didn't, which Compose can't
# detect on its own (a rebuilt local image with the same tag IS already
# picked up by the "present" task above).
- name: Restart if its config changed ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: restarted
  when: compose_app_extra_changed | default(false)
  register: compose_app_deploy_restart_result
  tags:
    - infra

- name: Record this app's result, for the end-of-run report
  ansible.builtin.set_fact:
    compose_app_results: >-
      {{
        compose_app_results | default([]) + [{
          'name': compose_app_item.name,
          'status': (
            (compose_app_deploy_up_result.changed | default(false))
            or (compose_app_deploy_restart_result.changed | default(false))
            or (compose_app_extra_changed | default(false))
          ) | ternary('changed', 'ok')
        }]
      }}
  tags:
    - images
    - infra
