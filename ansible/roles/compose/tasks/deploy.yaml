---
# Reusable single-app deployer. Shared by compose_app (looped per
# non-infra app) and caddy/bind9 (called directly right after their own
# config is generated, so their container is up before anything
# downstream needs it).
#
# Expects compose_app_item (a resolved_apps entry) and optional
# compose_app_extra_changed (set true when config outside the compose
# file changed — e.g. Caddyfile, named.conf/zones — so the container
# should restart even though docker_compose_v2 sees no diff).
#
# Appends this app's result to compose_app_results, which the deploy_report
# filter turns into the end-of-run report (Play 10 of deploy.yaml). Every
# caller reaches it, so caddy, bind9 and openbao are reported alongside the
# apps compose_app loops over.

# A service that mounts a file or directory read-only from the stack directory
# is recreated when that content changes: Compose does not notice a changed
# bind-mounted file, and a container keeps the old content of a file replaced by
# a rename. compose.override.yaml, which Compose reads from the project directory
# without being named, labels each such service with a checksum of what it
# mounts, as it is on the host now, so a run after one that failed between
# writing the file and here still recreates it (ansible/filter_plugins/compose_mounts.py).
# Written before any Compose call. Tagged `always`, as `up` is: a task tagged
# images and infra is skipped by --skip-tags on either. The include that reaches
# this file carries the play's tags.
- name: Read the deployed compose file ({{ compose_app_item.name }})
  ansible.builtin.slurp:
    src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/compose.yaml"
  register: compose_app_compose_file
  tags:
    - always

- name: Find the files its services mount read-only from the stack directory ({{ compose_app_item.name }})
  ansible.builtin.set_fact:
    compose_app_mounts: "{{ compose_app_compose_file.content | b64decode | compose_mounts(compose_deploy_dir ~ '/' ~ compose_app_item.name) }}"
  tags:
    - always

- name: Stat what its services mount ({{ compose_app_item.name }})
  ansible.builtin.stat:
    path: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/{{ item }}"
    checksum_algorithm: sha256
  loop: "{{ compose_app_mounts.values() | flatten | unique | list }}"
  register: compose_app_mount_stats
  tags:
    - always

- name: Find the files in the directories its services mount ({{ compose_app_item.name }})
  ansible.builtin.find:
    paths: "{{ item.stat.path }}"
    recurse: true
    hidden: true
    file_type: file
    get_checksum: true
  loop: "{{ compose_app_mount_stats.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: compose_app_mount_finds
  tags:
    - always

- name: Write the label file for its mounted files ({{ compose_app_item.name }})
  ansible.builtin.copy:
    content: "{{ compose_app_mounts | compose_mounts_override(compose_app_mount_stats.results, compose_app_mount_finds.results) }}"
    dest: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/compose.override.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: compose_app_mounts | length > 0
  tags:
    - always

- name: Remove the label file of an app with no such mount ({{ compose_app_item.name }})
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/compose.override.yaml"
    state: absent
  when: compose_app_mounts | length == 0
  tags:
    - always

# Every image reference in a compose file is pinned to a digest (ADR 0108), so
# a reference that is already on the host is the image the commit names and a
# changed digest is a reference the host does not have yet. `missing` pulls only
# the latter; the default, `always`, would replace an image under an unchanged
# reference and recreate its container on the next run.
- name: Pull Docker images the host does not have ({{ compose_app_item.name }})
  community.docker.docker_compose_v2_pull:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    policy: missing
  when: not (compose_app_item.build | default(false))
  tags:
    - images

- name: Build Docker images ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    build: always
    state: present
  when: compose_app_item.build | default(false)
  tags:
    - images

# `always`, with the label file above: only `up` turns a changed label into a
# recreated service. `restarted` below keeps the old container, and so the old
# content of a replaced mounted file.
- name: Deploy with Docker Compose ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: present
  register: compose_app_deploy_up_result
  tags:
    - always

# Separate from `up` above: for when Caddyfile/named.conf/zone
# content changed but the compose file/image didn't, which Compose can't
# detect on its own (a rebuilt local image with the same tag IS already
# picked up by the "present" task above).
- name: Restart if its config changed ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: restarted
  when: compose_app_extra_changed | default(false)
  register: compose_app_deploy_restart_result
  tags:
    - infra

# An app that holds a connection to this one (tinyauth's LDAP connection to
# lldap) keeps a dead one after this app is recreated or restarted, and fails
# requests until its own heartbeat notices. The catalog's `restart_after` lists
# those apps; an app whose directory is not on the host yet is left for its own
# first deploy.
- name: Look for the apps to restart after it ({{ compose_app_item.name }})
  ansible.builtin.stat:
    path: "{{ compose_deploy_dir }}/{{ item }}/compose.yaml"
  loop: "{{ compose_app_item.restart_after | default([]) }}"
  when: (compose_app_deploy_up_result.changed | default(false)) or (compose_app_deploy_restart_result.changed | default(false))
  register: compose_app_deploy_dependents
  tags:
    - images
    - infra

- name: Restart the apps that hold a connection to it ({{ compose_app_item.name }})
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ item.item }}"
    state: restarted
  loop: "{{ compose_app_deploy_dependents.results | selectattr('stat', 'defined') | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
  tags:
    - images
    - infra

- name: Record this app's result, for the end-of-run report
  ansible.builtin.set_fact:
    compose_app_results: >-
      {{
        compose_app_results | default([]) + [{
          'name': compose_app_item.name,
          'status': (
            (compose_app_deploy_up_result.changed | default(false))
            or (compose_app_deploy_restart_result.changed | default(false))
            or (compose_app_extra_changed | default(false))
          ) | ternary('changed', 'ok')
        }]
      }}
  tags:
    - images
    - infra
