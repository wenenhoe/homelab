---
# ---------------------------------------------------------------------------
# Reusable single-volume initializer. Included once per entry in
# compose_app_item.volumes (see init.yaml).
#
# Expects (via loop_var from init.yaml):
#   compose_app_item          — the resolved app entry (name, etc.)
#   compose_volume_item       — one entry from compose_app_item.volumes:
#                                 name         — volume key, e.g. "data"
#                                 legacy_path  — (optional) old bind-mount
#                                                subpath relative to the app's
#                                                stack dir, if it doesn't
#                                                match `name` (e.g. lldap's
#                                                "letsencrypt/conf" for the
#                                                letsencrypt_conf volume).
#                                                Defaults to `name`.
#
# Behaviour:
#   1. Ensure the external volume "<app>_<volume>" exists, labelled so it can
#      be found later without needing the app still present in the registry
#      (see roles/compose/tasks/cleanup.yaml).
#   2. If a legacy bind-mount directory still exists on disk at the expected
#      path, copy its contents into the new volume once via a throwaway
#      container, then rename the old directory to "<path>.migrated" so it
#      won't be picked up again on the next run. This is the only
#      idempotency check — no separate marker file needed.
# ---------------------------------------------------------------------------

- name: "Set volume facts ({{ [compose_app_item.name, compose_volume_item.name] | path_join }})"
  ansible.builtin.set_fact:
    compose_volume_full_name: "{{ compose_app_item.name }}_{{ compose_volume_item.name }}"
    compose_volume_legacy_path: >-
      {{ compose_deploy_dir }}/{{ compose_app_item.name }}/{{ compose_volume_item.legacy_path | default(compose_volume_item.name) }}

- name: "Ensure volume exists ({{ compose_volume_full_name }})"
  community.docker.docker_volume:
    name: "{{ compose_volume_full_name }}"
    state: present
    labels:
      homelab.app: "{{ compose_app_item.name }}"
      homelab.volume: "{{ compose_volume_item.name }}"

- name: "Check for legacy bind-mount directory ({{ compose_volume_full_name }})"
  ansible.builtin.stat:
    path: "{{ compose_volume_legacy_path }}"
  register: compose_volume_legacy_stat

- name: "Migrate legacy bind-mount data into volume, once ({{ compose_volume_full_name }})"
  community.docker.docker_container:
    name: "{{ compose_app_item.name }}-{{ compose_volume_item.name }}-migrate"
    image: alpine:latest
    command: ["sh", "-c", "cp -a /old/. /new/"]
    volumes:
      - "{{ compose_volume_legacy_path }}:/old:ro"
      - "{{ compose_volume_full_name }}:/new"
    detach: false
    cleanup: true
    state: started
  when: compose_volume_legacy_stat.stat.exists

- name: "Mark legacy directory as migrated ({{ compose_volume_full_name }})"
  ansible.builtin.command:
    cmd: "mv {{ compose_volume_legacy_path }} {{ compose_volume_legacy_path }}.migrated"
  when: compose_volume_legacy_stat.stat.exists
  changed_when: true
