---
# Reusable single-volume initializer, included once per entry in
# compose_app_item.volumes (see init.yaml).
#
# Ensures the external volume "<app>_<volume>" exists, labelled so it can
# be found later without the app still being in the catalog (see
# cleanup.yaml).

- name: "Set volume facts ({{ [compose_app_item.name, compose_volume_item.name] | path_join }})"
  ansible.builtin.set_fact:
    compose_volume_full_name: "{{ compose_app_item.name }}_{{ compose_volume_item.name }}"

- name: "Ensure volume exists ({{ compose_volume_full_name }})"
  community.docker.docker_volume:
    name: "{{ compose_volume_full_name }}"
    state: present
    labels:
      homelab.app: "{{ compose_app_item.name }}"
      homelab.volume: "{{ compose_volume_item.name }}"
