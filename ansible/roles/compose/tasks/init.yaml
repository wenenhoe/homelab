---
# Reusable single-app initializer. Shared by compose_app (looped once per
# non-infra app) and caddy/bind9 (called directly for their own app, to
# control ordering relative to their own config generation/deploy).
#
# Expects compose_app_item: one fully-resolved entry from compose_apps,
# already merged with app_registry defaults.

- name: Reset extra-changed flag ({{ compose_app_item.name }})
  ansible.builtin.set_fact:
    compose_app_extra_changed: false

- name: Ensure app directories exist ({{ compose_app_item.name }})
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ ['.'] + (compose_app_item.create_dirs | default([])) }}"
  loop_control:
    label: "{{ compose_app_item.name }}/{{ item }}"

- name: Ensure volumes exist and migrate legacy data ({{ compose_app_item.name }})
  ansible.builtin.include_tasks: ensure_volume.yaml
  loop: "{{ compose_app_item.volumes | default([]) }}"
  loop_control:
    loop_var: compose_volume_item
    label: "{{ compose_app_item.name }}/{{ compose_volume_item.name }}"

- name: Find compose and Dockerfile files on the controller ({{ compose_app_item.name }})
  ansible.builtin.find:
    paths: "{{ compose_source_dir }}/{{ compose_app_item.name }}/"
    # Dockerfile* also matches variants like Dockerfile.staging — needed
    # by any build: true app to get its build context onto the target.
    #
    # compose*.yaml.j2 is the same file, just referencing an Ansible var
    # directly instead of staying a plain static file — see the template
    # task below for why, and .j2 is a visible marker for which apps do
    # this (docs/adding-an-app.md). The destination path strips the
    # .j2 suffix back off, so this is invisible past this file.
    patterns:
      - "compose*.yaml"
      - "compose*.yaml.j2"
      - "Dockerfile*"
    # file_type: any, not the default "file" — find's default file_type
    # classifies a symlink as type "link" and never matches it as "file",
    # even with follow: true (that only affects recursion/stat-following,
    # not this classification). Molecule fixtures that symlink straight
    # at a production compose.yaml (see docs/molecule-testing.md) would
    # silently vanish here without this.
    file_type: any
  register: compose_compose_files_raw
  delegate_to: localhost
  become: false

- name: Deploy compose and Dockerfile files to remote host ({{ compose_app_item.name }})
  # template, not copy — every current compose.yaml/Dockerfile without a
  # .j2 suffix contains no Jinja2 syntax, confirmed byte-for-byte
  # identical output either way, so this is transparent everywhere it
  # isn't used. What it buys: an app whose only variable content is
  # non-secret and domain-free (a timezone, a hardcoded port — never a
  # real secret or anything derived from main_domain/lab_domain/
  # caddy_domain, those stay in configs/*.j2 per docs/adding-an-app.md)
  # can reference an Ansible var directly in its compose.yaml.j2 instead
  # of carrying a separate one-line .env just to get it into the
  # container. mode stays 0644 unconditionally — this task has no
  # per-app awareness of which files might contain a secret or the
  # domain, so nothing with that content should ever go through this
  # path (compose.yaml only, never configs).
  ansible.builtin.template:
    src: "{{ item.path }}"
    # .j2 stripped from the deployed filename — docker compose looks for
    # a file literally named compose.yaml, not compose.yaml.j2.
    dest: >-
      {{ compose_deploy_dir }}/{{
        (item.path | regex_replace('^' ~ compose_source_dir ~ '/', ''))
        | regex_replace('\.j2$', '')
      }}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ compose_compose_files_raw.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ project_root ~ '/', '') }}"

# Scripts and configs share the same direct-vs-volume-seeded split.
# Scripts are normalised to config-shaped items (dest "scripts/<name>")
# first, so both feed the same classification/staging/seed-detection
# logic — just via `copy` instead of `template`, since scripts are static.
- name: Classify configs and scripts as direct or volume-seeded ({{ compose_app_item.name }})
  ansible.builtin.set_fact:
    compose_app_deploy_plan: >-
      {%- set volume_names = compose_app_item.volumes | default([]) | map(attribute='name') | list -%}
      {%- set plan = {'configs': {'direct': [], 'seeded': []}, 'scripts': {'direct': [], 'seeded': []}} -%}
      {%- for c in compose_app_item.configs | default([]) -%}
        {%- set volume_name = c.dest.split('/')[0] -%}
        {%- if volume_name in volume_names -%}
          {%- set _ = plan.configs.seeded.append(c | combine({
              'volume_name': volume_name,
              'volume_relpath': c.dest.split('/', 1)[1]
          })) -%}
        {%- else -%}
          {%- set _ = plan.configs.direct.append(c) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for s in compose_app_item.scripts | default([]) -%}
        {%- if 'scripts' in volume_names -%}
          {%- set _ = plan.scripts.seeded.append({'src': s, 'volume_name': 'scripts', 'volume_relpath': s}) -%}
        {%- else -%}
          {%- set _ = plan.scripts.direct.append({'src': s, 'dest': 'scripts/' ~ s}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ plan }}

- name: Ensure staging directories exist for volume-seeded configs and scripts ({{ compose_app_item.name }})
  ansible.builtin.file:
    path: >-
      {{
        (compose_deploy_dir ~ '/' ~ compose_app_item.name ~ '/_staging/'
         ~ item.volume_name ~ '/' ~ item.volume_relpath) | dirname
      }}
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ compose_app_deploy_plan.configs.seeded + compose_app_deploy_plan.scripts.seeded }}"
  loop_control:
    label: "{{ compose_app_item.name }}/_staging/{{ item.volume_name }}/{{ item.volume_relpath }}"

# copy/template don't create missing destination directories, and the
# loop above only covers what create_dirs declares explicitly — a direct
# item's dest (e.g. scripts/<name>) can need a subdirectory nobody
# remembered to add there, so ensure it here instead.
- name: Ensure destination directories exist for direct-deployed configs and scripts ({{ compose_app_item.name }})
  ansible.builtin.file:
    path: "{{ (compose_deploy_dir ~ '/' ~ compose_app_item.name ~ '/' ~ item.dest) | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ compose_app_deploy_plan.configs.direct + compose_app_deploy_plan.scripts.direct }}"
  loop_control:
    label: "{{ compose_app_item.name }}/{{ item.dest }}"

- name: Deploy scripts - direct, not volume-backed ({{ compose_app_item.name }})
  ansible.builtin.copy:
    src: "{{ compose_source_dir }}/{{ compose_app_item.name }}/scripts/{{ item.src }}"
    dest: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ compose_app_deploy_plan.scripts.direct }}"
  loop_control:
    label: "{{ compose_app_item.name }}/{{ item.dest }}"

- name: Copy scripts to staging, for volume seeding ({{ compose_app_item.name }})
  ansible.builtin.copy:
    src: "{{ compose_source_dir }}/{{ compose_app_item.name }}/scripts/{{ item.src }}"
    dest: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/_staging/{{ item.volume_name }}/{{ item.volume_relpath }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ compose_app_deploy_plan.scripts.seeded }}"
  loop_control:
    label: "{{ compose_app_item.name }}/_staging/{{ item.volume_name }}/{{ item.volume_relpath }}"
  register: compose_app_staged_scripts

- name: Deploy config files - direct, not volume-backed ({{ compose_app_item.name }})
  ansible.builtin.template:
    src: "{{ compose_source_dir }}/{{ compose_app_item.name }}/configs/{{ item.src }}"
    dest: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/{{ item.dest }}"
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0644') }}"
    force: "{{ item.force | default(true) }}"
  loop: "{{ compose_app_deploy_plan.configs.direct }}"
  loop_control:
    label: "{{ compose_app_item.name }}/{{ item.dest }}"
  no_log: "{{ item.no_log | default(false) }}"

- name: Render config files to staging, for volume seeding ({{ compose_app_item.name }})
  ansible.builtin.template:
    src: "{{ compose_source_dir }}/{{ compose_app_item.name }}/configs/{{ item.src }}"
    dest: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/_staging/{{ item.volume_name }}/{{ item.volume_relpath }}"
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0644') }}"
    force: "{{ item.force | default(true) }}"
  loop: "{{ compose_app_deploy_plan.configs.seeded }}"
  loop_control:
    label: "{{ compose_app_item.name }}/_staging/{{ item.volume_name }}/{{ item.volume_relpath }}"
  register: compose_app_staged_configs
  no_log: "{{ item.no_log | default(false) }}"

- name: Work out which volumes have changed staged content ({{ compose_app_item.name }})
  ansible.builtin.set_fact:
    compose_app_changed_seed_volumes: >-
      {{
        (
          (compose_app_staged_configs.results | default([]))
          + (compose_app_staged_scripts.results | default([]))
        )
        | selectattr('changed', 'equalto', true)
        | map(attribute='item.volume_name')
        | unique | list
      }}

- name: Seed changed volumes from staging ({{ compose_app_item.name }})
  ansible.builtin.include_tasks: seed_volume.yaml
  loop: "{{ compose_app_item.volumes | default([]) | selectattr('name', 'in', compose_app_changed_seed_volumes) | list }}"
  loop_control:
    loop_var: compose_volume_item
    label: "{{ compose_app_item.name }}/{{ compose_volume_item.name }}"

- name: Roll up extra-changed flag ({{ compose_app_item.name }})
  ansible.builtin.set_fact:
    compose_app_extra_changed: "{{ compose_app_changed_seed_volumes | length > 0 }}"
