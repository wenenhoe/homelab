---
# Ensures the stacks directory exists before any app's files land in it.
# Runs in Play 1 on every host (deploy.yaml), and ahead of init.yaml in
# ci_boot_test.yaml and the Molecule scenarios. The resolved app
# definitions are not built here: `resolved_apps` (group_vars/all/main.yaml)
# is derived from `compose_apps` on demand, and `compose_apps` is never
# reassigned.
- name: Ensure stacks directory exists
  ansible.builtin.file:
    path: "{{ compose_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
