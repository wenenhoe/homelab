---
# Wipe one volume entirely and recreate it empty, then restore only
# whatever Ansible seeds into it (configs/scripts whose dest matches this
# volume — see docs/volumes.md) via a straight re-run of ensure_volume.yaml
# + seed_volume.yaml. Anything the app itself wrote at runtime (a
# database, a cache) is NOT restored — that's the point. Companion to
# volume-file-rm.yaml's single-file removal: this is the "reset
# everything except what Ansible manages" version, for when the file(s)
# to remove aren't known/named individually.
#
# Tears the app's container down (not just stops it) before touching the
# volume - see the note above the docker_volume task below for why.
#
# Expects: compose_app_item (resolved compose_apps entry — needs
# .volumes, so callers must run preinit.yaml first), compose_volume_item
# (one entry from compose_app_item.volumes), compose_reset_volume_confirm.

- name: "Require explicit confirmation ({{ compose_app_item.name ~ '/' ~ compose_volume_item.name }})"
  ansible.builtin.assert:
    that: compose_reset_volume_confirm | default(false) | bool
    fail_msg: >-
      Refusing to run without compose_reset_volume_confirm=true — this
      irreversibly deletes any non-Ansible-managed content in this volume.

- name: "Tear down app before resetting its volume ({{ compose_app_item.name }})"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: absent

# Any OTHER container still referencing this volume (backup_agent mounts
# every backed-up app's volumes read-only into its own always-running
# container) blocks the delete below with a 409 "volume is in use" even
# with the app's own container already gone above — confirmed live
# against backup_agent's lldap_certs mount. Stopping alone doesn't
# release the reference either, same reasoning as the teardown above —
# so whichever compose project(s) those containers belong to get torn
# down here too, and brought back at the very end once the volume is
# safe again. A blocker with no compose project label (an unmanaged,
# hand-run container) falls through this and hits the same 409 the
# delete task always produced — that's an acceptable fallback for a
# situation this role has no safe way to resolve on its own.
- name: "Find any other containers still referencing this volume ({{ compose_app_item.name ~ '_' ~ compose_volume_item.name }})"
  ansible.builtin.command:
    cmd: >-
      docker ps -a
      --filter volume={{ compose_app_item.name }}_{{ compose_volume_item.name }}
      --format {% raw %}'{{ .Label "com.docker.compose.project" }}'{% endraw %}
  register: compose_reset_volume_blocking_raw
  changed_when: false

- name: "Reduce that to the distinct compose projects to tear down and restore"
  ansible.builtin.set_fact:
    compose_reset_volume_blocking_projects: >-
      {{ compose_reset_volume_blocking_raw.stdout_lines
         | reject('equalto', '')
         | reject('equalto', compose_app_item.name)
         | unique | list }}

- name: "Tear down every other project still referencing this volume"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ item }}"
    state: absent
  loop: "{{ compose_reset_volume_blocking_projects }}"
  loop_control:
    label: "{{ item }}"

# docker_volume below fails with "volume is in use" if any container -
# running OR stopped - still references it; only removing the container
# (state: absent above, not stopped) releases that reference. compose's
# external: true on every volume (see docs/volumes.md) means this
# teardown never touches the volume itself, regardless.
- name: "Delete the volume ({{ compose_app_item.name ~ '_' ~ compose_volume_item.name }})"
  community.docker.docker_volume:
    name: "{{ compose_app_item.name }}_{{ compose_volume_item.name }}"
    state: absent

- name: "Recreate the volume empty ({{ compose_app_item.name ~ '_' ~ compose_volume_item.name }})"
  ansible.builtin.include_tasks: ensure_volume.yaml

# ensure_volume.yaml's legacy-migration check above is a no-op here: the
# legacy path (if this app ever had one) was already renamed to
# ".migrated" on its first-ever deploy, so there's nothing left to
# re-copy in - the volume comes back genuinely empty.

- name: "Check whether this volume has Ansible-seeded content ({{ compose_app_item.name ~ '/' ~ compose_volume_item.name }})"
  ansible.builtin.stat:
    path: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}/_staging/{{ compose_volume_item.name }}"
  register: compose_reset_volume_staging

- name: "Restore Ansible-managed content ({{ compose_app_item.name ~ '/' ~ compose_volume_item.name }})"
  ansible.builtin.include_tasks: seed_volume.yaml
  when: compose_reset_volume_staging.stat.exists

- name: "Recreate app ({{ compose_app_item.name }})"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ compose_app_item.name }}"
    state: present

- name: "Recreate every other project that referenced this volume"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_deploy_dir }}/{{ item }}"
    state: present
  loop: "{{ compose_reset_volume_blocking_projects }}"
  loop_control:
    label: "{{ item }}"
