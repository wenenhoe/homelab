---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    compose_app_continue_on_error: false
    app_catalog:
      app_ok_1: {}
      app_fail:
        configs:
          - src: missing.txt.j2
            dest: missing.txt
      app_ok_2: {}
    # Order matters here: app_fail sits between the two healthy apps. If
    # strict mode works, app_ok_1 deploys, app_fail doesn't, and app_ok_2 —
    # positioned after the failure — is never even attempted.
    compose_apps:
      - name: app_ok_1
      - name: app_fail
      - name: app_ok_2
  tasks:
    - name: Resolve compose_apps against the app catalog
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    # In strict mode, the first app's failure re-raises unconditionally
    # (see deploy_one_app.yaml), halting the loop — expected here, since
    # app_fail is deliberately broken. Catch it so Molecule's converge
    # stage doesn't abort before verify.yml ever runs.
    - name: "Run the batch [block / rescue] (app_fail is deliberately broken, halt is expected)"
      block:
        - name: Run compose_app's batch init/deploy
          ansible.builtin.include_role:
            name: compose_app
      rescue:
        # Any failure inside the block would leave the same marker behind and
        # read as a pass. `ansible_failed_task`/`ansible_failed_result` are
        # only populated inside rescue - assert the failure is the strict
        # re-raise for app_fail before trusting it.
        - name: Confirm the halt came from the strict re-raise for app_fail
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Re-raise for strict fail-fast (app_fail)"
              - "'app_fail failed to init/deploy' in ansible_failed_result.msg"
            fail_msg: >-
              compose_app failed, but not for the reason this scenario exists to
              test. Expected the strict re-raise for app_fail; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message:
              {{ ansible_failed_result.msg | default('(no msg)') }}

        - name: Leave a marker proving the batch actually halted as expected
          ansible.builtin.copy:
            dest: /tmp/compose_app_strict_halt_marker
            content: "batch halted as expected\n"
            mode: "0644"
