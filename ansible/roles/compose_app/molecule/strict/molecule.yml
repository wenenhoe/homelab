---
# Covers compose_app_continue_on_error: false — the opposite of the default
# scenario. Same Docker-in-Docker setup as the other compose_app/compose
# scenarios.
driver:
  name: docker
platforms:
  - name: compose-app-strict-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:af9445cb158a35fdd8cee179bae8fb403c3c0e36d15892fc8d522e07699d3b95
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
