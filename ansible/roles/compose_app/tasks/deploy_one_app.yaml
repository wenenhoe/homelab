---
# One iteration of the batch loop in main.yaml, kept in a separate file
# because block/rescue can't combine with `loop:` directly — the loop has
# to wrap an include, and block/rescue has to live inside what's included.
#
# Not just style: `ignore_errors: true` on a looped include does NOT stop
# one app's failure from halting the rest of the loop (see
# github.com/ansible/ansible/issues/70311 — it only suppresses the
# reported failure, not the host-marked-failed/skip-rest-of-loop
# behavior). Catching the error here, before it reaches the loop
# machinery, is what actually lets the batch continue.

# Tagged per-task below, not on the block itself: a tag on a block runs
# every nested task unconditionally, including untagged tasks reached
# through further includes (e.g. compose/tasks/init.yaml) — which would
# defeat a narrowly-scoped --tags images run.
- name: "Init and deploy [block / rescue]: {{ compose_app_target.name }}"
  block:
    - name: "Reset per-app changed flag ({{ compose_app_target.name }})"
      ansible.builtin.set_fact:
        compose_app_deploy_changed: false
      tags:
        - images

    - name: "Init and deploy ({{ compose_app_target.name }})"
      ansible.builtin.include_role:
        name: compose
        tasks_from: main
      vars:
        compose_app_item: "{{ compose_app_target }}"
      tags:
        - images

    - name: "Record result ({{ compose_app_target.name }})"
      ansible.builtin.set_fact:
        compose_app_results: >-
          {{
            compose_app_results | default([]) + [{
              'name': compose_app_target.name,
              'status': (compose_app_deploy_changed | default(false)) | ternary('changed', 'ok')
            }]
          }}
      tags:
        - images
  rescue:
    - name: "Record failure ({{ compose_app_target.name }})"
      ansible.builtin.set_fact:
        compose_app_results: "{{ compose_app_results | default([]) + [{'name': compose_app_target.name, 'status': 'failed'}] }}"
      when: compose_app_continue_on_error | bool
      tags:
        - images

    - name: "Re-raise for strict fail-fast ({{ compose_app_target.name }})"
      ansible.builtin.fail:
        msg: >-
          {{ compose_app_target.name }} failed to init/deploy
          (compose_app_continue_on_error is false - stopping here rather
          than attempting the remaining apps).
      when: not (compose_app_continue_on_error | bool)
      tags:
        - images
