---
# Batch init + deploy for every app that isn't self-managed (bind9, caddy).
# Runs last (Play 4), once DNS is serving the zones and caddy is already
# routing — bind9 and caddy resolve/init/deploy themselves earlier (Play 2
# / Play 3), see roles/caddy and roles/bind9. Non-infra apps don't get their
# files/dirs provisioned until here either — no reason to have them on disk
# any earlier than right before they start.

- name: Reset per-run deploy results
  ansible.builtin.set_fact:
    compose_app_results: []

- name: Init and deploy each non-infra app
  ansible.builtin.include_tasks: deploy_one_app.yaml
  loop: "{{ compose_apps | rejectattr('name', 'in', compose_self_managed_apps | default(['bind9', 'caddy'])) | list }}"
  loop_control:
    loop_var: compose_app_target
    label: "{{ compose_app_target.name }}"

- name: Report per-app deploy summary
  ansible.builtin.debug:
    msg:
      ok: "{{ compose_app_results | selectattr('status', 'equalto', 'ok') | map(attribute='name') | list }}"
      changed: "{{ compose_app_results | selectattr('status', 'equalto', 'changed') | map(attribute='name') | list }}"
      failed: "{{ compose_app_results | selectattr('status', 'equalto', 'failed') | map(attribute='name') | list }}"
  # display_ok_hosts=no (see ansible.cfg) hides routine "ok" task noise -
  # including this one, since debug never reports changed=true on its own.
  # Forcing changed_when routes it through the branch that's never hidden,
  # so the summary always shows even with that noise reduction on.
  changed_when: true

- name: Fail if any app failed to deploy
  ansible.builtin.fail:
    msg: >-
      {{ compose_app_results | selectattr('status', 'equalto', 'failed') | map(attribute='name') | list | length }}
      app(s) failed to deploy: {{ compose_app_results | selectattr('status', 'equalto', 'failed') | map(attribute='name') | list }}
  when: compose_app_results | selectattr('status', 'equalto', 'failed') | list | length > 0
