---
# The fingerprint of the key that signs Docker's apt repository, as Docker's
# install page for Ubuntu states it. The role stops when the downloaded key is
# any other, or holds more than this one.
docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

# Merged into /etc/docker/daemon.json by tasks/daemon_config.yaml. A daemon
# default applies to containers created after Docker restarts; a container
# keeps the logging it was created with until it is recreated.
# `no-new-privileges` is the only privilege default dockerd accepts; there is
# no daemon-wide cap_drop.
docker_daemon_defaults:
  no-new-privileges: true
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
