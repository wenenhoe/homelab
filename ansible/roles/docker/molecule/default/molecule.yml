---
# The docker role installs Docker Engine itself, so this needs a real
# Docker-in-Docker setup: a privileged, systemd-enabled container with
# /sys/fs/cgroup exposed so systemd (and, once installed, dockerd) can
# manage services inside it. geerlingguy/docker-*-ansible images ship
# python3 + systemd as PID 1 for exactly this.
driver:
  name: docker
platforms:
  - name: docker-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
