---
# The docker role installs Docker Engine itself, so this scenario needs a
# real Docker-in-Docker setup: a privileged, systemd-enabled container with
# /sys/fs/cgroup exposed so systemd (and, once installed, dockerd) can
# actually manage services inside it. geerlingguy/docker-*-ansible images
# are built for exactly this — they ship python3 + systemd as PID 1.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: docker-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
