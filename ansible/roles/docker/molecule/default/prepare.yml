---
# Runs before converge. This exists purely because the test container's own
# root filesystem is already overlay-mounted by the *host's* Docker — the
# overlay2 driver can't stack a second overlay filesystem on top of that
# ("failed to mount ... fstype: overlay ... err: invalid argument"). vfs is
# slower and skips copy-on-write, but it's the reliable fallback for nested
# Docker and is fine for the small test images used here. Real target hosts
# (bare metal/VMs) don't have this problem and should keep using overlay2 —
# this is test-scaffolding only, not something the role itself should set.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Ensure /etc/docker exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Force the nested Docker daemon onto the vfs storage driver
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "storage-driver": "vfs"
          }
        mode: "0644"
