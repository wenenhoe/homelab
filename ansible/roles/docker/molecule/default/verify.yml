---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert docker.service is running and enabled
      ansible.builtin.assert:
        that:
          - "'docker.service' in ansible_facts.services"
          - ansible_facts.services['docker.service'].state == 'running'
          - ansible_facts.services['docker.service'].status == 'enabled'
        fail_msg: "docker.service is not running/enabled: {{ ansible_facts.services.get('docker.service', 'not found') }}"

    - name: Confirm the Docker daemon actually responds
      community.docker.docker_host_info:
      register: docker_info

    - name: Run a real container end-to-end to prove the daemon works, not just the unit file
      ansible.builtin.command: docker run --rm hello-world
      register: hello_world
      changed_when: false
      failed_when: "'Hello from Docker!' not in hello_world.stdout"

    - name: Confirm the test user was added to the docker group
      ansible.builtin.getent:
        database: group
        key: docker
      failed_when: "'molecule_test_user' not in ansible_facts.getent_group['docker'][2].split(',')"
