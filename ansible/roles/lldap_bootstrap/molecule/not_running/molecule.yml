---
# Confirms the "no running lldap" guard actually fires and fails
# loudly, instead of that branch only ever being a coverage gap —
# mirrors seaweedfs_bucket's `wrong_credentials` / backup_agent's
# `conflict` in spirit: the point isn't the happy path, it's proving
# the negative case still fails loudly.
driver:
  name: docker
platforms:
  - name: lldap-bootstrap-not-running-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
