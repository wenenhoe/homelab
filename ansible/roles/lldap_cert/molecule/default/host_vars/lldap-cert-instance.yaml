---
# Must live here, not in converge.yml's play `vars:` — same reasoning as
# tinyauth/molecule/default's own host_vars: keeps every var resolvable
# the same way real inventory data is.
#
# lldap_host is "lldap" here (not "lldap-test" the way
# start_lldap_test_target.yaml's throwaway fixture uses) because this
# scenario deploys the real docker/lldap/compose.yaml, whose
# container_name is genuinely "lldap" — lldap_cert's own defaults
# already assume that name matches production.
main_domain: molecule.test
lab_domain: "lan.{{ main_domain }}"
caddy_domain: "sec.{{ lab_domain }}"
lldap_host: lldap
server_timezone: Asia/Singapore

# Throwaway values — real ones are Ansible-generated (secrets role),
# which doesn't run in this role-isolated scenario.
lldap_jwt_secret: molecule-test-jwt-secret
lldap_key_seed: molecule-test-key-seed
lldap_ldap_user_pass: molecule-test-admin-password

# The throwaway step-ca-test instance's own bootstrap password
# (molecule_helpers_step_ca_password in converge.yml) doubles as its
# stock DOCKER_STEPCA_INIT_PASSWORD-derived provisioner password, and its
# default provisioner is named "admin" — matching the official image's
# own DOCKER_STEPCA_INIT_PROVISIONER_NAME default, not production's
# "internal-services" (docker/step-ca's own custom-entrypoint bootstrap
# isn't used here — see start_step_ca_test_target.yaml's own comment).
step_ca_provisioner_password: molecule-test-step-ca-password
step_ca_provisioner_name: admin

# telegram_notify's install.yaml (included from lldap_cert's own
# tasks/main.yaml) needs these — see docs/telegram-notifications.md.
telegram_token: molecule-dummy-telegram-token
telegram_chat_id: molecule-dummy-chat-id
telegram_topic_id_certs: ""
# step-ca-test's own container name: lldap_cert's own tasks run `step`
# via a container on caddy-proxy now, not a host-installed binary, so it
# resolves "step-ca-test" the same way any other container on that
# network does. See docs/step-ca.md's Network section.
lldap_cert_step_ca_url: https://step-ca-test:9000

# Real production shape (ansible/inventory/group_vars/all/app_registry.yaml's
# lldap entry) — extracted via lookup rather than hand-copied. This used
# to be a hand-authored copy kept in sync "by convention" per this
# comment's previous wording; it had already drifted (missing the real
# entry's backup: and caddy: keys) by the time that was checked, which
# is the whole reason it's a lookup now instead — see
# docs/molecule-fixtures.md.
app_registry: >-
  {{
    (lookup('file', playbook_dir ~ '/../../../../inventory/group_vars/all/app_registry.yaml')
     | from_yaml).app_registry
  }}

compose_apps:
  - name: lldap
