---
- name: Verify
  hosts: all
  become: true
  vars:
    lldap_cert_step_ca_url: https://step-ca-test:9000
  tasks:
    - name: Discover the lldap certs volume's real host path
      community.docker.docker_volume_info:
        name: lldap_certs
      register: lldap_cert_verify_volume

    - name: Set the mountpoint fact
      ansible.builtin.set_fact:
        lldap_cert_verify_mountpoint: "{{ lldap_cert_verify_volume.volume.Mountpoint }}"

    - name: Confirm the cert files actually exist
      ansible.builtin.stat:
        path: "{{ lldap_cert_verify_mountpoint }}/{{ item }}"
      register: lldap_cert_verify_files
      loop:
        - fullchain.pem
        - privkey.pem
      failed_when: not lldap_cert_verify_files.stat.exists

    - name: Confirm the cert's SANs cover both the bare name and the FQDN
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ lldap_cert_verify_mountpoint }}/fullchain.pem"
          - -noout
          - -ext
          - subjectAltName
      register: lldap_cert_verify_sans
      changed_when: false
      failed_when: >-
        'DNS:lldap' not in lldap_cert_verify_sans.stdout
        or 'DNS:lldap.sec.lan.molecule.test' not in lldap_cert_verify_sans.stdout

    - name: Confirm lldap actually recovered from its cold-volume crash loop
      community.docker.docker_container_info:
        name: lldap
      register: lldap_cert_verify_lldap_info
      failed_when: lldap_cert_verify_lldap_info.container.State.Status != 'running'

    - name: Confirm the renewal timer is enabled and active
      ansible.builtin.systemd_service:
        name: cert-renewer@lldap.timer
      register: lldap_cert_verify_timer_info
      failed_when: >-
        lldap_cert_verify_timer_info.status.UnitFileState != 'enabled'
        or lldap_cert_verify_timer_info.status.ActiveState != 'active'

    # This scenario deliberately still doesn't exercise the timer's own
    # ExecCondition gating end to end — that's `renewal_timing`'s job
    # (a real 1-minute cert against step certificate needs-renewal's
    # documented 66%-of-lifetime default). What's tested here instead:
    # the exact commands ExecStart/ExecStartPost run, run directly,
    # produce the real side effects they're supposed to — a useful,
    # fast check on its own, just not the same claim as "the timer's
    # gating logic is correct".
    - name: Record the cert's serial number before a direct renewal
      ansible.builtin.command: openssl x509 -in {{ lldap_cert_verify_mountpoint }}/fullchain.pem -noout -serial
      register: lldap_cert_verify_serial_before
      changed_when: false

    - name: Run the exact renewal command ExecStart would run
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - root
          - --network
          - caddy-proxy
          - -v
          - lldap_certs:/certs
          - -v
          - /etc/step-ca/root_ca.crt:/root_ca.crt:ro
          - smallstep/step-cli:0.30.2
          - step
          - ca
          - renew
          - --force
          - --ca-url
          - "{{ lldap_cert_step_ca_url }}"
          - --root
          - /root_ca.crt
          - /certs/fullchain.pem
          - /certs/privkey.pem
      changed_when: true

    - name: Record the cert's serial number after
      ansible.builtin.command: openssl x509 -in {{ lldap_cert_verify_mountpoint }}/fullchain.pem -noout -serial
      register: lldap_cert_verify_serial_after
      changed_when: false
      failed_when: lldap_cert_verify_serial_after.stdout == lldap_cert_verify_serial_before.stdout

    - name: Record lldap's start time before a direct ExecStartPost run
      community.docker.docker_container_info:
        name: lldap
      register: lldap_cert_verify_restart_before

    - name: Run the exact restart command ExecStartPost would run
      ansible.builtin.command: docker compose -f /opt/stacks/lldap/compose.yaml restart lldap
      changed_when: true

    # StartedAt, not RestartCount: RestartCount only tracks restarts the
    # container's own restart *policy* drives (recovering from a crash),
    # never a manual `docker restart`/`docker compose restart` — it
    # stayed 0 here even though the container demonstrably did restart,
    # confirmed live. StartedAt changes on every restart regardless of
    # cause, the same signal backup_agent's own scenario already uses
    # for this exact kind of assertion (see docs/molecule-testing.md).
    - name: Record lldap's start time after
      community.docker.docker_container_info:
        name: lldap
      register: lldap_cert_verify_restart_after
      failed_when: >-
        lldap_cert_verify_restart_after.container.State.StartedAt
        == lldap_cert_verify_restart_before.container.State.StartedAt

    - name: Read back telegram-notify's rendered env file
      ansible.builtin.slurp:
        path: /etc/telegram-notify/env
      register: lldap_cert_verify_notify_env_raw

    - name: Confirm it carries the scenario's dummy bot credentials, not empty/template-literal values
      ansible.builtin.assert:
        that:
          - "'TELEGRAM_TOKEN=molecule-dummy-telegram-token' in (lldap_cert_verify_notify_env_raw.content | b64decode)"
          - "'TELEGRAM_CHAT_ID=molecule-dummy-chat-id' in (lldap_cert_verify_notify_env_raw.content | b64decode)"

    - name: Read back the rendered telegram-notify@ unit
      ansible.builtin.command: systemctl cat telegram-notify@lldap.service
      register: lldap_cert_verify_notify_unit
      changed_when: false

    - name: Confirm message_thread_id is omitted when no topic ID is configured (this scenario's telegram_topic_id_certs is blank)
      ansible.builtin.assert:
        that:
          # 'message_thread_id=' (with the '='), not the bare word — the
          # template's own explanatory comment mentions the bare word
          # unconditionally, so matching on that alone doesn't actually
          # test the conditional; only the '=' form is exclusive to the
          # rendered ExecStart line.
          - "'message_thread_id=' not in lldap_cert_verify_notify_unit.stdout"
        fail_msg: >-
          message_thread_id= appeared despite a blank telegram_topic_id_certs
          — the Jinja conditional in telegram-notify@.service.j2 regressed.

    # --- telegram-notify@ wiring -----------------------------------------
    # Doesn't exercise a real Telegram delivery (no live bot/network in
    # CI) — that part still needs a manual live check, see
    # docs/telegram-notifications.md. What this confirms instead: the
    # OnFailure= link is actually present, and the templated unit loads
    # and runs cleanly under real systemd rather than just "the file
    # looks right" (catches quoting/escaping bugs the static content
    # check below can't).
    - name: Confirm cert-renewer@ actually declares the OnFailure link
      ansible.builtin.command: systemctl cat cert-renewer@lldap.service
      register: lldap_cert_verify_onfailure
      changed_when: false
      failed_when: "'OnFailure=telegram-notify@%i.service' not in lldap_cert_verify_onfailure.stdout"

    - name: Start telegram-notify@lldap.service directly, as OnFailure= would
      # Deliberately raw systemctl, not the systemd_service module — same
      # reasoning renewal_timing/verify.yml already documents for
      # Type=oneshot units: the module's own success/failure handling
      # (and, confirmed live here, whether its registered result even
      # includes a `status` key) isn't reliable for a oneshot whose
      # ExecStart is expected to fail. The command's own exit code is
      # irrelevant either way — no real Telegram creds in CI — so this
      # only cares about the state queries below.
      ansible.builtin.command: systemctl start telegram-notify@lldap.service  # noqa: command-instead-of-module
      failed_when: false
      changed_when: false

    # Two separate `show` calls, not one `--property=LoadState,ActiveState`
    # — systemctl show's own multi-property output order follows DBus
    # property order, not the order given on the command line (see
    # systemd/systemd#28205), so indexing into combined output by
    # position isn't safe. One property per call has no such ambiguity.
    - name: Query the unit's actual LoadState
      ansible.builtin.command: systemctl show telegram-notify@lldap.service --property=LoadState --value
      register: lldap_cert_verify_notify_loadstate
      changed_when: false

    - name: Query the unit's actual ActiveState
      ansible.builtin.command: systemctl show telegram-notify@lldap.service --property=ActiveState --value
      register: lldap_cert_verify_notify_activestate
      changed_when: false

    - name: Confirm systemd actually loaded and ran the unit (not a syntax/templating error)
      ansible.builtin.assert:
        that:
          - lldap_cert_verify_notify_loadstate.stdout | trim == 'loaded'
          - (lldap_cert_verify_notify_activestate.stdout | trim) in ['inactive', 'failed']
        fail_msg: >-
          telegram-notify@lldap.service didn't load/run cleanly:
          LoadState={{ lldap_cert_verify_notify_loadstate.stdout | trim }}
          ActiveState={{ lldap_cert_verify_notify_activestate.stdout | trim }}
          — 'failed' here just means curl couldn't reach the real API
          (expected in CI), 'not-found' or 'masked' would mean the unit
          itself is broken.
