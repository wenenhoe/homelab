---
# Shared prepare playbook for every Docker-in-Docker Molecule scenario
# still on the bare geerlingguy base image: installs Docker itself,
# forces the nested daemon onto /etc/docker/daemon.json's fuse-overlayfs
# storage driver, and installs python3-requests for community.docker
# modules that talk to the Docker API directly (docker_volume,
# docker_host_info) rather than through the CLI plugin the docker role
# already installs.
#
# Scenarios on ghcr.io/wenenhoe/molecule-dind (docker/molecule-dind/Dockerfile)
# already have all three baked in and use prepare_dind_prebuilt.yml
# instead — see that file's own comment for which. docker/default is
# never migrated to the pre-baked image: it tests that installation from
# a clean base, and baking Docker in would make that test tautological.
#
# NOT used by bind9 — it manages its own daemon.json for DNS settings and
# would fight over the same file, so it uses a systemd drop-in override
# for the storage driver instead (see its own prepare.yml). bind9 does
# still call install_docker_api_requests.yaml on its own.
#
# Referenced from scenario molecule.yml files via:
#   provisioner:
#     playbooks:
#       prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
# instead of each scenario keeping its own identical copy.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Reset coverage data from any previous test run
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: reset_coverage_data.yaml

    - name: Force the nested Docker daemon onto the fuse-overlayfs storage driver
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: dind_storage_driver.yaml

    - name: Install python3-requests
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: install_docker_api_requests.yaml
      # docker_volume/docker_host_info talk to the Docker API directly via
      # requests, unlike docker_compose_v2 which only needs the CLI plugin
      # the docker role already installs.
