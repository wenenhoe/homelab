---
# Shared by every Docker-in-Docker scenario that manages Docker via
# /etc/docker/daemon.json (all except bind9, which manages its own
# daemon.json for DNS settings and uses a systemd drop-in override instead
# — see its own prepare.yml).
#
# Needed because the test container's own root filesystem is already
# overlay-mounted by the host's Docker — overlay2 can't stack a second
# overlay on top of that ("failed to mount ... fstype: overlay ... err:
# invalid argument"). vfs is slower and skips copy-on-write, but it's the
# reliable DinD fallback and fine for these small test images. Real
# target hosts don't have this problem and should keep using overlay2 —
# this is test-scaffolding only.
- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Force the nested Docker daemon onto the vfs storage driver
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "storage-driver": "vfs"
      }
    mode: "0644"
