---
# Shared by any scenario wired into ansible/molecule-coverage/ (see its
# README). The callback plugin appends to its JSONL rather than
# truncating it, so repeated `molecule test` runs would otherwise
# accumulate stale data. Included at the start of each scenario's prepare
# step to delete that scenario's JSONL, so converge/idempotence/verify
# all append into a fresh file for that one run.
#
# Safe to include even without coverage wired up — a no-op if
# MOLECULE_COVERAGE_DIR isn't set.
- name: Reset this scenario's molecule-coverage JSONL, if coverage is wired up
  ansible.builtin.file:
    path: "{{ _coverage_dir }}/{{ _role_name }}/{{ _scenario_name }}.jsonl"
    state: absent
  vars:
    _coverage_dir: "{{ lookup('env', 'MOLECULE_COVERAGE_DIR') }}"
    _role_name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
    _scenario_name: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') }}"
  delegate_to: localhost
  run_once: true
  become: false
  when: lookup('env', 'MOLECULE_COVERAGE_DIR') | length > 0
