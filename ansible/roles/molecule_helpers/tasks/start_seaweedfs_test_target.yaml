---
# Starts a real, throwaway SeaweedFS S3 target — shared by
# backup_agent/default, seaweedfs_bucket/default, and
# seaweedfs_bucket/wrong_credentials. Extracted after the third
# near-identical copy; each carried the same hard-won lessons
# independently before this existed:
#   - a real -s3.config identity, not anonymous mode (anonymous tolerates
#     some clients' signed requests but not others', and never verifies
#     the identity's scope is sufficient)
#   - -filer is required, or the S3 gateway never actually listens
#   - readiness checked against the FILER port (8888), not S3 (8333) — S3
#     needs real signed credentials once a real identity is configured,
#     so an unauthenticated check there gets rejected even when healthy
#   - checked by IP, not hostname — SeaweedFS binds to its
#     advertised/detected IP, not loopback. The container's own hostname
#     doesn't reliably resolve from within itself either (confirmed live:
#     "wget: bad address 'seaweedfs-test:8888'" on Docker's default
#     bridge network — an earlier version of this file assumed it did).
#     That also rules out a native Docker HEALTHCHECK, since its CMD runs
#     inside the container and hits the same resolution failure —
#     readiness is polled externally by IP instead.
#
# Required vars: molecule_helpers_seaweedfs_access_key/secret_key
# (credentials for the identity config), molecule_helpers_seaweedfs_bucket
# (bucket the identity is scoped to).
#
# Optional: molecule_helpers_seaweedfs_identity_json — a complete,
# pre-rendered identity config (string) to use verbatim instead of the
# single-identity default below. For scenarios testing the real
# production identity template's scoping rather than just "is a backup
# reachable" — access/secret_key above are unused in that case, but
# still required (used nowhere, but every caller already sets them, so
# making this identity_json path skip that requirement isn't worth the
# extra conditional).
#
# Optional: molecule_helpers_seaweedfs_network_name — attach to this
# docker network at creation time (SeaweedFS likely binds to whichever
# address is available at startup), for callers whose own role already
# created a custom network other test containers must share. Omit to use
# the default bridge network.
#
# Exposes molecule_helpers_seaweedfs_ip after returning, so callers don't
# need to re-discover the container's IP themselves.

- name: Render an S3 identity config for the test SeaweedFS target
  ansible.builtin.copy:
    dest: /tmp/seaweedfs-test-s3-identity.json
    mode: "0644"
    content: >-
      {% if molecule_helpers_seaweedfs_identity_json is defined -%}
      {{ molecule_helpers_seaweedfs_identity_json }}
      {%- else -%}
      {
        "identities": [
          {
            "name": "molecule-test",
            "credentials": [
              {
                "accessKey": "{{ molecule_helpers_seaweedfs_access_key }}",
                "secretKey": "{{ molecule_helpers_seaweedfs_secret_key }}"
              }
            ],
            "actions": [
              "Write:{{ molecule_helpers_seaweedfs_bucket }}",
              "Read:{{ molecule_helpers_seaweedfs_bucket }}",
              "List:{{ molecule_helpers_seaweedfs_bucket }}",
              "Tagging:{{ molecule_helpers_seaweedfs_bucket }}",
              "Admin:{{ molecule_helpers_seaweedfs_bucket }}"
            ]
          }
        ]
      }
      {%- endif %}

- name: Run a throwaway SeaweedFS S3 target for this scenario
  community.docker.docker_container:
    name: seaweedfs-test
    image: ghcr.io/chrislusf/seaweedfs:4.42
    command: "server -dir=/data -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-identity.json"
    volumes:
      - /tmp/seaweedfs-test-s3-identity.json:/etc/seaweedfs/s3-identity.json:ro
    state: started
    detach: true
    networks: >-
      {{ [{'name': molecule_helpers_seaweedfs_network_name}]
         if molecule_helpers_seaweedfs_network_name | default('')
         else omit }}

- name: Query seaweedfs-test's info to discover its IP
  community.docker.docker_container_info:
    name: seaweedfs-test
  register: molecule_helpers_seaweedfs_info

- name: Extract seaweedfs-test's IP on whichever network it landed on
  ansible.builtin.set_fact:
    molecule_helpers_seaweedfs_ip: >-
      {{ molecule_helpers_seaweedfs_info.container.NetworkSettings.Networks[
           molecule_helpers_seaweedfs_network_name | default('bridge', true)
         ].IPAddress }}

# .rc is a proven-reliable field for docker_container_exec (already used
# elsewhere in this project) — unlike docker_container's murkier
# detach:false failure shape, which didn't behave as assumed on two
# earlier attempts. `until` retries either way.
#
# command: must be a plain string here, not a YAML list, unlike
# docker_container's command: — confirmed the hard way: a list rendered
# as a single stringified executable name ("[wget,") that didn't exist
# in $PATH.
- name: Wait for SeaweedFS's filer port to accept connections
  community.docker.docker_container_exec:
    container: seaweedfs-test
    command: "wget -q --spider http://{{ molecule_helpers_seaweedfs_ip }}:8888/"
  register: molecule_helpers_seaweedfs_ready
  until: molecule_helpers_seaweedfs_ready.rc == 0
  retries: 15
  delay: 2
  changed_when: false
