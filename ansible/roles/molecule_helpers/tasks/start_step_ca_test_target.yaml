---
# Starts a real, throwaway step-ca instance — used by step_ca_client's,
# step_ca_cert's, and tinyauth_ca_trust's own Molecule scenarios, all of
# which need a genuine CA to issue/trust certs against, not a mock.
#
# Deliberately the official image driven by its own stock
# DOCKER_STEPCA_INIT_* auto-init, the same technique
# .github/scripts/seed-lldap-ci-cert.sh uses for compose-boot-test — this
# is a fully throwaway CA that only needs to exist for the scenario's
# lifetime, so docker/step-ca's own separate-passwords/claim-duration
# machinery doesn't apply here.
#
# Required vars:
#   molecule_helpers_step_ca_network_name — a user-defined Docker
#     network (not the default bridge): embedded DNS-by-name is what
#     lets consumers reach this container by its name.
#   molecule_helpers_step_ca_password — the CA's init password
#     (DOCKER_STEPCA_INIT_PASSWORD); callers set it and reuse it to
#     issue certs against this instance.
#
# Optional:
#   molecule_helpers_step_ca_container_name (default: step-ca-test) —
#     the container's name and DNS name. A container name is unique on
#     a Docker daemon, so two scenarios running at once each pass their
#     own; vars/helper_names.yml derives one from the scenario.
#
# Exposes molecule_helpers_step_ca_root_cert for callers that need to
# fetch the root directly, without a second docker_container_exec
# round-trip.

- name: Set this helper's optional-var defaults
  ansible.builtin.set_fact:
    molecule_helpers_step_ca_container_name: "{{ molecule_helpers_step_ca_container_name | default('step-ca-test') }}"

- name: Run a throwaway step-ca instance for this scenario
  community.docker.docker_container:
    name: "{{ molecule_helpers_step_ca_container_name }}"
    image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    env:
      DOCKER_STEPCA_INIT_NAME: "Molecule Throwaway CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "{{ molecule_helpers_step_ca_container_name }}"
      DOCKER_STEPCA_INIT_PASSWORD: "{{ molecule_helpers_step_ca_password }}"
    # The image's HEALTHCHECK sets no interval, so the daemon's 30s default
    # delays the first "healthy" by 30s. test_cli_compatible keeps the
    # image's own check: without it, omitting `test` disables the check.
    healthcheck:
      test_cli_compatible: true
      interval: 2s
    networks:
      - name: "{{ molecule_helpers_step_ca_network_name }}"
    state: started
    detach: true

- name: Wait for the step-ca container to report healthy
  community.docker.docker_container_info:
    name: "{{ molecule_helpers_step_ca_container_name }}"
  register: molecule_helpers_step_ca_info
  until: >-
    molecule_helpers_step_ca_info.container.State.Health.Status | default('') == 'healthy'
  retries: 30
  delay: 2

- name: Read the step-ca container's root cert
  community.docker.docker_container_exec:
    container: "{{ molecule_helpers_step_ca_container_name }}"
    command: cat /home/step/certs/root_ca.crt
  register: molecule_helpers_step_ca_root_cert_read
  changed_when: false

- name: Expose the root cert content as a fact for callers
  ansible.builtin.set_fact:
    molecule_helpers_step_ca_root_cert: "{{ molecule_helpers_step_ca_root_cert_read.stdout }}"
