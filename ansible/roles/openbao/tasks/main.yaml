---
# openbao is self-managed (like caddy/bind9 — see
# compose_self_managed_apps in group_vars/all/main.yaml): its data
# volume needs chowning to the image's own non-root user before first
# start, and that fix has to be a plain guarded `docker run`, not a
# compose service — see docs/openbao.md's "Non-root user" section for
# why a one-shot compose service doesn't work here.

- name: Resolve openbao's own compose_apps entry, if present
  ansible.builtin.set_fact:
    openbao_compose_app_matches: "{{ compose_apps | selectattr('name', 'equalto', 'openbao') | list }}"
  tags:
    - always

- name: Record whether openbao is present in compose_apps
  ansible.builtin.set_fact:
    openbao_has_compose_app: "{{ openbao_compose_app_matches | length > 0 }}"
    openbao_compose_app_item: "{{ openbao_compose_app_matches | first if openbao_compose_app_matches | length > 0 else {} }}"
  tags:
    - always

- name: Init openbao's own compose app files and directories
  ansible.builtin.include_role:
    name: compose
    tasks_from: init
  vars:
    compose_app_item: "{{ openbao_compose_app_item }}"
  when: openbao_has_compose_app

# A one-shot compose service for this doesn't work: Compose always
# reports a completed `restart: "no"` container as needing to run
# again on every `up`, showing `changed` forever —
# ./molecule-test-all.sh step_ca_cert caught this directly via its
# idempotence check. See docs/openbao.md for the full story. A plain,
# guarded `docker run` (below) has no such issue.
- name: "Ensure the data volume is owned by the openbao user, not root [block]"
  when: openbao_has_compose_app
  block:
    - name: Read the openbao image's own non-root UID
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "{{ openbao_image }}"
          - id
          - -u
          - openbao
      register: openbao_expected_uid
      changed_when: false

    - name: Discover the data volume's real host path
      community.docker.docker_volume_info:
        name: "{{ openbao_data_volume_name }}"
      register: openbao_data_volume_info

    - name: Check the data volume's current owner
      ansible.builtin.stat:
        path: "{{ openbao_data_volume_info.volume.Mountpoint }}"
      register: openbao_data_owner

    - name: Chown the data volume to the openbao user
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - root
          - -v
          - "{{ openbao_data_volume_name }}:/openbao/data"
          - "{{ openbao_image }}"
          - chown
          - -R
          - openbao:openbao
          - /openbao/data
      when: openbao_data_owner.stat.uid | string != openbao_expected_uid.stdout | trim
      changed_when: true

- name: Deploy openbao with Docker Compose
  ansible.builtin.include_role:
    name: compose
    tasks_from: deploy
  vars:
    compose_app_item: "{{ openbao_compose_app_item }}"
  when: openbao_has_compose_app
  tags:
    - images
