---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    # Only used by gpg-public-key.asc.j2's lookup — points at the one
    # shared test-only key in molecule_helpers, not a per-scenario copy
    # or the real production key. Same expression backup_agent's own
    # converge.yml uses, same depth (roles/<role>/molecule/default/).
    project_root: "{{ (playbook_dir ~ '/../../../molecule_helpers') | realpath }}"
    # Fake, structurally-shaped R2/B2 leaves — real credentials aren't
    # reachable from CI regardless (same reasoning cloud_sync's own
    # scenario states). This only needs to prove the role renders
    # openbao_snapshot_targets into rclone.conf correctly, not that the
    # values are live-usable.
    openbao_snapshot_targets:
      r2:
        bucket: openbao-snapshots
        endpoint: "https://molecule-fake-account.r2.cloudflarestorage.com"
        access_key: "molecule-fake-r2-access-key"
        secret_key: "molecule-fake-r2-secret-key"
        region: "auto"
      b2:
        bucket: openbao-snapshots
        endpoint: "https://s3.us-west-004.backblazeb2.com"
        access_key: "molecule-fake-b2-access-key"
        secret_key: "molecule-fake-b2-secret-key"
        region: "us-west-004"
  tasks:
    - name: Include openbao_backup role
      ansible.builtin.include_role:
        name: openbao_backup
