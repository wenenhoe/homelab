---
# openbao_backup needs nothing beyond a container with Python present —
# no systemd, no privileged mode, no Docker-in-Docker. Every task is a
# plain file/template render (see the role itself), no `when:` and no
# loops, so a single scenario naturally exercises 100% of it — same
# reasoning as roles/apt's own minimal pattern.
driver:
  name: docker
platforms:
  - name: openbao-backup-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
