---
# Same tag as docker/openbao/compose.yaml.j2 / ansible/roles/openbao's
# own pin — kept in sync by hand, same as those two already are with
# each other. Bump this and openbao_cli_deb_sha256 below together: Renovate
# (.github/renovate.json5) moves both, taking the hash from the digest GitHub
# lists for the .deb.
openbao_cli_version: "2.7.2"

# Renamed upstream from the "bao_*" naming its predecessor project
# used. The release assets are "openbao_<version>_linux_amd64.deb";
# "bao_<version>_linux_amd64.deb" 404s.
openbao_cli_deb_name: "openbao_{{ openbao_cli_version }}_linux_amd64.deb"
openbao_cli_deb_url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_cli_version }}/{{ openbao_cli_deb_name }}"

# The release's checksums.txt lists the same hash, GPG-signed as
# checksums.txt.gpgsig. CI checks this pin against that signed file with the
# key committed under tools/ci/checksums/keys/ — see
# docs/topics/engineering/ci/release-checksum-check.md.
openbao_cli_deb_sha256: "42bd0890a8e2060e5f29410ea828ee047aa2de21028045731a0516d5a532928c"
