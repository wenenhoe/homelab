---
# Same tag as docker/openbao/compose.yaml.j2 / ansible/roles/openbao's
# own pin — kept in sync by hand, same as those two already are with
# each other. Bumping this also means bumping openbao_cli_deb_sha256
# below, from that release's own checksums.txt.
openbao_cli_version: "2.7.0"

# Renamed upstream from the "bao_*" naming its predecessor project
# used — confirmed live against the real v2.6.2 release assets (this
# project's Stage 1 spike; see the design doc linked from
# tasks/main.yaml). "bao_2.6.2_linux_amd64.deb" 404s for this release.
openbao_cli_deb_name: "openbao_{{ openbao_cli_version }}_linux_amd64.deb"
openbao_cli_deb_url: "https://github.com/openbao/openbao/releases/download/v{{ openbao_cli_version }}/{{ openbao_cli_deb_name }}"

# From that release's own checksums.txt (GPG-signed as
# checksums.txt.gpgsig, not independently verified here — this repo's
# threat model already trusts GitHub-hosted release assets elsewhere,
# e.g. docker/openbao's own pinned image digest-free tag).
openbao_cli_deb_sha256: "7412233fef6bbe0e5093aa5461f493dd3a0f6193c8d5a5ba3a7ff475f96f34a2"
