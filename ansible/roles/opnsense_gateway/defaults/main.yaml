---
# The OPNsense release and the commit of the oxlorg.opnsense collection that
# works with it. The collection works only with the release of the same
# version, and its git tag carries an earlier version's metadata, so the
# collection is pinned by commit. ansible/requirements.yml names the same
# commit; ansible/tests/test_opnsense_pin.py fails when the two differ.
opnsense_gateway_release: "26.1.11"
opnsense_gateway_collection_commit: 5cec92ea25c8280a9913dfb958109f78ce930d00

# The name the gateway's GUI certificate carries (the seed's hostname and
# domain). The play connects by it, so the operator host must resolve it.
opnsense_gateway_management_name: OPNsense.internal
opnsense_gateway_api_port: 443
opnsense_gateway_api_url: "https://{{ opnsense_gateway_management_name }}:{{ opnsense_gateway_api_port }}"

# Holds opnsense_api_key and opnsense_api_secret (ADR 0048).
opnsense_gateway_credentials_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/tofu/credentials.tfvars"

# opnsense_gateway_ca_file has no default: it is the gateway's certificate as
# first_boot.sh read it off the console, the only CA the play trusts.
