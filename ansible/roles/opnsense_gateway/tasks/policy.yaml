---
# The aliases and the rules the gateway's policy is written from. Every object
# is matched by its name or description, so a run changes only what differs.
# Rules on a zone's interface are the only rules there, so whatever they do not
# pass is denied; the guard rule is floating and quick and comes first.

- name: Require the addresses the guard rule admits
  ansible.builtin.assert:
    that:
      - opnsense_gateway_operator_hosts is defined
      - opnsense_gateway_operator_hosts is sequence
      - opnsense_gateway_operator_hosts is not string
      - opnsense_gateway_operator_hosts | length > 0
      - opnsense_gateway_operator_hosts | select('match', '^(\d{1,3}\.){3}\d{1,3}$') | list | length == opnsense_gateway_operator_hosts | length
    quiet: true
    fail_msg: >-
      Set opnsense_gateway_operator_hosts to the IPv4 addresses the operator's work runs from. The guard
      rule admits them to the gateway's management ports, and an empty list would admit nobody.

- name: Name each zone's network
  oxlorg.opnsense.alias:
    name: "net_{{ opnsense_gateway_zone.name }}"
    type: network
    content: ["192.168.{{ opnsense_gateway_zone.vlan }}.0/24"]
    description: "{{ opnsense_gateway_zone.name }} zone"
    reload: true
  loop: "{{ opnsense_gateway_zones }}"
  loop_control:
    loop_var: opnsense_gateway_zone
    label: "{{ opnsense_gateway_zone.name }}"

- name: Name the management hosts and ports
  oxlorg.opnsense.alias:
    name: "{{ opnsense_gateway_alias.name }}"
    type: "{{ opnsense_gateway_alias.type }}"
    content: "{{ opnsense_gateway_alias.content }}"
    description: "{{ opnsense_gateway_alias.description }}"
    reload: true
  loop:
    - { name: operator_hosts, type: host, content: "{{ opnsense_gateway_operator_hosts }}", description: Hosts the operator's work runs from }
    - { name: cd_agent_hosts, type: host, content: "{{ opnsense_gateway_cd_agent_hosts }}", description: Hosts the CD agent runs from }
    - { name: gateway_management_ports, type: port, content: ["22", "443"], description: The gateway's SSH and API ports }
    - { name: proxmox_node_ports, type: port, content: ["22", "8006"], description: The Proxmox node's SSH and API ports }
    - { name: direct_dns_ports, type: port, content: ["53", "853"], description: Plain and TLS DNS }
    - { name: private_networks, type: network, content: "{{ opnsense_gateway_private_networks }}", description: Private ranges }
  loop_control:
    loop_var: opnsense_gateway_alias
    label: "{{ opnsense_gateway_alias.name }}"

- name: Name the hosts the flows reach
  oxlorg.opnsense.alias:
    name: "{{ opnsense_gateway_host.key }}"
    type: host
    content: ["{{ opnsense_gateway_host.value }}"]
    description: "{{ opnsense_gateway_host.key }}"
    reload: true
  loop: "{{ opnsense_gateway_hosts | dict2items }}"
  loop_control:
    loop_var: opnsense_gateway_host
    label: "{{ opnsense_gateway_host.key }}"

- name: Admit the operator hosts to the gateway's management ports before any other rule
  oxlorg.opnsense.rule:
    description: "guard: operator hosts to the gateway's management ports"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.guard }}"
    action: pass
    quick: true
    interface: "{{ opnsense_gateway_zones | map(attribute='interface') | list }}"
    direction: in
    ip_protocol: inet
    protocol: TCP
    source_net: operator_hosts
    destination_net: (self)
    destination_port: gateway_management_ports
    log: false
    reload: true

- name: Admit the CD agent to the gateway's API, or remove that rule
  oxlorg.opnsense.rule:
    description: "{{ opnsense_gateway_cd_agent_zone }}: CD agent to the gateway's API"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.cd_agent }}"
    state: "{{ 'present' if opnsense_gateway_cd_agent_management | bool else 'absent' }}"
    action: pass
    quick: true
    interface: "{{ opnsense_gateway_zones | selectattr('name', 'eq', opnsense_gateway_cd_agent_zone) | map(attribute='interface') | list }}"
    direction: in
    ip_protocol: inet
    protocol: TCP
    source_net: cd_agent_hosts
    destination_net: (self)
    destination_port: "443"
    log: false
    reload: true

- name: Let every zone ask the gateway for DNS, NTP and ping
  oxlorg.opnsense.rule:
    description: "{{ opnsense_gateway_pair.0.name }}: {{ opnsense_gateway_pair.1.name }} to the gateway"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.zone_services + opnsense_gateway_zone_services.index(opnsense_gateway_pair.1) }}"
    action: pass
    quick: true
    interface: ["{{ opnsense_gateway_pair.0.interface }}"]
    direction: in
    ip_protocol: inet
    protocol: "{{ opnsense_gateway_pair.1.protocol }}"
    source_net: "net_{{ opnsense_gateway_pair.0.name }}"
    destination_net: (self)
    destination_port: "{{ opnsense_gateway_pair.1.port | default('') }}"
    icmp_type: "{{ opnsense_gateway_pair.1.icmp_type | default([]) }}"
    log: false
    reload: true
  loop: "{{ opnsense_gateway_zones | product(opnsense_gateway_zone_services) | list }}"
  loop_control:
    loop_var: opnsense_gateway_pair
    label: "{{ opnsense_gateway_pair.0.name }}: {{ opnsense_gateway_pair.1.name }}"

- name: Pass the flows between zones
  oxlorg.opnsense.rule:
    description: "{{ opnsense_gateway_flow.name }}"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.flows + opnsense_gateway_flow_index }}"
    enabled: "{{ opnsense_gateway_flow.enabled | default(true) }}"
    action: pass
    quick: true
    interface: "{{ opnsense_gateway_zones | selectattr('name', 'in', opnsense_gateway_flow.zones) | map(attribute='interface') | list }}"
    direction: in
    ip_protocol: inet
    protocol: "{{ opnsense_gateway_flow.protocol }}"
    source_net: "{{ opnsense_gateway_flow.source }}"
    destination_net: "{{ opnsense_gateway_flow.destination }}"
    destination_port: "{{ opnsense_gateway_flow.port }}"
    log: false
    reload: true
  loop: "{{ opnsense_gateway_flows }}"
  loop_control:
    loop_var: opnsense_gateway_flow
    index_var: opnsense_gateway_flow_index
    label: "{{ opnsense_gateway_flow.name }}"

- name: Deny direct DNS to anywhere but the gateway, from each zone with Internet access
  oxlorg.opnsense.rule:
    description: "{{ opnsense_gateway_zone.name }}: direct DNS to anywhere but the gateway"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.direct_dns }}"
    state: "{{ 'present' if opnsense_gateway_zone.internet | bool else 'absent' }}"
    action: block
    quick: true
    interface: ["{{ opnsense_gateway_zone.interface }}"]
    direction: in
    ip_protocol: inet
    protocol: TCP/UDP
    source_net: "net_{{ opnsense_gateway_zone.name }}"
    destination_net: any
    destination_port: direct_dns_ports
    log: false
    reload: true
  loop: "{{ opnsense_gateway_zones }}"
  loop_control:
    loop_var: opnsense_gateway_zone
    label: "{{ opnsense_gateway_zone.name }}"

- name: Let each zone with Internet access reach everything but the private ranges
  oxlorg.opnsense.rule:
    description: "{{ opnsense_gateway_zone.name }}: Internet"
    match_fields: [description]
    sequence: "{{ opnsense_gateway_sequences.internet }}"
    state: "{{ 'present' if opnsense_gateway_zone.internet | bool else 'absent' }}"
    action: pass
    quick: true
    interface: ["{{ opnsense_gateway_zone.interface }}"]
    direction: in
    ip_protocol: inet
    protocol: any
    source_net: "net_{{ opnsense_gateway_zone.name }}"
    destination_invert: true
    destination_net: private_networks
    log: false
    reload: true
  loop: "{{ opnsense_gateway_zones }}"
  loop_control:
    loop_var: opnsense_gateway_zone
    label: "{{ opnsense_gateway_zone.name }}"
