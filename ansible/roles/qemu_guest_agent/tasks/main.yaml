---
# Installs qemu-guest-agent. No enable/start task on purpose - the
# shipped unit is udev-activated, not systemctl-enabled; forcing either
# is a no-op at best and a hard failure at worst. See
# docs/qemu-guest-agent.md. Run in deploy.yaml's Play 1, alongside
# docker. Idempotent.

- name: Install qemu-guest-agent package
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600
