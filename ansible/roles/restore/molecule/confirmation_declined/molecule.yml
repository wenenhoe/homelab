---
# Exercises the SECOND, independent safety gate — the human confirmation
# pause — distinct from validation_failure's vars/archive-existence gate.
# Both must independently block the destructive steps; this proves the
# confirmation gate does, with everything else about the run valid.
#
# converge.yml passes restore_confirm: false — the explicit "declined"
# signal — rather than relying on Molecule's ansible-playbook subprocess
# lacking a tty. It doesn't reliably: a plain interactive terminal gives
# its children a real one, in which case a real pause would hang here
# forever. See the confirmation-gate comment in
# roles/restore/tasks/main.yaml for the full story.
driver:
  name: docker
platforms:
  - name: restore-confirmation-declined-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # Unlike validation_failure, this scenario needs a REAL archive to
  # exist — the archive-existence check runs before the confirmation
  # gate, so a missing archive would fail there instead. Building that
  # archive (converge.yml's Clear/Create/Write/Build tasks) unconditionally
  # deletes and rebuilds it every run, so those setup tasks report
  # changed on every converge regardless of the role's own idempotence —
  # hence no `idempotence` step here, unlike validation_failure (which
  # never creates a file and stays genuinely idempotent).
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
