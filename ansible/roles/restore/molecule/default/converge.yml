---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"

    # One app, one volume — the simplest real case (mirrors kms: a single
    # volume, single-volume restore_volumes list).
    app_registry:
      restore_target:
        volumes:
          - name: data
    compose_apps:
      - name: restore_target

    # --- The "decrypted archive" this scenario hands the role ---
    # restore.yaml's contract is that it receives an already-decrypted
    # plain .tar.gz — GPG/SeaweedFS are out of scope for this role (see
    # its header). Building a plain tar.gz directly, rather than
    # round-tripping through a real backup_agent + GPG + SeaweedFS
    # pipeline, IS the documented production input shape here —
    # backup_agent's own scenarios already cover the encrypt/upload side.
    restore_staging_dir: /tmp/restore-molecule-default-staging
    restore_test_archive: /tmp/restore-molecule-default-archive.tar.gz
    restore_before_marker: /tmp/restore-molecule-default-before-started-at
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Deploy the synthetic "source" app so its volume/container exists
      ansible.builtin.include_role:
        name: compose_app

    - name: Discover restore_target's container id (no fixed container_name anymore — see molecule_helpers/fixtures/generic_alpine_app_with_volume)
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label: "com.docker.compose.project=restore_target"
      register: restore_target_lookup
      failed_when: restore_target_lookup.containers | length != 1

    # changed_when: false — test setup, not something idempotence should
    # count.
    - name: Seed STALE content into the volume, to prove restore overwrites it
      community.docker.docker_container_exec:
        container: "{{ restore_target_lookup.containers[0].Id }}"
        command: "sh -c 'echo stale-content-should-be-overwritten > /data/canary.txt'"
      changed_when: false

    - name: Capture restore_target's StartedAt BEFORE the restore
      community.docker.docker_container_info:
        name: "{{ restore_target_lookup.containers[0].Id }}"
      register: restore_default_before_info

    # Persisted to a file, not just a fact — verify.yml is a separate
    # ansible-playbook invocation, so an in-memory fact wouldn't survive.
    - name: Persist the BEFORE StartedAt for verify.yml to compare against
      ansible.builtin.copy:
        dest: "{{ restore_before_marker }}"
        content: "{{ restore_default_before_info.container.State.StartedAt }}"
        mode: "0644"

    - name: Clear any staging dir/archive left over from a previous run
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ restore_staging_dir }}"
        - "{{ restore_test_archive }}"
      delegate_to: localhost
      become: false

    # One level of nesting under the staging root — a real
    # docker-volume-backup archive nests under whatever BACKUP_SOURCES
    # was, which this role's extraction logic doesn't assume an exact
    # depth for. multi_volume stresses this more; this is just "not
    # flat" for the common case.
    - name: Create the staged volume directory the archive will contain
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}/offsite-source/restore_target_data"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Write the NEW canary content the restore should produce
      ansible.builtin.copy:
        dest: "{{ restore_staging_dir }}/offsite-source/restore_target_data/canary.txt"
        content: "restored-content-from-backup\n"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Build the plain .tar.gz — this is what a real operator hands the playbook after gpg --decrypt
      ansible.builtin.command: # noqa: command-instead-of-module — creating a tar.gz, not extracting one;
        # unarchive only extracts, and this project has no community.general dependency
        # (the only module that creates archives) declared in requirements.yml.
        cmd: "tar -czf {{ restore_test_archive }} -C {{ restore_staging_dir }} offsite-source"
      changed_when: true
      delegate_to: localhost
      become: false

    - name: Run the restore role — restore_confirm bypasses the pause gate for this automated happy-path run
      ansible.builtin.include_role:
        name: restore
      vars:
        restore_app: restore_target
        restore_archive_local_path: "{{ restore_test_archive }}"
        restore_volumes:
          - restore_target_data
        restore_confirm: true
