---
# Nothing here needs an S3 target — restore.yaml/roles/restore never talk
# to SeaweedFS; the "decrypted archive" input is built directly on the
# controller as a plain .tar.gz, like a real operator's post-gpg-decrypt
# handoff.
driver:
  name: docker
platforms:
  - name: restore-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step, deliberately: this role's job is to
  # unconditionally stop, overwrite, and redeploy on every invocation —
  # correct behaviour for a DR restore, not a bug to converge away. A
  # second converge run always reports changed, so idempotence would
  # fail by design, not by accident.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
