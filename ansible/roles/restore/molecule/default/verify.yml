---
- name: Verify
  hosts: all
  become: true
  vars:
    restore_before_marker: /tmp/restore-molecule-default-before-started-at
  tasks:
    # --- Did the restore actually stop and redeploy the app? ---------------
    # StartedAt changing is direct evidence the container was actually
    # stopped and restarted, not just that the role reported success.
    - name: Read back the BEFORE StartedAt marker
      ansible.builtin.slurp:
        path: "{{ restore_before_marker }}"
      register: restore_default_before_raw

    - name: Capture restore_target's StartedAt AFTER the restore
      community.docker.docker_container_info:
        name: restore_target
      register: restore_default_after_info

    - name: Confirm restore_target was actually stopped+redeployed (StartedAt changed)
      ansible.builtin.assert:
        that:
          - (restore_default_before_raw.content | b64decode) != restore_default_after_info.container.State.StartedAt
        fail_msg: >-
          StartedAt did not change
          ({{ restore_default_before_raw.content | b64decode }}) — the
          restore did not actually stop/redeploy restore_target.

    - name: Confirm restore_target is running again after the restore
      ansible.builtin.assert:
        that:
          - restore_default_after_info.container.State.Status == 'running'
        fail_msg: "restore_target is not running: {{ restore_default_after_info.container.State.Status }}"

    # --- Did the volume's CONTENT actually get overwritten? ----------------
    # The real point of the role: read the live volume back and confirm it
    # holds the archive's content, not the stale pre-restore content.
    - name: Read back the volume's content post-restore
      community.docker.docker_container:
        name: restore-default-content-check
        image: alpine:3.20
        volumes:
          - restore_target_data:/data:ro
        command: "cat /data/canary.txt"
        detach: false
        cleanup: true
        output_logs: true
      register: restore_default_content_check
      changed_when: false

    - name: Confirm the volume now holds the restored (not stale) content
      ansible.builtin.assert:
        that:
          - "'restored-content-from-backup' in restore_default_content_check.container.Output"
          - "'stale-content-should-be-overwritten' not in restore_default_content_check.container.Output"
        fail_msg: >-
          Volume content after restore:
          {{ restore_default_content_check.container.Output }}

    # --- Cleanup: did the role actually tear down its scratch state? -------
    - name: Confirm the scratch extraction volume was removed
      community.docker.docker_volume_info:
        name: restore_target_restore_scratch
      register: restore_default_scratch_volume
      failed_when: restore_default_scratch_volume.exists

    - name: Confirm the temporary archive copy was removed from the target host
      ansible.builtin.stat:
        path: /tmp/restore_target-restore-archive
      register: restore_default_remote_archive
      failed_when: restore_default_remote_archive.stat.exists
