name: restore_multi
services:
  restore_multi:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: restore_multi
    volumes:
      - certs:/certs
      - creds:/creds
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  certs:
    external: true
    name: restore_multi_certs
  creds:
    external: true
    name: restore_multi_creds
