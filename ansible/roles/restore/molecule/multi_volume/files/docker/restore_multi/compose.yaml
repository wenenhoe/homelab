name: restore_multi
services:
  restore_multi:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: restore_multi
    volumes:
      - certs:/certs
      - creds:/creds
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  certs:
    external: true
    name: restore_multi_certs
  creds:
    external: true
    name: restore_multi_creds
