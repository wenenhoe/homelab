name: restore_multi
services:
  restore_multi:
    image: alpine:3.24@sha256:ce9e1e6d23f04a0b7593445a062a9fc73ed52f8260b9396f77a958295ad18ee7
    container_name: restore_multi
    volumes:
      - certs:/certs
      - creds:/creds
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  certs:
    external: true
    name: restore_multi_certs
  creds:
    external: true
    name: restore_multi_creds
