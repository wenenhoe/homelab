name: restore_multi
services:
  restore_multi:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    container_name: restore_multi
    volumes:
      - certs:/certs
      - creds:/creds
    command: [ "sh", "-c", "sleep infinity" ]
volumes:
  certs:
    external: true
    name: restore_multi_certs
  creds:
    external: true
    name: restore_multi_creds
