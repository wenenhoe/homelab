---
# The direct, automated regression test for the safety property this
# whole extraction exists to preserve: a validation failure must
# genuinely block the destructive steps, not just "usually" — see the
# SAFETY-CRITICAL comment at the top of roles/restore/tasks/main.yaml.
#
# Exercises the "archive path doesn't exist on the controller" branch
# specifically (the more elaborate of the three validation checks). All
# three share the identical delegate_to: localhost blocking mechanism,
# so this one scenario is sufficient to prove the mechanism works.
driver:
  name: docker
platforms:
  - name: restore-validation-failure-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # Unlike default/multi_volume: this scenario never gets past validation,
  # so nothing destructive/non-idempotent ever runs — idempotence is safe
  # to keep here, same as backup_agent's conflict scenario.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
