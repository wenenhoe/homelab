---
- name: Verify
  hosts: all
  become: true
  vars:
    restore_before_marker: /tmp/restore-molecule-validation-failure-before-started-at
  tasks:
    - name: Confirm the validation failure was actually caught as expected
      ansible.builtin.stat:
        path: /tmp/restore_validation_failure_halt_marker
      register: restore_val_marker
      failed_when: not restore_val_marker.stat.exists

    # --- Nothing destructive ran: assert the actual side effects, not just
    #     that the marker exists (the marker only proves the rescue block
    #     fired — it doesn't by itself prove the block's tasks stopped in
    #     time). ---------------------------------------------------------
    - name: Read back the BEFORE StartedAt marker
      ansible.builtin.slurp:
        path: "{{ restore_before_marker }}"
      register: restore_val_before_raw

    - name: Discover restore_val_target's container id
      community.docker.docker_host_info:
        containers: true
        containers_filters:
          label: "com.docker.compose.project=restore_val_target"
      register: restore_val_target_lookup
      failed_when: restore_val_target_lookup.containers | length != 1

    - name: Capture restore_val_target's StartedAt now
      community.docker.docker_container_info:
        name: "{{ restore_val_target_lookup.containers[0].Id }}"
      register: restore_val_after_info

    - name: Confirm restore_val_target was NEVER stopped (StartedAt unchanged)
      ansible.builtin.assert:
        that:
          - (restore_val_before_raw.content | b64decode) == restore_val_after_info.container.State.StartedAt
        fail_msg: >-
          StartedAt changed — the validation failure did not actually
          block the compose-stop step.

    - name: Read back the volume's content
      community.docker.docker_container:
        name: restore-validation-failure-content-check
        image: alpine:3.20
        volumes:
          - restore_val_target_data:/data:ro
        command: "cat /data/canary.txt"
        detach: false
        cleanup: true
        output_logs: true
      register: restore_val_content_check
      changed_when: false

    - name: Confirm the volume's content was NEVER touched
      ansible.builtin.assert:
        that:
          - "'original-content-must-survive' in restore_val_content_check.container.Output"
        fail_msg: "volume content: {{ restore_val_content_check.container.Output }}"

    - name: Confirm no scratch extraction volume was ever created
      community.docker.docker_volume_info:
        name: restore_val_target_restore_scratch
      register: restore_val_scratch_volume
      failed_when: restore_val_scratch_volume.exists

    - name: Confirm no temporary archive copy was ever created on the target host
      ansible.builtin.stat:
        path: /tmp/restore_val_target-restore-archive
      register: restore_val_remote_archive
      failed_when: restore_val_remote_archive.stat.exists
