---
# Restores one app's volume(s) on a single target host from an
# already-decrypted offsite backup archive. playbooks/restore.yaml is a
# thin wrapper over this role (never touches GPG/SeaweedFS itself) — see
# docs/disaster-recovery.md for the operator-facing walkthrough.
#
# SAFETY-CRITICAL: this MUST stay a single play (see playbooks/restore.yaml),
# with validation tasks delegate_to: localhost inline, not split into a
# separate hosts: localhost pre-play. A separate pre-play silently
# resolves to zero hosts under --limit <group> and gets skipped, not
# failed — defeating the validation entirely.
#
# Validation tasks skip run_once (every check is global, not host-specific,
# so redundant per-host execution is harmless) and carry become: false
# (become: true at the play level is otherwise inherited regardless of
# delegate_to, which fails hard without passwordless sudo on the
# controller). Same pattern as roles/compose/tasks/init.yaml's own
# delegate_to: localhost + become: false find task.

- name: Compute this restore's directory/path facts
  ansible.builtin.set_fact:
    restore_deploy_dir: "{{ compose_deploy_dir }}/{{ restore_app | default('') }}"
    restore_remote_archive: "/tmp/{{ restore_app | default('restore') }}-restore-archive"

- name: Fail fast if required vars are missing
  ansible.builtin.assert:
    that:
      - restore_app is defined
      - restore_archive_local_path is defined
      - restore_volumes is defined
      - restore_volumes | length > 0
    fail_msg: >-
      Missing required vars. See the usage comment at the top of
      playbooks/restore.yaml for restore_app / restore_archive_local_path
      / restore_volumes examples.
  delegate_to: localhost
  become: false

- name: Confirm the decrypted archive exists on the controller
  ansible.builtin.stat:
    path: "{{ restore_archive_local_path }}"
  register: restore_archive_stat
  delegate_to: localhost
  become: false

- name: Fail if the archive path doesn't exist
  ansible.builtin.fail:
    msg: >-
      {{ restore_archive_local_path }} not found on the controller. Did
      you download + `gpg --decrypt` the object out of the
      homelab-backups bucket first? See docs/disaster-recovery.md.
  when: not restore_archive_stat.stat.exists
  delegate_to: localhost
  become: false

# Confirmation gate. pause doesn't wait for input without a tty (cron,
# systemd timers, CI), so this fails closed by default. restore_confirm
# is a three-state signal so scenarios don't depend on ambient tty state:
# undefined → real prompt; explicitly true/false → skip prompt, proceed
# confirmed/declined. Both explicit values are -e-only, never defaulted —
# a real operator only ever hits the undefined branch. The bypass task
# below feeds the same `.user_input` shape the real pause task registers,
# so "Abort if not confirmed" is a single comparison regardless of which
# task ran.
- name: "Confirm before proceeding — this will stop and overwrite volumes for: {{ restore_app }}"
  ansible.builtin.pause:
    prompt: >-
      About to STOP {{ restore_app }} on {{ inventory_hostname }} and
      irreversibly overwrite {{ restore_volumes | join(', ') }} with the
      contents of {{ restore_archive_local_path }}. Type 'yes' to continue
  register: restore_confirmation
  when: restore_confirm is not defined

# Feeds the same `.user_input` shape the real pause task registers — see
# the confirmation-gate comment above for why that matters.
- name: Record the explicit restore_confirm override as if it were the pause answer
  ansible.builtin.set_fact:
    restore_confirmation:
      user_input: "{{ 'yes' if (restore_confirm | bool) else 'no' }}"
  when: restore_confirm is defined

- name: Abort if not confirmed
  ansible.builtin.fail:
    msg: Restore aborted — confirmation not given.
  when: restore_confirmation.user_input | default('') != 'yes'

- name: Copy the decrypted archive onto the target host
  ansible.builtin.copy:
    src: "{{ restore_archive_local_path }}"
    dest: "{{ restore_remote_archive }}"
    mode: "0600"

- name: Stop the app's compose stack so nothing writes during restore
  community.docker.docker_compose_v2:
    project_src: "{{ restore_deploy_dir }}"
    state: stopped

- name: Extract the full archive into a scratch volume once
  community.docker.docker_container:
    name: "{{ restore_app }}-restore-extract"
    image: alpine:3.24
    volumes:
      - "{{ restore_remote_archive }}:/restore-archive.tar.gz:ro"
      - "{{ restore_app }}_restore_scratch:/scratch"
    command: >-
      sh -c "mkdir -p /scratch && tar -xzf /restore-archive.tar.gz -C /scratch"
    detach: false
    cleanup: true

- name: Locate and restore each targeted volume's contents
  community.docker.docker_container:
    name: "{{ restore_app }}-restore-{{ item }}"
    image: alpine:3.24
    volumes:
      - "{{ restore_app }}_restore_scratch:/scratch:ro"
      - "{{ item }}:/target"
    command: >-
      sh -c "
      srcdir=$(find /scratch -type d -name '{{ item }}' | head -1);
      if [ -z \"$srcdir\" ]; then
        echo 'ERROR: no directory named {{ item }} found in the archive' >&2;
        exit 1;
      fi;
      find /target -mindepth 1 -delete;
      cp -a \"$srcdir\"/. /target/
      "
    detach: false
    cleanup: true
  loop: "{{ restore_volumes }}"

- name: Remove the scratch extraction volume
  community.docker.docker_volume:
    name: "{{ restore_app }}_restore_scratch"
    state: absent

- name: Remove the temporary archive copy from the target host
  ansible.builtin.file:
    path: "{{ restore_remote_archive }}"
    state: absent

- name: Redeploy the app's compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ restore_deploy_dir }}"
    state: present
