---
# Controller-local setup for restore_all.py: a manifest.json describing
# what to restore and from where, plus an rclone.conf to read it with.
# Never touches a real host — hosts: controller only (see
# playbooks/restore-discovery-setup.yaml) — every task still carries its
# own delegate_to/become in case a future caller includes this role from
# a differently-scoped play, same defensive convention as
# roles/secrets/tasks/ensure_secret.yaml.
#
# Building the manifest here (Jinja over each host's backup_plan and
# host_vars/storage.yaml), not in restore_all.py, keeps
# app→host/volume/cloud-target resolution in one place — the same plan
# cloud_sync reads. Duplicating that logic in Python would be a second,
# driftable copy of it.

# An app's backup_plan entry, which exists exactly when it has backup
# volumes, is authoritative for scope, so batch-restore covers exactly
# what's actually backed up with no separate list to keep in sync. Only
# restore_discovery_excluded_apps (defaults/main.yaml, empty by
# default) can narrow this — for an app you back up but deliberately
# never want auto-restored in a batch run.
- name: Determine which host runs each backed-up, non-excluded app
  ansible.builtin.set_fact:
    restore_discovery_app_discovery: >-
      {%- set ns = namespace(hosts={}, plans={}, collisions=[]) -%}
      {%- for host in groups['managed_hosts'] -%}
        {%- for entry in hostvars[host].backup_plan -%}
          {%- if entry.name not in restore_discovery_excluded_apps -%}
            {%- if entry.name in ns.hosts and ns.hosts[entry.name] != host -%}
              {%- set _ = ns.collisions.append(entry.name ~ ' (' ~ ns.hosts[entry.name] ~ ', ' ~ host ~ ')') -%}
            {%- else -%}
              {%- set _ = ns.hosts.update({entry.name: host}) -%}
              {%- set _ = ns.plans.update({entry.name: entry}) -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ {'hosts': ns.hosts, 'plans': ns.plans, 'collisions': ns.collisions} }}
  delegate_to: localhost
  become: false

# restore_all.py's manifest is keyed by app name alone (see the header
# comment) - two managed hosts backing up an app of the same name can't
# both be represented in it. Silently keeping whichever host's loop
# iteration ran last would just drop the other host's backup from every
# batch restore with no warning, so this must fail loudly instead.
- name: Fail loudly if the same app name is backed up on more than one host
  ansible.builtin.assert:
    that: restore_discovery_app_discovery.collisions | length == 0
    fail_msg: >-
      The same app name is backed up on more than one managed host -
      restore_all.py's manifest is keyed by app name alone and can't
      tell them apart: {{ restore_discovery_app_discovery.collisions | join('; ') }}.
      Rename one of the apps in app_catalog.yaml, or add it to
      restore_discovery_excluded_apps and restore it manually.
  delegate_to: localhost
  become: false

- name: Extract the discovered app-to-host mapping and each app's backup plan
  ansible.builtin.set_fact:
    restore_discovery_app_hosts: "{{ restore_discovery_app_discovery.hosts }}"
    restore_discovery_app_plans: "{{ restore_discovery_app_discovery.plans }}"
  delegate_to: localhost
  become: false

- name: Fail loudly if nothing was discovered (empty inventory/catalog, or restore_discovery_excluded_apps excluded everything)
  ansible.builtin.assert:
    that: restore_discovery_app_hosts | length > 0
    fail_msg: >-
      No app on any managed host has backup volumes in app_catalog.yaml
      (after restore_discovery_excluded_apps) — nothing for restore_all.py
      to discover. Check app_catalog.yaml and
      roles/restore_discovery/defaults/main.yaml.
  delegate_to: localhost
  become: false

# step-ca first if it's actually in scope — see docs/restore.md's
# batch-restore section for why. If step-ca itself has no backup volumes,
# this silently can't hoist anything — an app_catalog gap to fix
# there, not something this role can detect on its own.
- name: Order the discovered apps, step-ca first
  ansible.builtin.set_fact:
    restore_discovery_apps: >-
      {%- set names = restore_discovery_app_hosts.keys() | list -%}
      {%- if 'step-ca' in names -%}
      {{ ['step-ca'] + (names | reject('equalto', 'step-ca') | list) }}{%- else -%}
      {{ names }}{%- endif -%}
  delegate_to: localhost
  become: false

# One dict per app: which host, the SeaweedFS path (matches
# AWS_S3_PATH in backup_agent's schedule.env.j2 — always
# "<host>-<app>"), its full volume names, and which cloud target(s) to
# fall back to (the plan's cloud_targets, the same list cloud_sync fans
# out to).
- name: Build the ordered restore manifest
  ansible.builtin.set_fact:
    restore_discovery_manifest: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for app in restore_discovery_apps -%}
        {%- set host = restore_discovery_app_hosts[app] -%}
        {%- set plan = restore_discovery_app_plans[app] -%}
        {%- set target_ns = namespace(list=[]) -%}
        {%- for t in plan.cloud_targets -%}
          {%- set _ = target_ns.list.append({'name': t, 'bucket': hostvars['storage'].cloud_sync_targets[t].bucket}) -%}
        {%- endfor -%}
        {%- set volume_ns = namespace(list=[]) -%}
        {%- for v in plan.volumes -%}
          {%- set _ = volume_ns.list.append(app ~ '_' ~ v) -%}
        {%- endfor -%}
        {%- set _ = ns.out.append({
              'app': app,
              'host': host,
              'seaweedfs_path': host ~ '-' ~ app,
              'volumes': volume_ns.list,
              'cloud_targets': target_ns.list,
            }) -%}
      {%- endfor -%}
      {{ ns.out }}
  delegate_to: localhost
  become: false

- name: Combine the manifest with the SeaweedFS bucket name for rendering
  ansible.builtin.set_fact:
    restore_discovery_manifest_full:
      seaweedfs_bucket: "{{ seaweedfs_s3_bucket }}"
      apps: "{{ restore_discovery_manifest }}"
  delegate_to: localhost
  become: false

- name: Ensure the restore-discovery output directory exists
  ansible.builtin.file:
    path: "{{ restore_discovery_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Render the batch-restore manifest
  ansible.builtin.template:
    src: manifest.json.j2
    dest: "{{ restore_discovery_dir }}/manifest.json"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Render the read-only rclone.conf (SeaweedFS + every cloud fallback target)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ restore_discovery_dir }}/rclone.conf"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
