---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    server_timezone: "Etc/UTC"

    offsite_backup_s3_bucket: molecule-test-ensure-bucket
    offsite_backup_s3_proto: "http"
    seaweedfs_admin_access_key: molecule-test-access-key
    seaweedfs_admin_secret_key: molecule-test-secret-key
  tasks:
    # --- Real S3 target for this scenario ---------------------------------
    # See molecule_helpers/tasks/start_seaweedfs_test_target.yaml for what
    # this does and why. No custom network name given, so this lands on
    # Docker's default bridge network — reachable by IP from the DinD
    # instance itself, which is where the role's own amazon.aws.s3_bucket
    # task actually runs (no container of its own anymore, see below).
    - name: Start a real SeaweedFS S3 target for this scenario
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_seaweedfs_test_target.yaml
      vars:
        molecule_helpers_seaweedfs_access_key: "{{ seaweedfs_admin_access_key }}"
        molecule_helpers_seaweedfs_secret_key: "{{ seaweedfs_admin_secret_key }}"
        molecule_helpers_seaweedfs_bucket: "{{ offsite_backup_s3_bucket }}"

    # molecule_helpers_seaweedfs_ip is exposed by the shared task above —
    # no need to re-discover it here.
    - name: Alias the discovered IP under this scenario's own name
      ansible.builtin.set_fact:
        seaweedfs_bucket_test_ip: "{{ molecule_helpers_seaweedfs_ip }}"

    - name: Point this scenario's endpoint at the discovered IP
      # noqa: var-naming[no-role-prefix] — offsite_backup_s3_endpoint is a
      # fixed global var name the role's tasks/main.yaml consumes, can't
      # be renamed. Overriding it dynamically is unavoidable — the IP is
      # only known after the discovery task above runs, unlike
      # backup_agent's own test which addresses SeaweedFS by hostname.
      ansible.builtin.set_fact:
        offsite_backup_s3_endpoint: "{{ seaweedfs_bucket_test_ip }}:8333"

    # The role under test talks to that IP directly via
    # amazon.aws.s3_bucket (boto3/botocore on the DinD instance's own
    # Python) — no container of its own to land on any network.
    - name: Run seaweedfs_bucket
      ansible.builtin.include_role:
        name: seaweedfs_bucket
