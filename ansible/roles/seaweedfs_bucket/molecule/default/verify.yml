---
- name: Verify
  hosts: all
  become: true
  vars_files:
    - "{{ playbook_dir }}/../../../molecule_helpers/vars/images/aws_cli.yml"
  vars:
    seaweedfs_s3_bucket: molecule-test-ensure-bucket
    seaweedfs_admin_access_key: molecule-test-access-key
    seaweedfs_admin_secret_key: molecule-test-secret-key
  tasks:
    # Facts don't persist between converge.yml and verify.yml (separate
    # ansible-playbook runs) — re-discover seaweedfs-test's IP the same
    # way converge.yml did.
    - name: Re-discover seaweedfs-test's IP on the default bridge network
      community.docker.docker_container_info:
        name: seaweedfs-test
      register: seaweedfs_bucket_test_info

    - name: Set the discovered IP as a fact
      ansible.builtin.set_fact:
        seaweedfs_bucket_test_ip: "{{ seaweedfs_bucket_test_info.container.NetworkSettings.Networks.bridge.IPAddress }}"

    # The actual point of this test: did the bucket really get created?
    # Not "did the task exit 0" — a real listing against the real S3 API.
    #
    # Targets the bucket directly (s3 ls s3://<bucket>, listing objects
    # WITHIN it) rather than a bare `s3 ls` (listing all buckets the
    # caller owns) — the latter needs the account-level ListAllMyBuckets
    # permission, which this identity deliberately doesn't have (scoped
    # to List:{{bucket}} only, same least-privilege scoping as
    # production's own identity config). Confirmed the hard way: a bare
    # `s3 ls` got AccessDenied even though the bucket genuinely existed.
    - name: Confirm the bucket actually exists (list objects within it)
      community.docker.docker_container:
        name: seaweedfs-bucket-verify-listing
        image: "{{ molecule_helpers_aws_cli_image }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_admin_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_admin_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: >-
          --endpoint-url http://{{ seaweedfs_bucket_test_ip }}:8333
          s3 ls s3://{{ seaweedfs_s3_bucket }}
        detach: false
        cleanup: true
        output_logs: true
      register: seaweedfs_bucket_listing
      changed_when: false
      # community.docker.docker_container never reflects a containerized
      # command's own exit code in Ansible's failed state, so this
      # never actually "naturally failed" on NoSuchBucket the way the
      # comment above assumed — it was a silent no-op regardless of
      # whether the bucket existed. A successful listing of an empty
      # bucket produces empty stdout (nothing positive to match on), so
      # the check here is inverted: fail if an error indicator is
      # present, not on the absence of a success one.
      failed_when: >-
        (seaweedfs_bucket_listing.container.Output | default('')) is search('(?i)nosuchbucket|accessdenied|access denied|error')

    # backup_agent prunes by retention with a plain delete. On a versioned
    # bucket that leaves the archive stored as a noncurrent version behind a
    # delete marker, so the bucket would only ever grow. The probe object
    # must therefore leave no version and no marker after one plain delete.
    # The listing before the delete is the positive control: without it, a
    # listing that errored would look the same as an empty one.
    - name: Write a probe object into the bucket
      community.docker.docker_container:
        name: seaweedfs-bucket-verify-probe-put
        image: "{{ molecule_helpers_aws_cli_image }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_admin_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_admin_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: >-
          --endpoint-url http://{{ seaweedfs_bucket_test_ip }}:8333
          s3api put-object --bucket {{ seaweedfs_s3_bucket }}
          --key retention-probe/archive.bin --body /etc/hostname
        detach: false
        cleanup: true
        output_logs: true
      register: seaweedfs_bucket_probe_put
      changed_when: false

    - name: List the probe's versions before the delete
      community.docker.docker_container:
        name: seaweedfs-bucket-verify-probe-list-before
        image: "{{ molecule_helpers_aws_cli_image }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_admin_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_admin_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: >-
          --endpoint-url http://{{ seaweedfs_bucket_test_ip }}:8333
          s3api list-object-versions --bucket {{ seaweedfs_s3_bucket }}
          --prefix retention-probe/
        detach: false
        cleanup: true
        output_logs: true
      register: seaweedfs_bucket_probe_before
      changed_when: false

    - name: Confirm the probe is listed, so an empty listing afterwards means something
      ansible.builtin.assert:
        that:
          - "'retention-probe/archive.bin' in (seaweedfs_bucket_probe_before.container.Output | default(''))"
        fail_msg: >-
          The probe object was not listed after being written, so the check
          below could not tell a deleted object from a failed listing. put:
          {{ seaweedfs_bucket_probe_put.container.Output | default('') }}
          listing: {{ seaweedfs_bucket_probe_before.container.Output | default('') }}

    - name: Delete the probe with a plain delete, as the retention prune does
      community.docker.docker_container:
        name: seaweedfs-bucket-verify-probe-delete
        image: "{{ molecule_helpers_aws_cli_image }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_admin_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_admin_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: >-
          --endpoint-url http://{{ seaweedfs_bucket_test_ip }}:8333
          s3api delete-object --bucket {{ seaweedfs_s3_bucket }}
          --key retention-probe/archive.bin
        detach: false
        cleanup: true
        output_logs: true
      changed_when: false

    - name: List the probe's versions after the delete
      community.docker.docker_container:
        name: seaweedfs-bucket-verify-probe-list-after
        image: "{{ molecule_helpers_aws_cli_image }}"
        env:
          AWS_ACCESS_KEY_ID: "{{ seaweedfs_admin_access_key }}"
          AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_admin_secret_key }}"
          AWS_DEFAULT_REGION: us-east-1
        command: >-
          --endpoint-url http://{{ seaweedfs_bucket_test_ip }}:8333
          s3api list-object-versions --bucket {{ seaweedfs_s3_bucket }}
          --prefix retention-probe/
        detach: false
        cleanup: true
        output_logs: true
      register: seaweedfs_bucket_probe_after
      changed_when: false

    - name: Confirm the delete left neither a version nor a delete marker
      ansible.builtin.assert:
        that:
          - "'\"Versions\"' not in (seaweedfs_bucket_probe_after.container.Output | default(''))"
          - "'\"DeleteMarkers\"' not in (seaweedfs_bucket_probe_after.container.Output | default(''))"
        fail_msg: >-
          A plain delete left the probe stored, which is what a versioned
          bucket does and what retention pruning must not meet. listing:
          {{ seaweedfs_bucket_probe_after.container.Output | default('') }}
