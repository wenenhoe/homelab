---
# Confirms a genuine auth failure actually surfaces and isn't
# accidentally swallowed by the role's BucketAlreadyExists tolerance
# logic — mirrors backup_agent's `conflict` scenario in spirit: the
# point isn't the happy path, it's proving the negative case still
# fails loudly.
driver:
  name: docker
platforms:
  - name: seaweedfs-bucket-wrong-creds-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
