---
# SeaweedFS does not auto-create a bucket on first PUT, even with
# Admin-scoped credentials (see
# docker/seaweedfs/configs/s3-identity.json.j2) — this makes creation
# explicit and idempotent instead.
#
# Runs once, on `storage` only (see deploy.yaml). Kept out of
# backup_agent itself: bucket creation is a one-time storage-side
# concern, not something every backup_agent host should redundantly
# handle.

- name: Create the offsite-backup bucket in SeaweedFS if it doesn't already exist
  community.docker.docker_container:
    name: seaweedfs-ensure-bucket
    image: amazon/aws-cli:2.36.19
    env:
      AWS_ACCESS_KEY_ID: "{{ seaweedfs_s3_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ seaweedfs_s3_secret_key }}"
      AWS_DEFAULT_REGION: us-east-1
    command: >-
      --endpoint-url {{ offsite_backup_s3_proto }}://{{ offsite_backup_s3_endpoint }}
      s3 mb s3://{{ offsite_backup_s3_bucket }}
    detach: false
    cleanup: true
    output_logs: true
  register: seaweedfs_bucket_create
  changed_when: false
  # Tolerate "already exists" (both BucketAlreadyExists and
  # BucketAlreadyOwnedByYou — the latter is what a single-owner target
  # like this one actually returns on an idempotent re-run). Anything
  # else is a real failure.
  failed_when: >-
    seaweedfs_bucket_create is failed
    and 'BucketAlreadyExists' not in (seaweedfs_bucket_create.msg | default(''))
    and 'BucketAlreadyOwnedByYou' not in (seaweedfs_bucket_create.msg | default(''))
