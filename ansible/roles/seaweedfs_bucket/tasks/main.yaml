---
# amazon.aws.s3_bucket executes on whatever Python interpreter this
# role actually runs against (storage's own, over SSH — not the
# controller's), and needs boto3/botocore importable there. Confirmed
# live: without this, the task below fails at import time with
# "Failed to import the required Python libraries (botocore and
# boto3)", not a connectivity or credentials error. `storage` is the
# only host this role runs on (deploy.yaml Play 5), so this is scoped
# to apt/Debian rather than anything more portable.
- name: Ensure boto3/botocore are available for amazon.aws.s3_bucket
  ansible.builtin.apt:
    name:
      - python3-boto3
      - python3-botocore
    state: present
    update_cache: true
    cache_valid_time: 3600

# SeaweedFS does not auto-create a bucket on first PUT, even with
# Admin-scoped credentials (see
# docker/seaweedfs/configs/s3-identity.json.j2) — this makes creation
# explicit and idempotent instead.
#
# Runs once, on `storage` only (see deploy.yaml). Kept out of
# backup_agent itself: bucket creation is a one-time storage-side
# concern, not something every backup_agent host should redundantly
# handle.
#
# amazon.aws.s3_bucket gives real create-if-missing idempotence
# natively — confirmed live against a real SeaweedFS target running
# production's exact identity-scoping model (bucket-scoped `Admin:`,
# not an account-wide grant); see
# docs/projects/ansible-collections-audit.md's Stage 1 detail.
# No standing container needed the way the previous aws-cli-exec
# implementation required just to get idempotence.
#
# Play 4 (compose_app) returns once `docker compose up` exits, not once
# SeaweedFS is healthy — on a cold start this call (routed through
# Caddy, see offsite_backup_s3_endpoint) can hit a connection failure
# before the S3 listener is up. The module has no built-in wait/retry
# (checked its full option list, confirmed live) — this task still
# needs its own retry loop for that, same as the previous
# implementation needed one around its aws-cli exec. `until:` retrying
# past a module-level `failed: true` (not just a bad exit code) is
# core Ansible behavior, confirmed live rather than assumed.
#
# Retry condition is deliberately narrower than "anything but success"
# — confirmed live (real SeaweedFS target, real wrong-credentials
# case) that a genuine 4xx (bad credentials, access denied, bad
# request) comes back as a normal structured botocore error with
# response_metadata.http_status_code populated, on the first attempt,
# no connection ever having failed. Retrying that blindly would turn
# the previous implementation's fail-fast-on-bad-auth behavior (see
# the wrong_credentials molecule scenario) into a needless ~30s stall
# before the same eventual failure. A genuine connection-level failure
# has no response_metadata at all (never got an HTTP response to have
# a status code from) — that, and any real 5xx, is what actually
# retries here.
#
# No `failed_when`/"tolerate already-exists" carve-out needed here
# unlike the previous implementation: an already-existing bucket is
# just `changed: false` from this module, not an error to special-case
# around.
#
# versioning: true — confirmed live against the pinned SeaweedFS image
# (ghcr.io/chrislusf/seaweedfs:4.47, see docker/seaweedfs/compose.yaml.j2):
# PutBucketVersioning succeeds on this version. Trivy's AWS-0090 flags a
# versionless bucket; the module docs note versioning "can only be
# suspended" once enabled, not turned back off, so this is a one-way
# change to this bucket's behavior, not just a lint fix.
#
# public_access and logging are deliberately not set here — confirmed
# live on this same pinned image that PutPublicAccessBlock and
# PutBucketLogging aren't implemented (see .config/.trivyignore's
# AWS-0086/0087/0091/0093/0089 entries for how this was confirmed).
#
# This task also always warns "Failed to get bucket ownership settings
# (permission denied)" — confirmed live with a raw `aws s3api
# get-bucket-ownership-controls` call, which comes back a clean
# AccessDenied, not a connection or parsing failure. Harmless: that
# call's access check (weed/s3api/s3api_acp.go's
# checkAccessByOwnership) doesn't consult the `actions` list in
# s3-identity.json.j2 at all — it only passes SeaweedFS's built-in
# AccountAdmin or the bucket's own Owner account, both of which come
# from SeaweedFS's separate account/IAM-role model. Our
# identities.json.j2 uses the flat actions-list model instead, so
# every identity here — including seaweedfs-bucket-admin's
# bucket-scoped `Admin:` grant — resolves to the anonymous account for
# this one call and gets denied regardless of scope. Widening that
# grant would not fix it; nothing to change here if it reappears.
- name: Create the offsite-backup bucket in SeaweedFS if it doesn't already exist
  amazon.aws.s3_bucket:
    name: "{{ offsite_backup_s3_bucket }}"
    state: present
    endpoint_url: "{{ offsite_backup_s3_proto }}://{{ offsite_backup_s3_endpoint }}"
    access_key: "{{ seaweedfs_admin_access_key }}"
    secret_key: "{{ seaweedfs_admin_secret_key }}"
    region: us-east-1
    versioning: true
  register: seaweedfs_bucket_create
  until: >-
    seaweedfs_bucket_create is succeeded
    or (seaweedfs_bucket_create.response_metadata.http_status_code | default(0) | int >= 400
        and seaweedfs_bucket_create.response_metadata.http_status_code | default(0) | int < 500)
  retries: 15
  delay: 2
