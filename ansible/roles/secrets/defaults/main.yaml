---
# step-ca's own container name on `security` — same value
# step_ca_client_container_name defaults to, duplicated here rather than
# depended on cross-role since this role's Vault-login step runs before
# step_ca_client's own role has necessarily run in a given play.
secrets_vault_step_ca_container_name: step-ca

# OpenBao is always on `security`, always on 8200, published directly
# (not proxied through Caddy) — see docs/openbao.md. Not overridable per
# environment: this migration has exactly one OpenBao instance.
secrets_vault_host: security
secrets_vault_port: 8200
secrets_vault_kv_mount: secret
