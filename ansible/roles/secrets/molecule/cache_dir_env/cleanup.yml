---
# Removes everything this scenario wrote on the controller, markers included:
# nothing here is driver-managed, so `destroy` never touches it. hosts:
# localhost for the reason ../default/cleanup.yml gives.
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's directory from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-cache-dir-env/
        state: absent
