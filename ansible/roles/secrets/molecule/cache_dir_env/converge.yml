---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-cache-dir-env/project
    # Equal to molecule.yml's HOMELAB_SECRETS_DIR.
    secrets_molecule_credentials_dir: /tmp/secrets-molecule-cache-dir-env/credentials
    secrets_molecule_markers: /tmp/secrets-molecule-cache-dir-env/markers
    secret_catalog:
      secrets-molecule-cache-dir-env-example:
        source: manual
        store: controller_file
        sensitive: false
        description: "Molecule fixture: a value seeded in both cache directories, with a different content in each."
    secrets_molecule_vault_catalog:
      secrets-molecule-cache-dir-env-vault-example:
        source: hex
        length: 32
        store: openbao
        scope: hosts/security
  tasks:
    - name: Create both cache directories and the markers directory on the controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      loop:
        - "{{ project_root }}/ansible/files/secrets"
        - "{{ secrets_molecule_credentials_dir }}"
        - "{{ secrets_molecule_markers }}"

    # The checkout's cache holds a different value for the manual secret and a
    # complete AppRole pair; the credentials directory holds the manual secret
    # only. A role that read the checkout's cache would find the pair and the
    # wrong value.
    - name: Seed the checkout's cache with decoys
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      loop:
        - { name: secrets-molecule-cache-dir-env-example, content: from-the-checkout }
        - { name: openbao-controller-role-id, content: decoy-role-id }
        - { name: openbao-controller-secret-id, content: decoy-secret-id }
      loop_control:
        label: "{{ item.name }}"

    - name: Seed the credentials directory with the manual secret
      ansible.builtin.copy:
        dest: "{{ secrets_molecule_credentials_dir }}/secrets-molecule-cache-dir-env-example"
        content: from-the-credentials-dir
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Run the secrets role with HOMELAB_SECRETS_DIR set
      ansible.builtin.include_role:
        name: secrets

    - name: Confirm the manual secret came from the credentials directory
      ansible.builtin.assert:
        that:
          - secrets_generated['secrets-molecule-cache-dir-env-example'] == 'from-the-credentials-dir'

    - name: Leave a marker that the manual secret was read from the credentials directory
      ansible.builtin.copy:
        dest: "{{ secrets_molecule_markers }}/manual-secret-read"
        content: ok
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: "Run secrets [block / rescue] (a Vault-backed secret, no AppRole files in the credentials directory, failure is deliberate and expected)"
      block:
        - name: Run the secrets role against a Vault-scoped catalog
          ansible.builtin.include_role:
            name: secrets
          vars:
            secret_catalog: "{{ secrets_molecule_vault_catalog }}" # noqa: var-naming[no-role-prefix]
      rescue:
        # The decoy pair sits in the checkout's cache, so reaching the files-missing
        # gate, and naming the credentials directory, shows only that directory was
        # searched.
        - name: Confirm the files-missing gate fired and named the credentials directory, not the checkout
          ansible.builtin.assert:
            that:
              - "'[cache files missing]' in ansible_failed_task.name"
              - "secrets_molecule_credentials_dir in ansible_failed_result.msg"
              - "project_root not in ansible_failed_result.msg"
            fail_msg: >-
              Expected vault_login.yaml's files-missing gate to fail naming
              {{ secrets_molecule_credentials_dir }}; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message
              "{{ ansible_failed_result.msg | default('none') }}" instead.

        - name: Leave a marker that the gate looked in the credentials directory only
          ansible.builtin.copy:
            dest: "{{ secrets_molecule_markers }}/approle-gate-searched-credentials-dir"
            content: ok
            mode: "0644"
          delegate_to: localhost
          become: false

    - name: "Run secrets [block / rescue] (a relative cache directory, failure is deliberate and expected)"
      block:
        - name: Run the secrets role with a relative cache directory
          ansible.builtin.include_role:
            name: secrets
          vars:
            secrets_file_cache_dir: relative/credentials
      rescue:
        - name: Confirm the absolute-path check refused it
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert the controller-side secrets cache directory is an absolute path'
              - "'must be an absolute path' in ansible_failed_result.msg"
              - "'relative/credentials' in ansible_failed_result.msg"

        - name: Leave a marker that the relative directory was refused
          ansible.builtin.copy:
            dest: "{{ secrets_molecule_markers }}/relative-dir-refused"
            content: ok
            mode: "0644"
          delegate_to: localhost
          become: false
