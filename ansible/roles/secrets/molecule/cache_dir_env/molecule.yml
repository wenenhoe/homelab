---
# Same lightweight shape as ../vault_approle_files_missing: every task is
# delegate_to: localhost, and nothing here reaches OpenBao (the gate under
# test fires before any Vault call). HOMELAB_SECRETS_DIR is what a CD agent
# job's unit sets; it must equal converge.yml's secrets_molecule_credentials_dir.
driver:
  name: docker
platforms:
  - name: secrets-cache-dir-env-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  env:
    HOMELAB_SECRETS_DIR: /tmp/secrets-molecule-cache-dir-env/credentials
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step: two of the three role runs fail on purpose, as in
  # ../vault_approle_files_missing.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
