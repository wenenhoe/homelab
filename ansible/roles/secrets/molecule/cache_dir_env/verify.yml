---
- name: Verify
  hosts: all
  become: true
  vars:
    secrets_molecule_credentials_dir: /tmp/secrets-molecule-cache-dir-env/credentials
  tasks:
    # Each marker was written only after its block's own assertion held.
    - name: Confirm each expected outcome left its marker
      ansible.builtin.stat:
        path: "/tmp/secrets-molecule-cache-dir-env/markers/{{ item }}"
      register: secrets_verify_markers
      delegate_to: localhost
      become: false
      loop:
        - manual-secret-read
        - approle-gate-searched-credentials-dir
        - relative-dir-refused
      failed_when: not secrets_verify_markers.stat.exists

    - name: Read the checkout's decoy back
      ansible.builtin.slurp:
        src: /tmp/secrets-molecule-cache-dir-env/project/ansible/files/secrets/secrets-molecule-cache-dir-env-example
      register: secrets_verify_decoy
      delegate_to: localhost
      become: false

    - name: List the credentials directory
      ansible.builtin.find:
        paths: "{{ secrets_molecule_credentials_dir }}"
      register: secrets_verify_credentials_files
      delegate_to: localhost
      become: false

    - name: Confirm the role read the credentials directory and changed neither directory's contents
      ansible.builtin.assert:
        that:
          - (secrets_verify_decoy.content | b64decode) == 'from-the-checkout'
          - secrets_verify_credentials_files.files | map(attribute='path') | map('basename') | list == ['secrets-molecule-cache-dir-env-example']
