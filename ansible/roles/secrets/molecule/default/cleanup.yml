---
# Removes this scenario's whole project_root from the controller (molecule
# control node) — nothing under it is driver-managed, so `destroy` never
# touches it. Runs via molecule's own `cleanup` step, before create and
# after verify (see molecule.yml's test_sequence).
#
# hosts: localhost, not hosts: all: the pre-create run happens before
# secrets-instance exists, so hosts: all's implicit Gathering Facts task
# would fail UNREACHABLE (same reasoning as bootstrap-secrets.yaml's own
# Play 0). Every task here is controller-only anyway.
#
# Removes the whole directory, not just ansible/files/secrets/: converge.yml's
# first-run-secrets.json is written with force:false, so a copy left over
# here would survive a narrower cleanup and get compared against a
# freshly-regenerated latest-run-secrets.json in verify.yml, failing the
# idempotence check for a reason that has nothing to do with the role itself.
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-default/
        state: absent
