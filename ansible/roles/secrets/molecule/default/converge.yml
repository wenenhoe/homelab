---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    # Under /tmp, not the real repo checkout — this scenario's whole point
    # is to exercise first-run-vs-reuse behavior against a throwaway cache
    # dir, not to write real secret files anywhere near source control.
    # prepare.yml deletes this between `molecule test` runs so "first-run
    # generation" genuinely starts from nothing every time.
    project_root: /tmp/secrets-molecule-default
    # hex/uuid4 entries all have `store: openbao`, and that generation path is
    # covered by vault_backed's own scenario. What's left to test here is
    # exactly what production still uses the file cache for: manual entries with
    # `store: controller_file` (main-domain, the controller AppRole pair) — one
    # present-and-non-empty sub-case, one present-but-empty sub-case.
    secret_catalog:
      secrets-molecule-manual-present-example:
        source: manual
        store: controller_file
        sensitive: false
        description: "Molecule fixture: pre-seeded before the role runs, like a real openbao_utils/bootstrap.py would have done."
      secrets-molecule-manual-blank-example:
        source: manual
        store: controller_file
        sensitive: false
        allow_blank: true
        description: "Molecule fixture: pre-seeded as an empty file, like beszel_hub_key/beszel_agent_token before their first real value is known."
  tasks:
    - name: Ensure the secrets cache directory exists on the controller (molecule control node)
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # a manual source can't generate anything — its cache file has to exist
    # BEFORE the role runs (this is what openbao_utils/bootstrap.py would do in
    # a real deploy). Idempotent by construction: ansible.builtin.copy
    # with fixed content reports changed:false once the file already
    # matches, so this doesn't trip the idempotence step on its own.
    - name: Pre-seed the manual secrets' cache files (simulating a prior openbao_utils/bootstrap.py run)
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      loop:
        - { name: secrets-molecule-manual-present-example, content: "a-manually-supplied-value" }
        - { name: secrets-molecule-manual-blank-example, content: "" }
      loop_control:
        label: "{{ item.name }}"

    - name: Run the secrets role
      ansible.builtin.include_role:
        name: secrets

    # Persisted to files, not just facts — verify.yml is a separate
    # ansible-playbook invocation, so in-memory facts wouldn't survive
    # (same reasoning as roles/restore's own converge.yml).
    - name: Persist this run's secrets_generated, for verify.yml to inspect
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    # force: false (same convention app_catalog.yaml uses for any
    # secret-bearing config: "generate once, never clobber on a re-run")
    # — only ever written by the FIRST converge of a `molecule test` run.
    # verify.yml diffs this against latest-run-secrets.json (written by
    # every converge, including the idempotence step's re-run) to prove
    # the re-run genuinely reused the cached values rather than
    # regenerating them — a stronger check than Molecule's own
    # idempotence step, which only proves no task reported `changed`.
    - name: Snapshot the FIRST run's secrets_generated, if not already captured
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
