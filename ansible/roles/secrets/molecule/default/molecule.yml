---
# secrets role needs nothing beyond a container with Python present — every
# real task is delegate_to: localhost against the molecule control node
# (this repo's own convention, see roles/restore's own scenarios), so
# there's no Docker-in-Docker, no systemd, no privileged mode. Mirrors
# roles/apt/molecule/default's minimal pattern.
driver:
  name: docker
platforms:
  - name: secrets-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
