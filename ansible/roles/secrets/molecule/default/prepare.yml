---
# No Docker-in-Docker/systemd needed (see molecule.yml) - this playbook
# exists solely to reset molecule-coverage's JSONL before each test run
# and to clear out any cache directory left over from a previous local
# run, so "first-run generation" genuinely starts from nothing every time.
- name: Prepare
  hosts: all
  tasks:
    - name: Reset coverage data from any previous test run
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: reset_coverage_data.yaml

    - name: Clear any secrets cache left over from a previous local run
      ansible.builtin.file:
        path: /tmp/secrets-molecule-default/ansible/files/secrets/
        state: absent
      delegate_to: localhost
      become: false
