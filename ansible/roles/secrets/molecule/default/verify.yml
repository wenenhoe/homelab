---
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-default
  tasks:
    # --- Both registered secrets were generated -----------------------------
    - name: Read the latest run's persisted secrets_generated
      ansible.builtin.slurp:
        path: "{{ project_root }}/latest-run-secrets.json"
      register: secrets_verify_latest_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the FIRST run's persisted secrets_generated
      ansible.builtin.slurp:
        path: "{{ project_root }}/first-run-secrets.json"
      register: secrets_verify_first_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Parse both persisted snapshots
      ansible.builtin.set_fact:
        secrets_verify_latest: "{{ secrets_verify_latest_raw.content | b64decode | from_json }}"
        secrets_verify_first: "{{ secrets_verify_first_raw.content | b64decode | from_json }}"
      no_log: true

    - name: Confirm both registered secrets were generated
      ansible.builtin.assert:
        that:
          - "'secrets-molecule-hex-example' in secrets_verify_latest"
          - "'secrets-molecule-uuid4-example' in secrets_verify_latest"
          - "'secrets-molecule-manual-present-example' in secrets_verify_latest"
          - "'secrets-molecule-manual-blank-example' in secrets_verify_latest"
        fail_msg: "secrets_generated is missing one or more registered secrets — the loop in roles/secrets/tasks/main.yaml didn't process every registry key."

    # --- hex mode: correct length and character set -------------------------
    - name: Confirm the hex secret is the requested length and character set
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-hex-example'] | length == 40
          - secrets_verify_latest['secrets-molecule-hex-example'] is match('^[0-9a-fA-F]+$')
        fail_msg: "hex secret isn't 40 mixed-case hex characters — check the lookup term built in ensure_secret.yaml."

    # --- uuid4 mode: real RFC 4122 v4 shape, not just any string ------------
    - name: Confirm the uuid4 secret is a real version-4 UUID
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-uuid4-example'] is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
        fail_msg: >-
          Generated value isn't shaped like a real UUID4 (version nibble '4',
          variant nibble in 8-9-a-b) — lookup('password') can't produce
          this, which is exactly why uuid4 mode has its own generate/cache
          logic; confirm python3's uuid.uuid4() is actually what ran.

    # --- manual mode: exact value read back correctly ------------------------
    - name: Confirm the present manual secret's value was read back exactly
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-manual-present-example'] == 'a-manually-supplied-value'
        fail_msg: "manual secret's value doesn't match what was pre-seeded in its cache file — check ensure_secret.yaml's slurp/trim logic."

    - name: Confirm an existing EMPTY manual secret file resolves to an empty string, not an error
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-manual-blank-example'] == ''
        fail_msg: >-
          A pre-seeded empty manual secret file should resolve to "" —
          this is exactly the behavior beszel_hub_key/beszel_agent_token
          depend on to avoid failing every run before their real first
          boot. If this assertion fails, allow_blank-style secrets are
          broken.

    # --- Idempotent re-run: reused, not regenerated --------------------------
    # first-run-secrets.json was written with force: false, so it only ever
    # captured the FIRST converge's output. latest-run-secrets.json was
    # overwritten by the idempotence step's re-converge. If the helper
    # regenerated instead of reusing, these two snapshots would differ.
    - name: Confirm the idempotent re-run reused the exact same values (not just changed:false)
      ansible.builtin.assert:
        that:
          - secrets_verify_first == secrets_verify_latest
        fail_msg: "secrets_generated differs between runs — the helper regenerated a value instead of reusing the cached one."

    # --- Cache files on the controller: exist, correct permissions ----------
    - name: Confirm all four secrets are cached on the controller with 0600 permissions
      ansible.builtin.stat:
        path: "{{ project_root }}/ansible/files/secrets/{{ item }}"
      register: secrets_verify_cache_stat
      delegate_to: localhost
      become: false
      loop:
        - secrets-molecule-hex-example
        - secrets-molecule-uuid4-example
        - secrets-molecule-manual-present-example
        - secrets-molecule-manual-blank-example
      loop_control:
        label: "{{ item }}"

    - name: Assert both cache files exist with mode 0600
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} is missing or not mode 0600 on the controller cache."
      loop: "{{ secrets_verify_cache_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- The uuid4 read-back path specifically (not just generation) --------
    - name: Read the cached uuid4 file's raw content directly off disk
      ansible.builtin.slurp:
        path: "{{ project_root }}/ansible/files/secrets/secrets-molecule-uuid4-example"
      register: secrets_verify_uuid4_file
      delegate_to: localhost
      become: false
      no_log: true

    - name: Assert the cached file's content equals the value stored in secrets_generated (proves the read-back path, not just generation, works)
      ansible.builtin.assert:
        that:
          - (secrets_verify_uuid4_file.content | b64decode | trim) == secrets_verify_latest['secrets-molecule-uuid4-example']
        fail_msg: "The value read back from the cache file doesn't match secrets_generated — ensure_secret.yaml's slurp/set_fact step is buggy."
