---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-delivered-root-cert/project
    secrets_molecule_cache_dir: /tmp/secrets-molecule-delivered-root-cert/cache
    secrets_molecule_markers: /tmp/secrets-molecule-delivered-root-cert/markers
    secrets_molecule_pem: |
      -----BEGIN CERTIFICATE-----
      bW9sZWN1bGUgZml4dHVyZSwgbm90IGEgY2VydA==
      -----END CERTIFICATE-----
  tasks:
    - name: Create the cache and markers directories on the controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      loop:
        - "{{ secrets_molecule_cache_dir }}"
        - "{{ secrets_molecule_markers }}"

    - name: Check with no delivered copy
      ansible.builtin.include_role:
        name: secrets
        tasks_from: check_delivered_root_cert.yaml
      vars:
        secrets_file_cache_dir: "{{ secrets_molecule_cache_dir }}"
        secrets_vault_root_cert_read:
          stdout: "{{ secrets_molecule_pem }}"

    - name: Leave a marker that an absent copy passed
      ansible.builtin.copy:
        dest: "{{ secrets_molecule_markers }}/absent-copy-passed"
        content: ok
        mode: "0644"
      delegate_to: localhost
      become: false

    # Differs from the fetched value only by whitespace at the ends.
    - name: Deliver a copy equal to the fetched root
      ansible.builtin.copy:
        dest: "{{ secrets_molecule_cache_dir }}/step-ca-root.crt"
        content: "{{ secrets_molecule_pem }}\n\n"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Check with a matching delivered copy
      ansible.builtin.include_role:
        name: secrets
        tasks_from: check_delivered_root_cert.yaml
      vars:
        secrets_file_cache_dir: "{{ secrets_molecule_cache_dir }}"
        secrets_vault_root_cert_read:
          stdout: "{{ secrets_molecule_pem }}"

    - name: Leave a marker that a matching copy passed
      ansible.builtin.copy:
        dest: "{{ secrets_molecule_markers }}/matching-copy-passed"
        content: ok
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: "Check [block / rescue] (a stale delivered copy, failure is deliberate and expected)"
      block:
        - name: Check against a root that has since changed
          ansible.builtin.include_role:
            name: secrets
            tasks_from: check_delivered_root_cert.yaml
          vars:
            secrets_file_cache_dir: "{{ secrets_molecule_cache_dir }}"
            secrets_vault_root_cert_read:
              stdout: "{{ secrets_molecule_pem | replace('bW9s', 'cm90') }}"
      rescue:
        - name: Confirm the mismatch failed, naming the delivered file
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail if the delivered copy of the root cert differs from the one fetched'
              - "(secrets_molecule_cache_dir ~ '/step-ca-root.crt') in ansible_failed_result.msg"
              - "'Redeliver' in ansible_failed_result.msg"

        - name: Leave a marker that a stale copy was refused
          ansible.builtin.copy:
            dest: "{{ secrets_molecule_markers }}/stale-copy-refused"
            content: ok
            mode: "0644"
          delegate_to: localhost
          become: false
