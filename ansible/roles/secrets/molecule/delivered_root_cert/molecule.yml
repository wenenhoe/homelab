---
# Same lightweight shape as ../cache_dir_env: every task is delegate_to:
# localhost and nothing reaches OpenBao or security. The fetched root cert is
# a fact set in converge.yml, standing in for vault_login.yaml's fetch.
driver:
  name: docker
platforms:
  - name: secrets-delivered-root-cert-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step: one of the role runs fails on purpose.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
