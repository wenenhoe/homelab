---
- name: Verify
  hosts: all
  become: true
  vars:
    secrets_molecule_cache_dir: /tmp/secrets-molecule-delivered-root-cert/cache
  tasks:
    # Each marker was written only after its case's own outcome held.
    - name: Confirm each expected outcome left its marker
      ansible.builtin.stat:
        path: "/tmp/secrets-molecule-delivered-root-cert/markers/{{ item }}"
      register: secrets_verify_markers
      delegate_to: localhost
      become: false
      loop:
        - absent-copy-passed
        - matching-copy-passed
        - stale-copy-refused
      failed_when: not secrets_verify_markers.stat.exists

    - name: Read the delivered copy back
      ansible.builtin.slurp:
        src: "{{ secrets_molecule_cache_dir }}/step-ca-root.crt"
      register: secrets_verify_delivered
      delegate_to: localhost
      become: false

    - name: Confirm the check left the delivered copy as it was
      ansible.builtin.assert:
        that:
          - "'bW9sZWN1' in (secrets_verify_delivered.content | b64decode)"
