---
# Removes this scenario's controller-side state — nothing here is
# driver-managed, so `destroy` never touches it. Runs via molecule's own
# `cleanup` step: once before create (guards against a previous run that
# crashed before reaching its own post-verify cleanup) and once after
# verify (see molecule.yml's test_sequence, and ../default/cleanup.yml
# for the sibling scenario this mirrors).
#
# hosts: localhost / connection: local / gather_facts: false, not hosts:
# all — see ../default/cleanup.yml for why hosts: all fails UNREACHABLE
# on the pre-create cleanup run.
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-manual-missing/
        state: absent

    # Not under project_root — converge.yml's rescue block writes this as
    # proof the expected failure surfaced; a stale marker from a run that
    # crashed BEFORE reaching the rescue block would let a real regression
    # (the role no longer failing when it should) hide behind old evidence.
    - name: Remove this scenario's halt marker from the controller
      ansible.builtin.file:
        path: /tmp/secrets_manual_missing_halt_marker
        state: absent
