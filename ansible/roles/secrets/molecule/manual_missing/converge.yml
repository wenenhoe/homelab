---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-manual-missing
    secrets_registry:
      secrets-molecule-manual-missing-example:
        format: manual
        sensitive: false
        description: "Molecule fixture: deliberately never pre-seeded, to prove the role fails loudly instead of silently deploying a blank credential."
  tasks:
    - name: Ensure the secrets cache directory exists (but leave it empty — nothing pre-seeded)
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # The secret's cache file is deliberately never created — this is the
    # scenario. block/rescue (this repo's own idiom for "failure here is
    # the expected, correct outcome" — see backup_agent/conflict,
    # seaweedfs_bucket/wrong_credentials) since the role failing is the
    # thing under test.
    - name: "Run secrets [block / rescue] (missing manual secret, failure is deliberate and expected)"
      block:
        - name: Run the secrets role against a registry with an unsupplied manual secret
          ansible.builtin.include_role:
            name: secrets
      rescue:
        # A bare rescue accepts ANY failure inside the block as "the gate
        # worked" — a Docker hiccup or an unrelated typo would leave the
        # same halt marker behind and pass for the wrong reason (see
        # docs/molecule-testing.md's note on this). ansible_failed_task/
        # ansible_failed_result are only populated inside a rescue block —
        # assert on both the exact task and the exact message before
        # trusting the "expected" label at all.
        - name: Confirm the failure came from the manual-secret-missing gate itself
          ansible.builtin.assert:
            that:
              - "'Fail loudly if a manual secret was never supplied' in ansible_failed_task.name"
              - "'Missing required secret: secrets-molecule-manual-missing-example' in ansible_failed_result.msg"
              - "'bootstrap_secrets.py' in ansible_failed_result.msg"
            fail_msg: >-
              secrets role failed, but not for the reason this scenario exists to
              test. Expected the manual-format "Fail loudly if a manual secret was
              never supplied" task to fail, naming the missing secret and pointing
              at bootstrap_secrets.py; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message
              "{{ ansible_failed_result.msg | default('none') }}" instead.

        - name: Leave a marker proving the expected failure actually surfaced
          ansible.builtin.copy:
            dest: /tmp/secrets_manual_missing_halt_marker
            content: "missing-manual-secret caught as expected\n"
            mode: "0644"
          delegate_to: localhost
          become: false
