---
# Same lightweight, no-Docker-in-Docker shape as ../default — this
# scenario never touches a container's filesystem either, everything
# happens delegate_to: localhost.
driver:
  name: docker
platforms:
  - name: secrets-manual-missing-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step, deliberately: this scenario's whole point is a
  # role run that FAILS (rescued, but still a failure inside the block),
  # so a second identical converge would just fail the same way again,
  # not converge to a no-op. Same reasoning as roles/restore's
  # default/multi_volume scenarios skipping idempotence.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
