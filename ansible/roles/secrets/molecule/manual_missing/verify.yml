---
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-manual-missing
  tasks:
    # --- The rescue block fired, and specifically for the right reason ------
    # (the assertion inside converge.yml's rescue: block already confirmed
    # ansible_failed_task/ansible_failed_result before this marker was ever
    # written — its mere existence is proof the right failure happened,
    # not just *a* failure.)
    - name: Confirm the expected-failure marker exists
      ansible.builtin.stat:
        path: /tmp/secrets_manual_missing_halt_marker
      register: secrets_verify_marker
      delegate_to: localhost
      become: false
      failed_when: not secrets_verify_marker.stat.exists

    # --- Independent side-effect check, not just the marker -----------------
    # manual format has no generation step at all, so the strongest
    # available side-effect check is simply: nothing got created where the
    # missing secret's cache file would live. Confirms the fail-fast gate
    # ran before anything else touched the filesystem, not just that the
    # role failed somewhere.
    - name: Confirm no cache file was ever created for the missing secret
      ansible.builtin.stat:
        path: "{{ project_root }}/ansible/files/secrets/secrets-molecule-manual-missing-example"
      register: secrets_verify_missing_file
      delegate_to: localhost
      become: false
      failed_when: secrets_verify_missing_file.stat.exists
