---
# Same reasoning as ../vault_backed's own cleanup.yml — runs before
# create and after verify, tolerates "nothing to clean up yet" as well
# as "scenario ran to completion".
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-rotate-secret/
        state: absent

    - name: Remove the throwaway OpenBao/step-ca containers
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ item }}"
      loop:
        - openbao-test
        - step-ca-test
      register: secrets_rotate_secret_cleanup_rm_containers
      changed_when: secrets_rotate_secret_cleanup_rm_containers.rc == 0
      failed_when: false

    - name: Remove the throwaway docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - rm
          - secrets-rotate-secret-net
      register: secrets_rotate_secret_cleanup_rm_network
      changed_when: secrets_rotate_secret_cleanup_rm_network.rc == 0
      failed_when: false

    - name: Remove the throwaway cert/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/molecule-openbao-test-certs
        - /tmp/molecule-openbao-test-data

    - name: Remove the /etc/hosts entry this scenario added
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 openbao.rotate-secret.molecule.invalid"
        state: absent
      become: true
      register: secrets_rotate_secret_cleanup_hosts_entry
      failed_when: false
