---
- name: Converge (Play 1) - bootstrap OpenBao and create the secret to be rotated
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-rotate-secret
    secrets_rotate_secret_test_step_ca_password: molecule-rotate-secret-step-ca-password
    secrets_rotate_secret_test_openbao_port: 18201 # different from ../vault_backed's 18200 — both scenarios' containers could run on the same CI host
    secrets_rotate_secret_test_caddy_domain: rotate-secret.localtest.me
    # Real production shape isn't the point here (../vault_backed
    # already proves the mechanism against multiple formats) — one hex
    # secret is enough to prove rotate-secret.yaml's own CAS-versioned
    # update-in-place actually changes something real in Vault.
    secrets_registry:
      main-domain:
        format: manual
        sensitive: false
        description: "Molecule fixture: pre-seeded to the file cache, same as production."
      secrets-molecule-rotate-example: { format: hex, length: 40, vault_scope: hosts/security }
  tasks:
    - name: Ensure the secrets cache directory exists on the controller
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Pre-seed main-domain's cache file
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/main-domain"
        content: molecule-rotate-secret-test
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Create the docker network step-ca-test and openbao-test share
      community.docker.docker_network:
        name: secrets-rotate-secret-net
        state: present
      delegate_to: localhost
      become: false

    # delegate_to/become aren't valid attributes directly on
    # ansible.builtin.include_role (confirmed live against this repo's
    # pinned ansible-core) — wrapped in a block instead; see
    # ../vault_backed/converge.yml's identical task for the full
    # reasoning.
    - name: "Start a real, throwaway step-ca instance for this scenario [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, throwaway step-ca instance for this scenario
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_step_ca_test_target.yaml
          vars:
            molecule_helpers_step_ca_network_name: secrets-rotate-secret-net
            molecule_helpers_step_ca_password: "{{ secrets_rotate_secret_test_step_ca_password }}"

    # See ../vault_backed/converge.yml's identical task for the full
    # reasoning (secrets_vault_host is overridden to localhost below,
    # so hostvars['localhost'].caddy_domain has to resolve for
    # secrets_vault_base_url's own construction).
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ secrets_rotate_secret_test_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    # UNVERIFIED, FLAGGED — same Docker-reachability assumption as
    # ../vault_backed's own scenario (see that file's own comment, and
    # start_openbao_test_target.yaml's header, for the full reasoning);
    # not repeated at length here. The earlier sudo/etc-hosts half of
    # this concern no longer applies — confirmed live that a real CI/dev
    # control node can lack passwordless sudo, hence the
    # *.localtest.me domain below instead.
    - name: "Start a real, initialized OpenBao test target [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, initialized OpenBao test target
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_openbao_test_target.yaml
          vars:
            molecule_helpers_openbao_network_name: secrets-rotate-secret-net
            molecule_helpers_openbao_step_ca_password: "{{ secrets_rotate_secret_test_step_ca_password }}"
            molecule_helpers_openbao_host_port: "{{ secrets_rotate_secret_test_openbao_port }}"
            molecule_helpers_openbao_extra_san: "openbao.{{ secrets_rotate_secret_test_caddy_domain }}"
            molecule_helpers_openbao_approle_name: controller
            molecule_helpers_openbao_policy_hcl: >-
              {{ lookup('file', playbook_dir ~ '/../../../../../docker/openbao/policies/controller.hcl') }}
            molecule_helpers_openbao_role_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
            molecule_helpers_openbao_secret_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"

    # First-ever generation — this is what rotate-secret.yaml (Play 2,
    # below) will rotate. Real secrets role, not a hand-rolled Vault
    # write, so this scenario also incidentally re-proves create-mode
    # still works against a real target (already covered by
    # ../vault_backed, but free here).
    - name: Run the secrets role to create the secret that will be rotated
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ secrets_rotate_secret_test_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    - name: Persist the pre-rotation value, for verify.yml to compare
      ansible.builtin.copy:
        dest: "{{ project_root }}/before-rotate-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Read the pre-rotation KV version directly from Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-rotate-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: secrets_rotate_secret_test_before_metadata
      delegate_to: localhost
      become: false
      no_log: true

    - name: Persist the pre-rotation KV version
      ansible.builtin.copy:
        dest: "{{ project_root }}/before-rotate-kv-version.json"
        content: "{{ {'version': secrets_rotate_secret_test_before_metadata.json.data.metadata.version} | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    # rotate-secret.yaml (Play 2) requires these as -e vars in real
    # usage; set_fact + delegate_facts is what makes them visible to a
    # LATER, separately-imported play targeting the same host
    # ("localhost") within this one ansible-playbook run — plain play
    # vars: wouldn't carry across the play boundary the way facts do.
    - name: Set the vars rotate-secret.yaml needs, for the next play to see
      ansible.builtin.set_fact:
        secret_name: secrets-molecule-rotate-example # noqa: var-naming[no-role-prefix]
        confirm: true # noqa: var-naming[no-role-prefix]
        # rotate-secret.yaml's own tasks reference secrets_registry and
        # project_root directly — a plain play var: (as defined above)
        # doesn't survive the play boundary the same way a fact does,
        # so both have to be re-published as facts here too, same
        # reasoning as secret_name/confirm.
        secrets_registry: "{{ secrets_registry }}" # noqa: var-naming[no-role-prefix]
        project_root: "{{ project_root }}" # noqa: var-naming[no-role-prefix]
        # rotate-secret.yaml's own "Log into OpenBao as the controller
        # AppRole" task calls vault_login.yaml with no vars: overrides
        # at all (correct for its real, production call site, which
        # relies on the role's own defaults: secrets_vault_host:
        # security, port 8200, container step-ca) — so these three have
        # to arrive as facts too, or Play 2 would silently fall back to
        # those production defaults instead of this scenario's real
        # target. Not self-referential like the two above: nothing in
        # this play already holds these under these exact names.
        secrets_vault_host: localhost # noqa: var-naming[no-role-prefix]
        secrets_vault_port: "{{ secrets_rotate_secret_test_openbao_port }}" # noqa: var-naming[no-role-prefix]
        secrets_vault_step_ca_container_name: step-ca-test # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

- name: Converge (Play 2) - run the REAL rotate-secret.yaml playbook, not a reimplementation
  ansible.builtin.import_playbook: ../../../../playbooks/rotate-secret.yaml

- name: Converge (Play 3) - persist post-rotation state for verify.yml
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    project_root: /tmp/secrets-molecule-rotate-secret
    secrets_rotate_secret_test_openbao_port: 18201
    secrets_rotate_secret_test_caddy_domain: rotate-secret.localtest.me
  tasks:
    - name: Log into OpenBao independently, to read the post-rotation state
      ansible.builtin.include_role:
        name: secrets
        tasks_from: vault_login.yaml
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ secrets_rotate_secret_test_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    - name: Read the post-rotation value and version directly from Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-rotate-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: secrets_rotate_secret_test_after_metadata
      no_log: true

    - name: Persist the post-rotation value and KV version
      ansible.builtin.copy:
        dest: "{{ project_root }}/after-rotate-secrets.json"
        content: >-
          {{
            {
              'value': secrets_rotate_secret_test_after_metadata.json.data.data.value,
              'version': secrets_rotate_secret_test_after_metadata.json.data.metadata.version
            } | to_nice_json
          }}
        mode: "0600"
