---
# Same sibling-container-on-the-control-node shape as ../vault_backed —
# see that scenario's molecule.yml and molecule_helpers/tasks/
# start_openbao_test_target.yaml's header comment for why (rotate-
# secret.yaml's own Vault calls are delegate_to: localhost too, via the
# secrets role's tasks_from files it includes).
#
# No `idempotence` step, deliberately: this scenario's whole point is a
# playbook that CHANGES a value on every run — a second identical
# converge would rotate again, not converge to a no-op. Same reasoning
# as ../manual_missing's own scenario.
driver:
  name: docker
platforms:
  - name: secrets-rotate-secret-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
