---
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-rotate-secret
  tasks:
    - name: Read the pre-rotation state
      ansible.builtin.slurp:
        path: "{{ project_root }}/before-rotate-secrets.json"
      register: secrets_rotate_secret_verify_before_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the pre-rotation KV version
      ansible.builtin.slurp:
        path: "{{ project_root }}/before-rotate-kv-version.json"
      register: secrets_rotate_secret_verify_before_version_raw
      delegate_to: localhost
      become: false

    - name: Read the post-rotation state
      ansible.builtin.slurp:
        path: "{{ project_root }}/after-rotate-secrets.json"
      register: secrets_rotate_secret_verify_after_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the uuid4 secret's pre-rotation KV version
      ansible.builtin.slurp:
        path: "{{ project_root }}/before-rotate-uuid4-kv-version.json"
      register: secrets_rotate_secret_verify_before_uuid4_version_raw
      delegate_to: localhost
      become: false

    - name: Read the uuid4 secret's post-rotation state
      ansible.builtin.slurp:
        path: "{{ project_root }}/after-rotate-uuid4-secrets.json"
      register: secrets_rotate_secret_verify_after_uuid4_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Parse all three snapshots
      ansible.builtin.set_fact:
        secrets_rotate_secret_verify_before: "{{ secrets_rotate_secret_verify_before_raw.content | b64decode | from_json }}"
        secrets_rotate_secret_verify_before_version: "{{ (secrets_rotate_secret_verify_before_version_raw.content | b64decode | from_json).version }}"
        secrets_rotate_secret_verify_after: "{{ secrets_rotate_secret_verify_after_raw.content | b64decode | from_json }}"
        secrets_rotate_secret_verify_before_uuid4_version: >-
          {{
            (secrets_rotate_secret_verify_before_uuid4_version_raw.content | b64decode | from_json).version
          }}
        secrets_rotate_secret_verify_after_uuid4: "{{ secrets_rotate_secret_verify_after_uuid4_raw.content | b64decode | from_json }}"
      no_log: true

    # --- The actual point of this scenario: rotation genuinely changed
    # the value, and did so exactly once (version incremented by exactly
    # 1, not left alone or bumped repeatedly) --------------------------
    - name: Confirm the value actually changed
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after.value != secrets_rotate_secret_verify_before['secrets-molecule-rotate-example']
        fail_msg: >-
          rotate-secret.yaml ran but the value in Vault is identical to
          before — it either no-opped or read stale state instead of
          actually rotating.

    - name: Confirm the new value has the correct shape (still a valid hex secret)
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after.value | length == 40
          - secrets_rotate_secret_verify_after.value is match('^[0-9a-fA-F]+$')
        fail_msg: "The rotated value isn't 40 mixed-case hex characters — check generate_vault_value.yaml's hex path."

    - name: Confirm Vault's own KV version incremented by exactly one
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after.version == secrets_rotate_secret_verify_before_version + 1
        fail_msg: >-
          Expected the KV version to go from
          {{ secrets_rotate_secret_verify_before_version }} to
          {{ secrets_rotate_secret_verify_before_version + 1 }}, got
          {{ secrets_rotate_secret_verify_after.version }} — either rotation didn't
          write, or it wrote more than once, or something else touched
          this path during the run.

    # --- Confirm it was a real update-in-place, not a delete+recreate —
    # the property this playbook's whole design depends on (controller's
    # policy grants no delete on hosts/*, see ADR 0020/openbao-auth.md).
    # A delete+recreate would reset the version back to 1, not increment
    # it — the assertion above already rules that out, but this makes
    # the reasoning explicit rather than incidental. --------------------
    - name: Confirm the version is genuinely greater than 1 (an update, not a fresh create)
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after.version > 1
        fail_msg: "Version is 1 after rotation — this looks like a delete+recreate happened, not an in-place update."

    # --- Same four checks, for the uuid4 secret this scenario also
    # rotates — the only path that ever exercises
    # generate_vault_value.yaml's uuid4 branch anywhere in this repo. ---
    - name: Confirm the uuid4 secret's value actually changed
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after_uuid4.value != secrets_rotate_secret_verify_before['secrets-molecule-rotate-uuid4-example']
        fail_msg: >-
          rotate-secret.yaml ran against the uuid4 secret but its value in
          Vault is identical to before — it either no-opped or read stale
          state instead of actually rotating.

    - name: Confirm the new uuid4 value has the correct shape (a real version-4 UUID)
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after_uuid4.value is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
        fail_msg: "The rotated uuid4 value isn't shaped like a real UUID4 — check generate_vault_value.yaml's uuid4 path."

    - name: Confirm the uuid4 secret's KV version incremented by exactly one
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after_uuid4.version == secrets_rotate_secret_verify_before_uuid4_version + 1
        fail_msg: >-
          Expected the uuid4 secret's KV version to go from
          {{ secrets_rotate_secret_verify_before_uuid4_version }} to
          {{ secrets_rotate_secret_verify_before_uuid4_version + 1 }}, got
          {{ secrets_rotate_secret_verify_after_uuid4.version }}.

    - name: Confirm the uuid4 secret's version is genuinely greater than 1 (an update, not a fresh create)
      ansible.builtin.assert:
        that:
          - secrets_rotate_secret_verify_after_uuid4.version > 1
        fail_msg: "Version is 1 after rotation — this looks like a delete+recreate happened, not an in-place update."
