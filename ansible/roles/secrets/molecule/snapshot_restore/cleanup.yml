---
# Runs before create and after verify, tolerating "nothing to clean up
# yet" as well as "ran to completion" — same shape as ../rotate_secret's.
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../molecule_helpers/vars/images/alpine.yml"
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-snapshot-restore/
        state: absent

    - name: Remove the throwaway OpenBao/step-ca containers
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ item }}"
      loop:
        - openbao-restore-test
        - openbao-test
        - step-ca-test
      register: secrets_snapshot_restore_cleanup_rm_containers
      changed_when: secrets_snapshot_restore_cleanup_rm_containers.rc == 0
      failed_when: false

    - name: Remove the throwaway docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - rm
          - secrets-snapshot-restore-net
      register: secrets_snapshot_restore_cleanup_rm_network
      changed_when: secrets_snapshot_restore_cleanup_rm_network.rc == 0
      failed_when: false

    # Removed from inside a container, as root: the OpenBao containers
    # write these directories as their own non-root user, and the host
    # user can't remove entries it doesn't own under /tmp's sticky bit
    # (see ../rotate_secret/cleanup.yml for the longer account).
    - name: Force-remove the cert/data directories as root, inside a throwaway container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - /tmp:/tmp
          - "{{ molecule_helpers_alpine_image }}"
          - rm
          - -rf
          - /tmp/molecule-openbao-test-certs
          - /tmp/molecule-openbao-test-data
          - /tmp/molecule-openbao-restore-data
      register: secrets_snapshot_restore_cleanup_force_rm
      changed_when: secrets_snapshot_restore_cleanup_force_rm.rc == 0
      failed_when: false

    - name: Remove the throwaway cert/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/molecule-openbao-test-certs
        - /tmp/molecule-openbao-test-data
        - /tmp/molecule-openbao-restore-data
