---
# Walks the restore drill in docs/topics/secrets/openbao-backup-restore.md
# against the pinned OpenBao image, with a second throwaway node standing
# in for the disaster-recovery host: snapshot a populated node as the
# `controller` AppRole, restore it onto a freshly initialized node, and
# record what the CLI actually did. verify.yml asserts on that record.
#
# The doc's drill depends on behaviour of the `bao` CLI that changes
# between releases, so this runs on every change to the image pin — the
# pin lives in molecule_helpers' start_openbao_test_target.yaml, which
# queues every scenario that includes it. The restore target runs
# whatever image that helper started, read back from the container
# rather than written a second time here.
- name: Converge - snapshot a populated node and restore it onto a fresh one
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-snapshot-restore
    secrets_snapshot_restore_step_ca_password: molecule-snapshot-restore-step-ca-password
    secrets_snapshot_restore_openbao_port: 18203 # distinct from the other secrets scenarios' 18200-18202
    secrets_snapshot_restore_caddy_domain: snapshot-restore.localtest.me
    secrets_snapshot_restore_cert_dir: /tmp/molecule-openbao-test-certs
    secrets_snapshot_restore_target_data_dir: /tmp/molecule-openbao-restore-data
    secrets_snapshot_restore_addr: -address=https://127.0.0.1:8200
    secrets_snapshot_restore_secret_path: hosts/security/snapshot-drill
    secrets_snapshot_restore_secret_value: molecule-snapshot-drill-value
  tasks:
    - name: Create the working directories on the controller
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "{{ item.endswith('/exchange') | ternary('0755', '0700') }}"
      loop:
        - "{{ project_root }}"
        - "{{ project_root }}/exchange"
        - "{{ project_root }}/ansible/files/secrets"
      delegate_to: localhost
      become: false

    - name: Create the docker network the nodes and step-ca-test share
      community.docker.docker_network:
        name: secrets-snapshot-restore-net
        state: present
      delegate_to: localhost
      become: false

    - name: "Start a real, throwaway step-ca instance for this scenario [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, throwaway step-ca instance for this scenario
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_step_ca_test_target.yaml
          vars:
            molecule_helpers_step_ca_network_name: secrets-snapshot-restore-net
            molecule_helpers_step_ca_password: "{{ secrets_snapshot_restore_step_ca_password }}"

    # The source node: initialized at 1-of-1 Shamir, with the real
    # controller policy and AppRole. The helper leaves its unseal key
    # in the certs directory, which is what the restored node needs.
    - name: "Start a real, initialized OpenBao source node [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, initialized OpenBao source node
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_openbao_test_target.yaml
          vars:
            molecule_helpers_openbao_network_name: secrets-snapshot-restore-net
            molecule_helpers_openbao_step_ca_password: "{{ secrets_snapshot_restore_step_ca_password }}"
            molecule_helpers_openbao_host_port: "{{ secrets_snapshot_restore_openbao_port }}"
            molecule_helpers_openbao_extra_san: "openbao.{{ secrets_snapshot_restore_caddy_domain }}"
            molecule_helpers_openbao_approle_name: controller
            molecule_helpers_openbao_policy_hcl: >-
              {{ lookup('file', playbook_dir ~ '/../../../../../docker/openbao/policies/controller.hcl') }}
            molecule_helpers_openbao_role_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
            molecule_helpers_openbao_secret_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"

    - name: "Snapshot the source node as controller [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Read the controller AppRole's credentials and the source's unseal key
          ansible.builtin.slurp:
            src: "{{ item.src }}"
          loop:
            - { name: role_id, src: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id" }
            - { name: secret_id, src: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id" }
            - { name: unseal_key, src: "{{ secrets_snapshot_restore_cert_dir }}/unseal-key" }
          loop_control:
            label: "{{ item.name }}"
          register: secrets_snapshot_restore_creds_raw
          no_log: true

        - name: Hold them as facts
          ansible.builtin.set_fact:
            secrets_snapshot_restore_role_id: "{{ secrets_snapshot_restore_creds_raw.results[0].content | b64decode | trim }}"
            secrets_snapshot_restore_secret_id: "{{ secrets_snapshot_restore_creds_raw.results[1].content | b64decode | trim }}"
            secrets_snapshot_restore_unseal_key: "{{ secrets_snapshot_restore_creds_raw.results[2].content | b64decode | trim }}"
          no_log: true

        - name: Log into the source node as controller
          community.docker.docker_container_exec:
            container: openbao-test
            argv:
              - bao
              - write
              - "{{ secrets_snapshot_restore_addr }}"
              - -field=token
              - auth/approle/login
              - "role_id={{ secrets_snapshot_restore_role_id }}"
              - "secret_id={{ secrets_snapshot_restore_secret_id }}"
          register: secrets_snapshot_restore_source_login
          changed_when: false
          failed_when: secrets_snapshot_restore_source_login.rc != 0
          no_log: true

        - name: Write the known secret the restore must bring back
          community.docker.docker_container_exec:
            container: openbao-test
            argv:
              - bao
              - kv
              - put
              - "{{ secrets_snapshot_restore_addr }}"
              - -mount=secret
              - "{{ secrets_snapshot_restore_secret_path }}"
              - "value={{ secrets_snapshot_restore_secret_value }}"
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_source_login.stdout }}"
          register: secrets_snapshot_restore_kv_put
          changed_when: true
          failed_when: secrets_snapshot_restore_kv_put.rc != 0
          no_log: true

        # The call snapshot-push.sh makes, as the same AppRole.
        - name: Save a snapshot, positional path
          community.docker.docker_container_exec:
            container: openbao-test
            argv:
              - bao
              - operator
              - raft
              - snapshot
              - save
              - "{{ secrets_snapshot_restore_addr }}"
              - /tmp/drill.snap
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_source_login.stdout }}"
          register: secrets_snapshot_restore_save
          changed_when: true
          failed_when: secrets_snapshot_restore_save.rc != 0
          no_log: true

        - name: Test that the snapshot file is gzip-compressed
          community.docker.docker_container_exec:
            container: openbao-test
            argv:
              - gzip
              - -t
              - /tmp/drill.snap
          register: secrets_snapshot_restore_gzip
          changed_when: false
          failed_when: false

        # The restore node reads it from a bind-mounted host directory.
        - name: Copy the snapshot out of the source node
          ansible.builtin.command:
            argv:
              - docker
              - cp
              - openbao-test:/tmp/drill.snap
              - "{{ project_root }}/exchange/drill.snap"
          changed_when: true

        - name: Make the copy readable by the restore node's non-root user (throwaway data)
          ansible.builtin.file:
            path: "{{ project_root }}/exchange/drill.snap"
            mode: "0644"

        - name: Read the image the source node runs
          ansible.builtin.command:
            argv:
              - docker
              - inspect
              - --format
              - "{% raw %}{{.Config.Image}}{% endraw %}"
              - openbao-test
          register: secrets_snapshot_restore_image
          changed_when: false

    # The restore node: a separate node with its own raft data, keyring
    # and TLS, as a rebuilt disaster-recovery host would have.
    - name: "Start and initialize the restore node [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Ensure the restore node's data directory exists and is writable by whatever UID it runs as
          ansible.builtin.file:
            path: "{{ secrets_snapshot_restore_target_data_dir }}"
            state: directory
            mode: "0777"

        - name: Render the restore node's config
          ansible.builtin.copy:
            dest: "{{ secrets_snapshot_restore_cert_dir }}/openbao-restore.hcl"
            mode: "0644"
            content: |
              storage "raft" {
                path    = "/openbao/data"
                node_id = "molecule-openbao-restore"
              }
              listener "tcp" {
                address         = "0.0.0.0:8200"
                cluster_address = "0.0.0.0:8201"
                tls_cert_file   = "/openbao/certs/fullchain.pem"
                tls_key_file    = "/openbao/certs/privkey.pem"
              }
              api_addr     = "https://openbao-restore-test:8200"
              cluster_addr = "https://openbao-restore-test:8201"
              ui = false

        - name: Run the same image as a second, empty node
          community.docker.docker_container:
            name: openbao-restore-test
            image: "{{ secrets_snapshot_restore_image.stdout }}"
            command: server
            networks:
              - name: secrets-snapshot-restore-net
            volumes:
              - "{{ secrets_snapshot_restore_cert_dir }}:/openbao/certs:ro"
              - "{{ secrets_snapshot_restore_cert_dir }}/openbao-restore.hcl:/openbao/config/openbao.hcl:ro"
              - "{{ secrets_snapshot_restore_target_data_dir }}:/openbao/data"
              - "{{ project_root }}/exchange:/snapshots:ro"
            capabilities:
              - IPC_LOCK
            env:
              BAO_SKIP_VERIFY: "true"
            state: started
            detach: true

        - name: Wait for the restore node to respond at all
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - status
              - "{{ secrets_snapshot_restore_addr }}"
          register: secrets_snapshot_restore_target_ready
          until: (secrets_snapshot_restore_target_ready.rc | default(-1)) in [0, 2, 3]
          retries: 15
          delay: 2
          changed_when: false
          failed_when: (secrets_snapshot_restore_target_ready.rc | default(-1)) not in [0, 2, 3]

        # Its own keys and root token: needed once, for the restore call
        # (the endpoint wants a token even on an empty node), then useless.
        - name: Initialize the restore node with its own fresh keys
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - operator
              - init
              - "{{ secrets_snapshot_restore_addr }}"
              - -key-shares=1
              - -key-threshold=1
              - -format=json
          register: secrets_snapshot_restore_target_init
          changed_when: true
          failed_when: secrets_snapshot_restore_target_init.rc != 0
          no_log: true

        - name: Hold the restore node's own key and root token
          ansible.builtin.set_fact:
            secrets_snapshot_restore_target_key: "{{ (secrets_snapshot_restore_target_init.stdout | from_json).unseal_keys_b64[0] }}"
            secrets_snapshot_restore_target_root: "{{ (secrets_snapshot_restore_target_init.stdout | from_json).root_token }}"
          no_log: true

        - name: Unseal the restore node with its own key
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - operator
              - unseal
              - "{{ secrets_snapshot_restore_addr }}"
              - "{{ secrets_snapshot_restore_target_key }}"
          register: secrets_snapshot_restore_target_unseal
          changed_when: true
          failed_when: secrets_snapshot_restore_target_unseal.rc != 0
          no_log: true

        # An unsealed node can still be mid-election; the restore
        # endpoint answers 5xx until it is active.
        - name: Wait for the restore node to be active
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - status
              - "{{ secrets_snapshot_restore_addr }}"
          register: secrets_snapshot_restore_target_active
          until: (secrets_snapshot_restore_target_active.rc | default(-1)) == 0
          retries: 15
          delay: 2
          changed_when: false
          failed_when: (secrets_snapshot_restore_target_active.rc | default(-1)) != 0

    - name: "Restore the snapshot onto the restore node [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Try a plain restore, the way the doc says does not work
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - operator
              - raft
              - snapshot
              - restore
              - "{{ secrets_snapshot_restore_addr }}"
              - /snapshots/drill.snap
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_target_root }}"
          register: secrets_snapshot_restore_plain
          changed_when: false
          failed_when: false
          no_log: true

        - name: Restore with -force, the working mechanism
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - operator
              - raft
              - snapshot
              - restore
              - "{{ secrets_snapshot_restore_addr }}"
              - -force
              - /snapshots/drill.snap
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_target_root }}"
          register: secrets_snapshot_restore_forced
          changed_when: true
          failed_when: false
          no_log: true

        - name: Wait for the node to report sealed
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - status
              - "{{ secrets_snapshot_restore_addr }}"
              - -format=json
          register: secrets_snapshot_restore_sealed
          until: >-
            (secrets_snapshot_restore_sealed.rc | default(-1)) == 2 and
            (secrets_snapshot_restore_sealed.stdout | default('') is search('"sealed":\s*true'))
          retries: 15
          delay: 2
          changed_when: false
          failed_when: false

        # The snapshot's shares, not the ones the node was initialized with.
        - name: Unseal with the source node's original key
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - operator
              - unseal
              - "{{ secrets_snapshot_restore_addr }}"
              - "{{ secrets_snapshot_restore_unseal_key }}"
          register: secrets_snapshot_restore_reunseal
          changed_when: true
          failed_when: false
          no_log: true

        - name: Wait for the restored node to be active
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - status
              - "{{ secrets_snapshot_restore_addr }}"
          register: secrets_snapshot_restore_restored_active
          until: (secrets_snapshot_restore_restored_active.rc | default(-1)) == 0
          retries: 15
          delay: 2
          changed_when: false
          failed_when: false

        - name: Look up the restore node's own pre-restore root token
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - token
              - lookup
              - "{{ secrets_snapshot_restore_addr }}"
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_target_root }}"
          register: secrets_snapshot_restore_old_token
          changed_when: false
          failed_when: false
          no_log: true

        - name: Log into the restored node as controller
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - write
              - "{{ secrets_snapshot_restore_addr }}"
              - -field=token
              - auth/approle/login
              - "role_id={{ secrets_snapshot_restore_role_id }}"
              - "secret_id={{ secrets_snapshot_restore_secret_id }}"
          register: secrets_snapshot_restore_login
          until: secrets_snapshot_restore_login.rc | default(-1) == 0
          retries: 10
          delay: 2
          changed_when: false
          failed_when: false
          no_log: true

        - name: Read the known secret back
          community.docker.docker_container_exec:
            container: openbao-restore-test
            argv:
              - bao
              - kv
              - get
              - "{{ secrets_snapshot_restore_addr }}"
              - -mount=secret
              - -field=value
              - "{{ secrets_snapshot_restore_secret_path }}"
            env:
              BAO_TOKEN: "{{ secrets_snapshot_restore_login.stdout | default('') }}"
          register: secrets_snapshot_restore_readback
          changed_when: false
          failed_when: false
          no_log: true

        - name: Record what happened, for verify.yml
          ansible.builtin.copy:
            dest: "{{ project_root }}/results.json"
            mode: "0600"
            content: >-
              {{
                {
                  'gzip_rc': secrets_snapshot_restore_gzip.rc,
                  'plain_rc': secrets_snapshot_restore_plain.rc,
                  'plain_stderr': secrets_snapshot_restore_plain.stderr | default(''),
                  'forced_rc': secrets_snapshot_restore_forced.rc,
                  'forced_stderr': secrets_snapshot_restore_forced.stderr | default(''),
                  'sealed_rc': secrets_snapshot_restore_sealed.rc | default(-1),
                  'reunseal_rc': secrets_snapshot_restore_reunseal.rc,
                  'active_rc': secrets_snapshot_restore_restored_active.rc | default(-1),
                  'old_token_rc': secrets_snapshot_restore_old_token.rc,
                  'login_rc': secrets_snapshot_restore_login.rc | default(-1),
                  'readback_rc': secrets_snapshot_restore_readback.rc,
                  'readback_value': secrets_snapshot_restore_readback.stdout | default('')
                } | to_nice_json
              }}
