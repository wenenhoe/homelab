---
# Same sibling-container-on-the-control-node shape as ../vault_backed —
# see that scenario's molecule.yml and molecule_helpers/tasks/
# start_openbao_test_target.yaml's header comment for why.
#
# No `idempotence` step: this scenario restores a snapshot over a node,
# which is a one-way trip by design.
driver:
  name: docker
platforms:
  - name: secrets-snapshot-restore-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
