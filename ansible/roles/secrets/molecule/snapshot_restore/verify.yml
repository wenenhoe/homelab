---
# Asserts on what converge.yml recorded. Each failure message says which
# line of docs/topics/secrets/openbao-backup-restore.md to revisit.
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-snapshot-restore
    secrets_snapshot_restore_expected_value: molecule-snapshot-drill-value
  tasks:
    - name: Read the recorded results
      ansible.builtin.slurp:
        path: "{{ project_root }}/results.json"
      register: secrets_snapshot_restore_verify_raw
      delegate_to: localhost
      become: false

    - name: Parse them
      ansible.builtin.set_fact:
        secrets_snapshot_restore_verify: "{{ secrets_snapshot_restore_verify_raw.content | b64decode | from_json }}"

    - name: Confirm the saved snapshot is a gzip file
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.gzip_rc == 0
        fail_msg: "snapshot save no longer produces a gzip file; revisit the 'bao CLI behavior' section."

    - name: Confirm a plain restore onto a node with different keys is refused
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.plain_rc != 0
          - "'could not verify hash file' in secrets_snapshot_restore_verify.plain_stderr"
        fail_msg: >-
          A plain restore no longer fails with 'could not verify hash file'
          (rc {{ secrets_snapshot_restore_verify.plain_rc }}, stderr
          {{ secrets_snapshot_restore_verify.plain_stderr }}); revisit the
          'bao CLI behavior' section and the drill's step 4.

    - name: Confirm restore -force succeeds
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.forced_rc == 0
        fail_msg: "restore -force failed: {{ secrets_snapshot_restore_verify.forced_stderr }}"

    - name: Confirm the node resealed itself after the restore
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.sealed_rc == 2
        fail_msg: "The node did not report sealed after the forced restore; revisit the drill's steps 4 and 5."

    - name: Confirm the snapshot's original key unseals it
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.reunseal_rc == 0
          - secrets_snapshot_restore_verify.active_rc == 0
        fail_msg: "The source node's original key did not unseal the restored node; revisit the drill's step 5."

    - name: Confirm the node's own pre-restore root token no longer works
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.old_token_rc != 0
        fail_msg: "The restore node's own root token still works after the restore; revisit the 'bao CLI behavior' section."

    - name: Confirm controller's AppRole came back and reads the known secret
      ansible.builtin.assert:
        that:
          - secrets_snapshot_restore_verify.login_rc == 0
          - secrets_snapshot_restore_verify.readback_rc == 0
          - secrets_snapshot_restore_verify.readback_value == secrets_snapshot_restore_expected_value
        fail_msg: >-
          controller could not log in to, or read the known secret from, the
          restored node (login rc {{ secrets_snapshot_restore_verify.login_rc }},
          read rc {{ secrets_snapshot_restore_verify.readback_rc }}); revisit the drill's step 6.
