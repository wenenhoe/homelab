---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-vault-approle-files-missing
    # Same reasoning as ../vault_approle_missing's identical comment:
    # format doesn't matter, only vault_scope does.
    secrets_registry:
      secrets-molecule-vault-approle-files-missing-example:
        format: hex
        length: 32
        vault_scope: hosts/security
  tasks:
    # Deliberately NOT pre-seeding openbao-controller-role-id/-secret-id
    # here at all — that's the entire difference from
    # ../vault_approle_missing, which pre-seeds them blank. This
    # scenario's project_root has never been touched by anything, same
    # as a controller that has never run openbao-auth.md's runbook even
    # once — the role's own "Ensure the controller-side secrets cache
    # directory exists" task (main.yaml) creates the directory itself,
    # so nothing here needs to.

    # block/rescue (this repo's own idiom for "failure here is the
    # expected, correct outcome" — see ../manual_missing/converge.yml)
    # since the role failing is the thing under test.
    - name: "Run secrets [block / rescue] (AppRole files never provisioned at all, failure is deliberate and expected)"
      block:
        - name: Run the secrets role against a Vault-scoped registry with no AppRole cache files at all
          ansible.builtin.include_role:
            name: secrets
      rescue:
        # A bare rescue accepts ANY failure inside the block as "the
        # gate worked" — see ../manual_missing/converge.yml's identical
        # reasoning. ansible_failed_task/ansible_failed_result are only
        # populated inside a rescue block — assert on both the exact
        # task and the exact message, quoting vault_login.yaml's own
        # text rather than paraphrasing it, before trusting the
        # "expected" label at all. The "[cache files missing]" suffix
        # in the task name is what distinguishes this gate from
        # ../vault_approle_missing's sibling "present but blank" one —
        # asserting on it here is what actually proves this scenario
        # exercised the gate it exists to test, not the other one.
        - name: Confirm the failure came from the files-missing gate itself, not the blank-content one
          ansible.builtin.assert:
            that:
              - "'[cache files missing]' in ansible_failed_task.name"
              - "'openbao-controller-role-id / openbao-controller-secret-id don' in ansible_failed_result.msg"
              - "'openbao-auth.md' in ansible_failed_result.msg"
            fail_msg: >-
              secrets role failed, but not for the reason this scenario exists to
              test. Expected vault_login.yaml's "Fail loudly if the controller
              AppRole hasn't been provisioned yet [cache files missing]" task to
              fail, naming the missing credential files and pointing at
              openbao-auth.md; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message
              "{{ ansible_failed_result.msg | default('none') }}" instead.

        - name: Leave a marker proving the expected failure actually surfaced
          ansible.builtin.copy:
            dest: /tmp/secrets_vault_approle_files_missing_halt_marker
            content: "missing-approle-files caught as expected\n"
            mode: "0644"
          delegate_to: localhost
          become: false
