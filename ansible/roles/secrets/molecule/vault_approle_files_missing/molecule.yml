---
# Same lightweight, no-Docker-in-Docker shape as ../vault_approle_missing
# — this scenario never touches OpenBao at all either (the gate under
# test fires before any Vault reachability is even attempted).
driver:
  name: docker
platforms:
  - name: secrets-vault-approle-files-missing-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step, deliberately — same reasoning as
  # ../vault_approle_missing: this scenario's whole point is a role run
  # that FAILS (rescued, but still a failure inside the block), so a
  # second identical converge would just fail the same way again, not
  # converge to a no-op.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
