---
- name: Verify
  hosts: all
  become: true
  tasks:
    # --- The rescue block fired, and specifically for the right reason ------
    # Same reasoning as ../vault_approle_missing's identical verify.yml:
    # the assertion inside converge.yml's rescue: block already confirmed
    # ansible_failed_task/ansible_failed_result (including the
    # "[cache files missing]" task-name suffix that distinguishes this
    # gate from the sibling blank-content one) before this marker was
    # ever written — its mere existence is proof the right failure
    # happened, not just *a* failure.
    - name: Confirm the expected-failure marker exists
      ansible.builtin.stat:
        path: /tmp/secrets_vault_approle_files_missing_halt_marker
      register: secrets_verify_marker
      delegate_to: localhost
      become: false
      failed_when: not secrets_verify_marker.stat.exists
