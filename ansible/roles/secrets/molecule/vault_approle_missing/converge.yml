---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-vault-approle-missing
    # format doesn't matter here — vault_login.yaml's own gate fires
    # before ensure_secret.yaml ever gets to this entry's own
    # generation/read logic. Only vault_scope matters, since that's
    # what makes secrets_vault_needed true and triggers vault_login.yaml
    # in the first place. No main-domain entry — main.yaml's own guard
    # (`when: "'main-domain' in secrets_registry"`) skips resolving it
    # when absent, same as ../vault_backed/../rotate_secret's own
    # fixtures.
    secrets_registry:
      secrets-molecule-vault-approle-missing-example:
        format: hex
        length: 32
        vault_scope: hosts/security
  tasks:
    - name: Ensure the secrets cache directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # Present but blank, not absent: vault_login.yaml's own gate
    # specifically checks for present-but-empty (a controller that's
    # been through main.yaml's cache-directory setup but never actually
    # run openbao-auth.md's runbook) — an absent file would instead hit
    # ensure_secret.yaml's OWN generic "cache file missing" handling for
    # a manual-format secret, a different code path than the one this
    # scenario exists to test. These two are the only permanent
    # file-cache-backed exceptions still relevant to a vault_scope-only
    # registry (main-domain is the third, and irrelevant here — see the
    # comment above).
    - name: Pre-seed the controller AppRole credential files as blank, matching a never-provisioned controller
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/{{ item }}"
        content: ""
        mode: "0600"
      loop:
        - openbao-controller-role-id
        - openbao-controller-secret-id
      delegate_to: localhost
      become: false

    # block/rescue (this repo's own idiom for "failure here is the
    # expected, correct outcome" — see ../manual_missing/converge.yml)
    # since the role failing is the thing under test.
    - name: "Run secrets [block / rescue] (AppRole not provisioned, failure is deliberate and expected)"
      block:
        - name: Run the secrets role against a Vault-scoped registry with the controller AppRole never provisioned
          ansible.builtin.include_role:
            name: secrets
      rescue:
        # A bare rescue accepts ANY failure inside the block as "the
        # gate worked" — see ../manual_missing/converge.yml's identical
        # reasoning. ansible_failed_task/ansible_failed_result are only
        # populated inside a rescue block — assert on both the exact
        # task and the exact message, quoting vault_login.yaml's own
        # text rather than paraphrasing it, before trusting the
        # "expected" label at all.
        - name: Confirm the failure came from the AppRole-not-provisioned gate itself
          ansible.builtin.assert:
            that:
              - "'Fail loudly if the controller AppRole' in ansible_failed_task.name"
              - "'openbao-controller-role-id / openbao-controller-secret-id are' in ansible_failed_result.msg"
              - "'openbao-auth.md' in ansible_failed_result.msg"
            fail_msg: >-
              secrets role failed, but not for the reason this scenario exists to
              test. Expected vault_login.yaml's "Fail loudly if the controller
              AppRole hasn't been provisioned yet" task to fail, naming the
              blank credential files and pointing at openbao-auth.md; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message
              "{{ ansible_failed_result.msg | default('none') }}" instead.

        - name: Leave a marker proving the expected failure actually surfaced
          ansible.builtin.copy:
            dest: /tmp/secrets_vault_approle_missing_halt_marker
            content: "unprovisioned-approle caught as expected\n"
            mode: "0644"
          delegate_to: localhost
          become: false
