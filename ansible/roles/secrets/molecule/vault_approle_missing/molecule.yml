---
# Same lightweight, no-Docker-in-Docker shape as ../manual_missing —
# this scenario never touches OpenBao at all (the gate under test fires
# before any Vault reachability is even attempted), so it needs no
# sibling OpenBao/step-ca containers the way ../vault_backed does.
driver:
  name: docker
platforms:
  - name: secrets-vault-approle-missing-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step, deliberately — same reasoning as
  # ../manual_missing: this scenario's whole point is a role run that
  # FAILS (rescued, but still a failure inside the block), so a second
  # identical converge would just fail the same way again, not converge
  # to a no-op.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
