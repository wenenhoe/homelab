---
- name: Verify
  hosts: all
  become: true
  tasks:
    # --- The rescue block fired, and specifically for the right reason ------
    # (the assertion inside converge.yml's rescue: block already confirmed
    # ansible_failed_task/ansible_failed_result before this marker was ever
    # written — its mere existence is proof the right failure happened,
    # not just *a* failure.) No independent side-effect check beyond this,
    # unlike ../manual_missing's own "no cache file exists" check: a
    # Vault-scoped hex entry has no local file this gate's own outcome
    # would leave behind either way, and an earlier attempt at a
    # tempfile-based equivalent (confirmed live) proved unreliable —
    # vault_login.yaml's own root-cert tempfile is never cleaned up
    # anywhere in this codebase (a real, separate leak — see
    # vault_login.yaml's own header comment), so any long-lived machine
    # accumulates unrelated leftovers from genuinely successful runs
    # that a same-pattern check can't distinguish from a real
    # regression here. Redundant anyway: if this gate's own `when:`
    # condition were ever wrong and failed to fire, the role would
    # never reach the rescue block at all, and the marker itself would
    # never get written — already caught by the check above.
    - name: Confirm the expected-failure marker exists
      ansible.builtin.stat:
        path: /tmp/secrets_vault_approle_missing_halt_marker
      register: secrets_verify_marker
      delegate_to: localhost
      become: false
      failed_when: not secrets_verify_marker.stat.exists
