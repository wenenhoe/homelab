---
# Runs via molecule's own `cleanup` step, before create and after verify
# (see molecule.yml's test_sequence) — same reasoning as ../default's
# own cleanup.yml. hosts: localhost, not hosts: all: the pre-create run
# happens before secrets-vault-backed-instance exists.
#
# Every task here tolerates "nothing to clean up yet" (the pre-create
# run) as well as "scenario ran to completion" (the post-verify run) —
# same shape as spike-openbao-runtime-assumptions.sh's own cleanup().
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-vault-backed/
        state: absent

    - name: Remove the throwaway OpenBao/step-ca containers
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ item }}"
      loop:
        - openbao-test
        - step-ca-test
      register: secrets_vault_backed_cleanup_rm_containers
      changed_when: secrets_vault_backed_cleanup_rm_containers.rc == 0
      failed_when: false

    - name: Remove the throwaway docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - rm
          - secrets-vault-backed-net
      register: secrets_vault_backed_cleanup_rm_network
      changed_when: secrets_vault_backed_cleanup_rm_network.rc == 0
      failed_when: false

    # Mounts /tmp itself (not the target directories individually) and
    # removes them FROM INSIDE, as the container's root user — matching
    # spike-openbao-runtime-assumptions.sh's own cleanup() exactly. This
    # matters, not just convenience: mounting a target directory AS the
    # container's own root (an earlier version of this task did that)
    # only lets the container clear its CONTENTS, never the mount-point
    # entry itself — removing that entry afterward, from the host side,
    # then hit EPERM (not EACCES) on /tmp's own sticky bit, which blocks
    # anyone but the owner (or root) from removing an entry directly
    # inside it, regardless of that entry's own permission bits.
    # Mounting /tmp and deleting from inside, as root, bypasses the
    # sticky bit entirely (root is exempt from it) and actually removes
    # the directories, not just their contents.
    - name: Force-remove the cert/data directories as root, inside a throwaway container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - /tmp:/tmp
          - alpine
          - rm
          - -rf
          - /tmp/molecule-openbao-test-certs
          - /tmp/molecule-openbao-test-data
      register: secrets_vault_backed_cleanup_force_rm
      changed_when: secrets_vault_backed_cleanup_force_rm.rc == 0
      failed_when: false

    # Redundant fallback, same as the spike's own belt-and-suspenders
    # shape: normally a no-op by the time this runs (the task above
    # already removed both directories), but still catches it if Docker
    # itself isn't reachable for some reason. state: absent is already
    # a no-op on a path that doesn't exist — no failed_when/
    # ignore_errors needed, unlike the docker-based tasks above.
    - name: Remove the throwaway cert/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/molecule-openbao-test-certs
        - /tmp/molecule-openbao-test-data
