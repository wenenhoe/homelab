---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-vault-backed
    vault_backed_step_ca_password: molecule-vault-backed-step-ca-password
    vault_backed_openbao_port: 18200
    vault_backed_caddy_domain: vault-backed.molecule.invalid
    # One of each format that has a vault_scope, plus main-domain (the
    # one entry EVERY registry needs regardless — see
    # secrets_registry.yaml's own header comment). Real host/concern
    # values don't matter here — this scenario tests the mechanism
    # against real Vault, not any specific production consumer (same
    # reasoning as ../default's own fixture registry).
    #
    # Deliberately no manual-vault-missing case here: that failure path
    # needs block/rescue (see ../manual_missing), which can't coexist
    # with this scenario's idempotence step. A vault_manual_missing
    # scenario mirroring manual_missing's own shape, but against real
    # Vault, is a reasonable follow-up — not built yet.
    secrets_registry:
      main-domain:
        format: manual
        sensitive: false
        description: "Molecule fixture: pre-seeded to the file cache, same as production — this entry never moves to Vault."
      secrets-molecule-vault-hex-example: { format: hex, length: 40, vault_scope: hosts/security }
      secrets-molecule-vault-uuid4-example: { format: uuid4, vault_scope: hosts/services }
      secrets-molecule-vault-manual-present-example:
        format: manual
        sensitive: false
        vault_scope: hosts/all/telegram
        description: "Molecule fixture: pre-seeded directly into Vault below, simulating what bootstrap_secrets.py would have done in production."
  tasks:
    - name: Ensure the secrets cache directory exists on the controller (molecule control node)
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # Never moves to Vault (secrets_registry.yaml's own header comment)
    # — the value itself is unused by anything in this scenario, since
    # secrets_vault_base_url is built from vault_backed_caddy_domain
    # directly, not derived from main_domain the way production's real
    # openbao.{{ caddy_domain }} naming is.
    - name: Pre-seed main-domain's cache file
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/main-domain"
        content: molecule-vault-backed-test
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Create the docker network step-ca-test and openbao-test share
      community.docker.docker_network:
        name: secrets-vault-backed-net
        state: present
      delegate_to: localhost
      become: false

    - name: Start a real, throwaway step-ca instance for this scenario
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_step_ca_test_target.yaml
      vars:
        molecule_helpers_step_ca_network_name: secrets-vault-backed-net
        molecule_helpers_step_ca_password: "{{ vault_backed_step_ca_password }}"

    # secrets_vault_base_url is built as
    # "https://openbao.{{ hostvars[secrets_vault_host].caddy_domain }}:...",
    # and secrets_vault_host is overridden to `localhost` below (the
    # cert-fetch task needs to delegate to wherever the real docker
    # daemon lives, which is the control node here, not this scenario's
    # platform container — see start_openbao_test_target.yaml's header
    # comment). delegate_facts: true is what makes
    # hostvars['localhost'].caddy_domain resolve to this value for that
    # URL construction, since "localhost" is never itself a member of
    # this play's targeted hosts otherwise.
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ vault_backed_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    # UNVERIFIED, FLAGGED (see start_openbao_test_target.yaml's own
    # header comment for the full reasoning): this and every other
    # docker-touching task from here on assumes delegate_to: localhost
    # reaches the same docker daemon Molecule's own driver used to
    # create this scenario's platform container, and that the control
    # node can sudo to edit /etc/hosts. Confirmed in isolation via
    # spike-openbao-runtime-assumptions.sh's Q4; not yet confirmed
    # through Molecule's own actual provisioner process specifically —
    # if either is wrong, the tasks below fail with an ordinary
    # connection/permission error, not a silent wrong result.
    - name: Start a real, initialized OpenBao test target
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_openbao_test_target.yaml
      vars:
        molecule_helpers_openbao_network_name: secrets-vault-backed-net
        molecule_helpers_openbao_step_ca_password: "{{ vault_backed_step_ca_password }}"
        molecule_helpers_openbao_host_port: "{{ vault_backed_openbao_port }}"
        molecule_helpers_openbao_extra_san: "openbao.{{ vault_backed_caddy_domain }}"
        molecule_helpers_openbao_approle_name: controller
        # The REAL production policy, extracted rather than hand-copied
        # — same reasoning as openbao_cert/molecule/default's own
        # app_registry lookup (docs/molecule-fixtures.md): this proves
        # the actual Accepted policy (ADR 0022) permits what
        # ensure_secret.yaml/rotate-secret.yaml need, including proving
        # the NEGATIVE that it grants no delete on hosts/* (which
        # rotate-secret.yaml's CAS-update-in-place design relies on) —
        # a hand-copied approximation could silently drift from that.
        molecule_helpers_openbao_policy_hcl: >-
          {{ lookup('file', playbook_dir ~ '/../../../../../docker/openbao/policies/controller.hcl') }}
        molecule_helpers_openbao_role_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
        molecule_helpers_openbao_secret_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"

    # Logs in independently of the main secrets role invocation below,
    # simulating what bootstrap_secrets.py does in production for a
    # Vault-backed manual secret (it also authenticates on its own,
    # separately from any deploy.yaml run) — not just reusing a token
    # the role-under-test happens to have already minted.
    - name: Log into OpenBao directly, to pre-seed the manual secret (simulating bootstrap_secrets.py)
      ansible.builtin.include_role:
        name: secrets
        tasks_from: vault_login.yaml
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_backed_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    - name: Pre-seed the manual secret in Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/all/telegram/secrets-molecule-vault-manual-present-example"
        method: POST
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        body_format: json
        body:
          data:
            value: a-manually-supplied-vault-value
          options:
            cas: 0
        status_code: [200]
      delegate_to: localhost
      become: false
      no_log: true

    - name: Run the secrets role
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_backed_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    # Persisted to files, not just facts — verify.yml is a separate
    # ansible-playbook invocation (same reasoning as ../default's own
    # converge.yml).
    - name: Persist this run's secrets_generated, for verify.yml to inspect
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Snapshot the FIRST run's secrets_generated, if not already captured
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false

    # Independent, stronger idempotence check than "nothing reported
    # changed": ask Vault itself for the hex secret's current KV
    # version. If the role re-wrote it on the idempotence re-run, this
    # would be 2, not 1 — proves the CAS create-only path genuinely
    # never re-fires, not just that Ansible's own change-tracking
    # didn't notice (see docs/verification-discipline in the project's
    # own standing rules: assert the actual side effect).
    - name: Read the hex secret's current KV metadata directly from Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-vault-hex-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: vault_backed_hex_metadata_check
      delegate_to: localhost
      become: false
      no_log: true

    - name: Persist the current KV version, for verify.yml to compare
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-kv-version.json"
        content: "{{ {'version': vault_backed_hex_metadata_check.json.data.metadata.version} | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Snapshot the FIRST run's KV version, if not already captured
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-kv-version.json"
        content: "{{ {'version': vault_backed_hex_metadata_check.json.data.metadata.version} | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
