---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-vault-backed
    vault_backed_step_ca_password: molecule-vault-backed-step-ca-password
    vault_backed_openbao_port: 18200
    vault_backed_caddy_domain: vault-backed.localtest.me
    # One of each source that is stored in OpenBao, plus main-domain (the
    # one entry EVERY catalog needs regardless — see
    # secret_catalog.yaml's own header comment). Real host/concern
    # values don't matter here — this scenario tests the mechanism
    # against real Vault, not any specific production consumer (same
    # reasoning as ../default's own fixture catalog).
    #
    # Deliberately no manual-vault-missing case here: that failure path
    # needs block/rescue (see ../manual_missing), which can't coexist
    # with this scenario's idempotence step — see ../vault_manual_missing,
    # which mirrors manual_missing's own shape but against real Vault.
    secret_catalog:
      main-domain:
        source: manual
        store: controller_file
        sensitive: false
        description: "Molecule fixture: pre-seeded to the file cache, same as production — this entry never moves to Vault."
      secrets-molecule-vault-hex-example:
        source: hex
        length: 40
        store: openbao
        scope: hosts/security
      secrets-molecule-vault-uuid4-example:
        source: uuid4
        store: openbao
        scope: hosts/services
      secrets-molecule-vault-manual-present-example:
        source: manual
        sensitive: false
        store: openbao
        scope: hosts/all/telegram
        description: "Molecule fixture: pre-seeded directly into Vault below, simulating what openbao_utils/bootstrap.py would have done in production."
  tasks:
    - name: Ensure the secrets cache directory exists on the controller (molecule control node)
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # Never moves to Vault (secret_catalog.yaml's own header comment)
    # — the value itself is unused by anything in this scenario, since
    # secrets_vault_base_url is built from vault_backed_caddy_domain
    # directly, not derived from main_domain the way production's real
    # openbao.{{ caddy_domain }} naming is.
    - name: Pre-seed main-domain's cache file
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/main-domain"
        content: molecule-vault-backed-test
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Create the docker network step-ca-test and openbao-test share
      community.docker.docker_network:
        name: secrets-vault-backed-net
        state: present
      delegate_to: localhost
      become: false

    # delegate_to/become aren't valid attributes directly on
    # ansible.builtin.include_role (confirmed live against this repo's
    # pinned ansible-core: "'delegate_to' is not a valid attribute for
    # a IncludeRole") — wrapped in a block instead, since block: does
    # accept them and correctly propagates delegation into the
    # included role's own internal tasks (confirmed live), not just
    # the include_role statement itself.
    - name: "Start a real, throwaway step-ca instance for this scenario [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, throwaway step-ca instance for this scenario
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_step_ca_test_target.yaml
          vars:
            molecule_helpers_step_ca_network_name: secrets-vault-backed-net
            molecule_helpers_step_ca_password: "{{ vault_backed_step_ca_password }}"

    # secrets_vault_base_url is built as
    # "https://openbao.{{ hostvars[secrets_vault_host].caddy_domain }}:...",
    # and secrets_vault_host is overridden to `localhost` below (the
    # cert-fetch task needs to delegate to wherever the real docker
    # daemon lives, which is the control node here, not this scenario's
    # platform container — see start_openbao_test_target.yaml's header
    # comment). delegate_facts: true is what makes
    # hostvars['localhost'].caddy_domain resolve to this value for that
    # URL construction, since "localhost" is never itself a member of
    # this play's targeted hosts otherwise.
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ vault_backed_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    # Confirmed, not just assumed (see start_openbao_test_target.yaml's
    # own header comment for the full reasoning): delegate_to: localhost
    # does reach the same docker daemon Molecule's own driver used to
    # create this scenario's platform container — proven now through
    # this scenario's own actual provisioner process, including its
    # `idempotence` step, not just in isolation via
    # spike-openbao-runtime-assumptions.sh's Q4. (The earlier
    # /etc/hosts+sudo half of this same concern is gone: confirmed live
    # that a real CI/dev control node can lack passwordless sudo
    # entirely, which is why molecule_helpers_openbao_extra_san now uses
    # a *.localtest.me subdomain instead — see that var's own doc in
    # start_openbao_test_target.yaml.)
    - name: "Start a real, initialized OpenBao test target [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, initialized OpenBao test target
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_openbao_test_target.yaml
          vars:
            molecule_helpers_openbao_network_name: secrets-vault-backed-net
            molecule_helpers_openbao_step_ca_password: "{{ vault_backed_step_ca_password }}"
            molecule_helpers_openbao_host_port: "{{ vault_backed_openbao_port }}"
            molecule_helpers_openbao_extra_san: "openbao.{{ vault_backed_caddy_domain }}"
            molecule_helpers_openbao_approle_name: controller
            # The REAL production policy, extracted rather than hand-copied
            # — same reasoning as step_ca_cert/molecule/signal_chown's
            # own app_catalog lookup (docs/topics/engineering/molecule-fixtures.md): this proves
            # the actual Accepted policy (ADR 0020) permits what
            # ensure_secret.yaml/rotate-secret.yaml need, including proving
            # the NEGATIVE that it grants no delete on hosts/* (which
            # rotate-secret.yaml's CAS-update-in-place design relies on) —
            # a hand-copied approximation could silently drift from that.
            molecule_helpers_openbao_policy_hcl: >-
              {{ lookup('file', playbook_dir ~ '/../../../../../docker/openbao/policies/controller.hcl') }}
            molecule_helpers_openbao_role_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
            molecule_helpers_openbao_secret_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"

    # Logs in independently of the main secrets role invocation below,
    # simulating what openbao_utils/bootstrap.py does in production for a
    # Vault-backed manual secret (it also authenticates on its own,
    # separately from any deploy.yaml run) — not just reusing a token
    # the role-under-test happens to have already minted.
    - name: Log into OpenBao directly, to pre-seed the manual secret (simulating openbao_utils/bootstrap.py)
      ansible.builtin.include_role:
        name: secrets
        tasks_from: vault_login.yaml
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_backed_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    # Molecule's idempotence step re-runs this whole converge a second
    # time — cas=0 correctly returns 400 on that second run (the value
    # already exists from the first run; the exact behavior confirmed
    # against real OpenBao and relied on everywhere else in this role),
    # but nothing here tolerated that. Same check-then-write shape as
    # read_vault_kv.yaml's own existence check, applied here for the
    # same reason.
    - name: Check whether the manual secret already exists in Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/all/telegram/secrets-molecule-vault-manual-present-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200, 404]
      register: secrets_vault_backed_manual_preseed_check
      delegate_to: localhost
      become: false
      no_log: true

    - name: Pre-seed the manual secret in Vault, only if not already there
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/all/telegram/secrets-molecule-vault-manual-present-example"
        method: POST
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        body_format: json
        body:
          data:
            value: a-manually-supplied-vault-value
          options:
            cas: 0
        status_code: [200]
      when: secrets_vault_backed_manual_preseed_check.status == 404
      delegate_to: localhost
      become: false
      no_log: true

    # This login's own tempfile — the role's own separate login just
    # below creates and cleans up its own (see vault_login.yaml's
    # header comment), so this one needs its own explicit removal here,
    # its own last use, or it leaks like every other test-only extra
    # login in this codebase confirmed live to do.
    # changed_when: false — same reasoning as the tempfile's own
    # creation task in vault_login.yaml: it's created and removed fresh
    # every single run, by design, which correctly fails Molecule's
    # idempotence check otherwise — confirmed live.
    - name: Remove this scenario's pre-seed-login root-cert tempfile
      ansible.builtin.file:
        path: "{{ secrets_vault_ca_path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Run the secrets role
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_backed_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    # Persisted to files, not just facts — verify.yml is a separate
    # ansible-playbook invocation (same reasoning as ../default's own
    # converge.yml).
    - name: Persist this run's secrets_generated, for verify.yml to inspect
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Snapshot the FIRST run's secrets_generated, if not already captured
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-secrets.json"
        content: "{{ secrets_generated | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false

    # Independent, stronger idempotence check than "nothing reported
    # changed": ask Vault itself for the hex secret's current KV
    # version. If the role re-wrote it on the idempotence re-run, this
    # would be 2, not 1 — proves the CAS create-only path genuinely
    # never re-fires, not just that Ansible's own change-tracking
    # didn't notice (see docs/verification-discipline in the project's
    # own standing rules: assert the actual side effect).
    - name: Read the hex secret's current KV metadata directly from Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-vault-hex-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: secrets_vault_backed_hex_metadata_check
      delegate_to: localhost
      become: false
      no_log: true

    # A task in a play finds a module in a library/ beside the playbook; only tasks
    # inside the role find the role's own, so this scenario's library/ links to it.
    # Two calls for the same, not-yet-existing secret started together. Which one
    # creates it is up to timing, so only what has to hold either way is checked
    # (verify.yml): one value, one creator. The lost-race branch itself is what
    # test_ensure_vault_secret.py covers.
    - name: Start two resolutions of the same new secret at once
      ensure_vault_secret:
        name: secrets-molecule-vault-race-example
        source: hex
        length: 40
        scope: hosts/security
        vault_base_url: "{{ secrets_vault_base_url }}"
        vault_token: "{{ secrets_vault_token }}"
        vault_ca_path: "{{ secrets_vault_ca_path }}"
      async: 60
      poll: 0
      loop: [first, second]
      register: secrets_vault_backed_race_jobs
      # Starting a job always reports a change; whether it created the secret is
      # what the wait below reports.
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Wait for both resolutions
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ secrets_vault_backed_race_jobs.results }}"
      register: secrets_vault_backed_race
      until: secrets_vault_backed_race.finished
      retries: 60
      delay: 1
      delegate_to: localhost
      become: false
      no_log: true

    - name: Persist what each resolution returned, for verify.yml to compare
      vars:
        secrets_vault_backed_race_summary:
          values: "{{ secrets_vault_backed_race.results | map(attribute='value') | list }}"
          changed: "{{ secrets_vault_backed_race.results | map(attribute='changed') | list }}"
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-race.json"
        content: "{{ secrets_vault_backed_race_summary | to_nice_json }}"
        mode: "0600"
      # Which call created the secret differs between the first run and the re-run
      # by design, so this file's content does too.
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Snapshot the FIRST run's resolutions, if not already captured
      vars:
        secrets_vault_backed_race_summary:
          values: "{{ secrets_vault_backed_race.results | map(attribute='value') | list }}"
          changed: "{{ secrets_vault_backed_race.results | map(attribute='changed') | list }}"
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-race.json"
        content: "{{ secrets_vault_backed_race_summary | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
      no_log: true

    # A task that calls the module with no_log: true must print neither the value
    # it generated nor the value it reused, at -vvv. The probe is its own
    # ansible-playbook process, with the settings that would hide a leak turned off
    # (display_ok_hosts = no in ansible.cfg hides every ok result, which would make
    # this pass whatever the task did) and without the coverage callback this
    # scenario's own run loads. The interpreter is the one running Molecule, which
    # has hvac.
    - name: Run the probe three times at -vvv - generate-or-reuse, reuse, and a control that prints the value
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/ansible-playbook"
          - -vvv
          - -i
          - localhost,
          - -c
          - local
          - -e
          - ansible_python_interpreter={{ ansible_playbook_python }}
          - -e
          - probe_reveal={{ item }}
          - "{{ playbook_dir }}/probe_ensure_vault_secret.yml"
      environment:
        ANSIBLE_DISPLAY_OK_HOSTS: "yes"
        ANSIBLE_DISPLAY_SKIPPED_HOSTS: "yes"
        # Replaces molecule_coverage. An empty value crashes ansible-playbook, so name a
        # callback that is always on anyway.
        ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.default
        PROBE_VAULT_BASE_URL: "{{ secrets_vault_base_url }}"
        PROBE_VAULT_TOKEN: "{{ secrets_vault_token }}"
        PROBE_VAULT_CA_PATH: "{{ secrets_vault_ca_path }}"
      loop: [false, false, true]
      register: secrets_vault_backed_probe
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the probe's secret straight from OpenBao
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-vault-no-log-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: secrets_vault_backed_probe_stored
      delegate_to: localhost
      become: false
      no_log: true

    - name: Confirm no_log kept the value out of both runs, and that the control run shows the capture can see it
      vars:
        secrets_vault_backed_probe_value: "{{ secrets_vault_backed_probe_stored.json.data.data.value }}"
        secrets_vault_backed_probe_first: "{{ secrets_vault_backed_probe.results[0].stdout ~ secrets_vault_backed_probe.results[0].stderr }}"
        secrets_vault_backed_probe_second: "{{ secrets_vault_backed_probe.results[1].stdout ~ secrets_vault_backed_probe.results[1].stderr }}"
      ansible.builtin.assert:
        that:
          - secrets_vault_backed_probe_value not in secrets_vault_backed_probe_first
          - secrets_vault_backed_probe_value not in secrets_vault_backed_probe_second
          - secrets_vault_backed_probe_value in secrets_vault_backed_probe.results[2].stdout
        fail_msg: >-
          A task calling ensure_vault_secret with no_log: true printed the secret at -vvv,
          or the control run did not print it, so the capture proves nothing.
        quiet: true
      no_log: true

    # This is "Run the secrets role"'s own, separate internal login's
    # tempfile (a different one from the pre-seed login's, already
    # cleaned up above) — its own last use, same reasoning.
    # changed_when: false — same reasoning as above.
    - name: Remove this run's root-cert tempfile
      ansible.builtin.file:
        path: "{{ secrets_vault_ca_path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Persist the current KV version, for verify.yml to compare
      ansible.builtin.copy:
        dest: "{{ project_root }}/latest-run-kv-version.json"
        content: "{{ {'version': secrets_vault_backed_hex_metadata_check.json.data.metadata.version} | to_nice_json }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Snapshot the FIRST run's KV version, if not already captured
      ansible.builtin.copy:
        dest: "{{ project_root }}/first-run-kv-version.json"
        content: "{{ {'version': secrets_vault_backed_hex_metadata_check.json.data.metadata.version} | to_nice_json }}"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
