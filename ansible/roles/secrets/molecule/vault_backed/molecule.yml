---
# Same lightweight platform as ../default/../manual_missing — no
# Docker-in-Docker, no systemd, no privileged mode. This scenario's
# OpenBao/step-ca containers run as SIBLINGS on the control node's own
# docker daemon instead (see molecule_helpers/tasks/
# start_openbao_test_target.yaml's header comment for why: the
# secrets role's own Vault calls are delegate_to: localhost, so the
# control node itself — not this platform container — is what needs to
# reach OpenBao).
driver:
  name: docker
platforms:
  - name: secrets-vault-backed-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
