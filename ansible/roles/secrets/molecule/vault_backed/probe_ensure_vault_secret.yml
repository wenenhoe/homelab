---
# Run by converge.yml as an ansible-playbook process of its own, at -vvv, so the
# output it captures is what an operator sees. The connection comes from the
# environment (the PROBE_VAULT_* variables), not from arguments, so the token is
# not on the command line.
- name: Resolve a secret the way the secrets role does
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve the secret
      ensure_vault_secret:
        name: secrets-molecule-vault-no-log-example
        source: hex
        length: 40
        scope: hosts/security
        vault_base_url: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_BASE_URL') }}"
        vault_token: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_TOKEN') }}"
        vault_ca_path: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_CA_PATH') }}"
      register: probe_resolved
      no_log: true

    - name: Read the secret straight from OpenBao
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_BASE_URL') }}/v1/secret/data/hosts/security/secrets-molecule-vault-no-log-example"
        headers:
          X-Vault-Token: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_TOKEN') }}"
        ca_path: "{{ lookup('ansible.builtin.env', 'PROBE_VAULT_CA_PATH') }}"
        status_code: [200]
      register: probe_stored
      no_log: true

    - name: Confirm the registered value is the stored one, not a redaction marker
      ansible.builtin.assert:
        that:
          - probe_resolved.value == probe_stored.json.data.data.value
          - probe_resolved.value is match('^[0-9a-f]{40}$')
        quiet: true
      no_log: true

    # Only for the control run: it shows this process's output does carry a value
    # when something prints one, so the absence in the other runs means something.
    - name: Print the value, when asked to
      ansible.builtin.debug:
        msg: "{{ probe_resolved.value }}"
      when: probe_reveal | default(false) | bool
