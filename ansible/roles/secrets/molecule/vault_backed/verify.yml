---
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-vault-backed
    vault_backed_step_ca_password: molecule-vault-backed-step-ca-password
    vault_backed_openbao_port: 18200
    vault_backed_caddy_domain: vault-backed.localtest.me
  tasks:
    # secrets_vault_base_url needs hostvars['localhost'].caddy_domain to
    # resolve (see converge.yml's identical task for the full reasoning)
    # — this is a SEPARATE playbook invocation from converge.yml, so it
    # has to set this up again rather than inheriting anything.
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ vault_backed_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    # --- Every registered secret was generated -----------------------------
    - name: Read the latest run's persisted secrets_generated
      ansible.builtin.slurp:
        path: "{{ project_root }}/latest-run-secrets.json"
      register: secrets_verify_latest_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read the FIRST run's persisted secrets_generated
      ansible.builtin.slurp:
        path: "{{ project_root }}/first-run-secrets.json"
      register: secrets_verify_first_raw
      delegate_to: localhost
      become: false
      no_log: true

    - name: Parse both persisted snapshots
      ansible.builtin.set_fact:
        secrets_verify_latest: "{{ secrets_verify_latest_raw.content | b64decode | from_json }}"
        secrets_verify_first: "{{ secrets_verify_first_raw.content | b64decode | from_json }}"
      no_log: true

    - name: Confirm every registered secret was generated
      ansible.builtin.assert:
        that:
          - "'secrets-molecule-vault-hex-example' in secrets_verify_latest"
          - "'secrets-molecule-vault-uuid4-example' in secrets_verify_latest"
          - "'secrets-molecule-vault-manual-present-example' in secrets_verify_latest"
        fail_msg: "secrets_generated is missing one or more Vault-backed registry keys."

    # --- hex mode: correct length and character set -------------------------
    - name: Confirm the hex secret is the requested length and character set
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-vault-hex-example'] | length == 40
          - secrets_verify_latest['secrets-molecule-vault-hex-example'] is match('^[0-9a-fA-F]+$')
        fail_msg: "Vault-backed hex secret isn't 40 mixed-case hex characters."

    # --- uuid4 mode: real RFC 4122 v4 shape ----------------------------------
    - name: Confirm the uuid4 secret is a real version-4 UUID
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-vault-uuid4-example'] is match('^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
        fail_msg: "Vault-backed uuid4 secret isn't shaped like a real UUID4."

    # --- manual mode: exact pre-seeded value read back -----------------------
    - name: Confirm the manual secret's value matches what was pre-seeded in Vault
      ansible.builtin.assert:
        that:
          - secrets_verify_latest['secrets-molecule-vault-manual-present-example'] == 'a-manually-supplied-vault-value'
        fail_msg: "Vault-backed manual secret doesn't match what was written directly to Vault before the role ran."

    # --- Idempotent re-run: reused, not regenerated (Ansible-level check) ---
    - name: Confirm the idempotent re-run reused the exact same values
      ansible.builtin.assert:
        that:
          - secrets_verify_first == secrets_verify_latest
        fail_msg: "secrets_generated differs between runs — the role regenerated a value instead of reusing the cached one."

    # --- Idempotent re-run: real side effect, not just Ansible's own
    # change-tracking (verification-discipline: assert the actual side
    # effect happened, not an exit code / changed:false) ---------------------
    - name: Read both persisted KV version snapshots
      ansible.builtin.slurp:
        path: "{{ project_root }}/{{ item }}"
      register: secrets_verify_kv_version_raw
      delegate_to: localhost
      become: false
      loop:
        - first-run-kv-version.json
        - latest-run-kv-version.json

    - name: Confirm Vault's own KV version never incremented across the idempotent re-run
      ansible.builtin.assert:
        that:
          - (secrets_verify_kv_version_raw.results[0].content | b64decode | from_json).version == 1
          - (secrets_verify_kv_version_raw.results[1].content | b64decode | from_json).version == 1
        fail_msg: >-
          The hex secret's KV version incremented between runs — the
          idempotence re-run wrote to Vault again instead of reusing the
          existing value. Ansible's own changed:false reporting can miss
          this; this checks Vault's actual version counter directly.

    # --- Independent re-read straight from Vault, not just trusting what
    # the role itself reported (same "assert the side effect, not just
    # the tool's own claim" reasoning as ../default's cached-file check) ----
    - name: Log into OpenBao independently, to re-verify directly
      ansible.builtin.include_role:
        name: secrets
        tasks_from: vault_login.yaml
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_backed_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    - name: Independently re-read the hex secret straight from Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/security/secrets-molecule-vault-hex-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [200]
      register: secrets_verify_direct_read
      delegate_to: localhost
      become: false
      no_log: true

    - name: Confirm the value in Vault matches what secrets_generated reported
      ansible.builtin.assert:
        that:
          - secrets_verify_direct_read.json.data.data.value == secrets_verify_latest['secrets-molecule-vault-hex-example']
        fail_msg: "The value actually stored in Vault doesn't match what ensure_secret.yaml reported into secrets_generated."

    # --- Prove the real production policy (ADR 0020, controller.hcl)
    # actually denies delete on hosts/* — the property
    # rotate-secret.yaml's CAS-update-in-place design depends on, and
    # openbao-auth.md's own runbook proves by hand (step 6). Confirming
    # it here means this scenario tests the ACTUAL Accepted policy, not
    # an approximation of it. ---------------------------------------------
    - name: Attempt to delete the hex secret's metadata (expected to be denied)
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/metadata/hosts/security/secrets-molecule-vault-hex-example"
        method: DELETE
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [403]
      delegate_to: localhost
      become: false

    # changed_when: false — same reasoning as vault_login.yaml's own
    # tempfile-creation task: fresh every run, by design, not a
    # meaningful state change to report.
    - name: Remove this verify run's root-cert tempfile
      ansible.builtin.file:
        path: "{{ secrets_vault_ca_path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
