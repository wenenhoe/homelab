---
# Runs via molecule's own `cleanup` step, before create and after verify
# (see molecule.yml's test_sequence) — same reasoning as ../vault_backed's
# own cleanup.yml. hosts: localhost, not hosts: all: the pre-create run
# happens before secrets-vault-manual-missing-instance exists.
#
# Every task here tolerates "nothing to clean up yet" (the pre-create
# run) as well as "scenario ran to completion" (the post-verify run) —
# same shape as spike-openbao-runtime-assumptions.sh's own cleanup().
- name: Cleanup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove this scenario's project_root from the controller
      ansible.builtin.file:
        path: /tmp/secrets-molecule-vault-manual-missing/
        state: absent

    - name: Remove the throwaway OpenBao/step-ca containers
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - -f
          - "{{ item }}"
      loop:
        - openbao-test
        - step-ca-test
      register: secrets_vault_manual_missing_cleanup_rm_containers
      changed_when: secrets_vault_manual_missing_cleanup_rm_containers.rc == 0
      failed_when: false

    - name: Remove the throwaway docker network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - rm
          - secrets-vault-manual-missing-net
      register: secrets_vault_manual_missing_cleanup_rm_network
      changed_when: secrets_vault_manual_missing_cleanup_rm_network.rc == 0
      failed_when: false

    # Mounts /tmp itself and removes from inside, as root — see
    # ../vault_backed/cleanup.yml's identical task for the full
    # reasoning (the sticky-bit/EPERM issue that mounting the target
    # directory directly, instead of /tmp itself, previously hit).
    - name: Force-remove the cert/data directories as root, inside a throwaway container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - /tmp:/tmp
          - alpine
          - rm
          - -rf
          - /tmp/molecule-openbao-test-certs
          - /tmp/molecule-openbao-test-data
      register: secrets_vault_manual_missing_cleanup_force_rm
      changed_when: secrets_vault_manual_missing_cleanup_force_rm.rc == 0
      failed_when: false

    # Redundant fallback, same as ../vault_backed's own — normally a
    # no-op by the time this runs, but still catches it if Docker itself
    # isn't reachable for some reason.
    - name: Remove the throwaway cert/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/molecule-openbao-test-certs
        - /tmp/molecule-openbao-test-data

    # Not under project_root — converge.yml's rescue block writes this as
    # proof the expected failure surfaced; a stale marker from a run that
    # crashed BEFORE reaching the rescue block would let a real regression
    # (the role no longer failing when it should) hide behind old evidence.
    - name: Remove this scenario's halt marker from the controller
      ansible.builtin.file:
        path: /tmp/secrets_vault_manual_missing_halt_marker
        state: absent
