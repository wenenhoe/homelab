---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    project_root: /tmp/secrets-molecule-vault-manual-missing
    vault_manual_missing_step_ca_password: molecule-vault-manual-missing-step-ca-password
    vault_manual_missing_openbao_port: 18202 # different from ../vault_backed's 18200 and ../rotate_secret's 18201 — all three could run on the same CI host
    vault_manual_missing_caddy_domain: vault-manual-missing.localtest.me
    # main-domain (every registry needs it regardless — see
    # secrets_registry.yaml's own header comment) plus ONE manual entry
    # with a vault_scope that's deliberately never pre-seeded anywhere —
    # this is the scenario. Real host/concern values don't matter here,
    # same reasoning as ../vault_backed's own fixture registry.
    secrets_registry:
      main-domain:
        format: manual
        sensitive: false
        description: "Molecule fixture: pre-seeded to the file cache, same as production — this entry never moves to Vault."
      secrets-molecule-vault-manual-missing-example:
        format: manual
        sensitive: false
        vault_scope: hosts/all/telegram
        description: "Molecule fixture: deliberately never pre-seeded anywhere, to prove the role fails loudly instead of deploying a blank credential."
  tasks:
    - name: Ensure the secrets cache directory exists on the controller (molecule control node)
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/secrets"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # Never moves to Vault (secrets_registry.yaml's own header comment)
    # — the value itself is unused by anything in this scenario, since
    # secrets_vault_base_url is built from vault_manual_missing_caddy_domain
    # directly, not derived from main_domain the way production's real
    # openbao.{{ caddy_domain }} naming is.
    - name: Pre-seed main-domain's cache file
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/secrets/main-domain"
        content: molecule-vault-manual-missing-test
        mode: "0600"
      delegate_to: localhost
      become: false

    # Deliberately absent: no cache file for
    # secrets-molecule-vault-manual-missing-example, and (below) no
    # pre-seed into Vault either — this is the scenario.

    - name: Create the docker network step-ca-test and openbao-test share
      community.docker.docker_network:
        name: secrets-vault-manual-missing-net
        state: present
      delegate_to: localhost
      become: false

    # delegate_to/become aren't valid attributes directly on
    # ansible.builtin.include_role — wrapped in a block instead. See
    # ../vault_backed/converge.yml's identical task for the full
    # reasoning.
    - name: "Start a real, throwaway step-ca instance for this scenario [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, throwaway step-ca instance for this scenario
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_step_ca_test_target.yaml
          vars:
            molecule_helpers_step_ca_network_name: secrets-vault-manual-missing-net
            molecule_helpers_step_ca_password: "{{ vault_manual_missing_step_ca_password }}"

    # See ../vault_backed/converge.yml's identical task for the full
    # reasoning (secrets_vault_host is overridden to localhost below, so
    # hostvars['localhost'].caddy_domain has to resolve for
    # secrets_vault_base_url's own construction).
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ vault_manual_missing_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    - name: "Start a real, initialized OpenBao test target [block]"
      delegate_to: localhost
      become: false
      block:
        - name: Start a real, initialized OpenBao test target
          ansible.builtin.include_role:
            name: molecule_helpers
            tasks_from: start_openbao_test_target.yaml
          vars:
            molecule_helpers_openbao_network_name: secrets-vault-manual-missing-net
            molecule_helpers_openbao_step_ca_password: "{{ vault_manual_missing_step_ca_password }}"
            molecule_helpers_openbao_host_port: "{{ vault_manual_missing_openbao_port }}"
            molecule_helpers_openbao_extra_san: "openbao.{{ vault_manual_missing_caddy_domain }}"
            molecule_helpers_openbao_approle_name: controller
            # The REAL production policy — see ../vault_backed/converge.yml's
            # identical task for the full reasoning.
            molecule_helpers_openbao_policy_hcl: >-
              {{ lookup('file', playbook_dir ~ '/../../../../../docker/openbao/policies/controller.hcl') }}
            molecule_helpers_openbao_role_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
            molecule_helpers_openbao_secret_id_dest: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"

    # block/rescue (this repo's own idiom for "failure here is the
    # expected, correct outcome" — see ../manual_missing/converge.yml)
    # since the role failing is the thing under test. A real, working
    # AppRole is provisioned above (unlike ../vault_approle_missing) —
    # this scenario proves the role reaches Vault successfully and
    # THEN fails loudly on the missing secret specifically, not that it
    # can't reach Vault at all.
    - name: "Run secrets [block / rescue] (Vault-backed manual secret missing, failure is deliberate and expected)"
      block:
        - name: Run the secrets role against a registry with an unsupplied Vault-backed manual secret
          ansible.builtin.include_role:
            name: secrets
          vars:
            secrets_vault_host: localhost
            secrets_vault_port: "{{ vault_manual_missing_openbao_port }}"
            secrets_vault_step_ca_container_name: step-ca-test
      rescue:
        # A bare rescue accepts ANY failure inside the block as "the
        # gate worked" — see ../manual_missing/converge.yml's identical
        # reasoning. ansible_failed_task/ansible_failed_result are only
        # populated inside a rescue block — assert on both the exact
        # task and the exact message, quoting ensure_secret.yaml's own
        # text rather than paraphrasing it, before trusting the
        # "expected" label at all.
        - name: Confirm the failure came from the Vault-backed-manual-missing gate itself
          ansible.builtin.assert:
            that:
              - "'Fail loudly if a Vault-backed manual secret was never supplied' in ansible_failed_task.name"
              - "'Missing required secret: secrets-molecule-vault-manual-missing-example' in ansible_failed_result.msg"
              - "'bootstrap_secrets.py' in ansible_failed_result.msg"
            fail_msg: >-
              secrets role failed, but not for the reason this scenario exists to
              test. Expected the Vault-backed-manual-format "Fail loudly if a
              Vault-backed manual secret was never supplied" task to fail, naming
              the missing secret and pointing at bootstrap_secrets.py; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with message
              "{{ ansible_failed_result.msg | default('none') }}" instead.

        - name: Leave a marker proving the expected failure actually surfaced
          ansible.builtin.copy:
            dest: /tmp/secrets_vault_manual_missing_halt_marker
            content: "missing-vault-manual-secret caught as expected\n"
            mode: "0644"
          delegate_to: localhost
          become: false
