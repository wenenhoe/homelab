---
# Same sibling-container shape as ../vault_backed — this scenario needs
# a real, reachable OpenBao to prove the gate's failure is specifically
# "genuinely not there" (a real 404), not "can't reach Vault at all".
# See molecule_helpers/tasks/start_openbao_test_target.yaml's header
# comment for why sibling containers, not Docker-in-Docker.
driver:
  name: docker
platforms:
  - name: secrets-vault-manual-missing-instance
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    cleanup: cleanup.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No `idempotence` step, deliberately — same reasoning as
  # ../manual_missing/../vault_approle_missing: this scenario's whole
  # point is a role run that FAILS (rescued, but still a failure inside
  # the block), so a second identical converge would just fail the same
  # way again, not converge to a no-op.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
