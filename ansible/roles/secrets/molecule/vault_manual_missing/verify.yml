---
- name: Verify
  hosts: all
  become: true
  vars:
    project_root: /tmp/secrets-molecule-vault-manual-missing
    vault_manual_missing_step_ca_password: molecule-vault-manual-missing-step-ca-password
    vault_manual_missing_openbao_port: 18202
    vault_manual_missing_caddy_domain: vault-manual-missing.localtest.me
  tasks:
    # --- The rescue block fired, and specifically for the right reason ------
    # (the assertion inside converge.yml's rescue: block already confirmed
    # ansible_failed_task/ansible_failed_result before this marker was ever
    # written — its mere existence is proof the right failure happened,
    # not just *a* failure.)
    - name: Confirm the expected-failure marker exists
      ansible.builtin.stat:
        path: /tmp/secrets_vault_manual_missing_halt_marker
      register: secrets_verify_marker
      delegate_to: localhost
      become: false
      failed_when: not secrets_verify_marker.stat.exists

    # --- Independent re-read straight from Vault, not just trusting what
    # the role itself reported (same "assert the side effect, not just
    # the tool's own claim" reasoning as ../vault_backed's own verify.yml,
    # and ../manual_missing's file-cache equivalent) — confirms the gate
    # found what it should have found (a real 404), not that it merely
    # failed for some other, unrelated reason that happens to also look
    # like success from converge.yml's own assertion alone.
    - name: Make caddy_domain resolvable via hostvars['localhost']
      ansible.builtin.set_fact:
        caddy_domain: "{{ vault_manual_missing_caddy_domain }}" # noqa: var-naming[no-role-prefix]
      delegate_to: localhost
      delegate_facts: true
      become: false

    - name: Log into OpenBao independently, to re-verify directly
      ansible.builtin.include_role:
        name: secrets
        tasks_from: vault_login.yaml
      vars:
        secrets_vault_host: localhost
        secrets_vault_port: "{{ vault_manual_missing_openbao_port }}"
        secrets_vault_step_ca_container_name: step-ca-test

    - name: Independently confirm the secret genuinely doesn't exist in Vault
      ansible.builtin.uri:
        url: "{{ secrets_vault_base_url }}/v1/secret/data/hosts/all/telegram/secrets-molecule-vault-manual-missing-example"
        headers:
          X-Vault-Token: "{{ secrets_vault_token }}"
        ca_path: "{{ secrets_vault_ca_path }}"
        status_code: [404]
      delegate_to: localhost
      become: false
      no_log: true

    # changed_when: false — same reasoning as vault_login.yaml's own
    # tempfile-creation task: fresh every run, by design, not a
    # meaningful state change to report.
    - name: Remove this verify run's root-cert tempfile
      ansible.builtin.file:
        path: "{{ secrets_vault_ca_path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
