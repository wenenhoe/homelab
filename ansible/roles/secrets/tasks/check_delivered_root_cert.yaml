---
# ADR 0022 revision 1: a delivered copy of step-ca's root is what the CD
# agent's jobs without an SSH key to security verify OpenBao's TLS against.
# This run has just fetched the live root (secrets_vault_root_cert_read), so
# it can tell that copy is stale. The run keeps using the fetched root either
# way; where no copy was delivered (an operator's checkout) nothing is checked.

- name: Check whether a delivered copy of step-ca's root cert exists
  ansible.builtin.stat:
    path: "{{ secrets_delivered_root_cert_path }}"
  register: secrets_delivered_root_cert_stat
  delegate_to: localhost
  become: false
  tags:
    - always

- name: Read the delivered copy of step-ca's root cert
  ansible.builtin.slurp:
    path: "{{ secrets_delivered_root_cert_path }}"
  register: secrets_delivered_root_cert_read
  delegate_to: localhost
  become: false
  when: secrets_delivered_root_cert_stat.stat.exists
  tags:
    - always

- name: Fail if the delivered copy of the root cert differs from the one fetched
  ansible.builtin.fail:
    msg: >-
      {{ secrets_delivered_root_cert_path }} is not step-ca's current root
      cert, so every job that verifies OpenBao against it will fail TLS.
      Redeliver the root cert fetched from {{ secrets_vault_host }} to each
      job's credentials directory (docs/topics/secrets/openbao-cd-agent-approles.md).
  delegate_to: localhost
  become: false
  when:
    - secrets_delivered_root_cert_stat.stat.exists
    - (secrets_delivered_root_cert_read.content | b64decode | trim) != (secrets_vault_root_cert_read.stdout | trim)
  tags:
    - always
