---
# Generates (first run only) or reuses (every run after) ONE secret named
# by secrets_item_name (a key in secrets_registry), and merges its value
# into secrets_generated. Included in a loop by main.yaml — see that
# file's header for why this runs redundantly per-host and why that's
# fine.
#
# All controller-side work below is delegate_to: localhost + become: false
# become: false is required, not decorative: deploy.yaml's Play 1 sets
# become: true at the PLAY level, which is inherited regardless of
# delegate_to unless overridden here
#
# `no_log: true` on every task that could put the plaintext secret value
# into -v/-vvv output — lookup('password', ...) calls embedded directly in
# group_vars (the pre-existing seaweedfs pattern) never had this problem
# since they're not task results; anything routed through a *task* here
# does need it explicitly.

- name: Compute this secret's controller-side cache path
  ansible.builtin.set_fact:
    secrets_cache_path: "{{ project_root }}/ansible/files/secrets/{{ secrets_item_name }}"

# --- hex format ------------------------------------------------------------
# lookup('password', ...) IS the generate-once-and-cache mechanism already
# (see docs/secrets.md for its exact
# semantics) — this task's only job is building the lookup term correctly
# from the registry (path + named charset + length) so every call site
# stops hand-rolling that string, and enforcing the chars=hexdigits
# named-charset convention (never a literal alphabet, see
# secrets_registry.yaml's header) in one place.
- name: Generate/reuse hex secret and store it - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: lookup(
            'password',
            secrets_cache_path ~ ' chars=hexdigits length=' ~ secrets_registry[secrets_item_name].length
          )
        })
      }}
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'hex'

# --- uuid4 format ------------------------------------------------------------
# lookup('password') can only draw from a charset, which can't produce a
# real RFC 4122 v4 UUID's fixed version/variant bits — so this format
# needs actual generate-once-and-cache task logic, mirroring what
# `password` does internally (stat, generate only if missing, write once,
# always read back), for a format it doesn't support natively.
- name: Check whether this uuid4 secret is already cached - {{ secrets_item_name }}
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  register: secrets_uuid4_stat
  delegate_to: localhost
  become: false
  when: secrets_registry[secrets_item_name].format == 'uuid4'

- name: Generate a new uuid4 value - {{ secrets_item_name }}
  ansible.builtin.command:
    cmd: python3 -c "import uuid; print(uuid.uuid4())"
  register: secrets_uuid4_generated
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'uuid4'
    - not secrets_uuid4_stat.stat.exists

- name: Cache the generated uuid4 value - {{ secrets_item_name }}
  ansible.builtin.copy:
    dest: "{{ secrets_cache_path }}"
    content: "{{ secrets_uuid4_generated.stdout }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'uuid4'
    - not secrets_uuid4_stat.stat.exists

- name: Read back the cached uuid4 value - {{ secrets_item_name }}
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  register: secrets_uuid4_read
  delegate_to: localhost
  become: false
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'uuid4'

- name: Store uuid4 secret - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (secrets_uuid4_read.content | b64decode | trim)
        })
      }}
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'uuid4'

# --- manual format -----------------------------------------------------
# Nothing here can generate this value — it comes from outside Ansible
# entirely (an externally-issued credential, or plain non-interactive
# config that used to be a vars_prompt entry). The cache file must
# already exist before this task runs; if it doesn't, fail loudly with
# exactly what's missing and how to fix it, rather than silently
# deploying with an empty/undefined credential nobody noticed.
#
# An EXISTING file with EMPTY content is a valid value (reads back as
# ""), not an error — deliberate, not a gap. See secrets_registry.yaml's
# `allow_blank` note: beszel_hub_key/beszel_agent_token genuinely can't
# exist before beszel-hub's own first boot, and bootstrap_secrets.py
# creates an empty placeholder for those two so a first deploy doesn't
# fail outright. Existence, not content, is what's checked here.
- name: Check whether this manual secret's file exists - {{ secrets_item_name }}
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_stat
  delegate_to: localhost
  become: false
  when: secrets_registry[secrets_item_name].format == 'manual'

- name: Fail loudly if a manual secret was never supplied - {{ secrets_item_name }}
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ secrets_item_name }}
      {{ secrets_registry[secrets_item_name].description | default('(no description in secrets_registry.yaml)') }}
      Create it with:
        printf '%s' '<value>' > {{ secrets_cache_path }} && chmod 600 {{ secrets_cache_path }}
      Or run once to fill in every missing manual secret interactively:
        python3 ansible/bootstrap_secrets.py
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - not secrets_manual_stat.stat.exists

- name: Read the manual secret's value - {{ secrets_item_name }}
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_read
  delegate_to: localhost
  become: false
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'manual'

- name: Store manual secret - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (secrets_manual_read.content | b64decode | trim)
        })
      }}
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'manual'
