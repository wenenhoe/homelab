---
# Generates (first run) or reuses (every run after) every secret in
# secrets_items, merging each value into secrets_generated. Included by
# main.yaml twice: once with secrets_items: [main-domain], once with
# every other catalog key at once — not once per key, so this file's
# own task list runs twice per playbook run, not once per secret.
#
# manual with `store: controller_file` (the controller-side file cache —
# exactly the three permanent bootstrap exceptions: main-domain and the
# two openbao-controller AppRole halves; every other manual entry is
# `store: openbao`) is handled directly below, each task looping over
# secrets_items itself. `store: openbao` entries are handled further
# down the same way: a hex/uuid4 entry by one ensure_vault_secret call per
# secret, a manual entry by a plain read. No include runs once per secret, so
# the role's output stays the same size however many secrets the catalog
# holds. See secret_catalog.yaml's own header comment and
# docs/decisions/0021-secret-path-layout-for-secrets-with-no-host-owner/revision-000.md
# for the split itself.
#
# Every task here needs both delegate_to: localhost and tags: [always],
# even plain set_fact/fail tasks: a task with no delegate_to still
# triggers remote_addr resolution for the current play host before
# dispatching, and this role runs before secrets_generated exists (the
# value every real host's ansible_host depends on — see
# docs/topics/secrets/secrets.md). Tags on include_role/include_tasks don't propagate to
# untagged child tasks under a --tags filter, so every level of inclusion
# needs its own explicit tag.
#
# become: false is explicit everywhere as a defensive default in case a
# future caller includes this role from a play with become: true at the
# play level (inherited regardless of delegate_to otherwise).
#
# no_log: true wherever a task result could put the plaintext secret into
# -v/-vvv output. ensure_vault_secret returns the value in plain text, so
# every task that calls it needs it (test_secrets_module_no_log.py checks).

# =========================================================================
# --- manual source, file-cache-backed: main-domain and the controller --
# --- AppRole pair only, see this file's own header comment -------------
# =========================================================================
# Nothing here can generate these values — each is externally-issued or
# plain config supplied ahead of time. The cache file must already
# exist; if not, fail loudly with what's missing and how to fix it. An
# existing file with empty content is valid (`allow_blank` in
# secret_catalog.yaml) — existence, not content, is what's checked.

- name: "Check whether manual secret files exist"
  vars:
    secrets_cache_path: "{{ secrets_file_cache_dir }}/{{ item }}"
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  loop: "{{ secrets_items }}"
  loop_control:
    label: "{{ item }}"
  when:
    - secret_catalog[item].source == 'manual'
    - secret_catalog[item].store == 'controller_file'
  register: secrets_manual_stat
  delegate_to: localhost
  become: false
  tags: [always]

- name: "Fail loudly if a manual secret was never supplied"
  vars:
    secrets_cache_path: "{{ secrets_file_cache_dir }}/{{ item.item }}"
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ item.item }}
      {{ secret_catalog[item.item].description | default('(no description in secret_catalog.yaml)') }}
      Create it with:
        printf '%s' '<value>' > {{ secrets_cache_path }} && chmod 600 {{ secrets_cache_path }}
      Or run once to fill in every missing manual secret interactively:
        cd tools && python3 -m openbao_utils.bootstrap
  loop: "{{ secrets_manual_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat is defined
    - not item.stat.exists
  delegate_to: localhost
  become: false
  tags: [always]

- name: "Read manual secret values"
  vars:
    secrets_cache_path: "{{ secrets_file_cache_dir }}/{{ item }}"
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  loop: "{{ secrets_items }}"
  loop_control:
    label: "{{ item }}"
  register: secrets_manual_read
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]
  when:
    - secret_catalog[item].source == 'manual'
    - secret_catalog[item].store == 'controller_file'

- name: "Store manual secrets"
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          item.item: (item.content | b64decode | trim)
        })
      }}
  loop: "{{ secrets_manual_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]
  when: item.content is defined

# =========================================================================
# --- Vault-backed, manual -----------------------------------------------
# =========================================================================
# Nothing can generate these, so a missing one fails the run, before any
# secret is generated below.

- name: "Read manual Vault-backed secrets"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secret_catalog[item].scope }}/{{ item }}"
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    status_code: [200, 404]
  loop: "{{ secrets_items }}"
  loop_control:
    label: "{{ item }}"
  when:
    - secret_catalog[item].store == 'openbao'
    - secret_catalog[item].source == 'manual'
  register: secrets_vault_manual_read
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Fail loudly if a Vault-backed manual secret was never supplied"
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ item.item }}
      {{ secret_catalog[item.item].description | default('(no description in secret_catalog.yaml)') }}
      This secret is stored in OpenBao at
      {{ secrets_vault_kv_mount }}/data/{{ secret_catalog[item.item].scope }}/{{ item.item }} — nothing
      currently there. Run once to fill in every missing manual secret:
        cd tools && python3 -m openbao_utils.bootstrap
  loop: "{{ secrets_vault_manual_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) == 404
  delegate_to: localhost
  become: false
  tags: [always]

- name: "Store manual Vault-backed secrets"
  ansible.builtin.set_fact:
    secrets_generated: "{{ secrets_generated | combine({item.item: item.json.data.data.value}) }}"
  loop: "{{ secrets_vault_manual_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status | default(0) == 200
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

# =========================================================================
# --- Vault-backed, generated (hex, uuid4) -------------------------------
# =========================================================================
# One call per secret reads it, or creates it first when nothing is there,
# and returns the value that is now stored, which is another run's when two
# runs create the same secret at once.

- name: "Resolve every generated Vault-backed secret"
  ensure_vault_secret:
    name: "{{ item }}"
    source: "{{ secret_catalog[item].source }}"
    length: "{{ secret_catalog[item].length | default(omit) }}"
    scope: "{{ secret_catalog[item].scope }}"
    kv_mount: "{{ secrets_vault_kv_mount }}"
    vault_base_url: "{{ secrets_vault_base_url }}"
    vault_token: "{{ secrets_vault_token }}"
    vault_ca_path: "{{ secrets_vault_ca_path }}"
  loop: "{{ secrets_items }}"
  loop_control:
    label: "{{ item }}"
  when:
    - secret_catalog[item].store == 'openbao'
    - secret_catalog[item].source in ['hex', 'uuid4']
  register: secrets_vault_ensured
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Store generated Vault-backed secrets"
  ansible.builtin.set_fact:
    secrets_generated: "{{ secrets_generated | combine({item.item: item.value}) }}"
  loop: "{{ secrets_vault_ensured.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.value is defined
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]
