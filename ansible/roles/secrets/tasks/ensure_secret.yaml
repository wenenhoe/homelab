---
# Generates (first run) or reuses (every run after) ONE secret named by
# secrets_item_name, merging its value into secrets_generated. Included
# in a loop by main.yaml (main-domain once, explicitly, then every other
# registry key).
#
# Each format branches on whether this entry has a vault_scope
# (secrets_registry.yaml): present → OpenBao KV v2. Absent → the
# controller-side file cache — as of Track A stage 6, that's exactly
# the three permanent bootstrap exceptions (main-domain,
# openbao-controller-role-id/-secret-id), all `manual` format; every
# hex/uuid4 entry and every other manual entry (including
# cloud_credentials' own, via vault_scope: cloud_credentials/leaf) now
# has a vault_scope. See secrets_registry.yaml's own header comment and
# docs/decisions/0021-vault-path-convention-hosts-all-for-global-secrets.md.
#
# Every task here needs both delegate_to: localhost and tags: [always],
# even plain set_fact/fail tasks: a task with no delegate_to still
# triggers remote_addr resolution for the current play host before
# dispatching, and this role runs before secrets_generated exists (the
# value every real host's ansible_host depends on — see
# docs/secrets.md). Tags on include_role/include_tasks don't propagate to
# untagged child tasks under a --tags filter, so every level of inclusion
# needs its own explicit tag.
#
# become: false is explicit everywhere as a defensive default in case a
# future caller includes this role from a play with become: true at the
# play level (inherited regardless of delegate_to otherwise).
#
# no_log: true wherever a task result could put the plaintext secret into
# -v/-vvv output.

- name: Compute this secret's controller-side cache path
  ansible.builtin.set_fact:
    secrets_cache_path: "{{ project_root }}/ansible/files/secrets/{{ secrets_item_name }}"
  delegate_to: localhost
  become: false
  tags:
    - always

- name: "Read this secret's current Vault state, if it has a vault_scope - {{ secrets_item_name }}"
  ansible.builtin.include_tasks: read_vault_kv.yaml
  tags:
    - always
  when: secrets_registry[secrets_item_name].vault_scope is defined

# =========================================================================
# --- Vault-backed (any format) ------------------------------------------
# =========================================================================

- name: "Fail loudly if a Vault-backed manual secret was never supplied - {{ secrets_item_name }}"
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ secrets_item_name }}
      {{ secrets_registry[secrets_item_name].description | default('(no description in secrets_registry.yaml)') }}
      This secret is stored in OpenBao at
      {{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }} — nothing
      currently there. Run once to fill in every missing manual secret:
        python3 ansible/bootstrap_secrets.py
  delegate_to: localhost
  become: false
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is defined
    - secrets_vault_read.status == 404

# hex and uuid4 share one generate/write/reread/store sequence — see
# resolve_vault_generated_secret.yaml. It doesn't repeat the existence
# check above; it consumes secrets_vault_read already computed by it.
- name: "Resolve a Vault-backed hex/uuid4 secret - {{ secrets_item_name }}"
  ansible.builtin.include_tasks: resolve_vault_generated_secret.yaml
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format in ['hex', 'uuid4']
    - secrets_registry[secrets_item_name].vault_scope is defined

- name: "Store manual secret from Vault - {{ secrets_item_name }}"
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: secrets_vault_read.json.data.data.value
        })
      }}
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is defined

# =========================================================================
# --- manual format, file-cache-backed: main-domain and the controller --
# --- AppRole pair only, see this file's own header comment -------------
# =========================================================================
# Track A stage 6 removed this mechanism for hex/uuid4 and every other
# manual entry — every one of them now has a vault_scope, so this branch
# (and secrets_cache_path above) is only ever reached for the three
# permanent bootstrap exceptions, all format: manual. Nothing here can
# generate this value — it's externally-issued or plain config supplied
# ahead of time. The cache file must already exist; if not, fail loudly
# with what's missing and how to fix it. An existing file with empty
# content is valid (`allow_blank` in secrets_registry.yaml) —
# existence, not content, is what's checked.
- name: "Check whether this manual secret's file exists - {{ secrets_item_name }}"
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_stat
  delegate_to: localhost
  become: false
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is not defined

- name: "Fail loudly if a manual secret was never supplied - {{ secrets_item_name }}"
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ secrets_item_name }}
      {{ secrets_registry[secrets_item_name].description | default('(no description in secrets_registry.yaml)') }}
      Create it with:
        printf '%s' '<value>' > {{ secrets_cache_path }} && chmod 600 {{ secrets_cache_path }}
      Or run once to fill in every missing manual secret interactively:
        python3 ansible/bootstrap_secrets.py
  delegate_to: localhost
  become: false
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is not defined
    - not secrets_manual_stat.stat.exists

- name: "Read the manual secret's value - {{ secrets_item_name }}"
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_read
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is not defined

- name: "Store manual secret - {{ secrets_item_name }}"
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (secrets_manual_read.content | b64decode | trim)
        })
      }}
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - secrets_registry[secrets_item_name].vault_scope is not defined
