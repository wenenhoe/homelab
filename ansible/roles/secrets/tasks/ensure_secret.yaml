---
# Generates (first run) or reuses (every run after) ONE secret named by
# secrets_item_name, merging its value into secrets_generated. Included
# in a loop by main.yaml.
#
# Every task here needs both delegate_to: localhost and tags: [always],
# even plain set_fact/fail tasks: a task with no delegate_to still
# triggers remote_addr resolution for the current play host before
# dispatching, and this role runs before secrets_generated exists (the
# value every real host's ansible_host depends on — see
# docs/secrets.md). Tags on include_role/include_tasks don't propagate to
# untagged child tasks under a --tags filter, so every level of inclusion
# needs its own explicit tag.
#
# become: false is explicit everywhere as a defensive default in case a
# future caller includes this role from a play with become: true at the
# play level (inherited regardless of delegate_to otherwise).
#
# no_log: true wherever a task result could put the plaintext secret into
# -v/-vvv output.

- name: Compute this secret's controller-side cache path
  ansible.builtin.set_fact:
    secrets_cache_path: "{{ project_root }}/ansible/files/secrets/{{ secrets_item_name }}"
  delegate_to: localhost
  become: false
  tags:
    - always

# --- hex format --------------------------------------------------------
# lookup('password', ...) is the generate-once-and-cache mechanism
# itself (see docs/secrets.md); this task just builds the lookup term
# from the registry and enforces the chars=hexdigits named-charset
# convention in one place.
- name: Generate/reuse hex secret and store it - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: lookup(
            'password',
            secrets_cache_path ~ ' chars=hexdigits length=' ~ secrets_registry[secrets_item_name].length
          )
        })
      }}
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'hex'

# --- uuid4 format --------------------------------------------------------
# lookup('password')'s charset can't produce a real RFC 4122 v4 UUID's
# fixed version/variant bits, so this format generates its own
# generate-once-and-cache logic instead (stat, generate if missing, write,
# always read back).
- name: Check whether this uuid4 secret is already cached - {{ secrets_item_name }}
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  register: secrets_uuid4_stat
  delegate_to: localhost
  become: false
  tags:
    - always
  when: secrets_registry[secrets_item_name].format == 'uuid4'

- name: Generate a new uuid4 value - {{ secrets_item_name }}
  ansible.builtin.command:
    cmd: python3 -c "import uuid; print(uuid.uuid4())"
  register: secrets_uuid4_generated
  delegate_to: localhost
  become: false
  tags:
    - always
  changed_when: true
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'uuid4'
    - not secrets_uuid4_stat.stat.exists

- name: Cache the generated uuid4 value - {{ secrets_item_name }}
  ansible.builtin.copy:
    dest: "{{ secrets_cache_path }}"
    content: "{{ secrets_uuid4_generated.stdout }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when:
    - secrets_registry[secrets_item_name].format == 'uuid4'
    - not secrets_uuid4_stat.stat.exists

- name: Read back the cached uuid4 value - {{ secrets_item_name }}
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  register: secrets_uuid4_read
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'uuid4'

- name: Store uuid4 secret - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (secrets_uuid4_read.content | b64decode | trim)
        })
      }}
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'uuid4'

# --- manual format -------------------------------------------------------
# Nothing here can generate this value — it's externally-issued or plain
# config supplied ahead of time. The cache file must already exist; if
# not, fail loudly with what's missing and how to fix it. An existing
# file with empty content is valid (see `allow_blank` in
# secrets_registry.yaml, for values like Beszel's that don't exist until
# after first boot) — existence, not content, is what's checked.
- name: Check whether this manual secret's file exists - {{ secrets_item_name }}
  ansible.builtin.stat:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_stat
  delegate_to: localhost
  become: false
  tags:
    - always
  when: secrets_registry[secrets_item_name].format == 'manual'

- name: Fail loudly if a manual secret was never supplied - {{ secrets_item_name }}
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ secrets_item_name }}
      {{ secrets_registry[secrets_item_name].description | default('(no description in secrets_registry.yaml)') }}
      Create it with:
        printf '%s' '<value>' > {{ secrets_cache_path }} && chmod 600 {{ secrets_cache_path }}
      Or run once to fill in every missing manual secret interactively:
        python3 ansible/bootstrap_secrets.py
  delegate_to: localhost
  become: false
  tags:
    - always
  when:
    - secrets_registry[secrets_item_name].format == 'manual'
    - not secrets_manual_stat.stat.exists

- name: Read the manual secret's value - {{ secrets_item_name }}
  ansible.builtin.slurp:
    path: "{{ secrets_cache_path }}"
  register: secrets_manual_read
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'manual'

- name: Store manual secret - {{ secrets_item_name }}
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (secrets_manual_read.content | b64decode | trim)
        })
      }}
  delegate_to: localhost
  become: false
  tags:
    - always
  no_log: true
  when: secrets_registry[secrets_item_name].format == 'manual'
