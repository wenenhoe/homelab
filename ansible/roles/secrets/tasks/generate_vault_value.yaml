---
# Generates a fresh value for ONE Vault-backed hex/uuid4 secret, in
# memory only — no read, no write, no local file. Sets
# secrets_vault_generated_value. Used by rotate-secret.yaml, which always
# replaces the current value.
#
# The same generation is done by generate_value() in
# ansible/module_utils/openbao_kv.py, for ensure_vault_secret; a change to
# either's hex/uuid4 semantics (token_hex sizing, slicing) needs making in both.
#
# python3 -c, not lookup('password', ...): that lookup's whole mechanism
# IS a local file cache (generate once, write to the given path, read
# back thereafter) — there's no mode where it generates a value without
# also caching it locally, which is exactly what a Vault-backed secret
# must not do. secrets.token_hex(n) returns 2n hex characters, so the
# byte count is half the catalog's requested length; sliced to the
# exact requested length afterward in case that length is odd.

- name: "Generate a fresh hex value in memory - {{ secrets_item_name }}"
  ansible.builtin.command:
    cmd: >-
      python3 -c "import secrets; print(secrets.token_hex({{ (secret_catalog[secrets_item_name].length / 2) | round(0, 'ceil') | int }}))"
  register: secrets_vault_hex_command
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  tags:
    - always
  when: secret_catalog[secrets_item_name].source == 'hex'

- name: "Generate a fresh uuid4 value in memory - {{ secrets_item_name }}"
  ansible.builtin.command:
    cmd: python3 -c "import uuid; print(uuid.uuid4())"
  register: secrets_vault_uuid4_command
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  tags:
    - always
  when: secret_catalog[secrets_item_name].source == 'uuid4'

- name: "Store the freshly generated value - {{ secrets_item_name }}"
  ansible.builtin.set_fact:
    secrets_vault_generated_value: >-
      {{
        secrets_vault_hex_command.stdout[:secret_catalog[secrets_item_name].length]
        if secret_catalog[secrets_item_name].source == 'hex'
        else (secrets_vault_uuid4_command.stdout | trim)
      }}
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
