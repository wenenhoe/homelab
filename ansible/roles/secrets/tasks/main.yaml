---
# Generates (on first run) or reuses (on every run after) every secret
# declared in secrets_registry.yaml, and publishes the results as
# secrets_generated — a dict keyed by registry key, e.g.
# secrets_generated['lldap-jwt-secret']. group_vars/all/main.yaml then
# exposes each entry under the plain var name its consuming template
# already expects (lldap_jwt_secret, shlink_api_key, ...).
#
# Included from bootstrap-secrets.yaml's Play 0 (hosts: localhost,
# gather_facts: false), its own play ahead of everything else — not
# folded into Play 1's first task, because every real host's
# ansible_host resolves through secrets_generated (see docs/secrets.md),
# which has to exist before Ansible needs a live connection at all,
# including Play 1's own implicit Gathering Facts step.
#
# Every task below carries tags: [always] DIRECTLY — not inherited from
# the outer "Include secrets role" task's own always tag. Confirmed
# live that tags on include_role/include_tasks do NOT propagate to
# untagged child tasks under a --tags filter that excludes them (only
# the wrapper task itself is guaranteed to run) — this applies at every
# level of dynamic inclusion, so it's not enough to tag just the
# outermost include either; ensure_secret.yaml's own tasks need this
# same explicit tag too, not just this file's. Same reasoning as
# compose's preinit.yaml: every downstream role/template that reads
# secrets_generated needs it to already exist by the time it runs,
# regardless of which --tags subset was requested. See
# docs/deployment-flow.md's Tags section.
#
# Runs once per host (Play 0 is hosts: localhost, then propagated to
# every real host — see bootstrap-secrets.yaml), each time delegating
# its actual work to localhost — cheap, redundant-but-harmless duplicate
# work across hosts (same rationale as roles/restore/tasks/main.yaml's
# own delegate_to: localhost tasks: every host computes/reads the
# identical controller-side value, nothing here is host-specific).
- name: Reset this host's secrets_generated before regenerating it
  ansible.builtin.set_fact:
    secrets_generated: {}
  delegate_to: localhost
  become: false
  tags:
    - always

# lookup('password', ...) creates ansible/files/secrets/ itself if missing
# (confirmed against ansible-core's password lookup source: both its
# locking and its write path call makedirs_safe() on the parent directory
# first) — but ansible.builtin.copy, used below for uuid4 mode, does NOT
# create missing parent directories, so a completely fresh clone (no
# ansible/files/secrets/ yet, no hex secret having run first to create it
# incidentally) would fail the first time a uuid4 secret is generated.
# Ensured once here, unconditionally, rather than per-secret.
- name: Ensure the controller-side secrets cache directory exists
  ansible.builtin.file:
    path: "{{ project_root }}/ansible/files/secrets/"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  tags:
    - always

- name: Ensure every registered secret is generated and cached
  ansible.builtin.include_tasks: ensure_secret.yaml
  loop: "{{ secrets_registry.keys() | list }}"
  loop_control:
    loop_var: secrets_item_name
    label: "{{ secrets_item_name }}"
  tags:
    - always
