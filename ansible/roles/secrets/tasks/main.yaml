---
# Generates (first run) or reuses (every run after) every secret in
# secrets_registry.yaml, publishing results as secrets_generated (keyed
# by registry key, e.g. secrets_generated['lldap-jwt-secret']). Storage
# is split by each entry's `vault_scope` (OpenBao) vs its absence (the
# controller-side file cache) — see secrets_registry.yaml's own header
# comment and docs/decisions/0024-vault-path-convention-hosts-all-for-global-secrets.md.
# group_vars/all/main.yaml exposes each under the plain var name its
# template expects.
#
# Included from bootstrap-secrets.yaml's own Play 0 (hosts: localhost),
# ahead of everything else — every real host's ansible_host resolves
# through secrets_generated (see docs/secrets.md), which must exist
# before Ansible needs a live connection at all.
#
# Every task below carries tags: [always] directly, not inherited —
# tags on include_role/include_tasks don't propagate to untagged child
# tasks under a --tags filter, at every level of inclusion (so
# ensure_secret.yaml's own tasks need it too). See
# docs/deployment-flow.md's Tags section.
#
# Runs once per host, each delegating to localhost — cheap, harmless
# duplicate work, since nothing here is host-specific.
- name: Reset this host's secrets_generated before regenerating it
  ansible.builtin.set_fact:
    secrets_generated: {}
  delegate_to: localhost
  become: false
  tags:
    - always

# lookup('password', ...) creates ansible/files/secrets/ itself if
# missing, but ansible.builtin.copy (used for uuid4 mode below) doesn't —
# so a fresh clone would fail the first time a uuid4 secret generates.
# Ensured once here, unconditionally, rather than per-secret.
- name: Ensure the controller-side secrets cache directory exists
  ansible.builtin.file:
    path: "{{ project_root }}/ansible/files/secrets/"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  tags:
    - always

# main-domain is never Vault-backed (secrets_registry.yaml's header
# comment explains why: resolving it is a prerequisite for reaching
# Vault at all, not just for computing ansible_host). Resolved explicitly
# here, before anything else, rather than relying on its position in
# secrets_registry.yaml's own key order — a future reordering of that
# file must not silently break this.
#
# Guarded on presence: production's real registry always has this key,
# but a minimal test registry exercising just the generate-once-and-
# cache mechanism itself (not any specific production consumer) isn't
# required to carry it — nothing else in this role assumes main-domain
# exists unless something downstream actually asks for it.
- name: Resolve main-domain before anything that might need Vault reachability
  ansible.builtin.include_tasks: ensure_secret.yaml
  vars:
    secrets_item_name: main-domain
  tags:
    - always
  when: "'main-domain' in secrets_registry"

- name: Determine whether any registered secret needs OpenBao
  ansible.builtin.set_fact:
    secrets_vault_needed: "{{ secrets_registry.values() | selectattr('vault_scope', 'defined') | list | length > 0 }}"
  delegate_to: localhost
  become: false
  tags:
    - always

# vault_login.yaml delegates to secrets_vault_host (production:
# "security") — but that host's own ansible_host resolves through
# ddns_domain -> main_domain -> secrets_generated['main-domain'], which
# at this point only exists as a fact on this play's own target host.
# Without this, security's own ansible_host template can't resolve at
# the exact moment vault_login.yaml tries to delegate to it — confirmed
# live: nothing here previously propagated it that early, so the
# connection attempt failed in a way that looked like an unrelated
# Docker problem, not a variable-resolution one. bootstrap-secrets.yaml's
# own later, complete propagation (same set_fact/delegate_facts/loop
# shape) still runs afterward and correctly supersedes this partial one
# once every secret — not just main-domain — has been generated.
#
# Plain `secrets_generated`, not `hostvars['localhost']['secrets_generated']`:
# confirmed live that delegate_to: localhost without delegate_facts:
# true (like the earlier "Reset this host's secrets_generated" task
# above) stores set_fact's result on THIS PLAY'S OWN TARGET HOST, not
# literally on localhost — delegate_to only controls where a task
# executes, never where its fact gets recorded. Invisible in
# bootstrap-secrets.yaml's own play (hosts: localhost, so the target
# already IS localhost) but not here, since this task runs from plays
# whose target genuinely isn't localhost (e.g. a Molecule scenario's
# platform container) — hostvars['localhost'] is empty there. The plain
# variable resolves correctly regardless of which host the play targets.
- name: Propagate main-domain onto every host, so their own ansible_host can resolve before Vault login
  ansible.builtin.set_fact:
    secrets_generated: "{{ secrets_generated }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
  when: secrets_vault_needed
  tags:
    - always

# Populates secrets_vault_token/secrets_vault_ca_path/secrets_vault_base_url
# — see vault_login.yaml. Skipped entirely on a registry with nothing
# Vault-backed (e.g. every existing molecule scenario's own fixture
# registry), so those scenarios need no OpenBao test target of their own.
- name: Log into OpenBao as the controller AppRole, if any secret needs it
  ansible.builtin.include_tasks: vault_login.yaml
  when: secrets_vault_needed
  tags:
    - always

- name: Ensure every remaining registered secret is generated and cached
  ansible.builtin.include_tasks: ensure_secret.yaml
  loop: "{{ secrets_registry.keys() | reject('equalto', 'main-domain') | list }}"
  loop_control:
    loop_var: secrets_item_name
    label: "{{ secrets_item_name }}"
  tags:
    - always
