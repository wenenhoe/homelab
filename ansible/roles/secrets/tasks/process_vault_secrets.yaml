---
# Resolves every Vault-backed secret (any format) in secrets_items into
# secrets_generated, in one include_tasks invocation regardless of how
# many secrets that is — included once by ensure_secret.yaml, not once
# per secret. Each stage below is a single task looping over its own
# subset of secrets_vault_items (all of them for the read; only the
# ones that came back 404 for generate/write; only the writes that lost
# the create race for the reread), then indexes its .results by secret
# name via `combine({item.item: item})` so the next stage — and the
# final store — can look values up by name instead of relying on list
# position, since each stage's list is a different length and order
# than the one before it. Confirmed live (throwaway spike, discarded)
# that this correlation is reliable across differently-sized, skip-
# filtered loops, and that skipped-by-`when` results simply lack the
# module-specific keys rather than reporting them as null.
#
# This is the multi-item counterpart to read_vault_kv.yaml, which
# still serves rotate-secret.yaml's own single-secret path
# (secrets_item_name) unchanged. resolve_vault_generated_secret.yaml —
# the file this one's generate/write/reread/store sequence replaces —
# has been deleted: it had exactly one caller (the original, per-secret
# version of this file, before this flatten), and checked directly,
# rotate-secret.yaml never used it either — rotation always overwrites
# with cas=<current version>, an update, not the cas=0-if-missing dance
# this sequence exists for. Confirmed dead both statically (no
# remaining include_tasks/tasks_from reference anywhere) and empirically
# (0/6 secrets-role Molecule scenarios ever touched any of its tasks).
# The hex/uuid4 generation step below duplicates
# generate_vault_value.yaml's command/slice logic rather than including
# it per item (that would reintroduce exactly the per-secret
# include_tasks cost this file exists to avoid) — any change to
# hex/uuid4 generation semantics (token_hex sizing, uuid4 command,
# slicing) must be made in both places or the two paths will silently
# diverge.
#
# Every task here is delegate_to: localhost/tags: [always] for the same
# reason as ensure_secret.yaml's own tasks (this runs before
# secrets_generated exists). no_log: true wherever a task result could
# carry a plaintext secret value.

- name: "Determine which of this call's secrets are Vault-backed"
  ansible.builtin.set_fact:
    secrets_vault_items: >-
      {{
        secrets_items
        | select('in', secrets_registry | dict2items
            | selectattr('value.vault_scope', 'defined')
            | map(attribute='key') | list)
        | list
      }}
  delegate_to: localhost
  become: false
  tags: [always]

- name: "Read current Vault state for every Vault-backed secret in this call"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_registry[item].vault_scope }}/{{ item }}"
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    status_code: [200, 404]
  register: secrets_vault_read_all
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

# A task's loop runs zero times when its list is empty — the module
# never executes at all, so a set_fact built only inside such a loop
# (e.g. the indexing task right below) is left completely undefined,
# not merely {} — confirmed live (throwaway spike, discarded) and hit
# for real on every run's main-domain-only call, which has zero
# Vault-backed secrets. Seeded here, unconditionally, once per call.
- name: "Start with an empty Vault-read index"
  ansible.builtin.set_fact:
    secrets_vault_read_by_item: {}
  delegate_to: localhost
  become: false
  tags: [always]

- name: "Index Vault read results by secret name"
  ansible.builtin.set_fact:
    secrets_vault_read_by_item: "{{ secrets_vault_read_by_item | combine({item.item: item}) }}"
  loop: "{{ secrets_vault_read_all.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Fail loudly if a Vault-backed manual secret was never supplied"
  ansible.builtin.fail:
    msg: |
      Missing required secret: {{ item }}
      {{ secrets_registry[item].description | default('(no description in secrets_registry.yaml)') }}
      This secret is stored in OpenBao at
      {{ secrets_vault_kv_mount }}/data/{{ secrets_registry[item].vault_scope }}/{{ item }} — nothing
      currently there. Run once to fill in every missing manual secret:
        cd tools && python3 -m openbao_utils.bootstrap
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "{{ item }}"
  when:
    - secrets_registry[item].format == 'manual'
    - secrets_vault_read_by_item[item].status == 404
  delegate_to: localhost
  become: false
  tags: [always]

# hex and uuid4 share this generate/write/reread/store sequence — only
# the format branches within it (see generate_vault_value.yaml's own
# identical split).
- name: "Determine which Vault-backed secrets need a fresh value generated"
  ansible.builtin.set_fact:
    secrets_vault_need_generate: >-
      {{
        secrets_vault_items
        | select('in', secrets_vault_read_by_item | dict2items
            | selectattr('value.status', 'equalto', 404) | map(attribute='key') | list)
        | select('in', secrets_registry | dict2items
            | selectattr('value.format', 'in', ['hex', 'uuid4']) | map(attribute='key') | list)
        | list
      }}
  delegate_to: localhost
  become: false
  tags: [always]

# Same zero-iteration hazard as secrets_vault_read_by_item above: this
# placeholder loop itself runs zero times when secrets_vault_items is
# empty, so the base case needs its own unconditional seed first.
- name: "Start with an empty Vault-write index"
  ansible.builtin.set_fact:
    secrets_vault_write_by_item: {}
  delegate_to: localhost
  become: false
  tags: [always]

# Seeded for every Vault-backed secret, not just the ones that get
# written below — the final store task needs a defined `.status` for
# every item to branch on, including manual secrets and already-
# generated hex/uuid4 secrets that never reach the write task at all.
- name: "Seed a not-yet-written placeholder for every Vault-backed secret"
  ansible.builtin.set_fact:
    secrets_vault_write_by_item: "{{ secrets_vault_write_by_item | combine({item: {'status': none}}) }}"
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  tags: [always]

# secrets.token_hex(n) returns 2n hex characters, so the byte count is
# half the registry's requested length; sliced to the exact requested
# length afterward in case that length is odd — see
# generate_vault_value.yaml's own identical reasoning.
- name: "Generate a fresh value in memory for each secret that needs one"
  ansible.builtin.command:
    cmd: >-
      {{
        ('python3 -c "import secrets; print(secrets.token_hex(' ~ ((secrets_registry[item].length / 2) | round(0, 'ceil') | int) ~ '))"')
        if secrets_registry[item].format == 'hex'
        else 'python3 -c "import uuid; print(uuid.uuid4())"'
      }}
  register: secrets_vault_generate_all
  loop: "{{ secrets_vault_need_generate }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
  tags: [always]

- name: "Index each generated value by secret name, sliced/trimmed per its own format"
  ansible.builtin.set_fact:
    secrets_vault_generated_by_item: >-
      {{
        secrets_vault_generated_by_item | default({}) | combine({
          item.item: (
            item.stdout[:secrets_registry[item.item].length]
            if secrets_registry[item.item].format == 'hex'
            else (item.stdout | trim)
          )
        })
      }}
  loop: "{{ secrets_vault_generate_all.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

# check-then-write against KV v2's cas parameter: cas=0 on the write
# only succeeds if the path doesn't exist yet ("In order for a write to
# be successful, cas must be set to the current version of the secret.
# If set to 0 a write will only be allowed if the key doesn't exist" —
# openbao.org's own KV v2 API docs), so two controller runs racing to
# generate the same never-yet-created secret can't both "win": whichever
# write lands second gets HTTP 400 ("check-and-set parameter did not
# match the current version" — same OpenBao/Vault KV v2 behavior,
# confirmed against Vault's own kv-v2 cookbook docs, which OpenBao's
# implementation is derived from).
- name: "Write freshly generated values to Vault with cas=0"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_registry[item].vault_scope }}/{{ item }}"
    method: POST
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    body_format: json
    body:
      data:
        value: "{{ secrets_vault_generated_by_item[item] }}"
      options:
        cas: 0
    status_code: [200, 400]
  register: secrets_vault_write_all
  loop: "{{ secrets_vault_need_generate }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Index Vault write results by secret name (overwrites the not-yet-written placeholder for items actually written)"
  ansible.builtin.set_fact:
    secrets_vault_write_by_item: "{{ secrets_vault_write_by_item | combine({item.item: item}) }}"
  loop: "{{ secrets_vault_write_all.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Determine which writes lost the create race and need a re-read"
  ansible.builtin.set_fact:
    secrets_vault_need_reread: >-
      {{
        secrets_vault_need_generate
        | select('in', secrets_vault_write_by_item | dict2items
            | selectattr('value.status', 'equalto', 400) | map(attribute='key') | list)
        | list
      }}
  delegate_to: localhost
  become: false
  tags: [always]

# Lost the create race: someone else's value is now authoritative.
# Re-read rather than trusting the value this run generated but never
# actually got to store.
- name: "Re-read after losing a create race"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_registry[item].vault_scope }}/{{ item }}"
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    status_code: [200]
  register: secrets_vault_reread_all
  loop: "{{ secrets_vault_need_reread }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Index Vault re-read results by secret name"
  ansible.builtin.set_fact:
    secrets_vault_reread_by_item: "{{ secrets_vault_reread_by_item | default({}) | combine({item.item: item}) }}"
  loop: "{{ secrets_vault_reread_all.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]

- name: "Store every Vault-backed secret's resolved value"
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          item: (
            secrets_vault_read_by_item[item].json.data.data.value
            if secrets_vault_read_by_item[item].status == 200
            else (
              secrets_vault_reread_by_item[item].json.data.data.value
              if secrets_vault_write_by_item[item].status == 400
              else secrets_vault_generated_by_item[item]
            )
          )
        })
      }}
  loop: "{{ secrets_vault_items }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags: [always]
