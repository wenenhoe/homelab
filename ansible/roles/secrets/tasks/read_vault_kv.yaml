---
# Given secrets_item_name (an entry with a vault_scope), computes its
# Vault path and reads its current value/version, or confirms it
# doesn't exist yet (404). Sets secrets_vault_path and secrets_vault_read.
#
# Shared by ensure_secret.yaml (every Vault-backed format's existence
# check) and rotate-secret.yaml (which additionally needs the current
# KV version, from secrets_vault_read.json.data.metadata.version, for
# its cas=<version> update) — previously duplicated between the two
# with different variable names.

- name: "Compute this secret's Vault path - {{ secrets_item_name }}"
  ansible.builtin.set_fact:
    secrets_vault_path: "{{ secrets_registry[secrets_item_name].vault_scope }}/{{ secrets_item_name }}"
  delegate_to: localhost
  become: false
  tags:
    - always

# Confirmed live: an ansible.builtin.include_role's own role defaults
# (defaults/main.yaml) are visible to every task within that SAME
# include_role invocation, but do NOT persist to a later, separate
# sibling task once that invocation returns — even a different
# include_role of the SAME role starts a fresh scope. ensure_secret.yaml
# never hit this (it reaches this file via plain include_tasks, nested
# under one outer include_role: name: secrets, so the whole call tree
# shares that one scope) — but rotate-secret.yaml calls vault_login.yaml,
# this file, and generate_vault_value.yaml as three SEPARATE
# include_role invocations, with its own plain ansible.builtin.uri tasks
# as later siblings needing secrets_vault_kv_mount too. Re-publishing it
# as an explicit fact here — while it's still visible as a role default,
# since this task is itself part of the include_role invocation that
# loaded it — is what makes it survive to those later siblings, the same
# way secrets_vault_base_url/token/ca_path already do (all explicit
# facts set inside vault_login.yaml, not role defaults).
- name: Capture the KV mount name as a fact (role defaults don't survive past this include_role's own scope)
  ansible.builtin.set_fact:
    secrets_vault_kv_mount: "{{ secrets_vault_kv_mount }}"
  delegate_to: localhost
  become: false
  tags:
    - always

- name: "Check whether this Vault-backed secret already exists - {{ secrets_item_name }}"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }}"
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    status_code: [200, 404]
  register: secrets_vault_read
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
