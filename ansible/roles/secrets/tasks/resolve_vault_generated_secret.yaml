---
# Resolves ONE Vault-backed hex/uuid4 secret into secrets_generated,
# given secrets_vault_read already computed by ensure_secret.yaml's
# shared existence check. Handles both formats identically — this
# sequence doesn't care whether the value is a hex string or a UUID;
# only generate_vault_value.yaml's own generation step branches on
# format.
#
# check-then-write against KV v2's cas parameter: cas=0 on the write
# only succeeds if the path doesn't exist yet ("In order for a write to
# be successful, cas must be set to the current version of the secret.
# If set to 0 a write will only be allowed if the key doesn't exist" —
# openbao.org's own KV v2 API docs), so two controller runs racing to
# generate the same never-yet-created secret can't both "win": whichever
# write lands second gets HTTP 400 ("check-and-set parameter did not
# match the current version" — same OpenBao/Vault KV v2 behavior,
# confirmed against Vault's own kv-v2 cookbook docs, which OpenBao's
# implementation is derived from) and falls back to reading the value
# the first write actually stored, rather than each host ending up with
# its own disagreeing value.

- name: "Generate a fresh value, if Vault doesn't have one yet - {{ secrets_item_name }}"
  ansible.builtin.include_tasks: generate_vault_value.yaml
  tags:
    - always
  when: secrets_vault_read.status == 404

- name: "Write the new value to Vault with cas=0 - {{ secrets_item_name }}"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    body_format: json
    body:
      data:
        value: "{{ secrets_vault_generated_value }}"
      options:
        cas: 0
    status_code: [200, 400]
  register: secrets_vault_write
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
  when: secrets_vault_read.status == 404

# Lost the create race (cas=0 write got 400): someone else's value is now
# the authoritative one. Re-read rather than trusting the value this run
# generated but never actually got to store.
- name: "Re-read after losing a create race - {{ secrets_item_name }}"
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/{{ secrets_vault_kv_mount }}/data/{{ secrets_vault_path }}"
    headers:
      X-Vault-Token: "{{ secrets_vault_token }}"
    ca_path: "{{ secrets_vault_ca_path }}"
    status_code: [200]
  register: secrets_vault_reread
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
  when:
    - secrets_vault_read.status == 404
    - secrets_vault_write.status == 400

- name: "Store secret from Vault - {{ secrets_item_name }}"
  ansible.builtin.set_fact:
    secrets_generated: >-
      {{
        secrets_generated | combine({
          secrets_item_name: (
            secrets_vault_read.json.data.data.value
            if secrets_vault_read.status == 200
            else (
              secrets_vault_reread.json.data.data.value
              if secrets_vault_write.status == 400
              else secrets_vault_generated_value
            )
          )
        })
      }}
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
