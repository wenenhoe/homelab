---
# Authenticates once per playbook run as the `controller` AppRole
# (ADR 0020, docs/openbao-auth.md), publishing secrets_vault_token,
# secrets_vault_ca_path, and secrets_vault_base_url for every
# vault_scope-backed secret ensure_secret.yaml processes afterward.
# Included once from main.yaml, only when secrets_vault_needed.
#
# Every task here is delegate_to: localhost/tags: [always] for the same
# reason as ensure_secret.yaml's own tasks (this runs before
# secrets_generated exists) — except the root-cert fetch, which must
# delegate to `security` specifically to reach the running step-ca
# container.

- name: Read the controller AppRole's role_id from the file cache
  ansible.builtin.slurp:
    path: "{{ project_root }}/ansible/files/secrets/openbao-controller-role-id"
  register: secrets_vault_role_id_read
  delegate_to: localhost
  become: false
  tags:
    - always

- name: Read the controller AppRole's secret_id from the file cache
  ansible.builtin.slurp:
    path: "{{ project_root }}/ansible/files/secrets/openbao-controller-secret-id"
  register: secrets_vault_secret_id_read
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always

- name: Fail loudly if the controller AppRole hasn't been provisioned yet
  ansible.builtin.fail:
    msg: >-
      openbao-controller-role-id / openbao-controller-secret-id are
      present but blank — at least one secret in secrets_registry.yaml
      has a vault_scope, which means OpenBao must be reachable, but this
      controller has no AppRole credential to authenticate with yet.
      Run docs/openbao-auth.md's runbook (Track A stage 3) first.
  delegate_to: localhost
  become: false
  when: >-
    (secrets_vault_role_id_read.content | b64decode | trim | length == 0)
    or (secrets_vault_secret_id_read.content | b64decode | trim | length == 0)
  tags:
    - always

# step-ca's root cert is public by design (see step_ca_client's own
# identical read) — no no_log needed on this task. Delegated to
# `security` directly rather than depending on step_ca_client having
# already run in this play: this role's own consumers (deploy.yaml's
# Play 0) run before step_ca_client ever does (Play 6).
#
# connection: ssh, explicit: bootstrap-secrets.yaml's own play sets
# connection: local at the play level (every other task in it, and
# every other task in this role, genuinely does delegate_to: localhost
# — that setting is correct for all of them). But a play-level
# connection: setting is the DEFAULT connection type for any
# delegate_to target that doesn't declare its own ansible_connection —
# and security, like every managed_hosts entry, doesn't; it relies on
# Ansible's normal SSH default. Confirmed live: without this override,
# that default silently became "local" instead, and the docker exec
# below ran on the CONTROLLER's own machine instead of security's —
# succeeding syntactically (the controller has docker too) while
# reporting "No such container: step-ca", a misleading symptom that
# looked exactly like a Docker/SDK problem on security and wasn't one.
- name: Read step-ca's root cert fresh from security, for validating OpenBao's TLS cert
  community.docker.docker_container_exec:
    container: "{{ secrets_vault_step_ca_container_name }}"
    command: cat /home/step/certs/root_ca.crt
  register: secrets_vault_root_cert_read
  changed_when: false
  delegate_to: "{{ secrets_vault_host }}"
  connection: ssh
  become: false
  tags:
    - always

# ADR 0022: a fresh, randomly-named file every run, not a fixed path —
# nothing to pre-plant. Not cleaned up here (this task doesn't own the
# file long enough to know when it's safe to remove — every later
# Vault-backed task in the same run still needs secrets_vault_ca_path,
# including some callers' own extra, direct queries after the whole
# secrets role has already returned — see main.yaml's own comment on
# its "Log into OpenBao..." task for why cleanup can't live there
# either). bootstrap-secrets.yaml's own play (the real outermost
# boundary for production use) and rotate-secret.yaml's own block/always
# both clean it up once they're genuinely done with it; each Molecule
# scenario that calls this file directly does the same in its own
# converge.yml/verify.yml.
#
# changed_when: false on both this and the write below: they genuinely
# DO run — and create a real, fresh file — every single time, by
# design (that's the whole point of ADR 0022). tempfile always reports
# changed (it always creates something new) and copy always reports
# changed writing to that brand-new path, which correctly fails
# Molecule's idempotence check otherwise — confirmed live. Tagging
# these molecule-idempotence-notest instead would be wrong: that skips
# execution entirely, and the very next task (the AppRole login) hard-
# depends on secrets_vault_ca_tempfile.path existing on every run, not
# just the first.
- name: Create a per-run temp file for the fetched root cert
  ansible.builtin.tempfile:
    state: file
    suffix: openbao-root-ca
  register: secrets_vault_ca_tempfile
  delegate_to: localhost
  become: false
  changed_when: false
  tags:
    - always

- name: Write the fetched root cert to the per-run temp file
  ansible.builtin.copy:
    dest: "{{ secrets_vault_ca_tempfile.path }}"
    content: "{{ secrets_vault_root_cert_read.stdout }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  tags:
    - always

- name: Compute OpenBao's base URL
  ansible.builtin.set_fact:
    secrets_vault_base_url: "https://openbao.{{ hostvars[secrets_vault_host].caddy_domain }}:{{ secrets_vault_port }}"
  delegate_to: localhost
  become: false
  tags:
    - always

# Response shape confirmed against OpenBao/Vault's own AppRole login API
# docs: a 200 response's auth.client_token is the short-lived token this
# role's caller authenticates every subsequent request with — same
# field docs/openbao-auth.md's own runbook (step 6) reads by hand via
# `bao write auth/approle/login`.
- name: Authenticate to OpenBao as the controller AppRole
  ansible.builtin.uri:
    url: "{{ secrets_vault_base_url }}/v1/auth/approle/login"
    method: POST
    ca_path: "{{ secrets_vault_ca_tempfile.path }}"
    body_format: json
    body:
      role_id: "{{ secrets_vault_role_id_read.content | b64decode | trim }}"
      secret_id: "{{ secrets_vault_secret_id_read.content | b64decode | trim }}"
    status_code: [200]
  register: secrets_vault_login
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always

- name: Store the Vault client token for this run
  ansible.builtin.set_fact:
    secrets_vault_token: "{{ secrets_vault_login.json.auth.client_token }}"
    secrets_vault_ca_path: "{{ secrets_vault_ca_tempfile.path }}"
  delegate_to: localhost
  become: false
  no_log: true
  tags:
    - always
