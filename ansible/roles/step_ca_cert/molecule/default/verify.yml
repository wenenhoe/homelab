---
- name: Verify
  hosts: all
  become: true
  vars:
    step_ca_cert_step_ca_url: https://step-ca-test:9000
  tasks:
    # Single source of truth for the argv-embedded image reference below
    # — loaded into a namespaced var (not shadowing the vars: block
    # above) so this can't drift from ansible/roles/step_ca_cert/
    # defaults/main.yaml the way a hardcoded literal here already had
    - name: Load step_ca_cert's own role defaults
      ansible.builtin.include_vars:
        file: ../../defaults/main.yaml
        name: step_ca_cert_role_defaults

    - name: Discover the lldap certs volume's real host path
      community.docker.docker_volume_info:
        name: lldap_certs
      register: step_ca_cert_verify_volume

    - name: Set the mountpoint fact
      ansible.builtin.set_fact:
        step_ca_cert_verify_mountpoint: "{{ step_ca_cert_verify_volume.volume.Mountpoint }}"

    - name: Confirm the cert files actually exist
      ansible.builtin.stat:
        path: "{{ step_ca_cert_verify_mountpoint }}/{{ item }}"
      register: step_ca_cert_verify_files
      loop:
        - fullchain.pem
        - privkey.pem
      failed_when: not step_ca_cert_verify_files.stat.exists

    - name: Confirm the cert's SANs cover both the bare name and the FQDN
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ step_ca_cert_verify_mountpoint }}/fullchain.pem"
          - -noout
          - -ext
          - subjectAltName
      register: step_ca_cert_verify_sans
      changed_when: false
      failed_when: >-
        'DNS:lldap' not in step_ca_cert_verify_sans.stdout
        or 'DNS:lldap.sec.lan.molecule.test' not in step_ca_cert_verify_sans.stdout

    - name: Confirm lldap actually recovered from its cold-volume crash loop
      community.docker.docker_container_info:
        name: lldap
      register: step_ca_cert_verify_lldap_info
      failed_when: step_ca_cert_verify_lldap_info.container.State.Status != 'running'

    - name: Confirm the renewal timer is enabled and active
      ansible.builtin.systemd_service:
        name: cert-renewer@lldap.timer
      register: step_ca_cert_verify_timer_info
      failed_when: >-
        step_ca_cert_verify_timer_info.status.UnitFileState != 'enabled'
        or step_ca_cert_verify_timer_info.status.ActiveState != 'active'

    # This scenario deliberately still doesn't exercise the timer's own
    # ExecCondition gating end to end — that's `renewal_timing`'s job
    # (a real 1-minute cert against step certificate needs-renewal's
    # documented 66%-of-lifetime default). What's tested here instead:
    # the exact commands ExecStart/ExecStartPost run, run directly,
    # produce the real side effects they're supposed to — a useful,
    # fast check on its own, just not the same claim as "the timer's
    # gating logic is correct".
    - name: Record the cert's serial number before a direct renewal
      ansible.builtin.command: openssl x509 -in {{ step_ca_cert_verify_mountpoint }}/fullchain.pem -noout -serial
      register: step_ca_cert_verify_serial_before
      changed_when: false

    - name: Run the exact renewal command ExecStart would run
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - root
          - --network
          - caddy-proxy
          - -v
          - lldap_certs:/certs
          - -v
          - /etc/step-ca/root_ca.crt:/root_ca.crt:ro
          - "{{ step_ca_cert_role_defaults.step_ca_cert_step_cli_image }}"
          - step
          - ca
          - renew
          - --force
          - --ca-url
          - "{{ step_ca_cert_step_ca_url }}"
          - --root
          - /root_ca.crt
          - /certs/fullchain.pem
          - /certs/privkey.pem
      changed_when: true

    - name: Record the cert's serial number after
      ansible.builtin.command: openssl x509 -in {{ step_ca_cert_verify_mountpoint }}/fullchain.pem -noout -serial
      register: step_ca_cert_verify_serial_after
      changed_when: false
      failed_when: step_ca_cert_verify_serial_after.stdout == step_ca_cert_verify_serial_before.stdout

    # Runs the literal ExecStartPost= line from the rendered unit,
    # sourcing lldap's actual /etc/cert-renewer/lldap.env the way
    # systemd's own EnvironmentFile= would — not a hand-typed
    # approximation of it. This exercises the CHOWN_IMAGE-guard's own
    # shell syntax for real (the opposite branch from signal_chown's
    # own equivalent task) without asserting on the resulting file
    # owner afterward: what uid a `docker run --user root`-created file
    # ends up as on the host is Docker daemon configuration this repo
    # doesn't control or document (e.g. rootless Docker maps container
    # root to the daemon's own uid, not host uid 0) — not something to
    # assert on here, since lldap's own correctness doesn't depend on
    # who owns this file, only openbao's does (see signal_chown's own
    # ownership assertions, which check against a chown that already
    # ran, not this no-op branch).
    - name: Run the real chown-guard ExecStartPost= line for this instance
      ansible.builtin.shell: |
        set -a
        . /etc/cert-renewer/lldap.env
        set +a
        [ -z "${CHOWN_IMAGE}" ] || /usr/bin/docker run --rm --user root -v lldap_certs:/certs "${CHOWN_IMAGE}" chown -R "${CHOWN_USER}:${CHOWN_USER}" /certs
      args:
        executable: /bin/bash
      changed_when: true

    - name: Record lldap's start time before a direct ExecStartPost run
      community.docker.docker_container_info:
        name: lldap
      register: step_ca_cert_verify_restart_before

    - name: Run the exact restart command the second ExecStartPost= line would run for RENEW_ACTION=restart
      ansible.builtin.command: docker compose -f /opt/stacks/lldap/compose.yaml restart lldap
      changed_when: true

    # StartedAt, not RestartCount: RestartCount only tracks restarts the
    # container's own restart *policy* drives (recovering from a crash),
    # never a manual `docker restart`/`docker compose restart` — it
    # stays 0 here even though the container demonstrably did restart.
    # StartedAt changes on every restart regardless of cause, the same
    # signal backup_agent's own scenario already uses for this exact
    # kind of assertion (see docs/molecule-testing.md).
    - name: Record lldap's start time after
      community.docker.docker_container_info:
        name: lldap
      register: step_ca_cert_verify_restart_after
      failed_when: >-
        step_ca_cert_verify_restart_after.container.State.StartedAt
        == step_ca_cert_verify_restart_before.container.State.StartedAt

    - name: Confirm the rendered env file carries lldap's restart/no-chown shape
      ansible.builtin.slurp:
        path: /etc/cert-renewer/lldap.env
      register: step_ca_cert_verify_env_raw
      # b64decode / assert below rather than a raw string == compare:
      # only asserts the fields this scenario cares about are present,
      # tolerant of key ordering.

    - name: Assert on the rendered env file's content
      ansible.builtin.assert:
        that:
          - "'RENEW_ACTION=restart' in (step_ca_cert_verify_env_raw.content | b64decode)"
          - "'CHOWN_IMAGE=' in (step_ca_cert_verify_env_raw.content | b64decode)"
        fail_msg: "Rendered env: {{ step_ca_cert_verify_env_raw.content | b64decode }}"

    - name: Read back telegram-notify's rendered env file
      ansible.builtin.slurp:
        path: /etc/telegram-notify/telegram-notify@.env
      register: step_ca_cert_verify_notify_env_raw

    - name: Confirm it carries the scenario's dummy bot credentials, not empty/template-literal values
      ansible.builtin.assert:
        that:
          - "'TELEGRAM_TOKEN=molecule-dummy-telegram-token' in (step_ca_cert_verify_notify_env_raw.content | b64decode)"
          - "'TELEGRAM_CHAT_ID=molecule-dummy-chat-id' in (step_ca_cert_verify_notify_env_raw.content | b64decode)"

    - name: Read back the rendered telegram-notify@ unit  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl cat telegram-notify@lldap.service
      register: step_ca_cert_verify_notify_unit
      changed_when: false

    - name: Confirm message_thread_id is omitted when no topic ID is configured (this scenario's telegram_topic_id_certs is blank)
      ansible.builtin.assert:
        that:
          - "'message_thread_id=' not in step_ca_cert_verify_notify_unit.stdout"
        fail_msg: >-
          message_thread_id= appeared despite a blank telegram_topic_id_certs
          — the Jinja conditional in telegram_notify/templates/notify.service.j2 regressed.

    - name: Confirm parse_mode=Markdown is set and the message is backtick-styled
      ansible.builtin.assert:
        that:
          - "'parse_mode=Markdown' in step_ca_cert_verify_notify_unit.stdout"
          - "'`' in step_ca_cert_verify_notify_unit.stdout"
        fail_msg: "Rendered unit: {{ step_ca_cert_verify_notify_unit.stdout }}"

    # --- telegram-notify@ wiring -----------------------------------------
    # Doesn't exercise a real Telegram delivery (no live bot/network in
    # CI) — that part still needs a manual live check, see
    # docs/telegram-notifications.md. What this confirms instead: the
    # OnFailure= link is actually present, and the templated unit loads
    # and runs cleanly under real systemd rather than just "the file
    # looks right" (catches quoting/escaping bugs the static content
    # check below can't).
    - name: Confirm cert-renewer@ actually declares both links  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl cat cert-renewer@lldap.service
      register: step_ca_cert_verify_onfailure
      changed_when: false
      failed_when: >-
        'OnFailure=telegram-notify@%i.service' not in step_ca_cert_verify_onfailure.stdout
        or 'OnSuccess=uptime-kuma-push-cert-renewer-%i.service' not in step_ca_cert_verify_onfailure.stdout

    - name: Start telegram-notify@lldap.service directly, as OnFailure= would  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start telegram-notify@lldap.service
      failed_when: false
      changed_when: false

    - name: Query the unit's actual state (not via raw systemctl show, whose multi-property output order isn't guaranteed — see systemd/systemd#28205)
      ansible.builtin.systemd_service:
        name: telegram-notify@lldap.service
        daemon_reload: false
      register: step_ca_cert_verify_notify_state

    - name: Confirm systemd actually loaded and ran the unit (not a syntax/templating error)
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_notify_state.status.LoadState == 'loaded'
          - step_ca_cert_verify_notify_state.status.ActiveState in ['inactive', 'failed']
        fail_msg: >-
          telegram-notify@lldap.service didn't load/run cleanly:
          LoadState={{ step_ca_cert_verify_notify_state.status.LoadState | default('?') }}
          ActiveState={{ step_ca_cert_verify_notify_state.status.ActiveState | default('?') }}
          — 'failed' here just means curl couldn't reach the real API
          (expected in CI), 'not-found' or 'masked' would mean the unit
          itself is broken.

    # --- uptime-kuma-push-cert-renewer-lldap wiring ----------------------
    # Same shape as the telegram-notify@ block above. This is the
    # concrete unit step_ca_cert's own tasks/main.yaml installs -
    # cert-renewer@lldap.service's OnSuccess= resolves
    # "uptime-kuma-push-cert-renewer-%i.service" to exactly this name
    # when %i=lldap, confirmed by the OnFailure/OnSuccess check above.
    - name: Read back uptime-kuma-push-cert-renewer-lldap's rendered env file
      ansible.builtin.slurp:
        path: /etc/uptime-kuma-push/uptime-kuma-push-cert-renewer-lldap.env
      register: step_ca_cert_verify_push_env_raw

    - name: Confirm it renders an empty URL (this scenario's step_ca_cert_uptime_kuma_push_url is blank)
      ansible.builtin.assert:
        that:
          - (step_ca_cert_verify_push_env_raw.content | b64decode | trim) == 'UPTIME_KUMA_PUSH_URL='
        fail_msg: "Rendered env: {{ step_ca_cert_verify_push_env_raw.content | b64decode }}"

    - name: Start uptime-kuma-push-cert-renewer-lldap.service directly, as OnSuccess= would  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start uptime-kuma-push-cert-renewer-lldap.service
      failed_when: false
      changed_when: false

    - name: Query the pusher unit's actual state
      ansible.builtin.systemd_service:
        name: uptime-kuma-push-cert-renewer-lldap.service
        daemon_reload: false
      register: step_ca_cert_verify_push_state

    - name: Confirm systemd actually loaded and ran the pusher unit (not a syntax/templating error)
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_push_state.status.LoadState == 'loaded'
          - step_ca_cert_verify_push_state.status.ActiveState in ['inactive', 'failed']
        fail_msg: >-
          uptime-kuma-push-cert-renewer-lldap.service didn't load/run cleanly:
          LoadState={{ step_ca_cert_verify_push_state.status.LoadState | default('?') }}
          ActiveState={{ step_ca_cert_verify_push_state.status.ActiveState | default('?') }}
          — 'failed' here just means curl had no URL to hit (expected in
          CI with a blank push URL), 'not-found' or 'masked' would mean
          the unit itself is broken.
