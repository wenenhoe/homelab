---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
  tasks:
    # Deliberately no container started at all — that's the whole point
    # of this scenario. The guard this tests is the very first task in
    # step_ca_cert/tasks/main.yaml, before anything step-ca-related
    # runs, so a throwaway step-ca isn't needed here either. app_name
    # is arbitrary — the guard doesn't depend on which real app this
    # instance represents.
    - name: "Run step_ca_cert [block / rescue] (no running target container, failure is deliberate and expected)"
      block:
        - name: Run step_ca_cert against a host with no matching container
          ansible.builtin.include_role:
            name: step_ca_cert
          vars:
            step_ca_cert_app_name: widget
            step_ca_cert_common_name: widget
            step_ca_cert_container_name: widget-test
      rescue:
        # A bare rescue: accepts ANY failure inside the block as "the
        # guard worked" — a Docker hiccup or an unrelated task erroring
        # out would leave the same halt marker behind and pass just as
        # happily as the real guard catching the missing container.
        # Assert on the exact task and reason before trusting the
        # "expected" label at all.
        - name: Confirm the failure came from the "not running" guard itself
          ansible.builtin.assert:
            that:
              - 'ansible_failed_task.name == "Fail loudly if this app isn''t running yet: widget"'
              - "'No running \"widget-test\" container found' in ansible_failed_result.msg"
            fail_msg: >-
              step_ca_cert failed, but not for the reason this scenario
              exists to test. Expected the "Fail loudly if this app isn't
              running yet: widget" task to fail naming "widget-test"; got
              task "{{ ansible_failed_task.name | default('unknown') }}"
              with message: {{ ansible_failed_result.msg | default('(no msg)') }}

        - name: Leave a marker proving the guard actually caught the missing container
          ansible.builtin.copy:
            dest: /tmp/step_ca_cert_not_running_halt_marker
            content: "missing target container caught as expected\n"
            mode: "0644"
