---
driver:
  name: docker
platforms:
  - name: step-ca-cert-renewal-timing-instance
    image: ghcr.io/wenenhoe/molecule-dind:latest@sha256:919ee3092f78df3207611fc2ef4f08fffaf058ec119044e45927043891c14364
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: ${MOLECULE_PROJECT_DIRECTORY}/../molecule_helpers/playbooks/prepare_dind_prebuilt.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  # No idempotence step: this scenario's whole point is issuing a
  # short-lived cert and waiting out real time in verify.yml, which
  # neither expects nor needs to be idempotent the way a normal
  # converge/re-converge pair does.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
