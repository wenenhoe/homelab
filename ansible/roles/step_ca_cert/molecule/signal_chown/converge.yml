---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
    compose_deploy_dir: /opt/stacks
    compose_source_dir: "{{ playbook_dir }}/files/docker"
    project_root: "{{ playbook_dir }}"
    # main_domain, lab_domain, caddy_domain, server_timezone, step_ca_*,
    # app_registry, compose_apps live in
    # host_vars/step-ca-cert-signal-chown-instance.yaml instead
    # — see the comment there.
  tasks:
    - name: Resolve compose_apps against the app registry
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: resolve_compose_apps.yaml

    - name: Create the caddy-proxy network for this scenario
      community.docker.docker_network:
        name: caddy-proxy
        state: present

    - name: Start a real, throwaway step-ca instance for this scenario
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: start_step_ca_test_target.yaml
      vars:
        molecule_helpers_step_ca_network_name: caddy-proxy
        molecule_helpers_step_ca_password: "{{ step_ca_provisioner_password }}"

    # Deploys the REAL docker/openbao/compose.yaml.j2 + configs/openbao.hcl.j2
    # (symlinked into this scenario's own files/docker/ — see
    # docs/molecule-fixtures.md), through the exact same `roles/openbao`
    # production uses — not a reimplemented inline deploy sequence — so
    # this scenario exercises the real data-volume chown-if-needed guard
    # too, not just the cert-issuance path step_ca_cert itself owns. TLS
    # is enabled with no cert seeded, so openbao crash-loops until
    # step_ca_cert (below) issues one and restarts it — the actual
    # production bootstrap race (see docs/openbao.md), not something
    # worked around here.
    - name: Deploy openbao on cold data/certs volumes
      ansible.builtin.include_role:
        name: openbao

    - name: Run step_ca_client
      ansible.builtin.include_role:
        name: step_ca_client
      vars:
        step_ca_client_container_name: step-ca-test

    # This is the "signal, with chown" shape (openbao's) — the
    # "restart, no chown" shape (lldap's) is default's own job,
    # not duplicated here.
    - name: Run the role under test
      ansible.builtin.include_role:
        name: step_ca_cert
      vars:
        step_ca_cert_app_name: openbao
        step_ca_cert_common_name: openbao
        step_ca_cert_container_cert_dir: /openbao/certs
        step_ca_cert_step_ca_url: https://step-ca-test:9000
        step_ca_cert_renew_action: signal
        step_ca_cert_chown_image: "openbao/openbao:2.6.2"
        step_ca_cert_chown_user: openbao
