---
# Must live here, not in converge.yml's play `vars:` — same reasoning as
# default's own host_vars.
main_domain: molecule.test
lan_domain: "lan.{{ main_domain }}"
caddy_domain: "sec.{{ lan_domain }}"
server_timezone: Asia/Singapore

# The throwaway step-ca-test instance's own bootstrap password
# (molecule_helpers_step_ca_password in converge.yml) doubles as its
# stock DOCKER_STEPCA_INIT_PASSWORD-derived provisioner password, and its
# default provisioner is named "admin" — matching the official image's
# own DOCKER_STEPCA_INIT_PROVISIONER_NAME default, not production's
# "internal-services" (docker/step-ca's own custom-entrypoint bootstrap
# isn't used here — see molecule_helpers/tasks/start_step_ca_test_target.yaml).
step_ca_provisioner_password: molecule-test-step-ca-password
step_ca_provisioner_name: admin

# telegram_notify's install.yaml (included from step_ca_cert's own
# tasks/main.yaml) needs these — see docs/topics/monitoring/telegram-notifications.md.
telegram_token: molecule-dummy-telegram-token
telegram_chat_id: molecule-dummy-chat-id
telegram_topic_id_certs: ""

# Real production shape (ansible/inventory/group_vars/all/app_catalog.yaml's
# openbao entry) — extracted via lookup rather than hand-copied, same
# reasoning as default's own host_vars (see
# docs/topics/engineering/molecule-fixtures.md): a hand-copied fixture drifts silently, a
# lookup can't.
app_catalog: >-
  {{
    (lookup('file', playbook_dir ~ '/../../../../inventory/group_vars/all/app_catalog.yaml')
     | from_yaml).app_catalog
  }}

# The image deploy.yaml passes for openbao's cert post-issuance chown, read
# from it rather than copied, so a Renovate bump of production moves this
# scenario with it (see docs/topics/engineering/molecule-fixtures.md).
step_ca_cert_chown_image: >-
  {{
    lookup('file', playbook_dir ~ '/../../../../playbooks/deploy.yaml')
    | regex_search('step_ca_cert_chown_image:\s*"([^"]+)"', '\1')
    | first
  }}

compose_apps:
  - name: openbao

# gatus_push's install.yaml (included from step_ca_cert's own tasks/main.yaml)
# asserts the job is in both maps; production builds them from heartbeat_jobs.
heartbeat_push_urls:
  cert-renewer-openbao: https://gatus-test.invalid/api/v1/endpoints/certs_cert-renewer-openbao/external?success=true
heartbeat_job_tokens:
  cert-renewer-openbao: molecule-dummy-gatus-token
