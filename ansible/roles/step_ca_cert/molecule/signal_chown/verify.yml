---
- name: Verify
  hosts: all
  become: true
  vars:
    step_ca_cert_step_ca_url: https://step-ca-test:9000
  tasks:
    # Single source of truth for the argv-embedded image reference below
    # — loaded into a namespaced var (not shadowing the vars: block
    # above) so this can't drift from ansible/roles/step_ca_cert/
    # defaults/main.yaml the way a hardcoded literal here already had
    - name: Load step_ca_cert's own role defaults
      ansible.builtin.include_vars:
        file: ../../defaults/main.yaml
        name: step_ca_cert_role_defaults

    # --- shared setup: the openbao image's own non-root UID -------------
    # By name, not a hardcoded number — see roles/openbao's own
    # comment for why. Read from the real running container rather
    # than assumed, so this stays correct even if a future image bump
    # changes the number `adduser -S` happens to assign.
    - name: Read the openbao image's own non-root UID
      community.docker.docker_container_exec:
        container: openbao
        command: id -u openbao
      register: step_ca_cert_verify_openbao_uid
      changed_when: false

    - name: Discover the openbao certs volume's real host path
      community.docker.docker_volume_info:
        name: openbao_certs
      register: step_ca_cert_verify_certs_volume

    - name: Discover the openbao data volume's real host path
      community.docker.docker_volume_info:
        name: openbao_data
      register: step_ca_cert_verify_data_volume

    - name: Set the mountpoint facts
      ansible.builtin.set_fact:
        step_ca_cert_verify_certs_mountpoint: "{{ step_ca_cert_verify_certs_volume.volume.Mountpoint }}"
        step_ca_cert_verify_data_mountpoint: "{{ step_ca_cert_verify_data_volume.volume.Mountpoint }}"

    # --- roles/openbao's own fix, not this role's -----------------------
    # Confirmed here rather than skipped just because it's a different
    # role's fix: this role's own issuance/restart tasks would silently
    # succeed even if that chown had failed, since nothing here touches
    # the data volume. The actual proof that fix works is openbao
    # itself reaching a running state at all (below), but checking the
    # ownership directly catches a regression here even if some other
    # change later made openbao tolerate a root-owned data dir some
    # other way.
    - name: Confirm the data volume is owned by the openbao user, not root
      ansible.builtin.stat:
        path: "{{ step_ca_cert_verify_data_mountpoint }}"
      register: step_ca_cert_verify_data_owner
      failed_when: step_ca_cert_verify_data_owner.stat.uid | string != step_ca_cert_verify_openbao_uid.stdout | trim

    # --- this role's own issuance --------------------------------------
    - name: Confirm the cert files actually exist
      ansible.builtin.stat:
        path: "{{ step_ca_cert_verify_certs_mountpoint }}/{{ item }}"
      register: step_ca_cert_verify_files
      loop:
        - fullchain.pem
        - privkey.pem
      failed_when: not step_ca_cert_verify_files.stat.exists

    - name: Confirm the cert's SANs cover both the bare name and the FQDN
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ step_ca_cert_verify_certs_mountpoint }}/fullchain.pem"
          - -noout
          - -ext
          - subjectAltName
      register: step_ca_cert_verify_sans
      changed_when: false
      failed_when: >-
        'DNS:openbao' not in step_ca_cert_verify_sans.stdout
        or 'DNS:openbao.sec.lan.molecule.test' not in step_ca_cert_verify_sans.stdout

    # `step ca certificate` runs --user root, so without the follow-up
    # chown these would be root-owned and openbao's own non-root process
    # couldn't read privkey.pem at all — which "openbao actually
    # recovered" below would also have caught, but this pins down the
    # specific fix.
    - name: Confirm the issued cert is owned by the openbao user, not root
      ansible.builtin.stat:
        path: "{{ step_ca_cert_verify_certs_mountpoint }}/privkey.pem"
      register: step_ca_cert_verify_privkey_owner
      failed_when: step_ca_cert_verify_privkey_owner.stat.uid | string != step_ca_cert_verify_openbao_uid.stdout | trim

    - name: Confirm openbao actually recovered from its cold-volume crash loop
      community.docker.docker_container_info:
        name: openbao
      register: step_ca_cert_verify_openbao_info
      failed_when: step_ca_cert_verify_openbao_info.container.State.Status != 'running'
      # Not asserting on State.Health here: this scenario never runs
      # `bao operator init`, so the healthcheck (`bao status`) is
      # expected to report unhealthy the whole time — see
      # docs/openbao.md's healthcheck section. "running" is the actual
      # claim this task tests (recovered from the crash loop), not
      # "healthy".

    - name: Confirm the renewal timer is enabled and active
      ansible.builtin.systemd_service:
        name: cert-renewer@openbao.timer
      register: step_ca_cert_verify_timer_info
      failed_when: >-
        step_ca_cert_verify_timer_info.status.UnitFileState != 'enabled'
        or step_ca_cert_verify_timer_info.status.ActiveState != 'active'

    - name: Confirm the rendered env file carries openbao's signal/chown shape
      ansible.builtin.slurp:
        path: /etc/cert-renewer/openbao.env
      register: step_ca_cert_verify_env_raw

    - name: Assert on the rendered env file's content
      ansible.builtin.assert:
        that:
          - "'RENEW_ACTION=signal' in (step_ca_cert_verify_env_raw.content | b64decode)"
          - "'CHOWN_IMAGE=openbao/openbao:2.6.2' in (step_ca_cert_verify_env_raw.content | b64decode)"
          - "'CHOWN_USER=openbao' in (step_ca_cert_verify_env_raw.content | b64decode)"
        fail_msg: "Rendered env: {{ step_ca_cert_verify_env_raw.content | b64decode }}"

    # --- renewal side effects -------------------------------------------
    # Same shape as default's own verify.yml: run the exact
    # commands ExecStart/ExecStartPost would run, directly, rather than
    # going through systemd's own ExecCondition gating (that's
    # renewal_timing's job, not duplicated here).
    - name: Record the cert's serial number before a direct renewal
      ansible.builtin.command: openssl x509 -in {{ step_ca_cert_verify_certs_mountpoint }}/fullchain.pem -noout -serial
      register: step_ca_cert_verify_serial_before
      changed_when: false

    - name: Run the exact renewal command ExecStart would run
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - root
          - --network
          - caddy-proxy
          - -v
          - openbao_certs:/certs
          - -v
          - /etc/step-ca/root_ca.crt:/root_ca.crt:ro
          - "{{ step_ca_cert_role_defaults.step_ca_cert_step_cli_image }}"
          - step
          - ca
          - renew
          - --force
          - --ca-url
          - "{{ step_ca_cert_step_ca_url }}"
          - --root
          - /root_ca.crt
          - /certs/fullchain.pem
          - /certs/privkey.pem
      changed_when: true

    - name: Record the cert's serial number after
      ansible.builtin.command: openssl x509 -in {{ step_ca_cert_verify_certs_mountpoint }}/fullchain.pem -noout -serial
      register: step_ca_cert_verify_serial_after
      changed_when: false
      failed_when: step_ca_cert_verify_serial_after.stdout == step_ca_cert_verify_serial_before.stdout

    # NOT asserting privkey.pem is root-owned here between renew and the
    # chown line, despite `step ca renew` also running --user root:
    # `step` overwrites the existing file in place rather than
    # recreating it, and overwriting content doesn't change a file's
    # ownership on Unix, only chown() does. So the file stays owned by
    # whatever the previous chown already left it as (`openbao`)
    # throughout renewal — unlike initial issuance, which genuinely
    # creates a new file and is root-owned until this role's issuance
    # task chowns it. The chown line below is still correct and still
    # needed regardless (chowning an already-correct owner is a
    # harmless no-op).

    # Runs the literal ExecStartPost= line from the rendered unit,
    # sourcing openbao's actual /etc/cert-renewer/openbao.env the way
    # systemd's own EnvironmentFile= would — not a hand-typed
    # approximation of it.
    - name: Run the real chown ExecStartPost= line for this instance
      ansible.builtin.shell: |
        set -a
        . /etc/cert-renewer/openbao.env
        set +a
        [ -z "${CHOWN_IMAGE}" ] || /usr/bin/docker run --rm --user root -v openbao_certs:/certs "${CHOWN_IMAGE}" chown -R "${CHOWN_USER}:${CHOWN_USER}" /certs
      args:
        executable: /bin/bash
      changed_when: true

    - name: Confirm the renewed cert is handed back to the openbao user
      ansible.builtin.stat:
        path: "{{ step_ca_cert_verify_certs_mountpoint }}/privkey.pem"
      register: step_ca_cert_verify_privkey_owner_final
      failed_when: step_ca_cert_verify_privkey_owner_final.stat.uid | string != step_ca_cert_verify_openbao_uid.stdout | trim

    - name: Confirm the rendered unit's ExecStartPost= lines are the generic, env-driven form
      ansible.builtin.command: systemctl cat cert-renewer@openbao.service  # noqa: command-instead-of-module
      register: step_ca_cert_verify_unit_content
      changed_when: false
      failed_when: >-
        '[ -z "${CHOWN_IMAGE}" ]' not in step_ca_cert_verify_unit_content.stdout
        or 'if [ "${RENEW_ACTION}" = "signal" ]' not in step_ca_cert_verify_unit_content.stdout
        or 'EnvironmentFile=/etc/cert-renewer/%i.env' not in step_ca_cert_verify_unit_content.stdout

    # --- SIGHUP reload, not a restart (see docs/openbao.md for the
    # citations this relies on) -------------------------------------
    # Two separate claims, both worth proving directly rather than
    # trusting the docs alone:
    #   1. openbao does NOT restart (unlike RENEW_ACTION=restart, which
    #      is what default's own scenario exercises for lldap).
    #   2. The TLS listener actually serves the renewed cert afterwards
    #      — not just that the file on disk changed, which the chown
    #      checks above already cover.
    - name: Record openbao's start time before the exact ExecStartPost command runs
      community.docker.docker_container_info:
        name: openbao
      register: step_ca_cert_verify_restart_before

    - name: Run the exact command ExecStartPost would run for RENEW_ACTION=signal
      ansible.builtin.command: docker kill --signal=HUP openbao
      changed_when: true

    - name: Record openbao's start time after
      community.docker.docker_container_info:
        name: openbao
      register: step_ca_cert_verify_restart_after

    - name: Confirm openbao did NOT restart (SIGHUP reloads in place, doesn't reseal)
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_restart_after.container.State.StartedAt == step_ca_cert_verify_restart_before.container.State.StartedAt
          - step_ca_cert_verify_restart_after.container.State.Status == 'running'
        fail_msg: >-
          openbao's StartedAt changed after a SIGHUP
          ({{ step_ca_cert_verify_restart_before.container.State.StartedAt }} ->
          {{ step_ca_cert_verify_restart_after.container.State.StartedAt }}) —
          dumb-init may not be forwarding the signal the way
          docs/openbao.md assumes it does.

    # A sealed/uninitialized OpenBao (this scenario never runs `bao
    # operator init`) still completes a TLS handshake — sealed only
    # affects the application-layer API, not the listener — so this can
    # confirm the in-memory served cert changed without needing a live
    # Vault. openssl s_client, not `bao status`: this is specifically a
    # transport-layer question, and s_client is what actually receives
    # the server's certificate independent of anything OpenBao's own
    # CLI does with it.
    #
    # 127.0.0.1, not the container name: this task runs directly on the
    # molecule instance's own shell, not inside a container joined to
    # caddy-proxy — Docker's embedded DNS only resolves a container's
    # name for other containers on the same network, not for the docker
    # host's own network namespace. compose.yaml.j2 publishes 8200 to
    # the host directly, so loopback reaches the same listener
    # regardless. -servername is unchanged (still openbao) — SNI, not
    # routing.
    - name: Fetch the cert currently served over the wire, after the SIGHUP
      ansible.builtin.shell: |
        set -o pipefail
        echo | openssl s_client -connect 127.0.0.1:8200 -servername openbao 2>&1 | openssl x509 -noout -serial
      args:
        executable: /bin/bash
      register: step_ca_cert_verify_served_serial
      changed_when: false
      failed_when: false

    - name: Confirm the serving listener actually picked up the renewed cert
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_served_serial.rc == 0
          - step_ca_cert_verify_served_serial.stdout | trim == step_ca_cert_verify_serial_after.stdout | trim
        fail_msg: >-
          Couldn't confirm the renewed cert is being served (rc={{ step_ca_cert_verify_served_serial.rc }}):
          stdout: {{ step_ca_cert_verify_served_serial.stdout }}
          stderr: {{ step_ca_cert_verify_served_serial.stderr }}
          Expected serial {{ step_ca_cert_verify_serial_after.stdout | trim }} — SIGHUP may not
          have actually reloaded the TLS listener's in-memory certificate,
          or the connection itself failed (see output above for which).

    # --- telegram-notify@ / uptime-kuma-push wiring ----------------------
    # Same shape as default's own verify.yml — see its comments
    # for the full rationale (no live Telegram/Kuma network access here,
    # this confirms the units load and run cleanly, not real delivery).
    - name: Read back telegram-notify's rendered env file
      ansible.builtin.slurp:
        path: /etc/telegram-notify/telegram-notify@.env
      register: step_ca_cert_verify_notify_env_raw

    - name: Confirm it carries the scenario's dummy bot credentials, not empty/template-literal values
      ansible.builtin.assert:
        that:
          - "'TELEGRAM_TOKEN=molecule-dummy-telegram-token' in (step_ca_cert_verify_notify_env_raw.content | b64decode)"
          - "'TELEGRAM_CHAT_ID=molecule-dummy-chat-id' in (step_ca_cert_verify_notify_env_raw.content | b64decode)"

    - name: Confirm cert-renewer@ actually declares both links  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl cat cert-renewer@openbao.service
      register: step_ca_cert_verify_onfailure
      changed_when: false
      failed_when: >-
        'OnFailure=telegram-notify@%i.service' not in step_ca_cert_verify_onfailure.stdout
        or 'OnSuccess=uptime-kuma-push-cert-renewer-%i.service' not in step_ca_cert_verify_onfailure.stdout

    - name: Start telegram-notify@openbao.service directly, as OnFailure= would  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start telegram-notify@openbao.service
      failed_when: false
      changed_when: false

    - name: Query the unit's actual state (not via raw systemctl show, whose multi-property output order isn't guaranteed — see systemd/systemd#28205)
      ansible.builtin.systemd_service:
        name: telegram-notify@openbao.service
        daemon_reload: false
      register: step_ca_cert_verify_notify_state

    - name: Confirm systemd actually loaded and ran the unit (not a syntax/templating error)
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_notify_state.status.LoadState == 'loaded'
          - step_ca_cert_verify_notify_state.status.ActiveState in ['inactive', 'failed']
        fail_msg: >-
          telegram-notify@openbao.service didn't load/run cleanly:
          LoadState={{ step_ca_cert_verify_notify_state.status.LoadState | default('?') }}
          ActiveState={{ step_ca_cert_verify_notify_state.status.ActiveState | default('?') }}
          — 'failed' here just means curl couldn't reach the real API
          (expected in CI), 'not-found' or 'masked' would mean the unit
          itself is broken.

    - name: Read back uptime-kuma-push-cert-renewer-openbao's rendered env file
      ansible.builtin.slurp:
        path: /etc/uptime-kuma-push/uptime-kuma-push-cert-renewer-openbao.env
      register: step_ca_cert_verify_push_env_raw

    - name: Confirm it renders an empty URL (this scenario's step_ca_cert_uptime_kuma_push_url is blank)
      ansible.builtin.assert:
        that:
          - (step_ca_cert_verify_push_env_raw.content | b64decode | trim) == 'UPTIME_KUMA_PUSH_URL='
        fail_msg: "Rendered env: {{ step_ca_cert_verify_push_env_raw.content | b64decode }}"

    - name: Start uptime-kuma-push-cert-renewer-openbao.service directly, as OnSuccess= would  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl start uptime-kuma-push-cert-renewer-openbao.service
      failed_when: false
      changed_when: false

    - name: Query the pusher unit's actual state
      ansible.builtin.systemd_service:
        name: uptime-kuma-push-cert-renewer-openbao.service
        daemon_reload: false
      register: step_ca_cert_verify_push_state

    - name: Confirm systemd actually loaded and ran the pusher unit (not a syntax/templating error)
      ansible.builtin.assert:
        that:
          - step_ca_cert_verify_push_state.status.LoadState == 'loaded'
          - step_ca_cert_verify_push_state.status.ActiveState in ['inactive', 'failed']
        fail_msg: >-
          uptime-kuma-push-cert-renewer-openbao.service didn't load/run cleanly:
          LoadState={{ step_ca_cert_verify_push_state.status.LoadState | default('?') }}
          ActiveState={{ step_ca_cert_verify_push_state.status.ActiveState | default('?') }}
          — 'failed' here just means curl had no URL to hit (expected in
          CI with a blank push URL), 'not-found' or 'masked' would mean
          the unit itself is broken.
