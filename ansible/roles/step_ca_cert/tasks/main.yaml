---
# Issues a per-app cert from step-ca (replacing certbot's DNS-01
# lifecycle) and installs the systemd renewal timer for it. Expects
# step_ca_client to have already run in this play (caches step-ca's
# root cert to a host path - see its own tasks/main.yaml).
#
# Two separate concerns, deliberately not merged into one command:
#   1. Initial issuance (this role, Ansible-run, once) - needs the JWK
#      provisioner password, since there's no existing cert yet to
#      authenticate with.
#   2. Ongoing renewal (systemd, host-level, forever after) - uses mTLS
#      against the cert this role just issued, so it never touches the
#      provisioner password at all. See docs/topics/services/step-ca.md.

- name: "Issue the app's first cert, if it has none: {{ step_ca_cert_app_name }}"
  ansible.builtin.include_tasks: issue.yaml

# The units below notify a handler that only exists once its role has
# loaded; see systemd_reload/tasks/reload.yaml.
- name: Load the shared Reload systemd handler
  ansible.builtin.include_role:
    name: systemd_reload

- name: Install Telegram alerting for cert-renewal failures
  ansible.builtin.include_role:
    name: telegram_notify
    tasks_from: install.yaml
  vars:
    telegram_notify_unit_name: "telegram-notify@"
    telegram_notify_description: "Telegram alert for a failed certificate renewal (%i)"
    telegram_notify_message: "Certificate renewal failed for `%i` on `{{ ansible_facts['hostname'] }}`"
    telegram_notify_topic_id: "{{ step_ca_cert_telegram_topic_id }}"

# The liveness push (cert-renewer-heartbeat@) starts this unit, on success only;
# failure alerting stays on the telegram_notify@ unit above, unchanged.
- name: "Install the Gatus push unit for this app's cert renewer liveness: {{ step_ca_cert_app_name }}"
  ansible.builtin.include_role:
    name: gatus_push
    tasks_from: install.yaml
  vars:
    gatus_push_job: "cert-renewer-{{ step_ca_cert_app_name }}"

- name: Ensure the cert-renewer env directory exists
  ansible.builtin.file:
    path: /etc/cert-renewer
    state: directory
    mode: "0755"

# Per-instance values (RENEW_ACTION, CHOWN_IMAGE/USER, etc.) live here,
# not in the shared unit template below - a content change here needs
# no daemon-reload, since systemd reads EnvironmentFile fresh on every
# activation rather than caching it the way unit *file* content is
# cached. Don't add a `notify: Reload systemd` here on the assumption
# it's needed; it isn't, and doing so would just tie env-only changes to
# a slower reload/flush cycle for no reason.
- name: "Render the cert-renewer env file for: {{ step_ca_cert_app_name }}"
  ansible.builtin.template:
    src: cert-renewer.env.j2
    dest: "/etc/cert-renewer/{{ step_ca_cert_app_name }}.env"
    mode: "0644"

# Content is identical regardless of which app's step_ca_cert instance
# renders it - every per-app value now lives in that app's own
# /etc/cert-renewer/<app>.env, not here - so unlike the old
# lldap_cert/openbao_cert split there's no "whichever role's copy is
# installed last wins" ambiguity to guard against.
- name: Install the generic cert-renewer@ service template
  ansible.builtin.template:
    src: cert-renewer@.service.j2
    dest: /etc/systemd/system/cert-renewer@.service
    mode: "0644"
  notify: Reload systemd

- name: Install the generic cert-renewer@ timer template
  ansible.builtin.template:
    src: cert-renewer@.timer.j2
    dest: /etc/systemd/system/cert-renewer@.timer
    mode: "0644"
  notify: Reload systemd

- name: Install the generic cert-renewer-heartbeat@ service template
  ansible.builtin.template:
    src: cert-renewer-heartbeat@.service.j2
    dest: /etc/systemd/system/cert-renewer-heartbeat@.service
    mode: "0644"
  notify: Reload systemd

- name: Install the generic cert-renewer-heartbeat@ timer template
  ansible.builtin.template:
    src: cert-renewer-heartbeat@.timer.j2
    dest: /etc/systemd/system/cert-renewer-heartbeat@.timer
    mode: "0644"
  notify: Reload systemd

- name: Reload systemd and flush handlers so systemd has the current unit definitions
  ansible.builtin.include_role:
    name: systemd_reload
    tasks_from: reload.yaml
  vars:
    systemd_reload_gatus: true

- name: "Enable and start the renewal timer for: {{ step_ca_cert_app_name }}"
  ansible.builtin.systemd:
    name: "cert-renewer@{{ step_ca_cert_app_name }}.timer"
    state: started
    enabled: true

- name: "Enable and start the renewal liveness timer for: {{ step_ca_cert_app_name }}"
  ansible.builtin.systemd:
    name: "cert-renewer-heartbeat@{{ step_ca_cert_app_name }}.timer"
    state: started
    enabled: true
