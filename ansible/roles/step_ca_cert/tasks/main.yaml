---
# Issues a per-app cert from step-ca (replacing certbot's DNS-01
# lifecycle) and installs the systemd renewal timer for it. Expects
# step_ca_client to have already run in this play (caches step-ca's
# root cert to a host path - see its own tasks/main.yaml).
#
# Two separate concerns, deliberately not merged into one command:
#   1. Initial issuance (this role, Ansible-run, once) - needs the JWK
#      provisioner password, since there's no existing cert yet to
#      authenticate with.
#   2. Ongoing renewal (systemd, host-level, forever after) - uses mTLS
#      against the cert this role just issued, so it never touches the
#      provisioner password at all. See docs/topics/services/step-ca.md.

- name: "Confirm the app is actually running before touching its cert volume: {{ step_ca_cert_app_name }}"
  community.docker.docker_container_info:
    name: "{{ step_ca_cert_container_name }}"
  register: step_ca_cert_container_info

- name: "Fail loudly if this app isn't running yet: {{ step_ca_cert_app_name }}"
  ansible.builtin.fail:
    msg: >-
      No running "{{ step_ca_cert_container_name }}" container found on
      this host — step_ca_cert must run after {{ step_ca_cert_app_name }}'s
      own compose deploy (see deploy.yaml's Play ordering).
  when: not step_ca_cert_container_info.exists

# Checked inside the already-running container itself rather than
# resolving the volume's host path - avoids needing that resolution at
# all now that issuance itself mounts the volume directly by name
# (below), not by host path.
- name: Check whether a cert has already been issued
  community.docker.docker_container_exec:
    container: "{{ step_ca_cert_container_name }}"
    command: "test -f {{ step_ca_cert_container_cert_dir }}/fullchain.pem"
  register: step_ca_cert_existing_cert
  changed_when: false
  failed_when: false

# Issuance below only runs when no cert exists, so a change to the
# requested names never reaches a cert that's already there. Read the
# issued cert's names and fail on any difference instead of leaving the
# old cert in place under the new configuration. Nothing is reissued
# here: a reissue restarts the app, which the operator should choose.
# Same read-only root mount as the renewal unit's ExecCondition.
- name: "Read the names on the already-issued cert: {{ step_ca_cert_app_name }}"
  community.docker.docker_container:
    name: "step-ca-cert-inspect-{{ step_ca_cert_app_name }}"
    image: "{{ step_ca_cert_step_cli_image }}"
    user: root
    volumes:
      - "{{ step_ca_cert_certs_volume_name }}:/certs:ro"
    command:
      - step
      - certificate
      - inspect
      - /certs/fullchain.pem
      - --format
      - json
    detach: false
    cleanup: true
    # `container.Output` below is a placeholder string on any driver
    # other than json-file, same as roles/openbao's own read of it.
    log_driver: json-file
  register: step_ca_cert_inspect_result
  changed_when: false
  check_mode: false
  when: step_ca_cert_existing_cert.rc | default(1) == 0

# step's `names` is the cert's DNS and IP SANs (the CN only if it's
# also a SAN; emails aren't included). Must match the two --san values
# passed to `step ca certificate` in the issuance block below.
- name: "Compare the issued names to the requested names: {{ step_ca_cert_app_name }}"
  ansible.builtin.set_fact:
    step_ca_cert_issued_names: "{{ (step_ca_cert_inspect_result.container.Output | from_json).names | sort }}"
    step_ca_cert_requested_names: "{{ [step_ca_cert_common_name, step_ca_cert_common_name ~ '.' ~ caddy_domain] | sort }}"
  when: step_ca_cert_existing_cert.rc | default(1) == 0

- name: "Fail loudly if the issued cert's names differ from the requested ones: {{ step_ca_cert_app_name }}"
  ansible.builtin.fail:
    msg: >-
      The cert already issued for {{ step_ca_cert_app_name }}
      (volume {{ step_ca_cert_certs_volume_name }}) covers
      {{ step_ca_cert_issued_names }}, but this role now requests
      {{ step_ca_cert_requested_names }}. This role only issues a cert when
      none exists, so it will not pick up the change on its own. Nothing was
      changed.

      To reissue on purpose, remove the cert file and re-run this deploy:

      ansible-playbook volume-file-rm.yaml
      --limit {{ inventory_hostname }},localhost
      -e volume_rm_app={{ step_ca_cert_app_name }}
      -e volume_rm_volume={{ step_ca_cert_certs_volume_name | regex_replace('^' ~ step_ca_cert_app_name ~ '_', '') }}
      -e '{"volume_rm_paths": ["fullchain.pem"]}'
      -e volume_rm_confirm=true -e volume_rm_stop_app=false

      The reissue restarts {{ step_ca_cert_app_name }} (an OpenBao restart
      leaves it sealed, see docs/topics/secrets/openbao.md). If the requested names are the
      mistake, revert the change instead.
  when:
    - step_ca_cert_existing_cert.rc | default(1) == 0
    - step_ca_cert_issued_names != step_ca_cert_requested_names

# Ongoing renewal is the systemd timer's job from here on (installed
# unconditionally below, regardless of this block) - this only ever
# runs once, on a genuinely empty certs volume.
- name: "Issue the initial cert [block / always] for: {{ step_ca_cert_app_name }}"
  when: step_ca_cert_existing_cert.rc | default(1) != 0
  block:
    - name: Render the provisioner password to a scratch file
      ansible.builtin.copy:
        dest: "/tmp/{{ step_ca_cert_app_name }}-cert-provisioner-password"
        content: "{{ step_ca_provisioner_password }}"
        mode: "0600"
      no_log: true

    # --user root: the certs volume is freshly created (no prior owner
    # set on its root dir), and smallstep/step-cli's default non-root
    # user can't write new files into a directory it doesn't own.
    # Simpler and more certain than trying to pre-chown a volume to
    # match the image's exact uid.
    - name: Request the initial cert from step-ca
      community.docker.docker_container:
        name: "step-ca-cert-issue-{{ step_ca_cert_app_name }}"
        image: "{{ step_ca_cert_step_cli_image }}"
        user: root
        networks:
          - name: "{{ step_ca_cert_network_name }}"
        volumes:
          - "{{ step_ca_cert_certs_volume_name }}:/certs"
          - "/tmp/{{ step_ca_cert_app_name }}-cert-provisioner-password:/tmp/provisioner_password:ro"
          - "{{ step_ca_client_root_cert_path }}:/root_ca.crt:ro"
        command:
          - step
          - ca
          - certificate
          - "{{ step_ca_cert_common_name }}"
          - /certs/fullchain.pem
          - /certs/privkey.pem
          # Keep in sync with step_ca_cert_requested_names above.
          - --san
          - "{{ step_ca_cert_common_name }}"
          - --san
          - "{{ step_ca_cert_common_name }}.{{ caddy_domain }}"
          - --provisioner
          - "{{ step_ca_provisioner_name }}"
          - --password-file
          - /tmp/provisioner_password
          - --ca-url
          - "{{ step_ca_cert_step_ca_url }}"
          - --root
          - /root_ca.crt
          - --force
        detach: false
        cleanup: true
        # Docker's own default driver is json-file (confirmed in
        # community.docker.docker_container's own log_driver doc) —
        # pinned explicitly so a real failure's `.msg` (below) carries
        # step-cli's actual error instead of a driver placeholder.
        log_driver: json-file
      register: step_ca_cert_issue_result
      until: step_ca_cert_issue_result.status == 0
      # step-ca may not have finished its own first-boot init yet (no
      # health-wait exists between Play 4's `docker compose up -d` and
      # this play — see compose/tasks/deploy.yaml). `cleanup: true`
      # with `detach: false` removes the container after each attempt
      # regardless of exit code (confirmed in the module's own
      # `container_start()`: cleanup runs before the exit-code check),
      # the same guarantee `docker run --rm` gave, so retrying is safe.
      retries: 5
      delay: 10
      changed_when: true

    # Blank step_ca_cert_chown_image (the default) makes this a no-op -
    # correct for an app that manages its own UID/GID instead of
    # relying on its image's own non-root user (e.g. lldap, via
    # LLDAP_UID/GID). Uses step_ca_cert_chown_image (not
    # step_ca_cert_step_cli_image) only to resolve the target
    # username via that image's own /etc/passwd, not to run the app
    # itself.
    - name: Hand the issued cert back to its owning user so the app can read it
      community.docker.docker_container:
        name: "step-ca-cert-chown-{{ step_ca_cert_app_name }}"
        image: "{{ step_ca_cert_chown_image }}"
        user: root
        volumes:
          - "{{ step_ca_cert_certs_volume_name }}:/certs"
        command:
          - chown
          - -R
          - "{{ step_ca_cert_chown_user }}:{{ step_ca_cert_chown_user }}"
          - /certs
        detach: false
        cleanup: true
      when: step_ca_cert_chown_image | length > 0
      changed_when: true

    - name: "Restart the app so it picks up the new cert: {{ step_ca_cert_app_name }}"
      community.docker.docker_compose_v2:
        project_src: "{{ compose_deploy_dir }}/{{ step_ca_cert_app_name }}"
        state: restarted
  always:
    - name: Remove the scratch provisioner password file
      ansible.builtin.file:
        path: "/tmp/{{ step_ca_cert_app_name }}-cert-provisioner-password"
        state: absent

# The units below notify a handler that only exists once its role has
# loaded; see systemd_reload/tasks/reload.yaml.
- name: Load the shared Reload systemd handler
  ansible.builtin.include_role:
    name: systemd_reload

- name: Install Telegram alerting for cert-renewal failures
  ansible.builtin.include_role:
    name: telegram_notify
    tasks_from: install.yaml
  vars:
    telegram_notify_unit_name: "telegram-notify@"
    telegram_notify_description: "Telegram alert for a failed certificate renewal (%i)"
    telegram_notify_message: "Certificate renewal failed for `%i` on `{{ ansible_facts['hostname'] }}`"
    telegram_notify_topic_id: "{{ step_ca_cert_telegram_topic_id }}"

# Only ever pushes on success (see docs/topics/monitoring/uptime-kuma.md) — failure
# alerting stays on the telegram_notify@ unit above, unchanged. A
# concrete unit for this specific instance, not a template - see
# cert-renewer@.service.j2's own OnSuccess= comment for why a per-
# instance push URL can't share telegram_notify@'s one-shared-unit
# approach.
- name: "Install the Uptime Kuma push-on-success unit for this app's cert renewal: {{ step_ca_cert_app_name }}"
  ansible.builtin.include_role:
    name: uptime_kuma_push
    tasks_from: install.yaml
  vars:
    uptime_kuma_push_unit_name: "uptime-kuma-push-cert-renewer-{{ step_ca_cert_app_name }}"
    uptime_kuma_push_description: "Uptime Kuma liveness push for a successful {{ step_ca_cert_app_name }} cert renewal"
    uptime_kuma_push_url: "{{ step_ca_cert_uptime_kuma_push_url }}"

- name: Ensure the cert-renewer env directory exists
  ansible.builtin.file:
    path: /etc/cert-renewer
    state: directory
    mode: "0755"

# Per-instance values (RENEW_ACTION, CHOWN_IMAGE/USER, etc.) live here,
# not in the shared unit template below - a content change here needs
# no daemon-reload, since systemd reads EnvironmentFile fresh on every
# activation rather than caching it the way unit *file* content is
# cached. Don't add a `notify: Reload systemd` here on the assumption
# it's needed; it isn't, and doing so would just tie env-only changes to
# a slower reload/flush cycle for no reason.
- name: "Render the cert-renewer env file for: {{ step_ca_cert_app_name }}"
  ansible.builtin.template:
    src: cert-renewer.env.j2
    dest: "/etc/cert-renewer/{{ step_ca_cert_app_name }}.env"
    mode: "0644"

# Content is identical regardless of which app's step_ca_cert instance
# renders it - every per-app value now lives in that app's own
# /etc/cert-renewer/<app>.env, not here - so unlike the old
# lldap_cert/openbao_cert split there's no "whichever role's copy is
# installed last wins" ambiguity to guard against.
- name: Install the generic cert-renewer@ service template
  ansible.builtin.template:
    src: cert-renewer@.service.j2
    dest: /etc/systemd/system/cert-renewer@.service
    mode: "0644"
  notify: Reload systemd

- name: Install the generic cert-renewer@ timer template
  ansible.builtin.template:
    src: cert-renewer@.timer.j2
    dest: /etc/systemd/system/cert-renewer@.timer
    mode: "0644"
  notify: Reload systemd

- name: Reload systemd and flush handlers so systemd has the current unit definitions
  ansible.builtin.include_role:
    name: systemd_reload
    tasks_from: reload.yaml
  vars:
    systemd_reload_uptime_kuma: true

- name: "Enable and start the renewal timer for: {{ step_ca_cert_app_name }}"
  ansible.builtin.systemd:
    name: "cert-renewer@{{ step_ca_cert_app_name }}.timer"
    state: started
    enabled: true
