---
# The client binary every task calls. Molecule points it at a stub.
tailscale_node_cli: /usr/bin/tailscale

# Where tailscaled keeps its login. A client that cannot reach its daemon is read
# as joined when this file exists, and the role reads the login again once the
# service is up.
tailscale_node_state_file: /var/lib/tailscale/tailscaled.state

# Canonical CIDRs, the form the node reports them in. An empty list is a
# node that advertises nothing.
tailscale_node_advertise_routes: []

tailscale_node_accept_dns: true

# Only used to join a logged-out node, and required then. The key is
# single-use and pre-authorized; the play supplies it at run time.
tailscale_node_tag: ""
tailscale_node_authkey: ""

# The fingerprint of the key that signs Tailscale's apt repository. The role
# stops when the downloaded key is any other, or holds more than this one.
tailscale_node_apt_key_fingerprint: 2596A99EAAB33821893C0A79458CA832957F5868
