---
# The role installs Tailscale and starts tailscaled, so this needs systemd as
# PID 1 in a privileged container with /sys/fs/cgroup exposed, the same
# platform shape as the docker role's scenario. The join and the preference
# comparison run against a stub client (molecule/default/files), because they need a
# control plane.
driver:
  name: docker
platforms:
  - name: tailscale-node-client-node
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    command: /lib/systemd/systemd
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
