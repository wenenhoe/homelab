---
- name: Prepare
  hosts: all
  become: true
  vars:
    tailscale_node_stub_state:
      logged_in: false
      prefs:
        CorpDNS: true
        RunSSH: false
        RunWebClient: false
        WantRunning: true
        AdvertiseRoutes: null
        AdvertiseServices: null
        AutoUpdate:
          Check: true
          Apply: true
  tasks:
    - name: Reset coverage data from any previous test run
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: reset_coverage_data.yaml

    # What a node leaves behind when it stops advertising routes.
    - name: Leave a forwarding drop-in from an earlier run
      ansible.builtin.copy:
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
        dest: /etc/sysctl.d/99-tailscale.conf
        owner: root
        group: root
        mode: "0644"

    - name: Turn forwarding on
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1
      changed_when: true

    - name: Install the stub client
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/default/files/tailscale-stub.py"
        dest: /usr/local/bin/tailscale-stub
        owner: root
        group: root
        mode: "0755"

    - name: Create the stub's state directory
      ansible.builtin.file:
        path: /var/lib/tailscale-stub
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The preferences recorded for VM 202 in docs/topics/infra/network-infra.md,
    # with the advertised routes the scenario starts from.
    - name: Seed the stub's state
      ansible.builtin.copy:
        content: "{{ tailscale_node_stub_state | to_json }}"
        dest: /var/lib/tailscale-stub/state.json
        owner: root
        group: root
        mode: "0644"
