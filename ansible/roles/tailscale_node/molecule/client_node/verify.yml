---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    tailscale_node_verify_state: "{{ tailscale_node_verify_state_raw.content | b64decode | from_json }}"
    tailscale_node_verify_calls: "{{ tailscale_node_verify_calls_raw.content | b64decode | split('\n') | select | list }}"
  tasks:
    - name: Stat the forwarding drop-in
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-tailscale.conf
      register: tailscale_node_verify_dropin

    - name: Read the live forwarding values
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward net.ipv6.conf.all.forwarding
      register: tailscale_node_verify_forwarding
      changed_when: false

    - name: Read the stub client's state
      ansible.builtin.slurp:
        src: /var/lib/tailscale-stub/state.json
      register: tailscale_node_verify_state_raw

    - name: Read the stub client's call log
      ansible.builtin.slurp:
        src: /var/lib/tailscale-stub/calls.log
      register: tailscale_node_verify_calls_raw

    # A node that advertises nothing keeps no forwarding drop-in, from an
    # earlier run or otherwise, and forwards nothing; it is not told to
    # advertise anything, and only the DNS setting and the updater differ from
    # what it reports.
    - name: Assert the node holds the role's preferences and set nothing else
      ansible.builtin.assert:
        that:
          - not tailscale_node_verify_dropin.stat.exists
          - tailscale_node_verify_forwarding.stdout_lines == ['0', '0']
          - tailscale_node_verify_state.logged_in
          - tailscale_node_verify_state.prefs.AdvertiseRoutes is none
          - not tailscale_node_verify_state.prefs.CorpDNS
          - tailscale_node_verify_state.prefs.AutoUpdate.Apply == false
          - tailscale_node_verify_calls | select('match', '^set ') | list == ['set accept-dns auto-update']

    # grep exits 1 when nothing matches, which is the pass. The command module
    # logs its own arguments to syslog, so the pattern's last character is a
    # bracket expression: the logged command line does not match the pattern.
    - name: Search the host's configuration, state and logs for the join key
      ansible.builtin.command: >-
        grep -rIlEs --exclude-dir=.ansible molecule-one-time-ke[y] /etc /var/lib /var/log /root /tmp /usr/local
      register: tailscale_node_verify_key_search
      changed_when: false
      failed_when: tailscale_node_verify_key_search.rc != 1
