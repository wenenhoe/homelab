---
- name: Prepare
  hosts: all
  become: true
  vars:
    tailscale_node_stub_state:
      logged_in: true
      # The first status read fails as it does when the daemon is not running;
      # the stub answers from the second one on.
      unreachable_reads: 1
      prefs:
        CorpDNS: true
        RunSSH: false
        RunWebClient: false
        WantRunning: true
        AdvertiseRoutes: ["192.168.20.0/24"]
        AdvertiseServices: null
        AutoUpdate:
          Check: true
          Apply: true
  tasks:
    - name: Reset coverage data from any previous test run
      ansible.builtin.include_role:
        name: molecule_helpers
        tasks_from: reset_coverage_data.yaml

    - name: Install the stub client
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/default/files/tailscale-stub.py"
        dest: /usr/local/bin/tailscale-stub
        owner: root
        group: root
        mode: "0755"

    - name: Create the stub's state directory
      ansible.builtin.file:
        path: /var/lib/tailscale-stub
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The preferences recorded for VM 202 in docs/topics/infra/network-infra.md,
    # with the advertised routes the scenario starts from.
    - name: Seed the stub's state
      ansible.builtin.copy:
        content: "{{ tailscale_node_stub_state | to_json }}"
        dest: /var/lib/tailscale-stub/state.json
        owner: root
        group: root
        mode: "0644"

    # What a node that once logged in has on disk while its daemon is down.
    - name: Create the daemon's state directory
      ansible.builtin.file:
        path: /var/lib/tailscale
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Leave the login the daemon stored
      ansible.builtin.copy:
        content: "{}"
        dest: /var/lib/tailscale/tailscaled.state
        owner: root
        group: root
        mode: "0600"
