---
# Compared against what the node reports, not against what an earlier run
# typed, so a preference changed by hand is repaired and shows in --check.
- name: Read the node's preferences
  ansible.builtin.command:
    argv: ["{{ tailscale_node_cli }}", debug, prefs]
  register: tailscale_node_prefs_raw
  changed_when: false
  failed_when: false
  check_mode: false

# The client's auto-update is off on every node (ADR 0097), and an unset value
# is not off. Source NAT stays at the client's default.
- name: Work out which preferences differ
  ansible.builtin.set_fact:
    tailscale_node_set_flags: >-
      {{
        (['--advertise-routes=' ~ (tailscale_node_advertise_routes | join(','))]
          if (tailscale_node_prefs.AdvertiseRoutes | default([], true) | sort)
            != (tailscale_node_advertise_routes | sort)
          else [])
        + (['--accept-dns=' ~ (tailscale_node_accept_dns | string | lower)]
          if tailscale_node_prefs.CorpDNS | default(none) != tailscale_node_accept_dns
          else [])
        + (['--auto-update=false']
          if (tailscale_node_prefs.AutoUpdate | default({})).Apply | default(none) != false
          else [])
      }}
  vars:
    tailscale_node_prefs: "{{ tailscale_node_prefs_raw.stdout | default('{}', true) | from_json }}"

- name: Apply the preferences that differ
  ansible.builtin.command:
    argv: "{{ [tailscale_node_cli, 'set'] + tailscale_node_set_flags }}"
  when: tailscale_node_set_flags | length > 0
  changed_when: true

# A command task is skipped in a check run, which would hide drift.
- name: Report the preferences a check run would change
  ansible.builtin.debug:
    msg: "tailscale set {{ tailscale_node_set_flags | join(' ') }}"
  when: ansible_check_mode and tailscale_node_set_flags | length > 0
  changed_when: true
