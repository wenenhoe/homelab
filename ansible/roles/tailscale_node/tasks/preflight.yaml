---
# Read-only commands run in a check run too, so --check sees the node's real
# state. A missing client leaves stdout empty, which counts as logged out.
- name: Read the node's status
  ansible.builtin.command:
    argv: ["{{ tailscale_node_cli }}", status, --json]
  register: tailscale_node_status
  changed_when: false
  failed_when: false
  check_mode: false

# A client that cannot reach its daemon fails the same way whether the node is
# new or joined with tailscaled stopped (a crash, a failed upgrade). The daemon's
# state file tells them apart: a node that ever logged in has one.
- name: Look for the login the daemon stored
  ansible.builtin.stat:
    path: "{{ tailscale_node_state_file }}"
  register: tailscale_node_state
  when: tailscale_node_status.rc != 0
  check_mode: false

- name: Note a login that could only be read from the state file
  ansible.builtin.set_fact:
    tailscale_node_login_from_state_file: "{{ tailscale_node_status.rc != 0 and tailscale_node_state.stat.exists and tailscale_node_state.stat.size > 0 }}"

# Stopped is a node that ran `tailscale down`: it keeps its login.
- name: Work out whether the node is logged in
  ansible.builtin.set_fact:
    tailscale_node_logged_in: >-
      {{
        tailscale_node_login_from_state_file
        or (
          tailscale_node_status.rc == 0
          and (tailscale_node_status.stdout | from_json).BackendState | default('')
            in ['Running', 'Starting', 'Stopped', 'NeedsMachineAuth']
        )
      }}

- name: Require a join key for a logged-out node
  ansible.builtin.assert:
    that:
      - tailscale_node_authkey | length > 0
    quiet: true
    fail_msg: >-
      {{ inventory_hostname }} is logged out and tailscale_node_authkey is empty.
      Set TAILSCALE_AUTHKEY to a single-use, pre-authorized, tagged key.
  when: not tailscale_node_logged_in

- name: Require a tag for a logged-out node
  ansible.builtin.assert:
    that:
      - tailscale_node_tag | length > 0
    quiet: true
    fail_msg: >-
      {{ inventory_hostname }} is logged out and tailscale_node_tag is empty.
      A node joins tagged, never as a user's device.
  when: not tailscale_node_logged_in
