---
# Control-node-only: posts a static header message into a forum topic
# and pins it. Progress is recorded under ansible/files/telegram-pins/
# (gitignored, same convention as ansible/files/secrets/) so re-running
# neither posts a second header nor pins twice.
#
# Telegram's Bot API has no per-topic "is this already pinned" query -
# getChat only ever returns the whole chat's single most recent pinned
# message, not one per forum topic (core.telegram.org/bots/api,
# ChatFullInfo.pinned_message) - so the state file, not a live API
# check, is what makes this idempotent.
#
# State file <key>, one line:
#   "<message_id> unpinned"  sent, pin not yet confirmed - the next run
#                            pins it without posting again
#   "<message_id> pinned"    done
#   "<message_id>"           written before pin state was recorded; counts
#                            as pinned, so existing installs don't re-pin
#                            over whatever was pinned in the topic since
# Anything other than the literal word "unpinned" counts as pinned.
#
# Required vars (set by the including playbook - see
# ansible/playbooks/pin-telegram-topics.yaml):
#   telegram_topic_pins_key      short slug used as the state filename (e.g. "updates")
#   telegram_topic_pins_topic_id raw telegram_topic_id_* value for this topic
#   telegram_topic_pins_text     the header message text (legacy Markdown)

- name: Fail loudly if a required telegram_topic_pins_* var is missing
  ansible.builtin.assert:
    that:
      - telegram_topic_pins_key is defined
      - telegram_topic_pins_topic_id is defined
      - telegram_topic_pins_text is defined
    fail_msg: >-
      pin.yaml needs telegram_topic_pins_key, _topic_id, and _text all
      set by the including playbook - see
      ansible/playbooks/pin-telegram-topics.yaml.

- name: "Skip - no topic ID configured yet for {{ telegram_topic_pins_key }}"
  ansible.builtin.debug:
    msg: >-
      telegram_topic_id_{{ telegram_topic_pins_key }} is blank (Topics not
      set up for this concern yet, see docs/telegram-notifications.md) -
      nothing to pin.
  when: telegram_topic_pins_topic_id | length == 0

- name: Ensure the pin-state directory exists
  ansible.builtin.file:
    path: "{{ project_root }}/ansible/files/telegram-pins"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: telegram_topic_pins_topic_id | length > 0

# Two concurrent runs of this playbook against the same topic would
# otherwise both see the state file absent and both send/pin a header -
# mkdir is atomic (EEXIST on a second caller), so it doubles as a simple
# mutex without needing a separate flock binary. Released in `always:`
# below no matter how the block exits.
- name: "[block / always] Serialize concurrent runs against the same cache file for {{ telegram_topic_pins_key }}"
  when: telegram_topic_pins_topic_id | length > 0
  block:
    - name: "Acquire the pin-state lock for {{ telegram_topic_pins_key }}"
      ansible.builtin.command: >-
        mkdir {{ (project_root ~ '/ansible/files/telegram-pins/.lock-' ~ telegram_topic_pins_key) | quote }}
      register: telegram_topic_pins_lock
      delegate_to: localhost
      become: false
      changed_when: true
      until: telegram_topic_pins_lock.rc == 0
      retries: 30
      delay: 2

    - name: "Check whether the header was already sent for {{ telegram_topic_pins_key }}"
      ansible.builtin.stat:
        path: "{{ project_root }}/ansible/files/telegram-pins/{{ telegram_topic_pins_key }}"
      register: telegram_topic_pins_cache
      delegate_to: localhost
      become: false

    - name: "Post the header message for {{ telegram_topic_pins_key }}"
      ansible.builtin.uri:
        url: "{{ telegram_topic_pins_api_base }}/bot{{ telegram_token }}/sendMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_chat_id }}"
          message_thread_id: "{{ telegram_topic_pins_topic_id }}"
          text: "{{ telegram_topic_pins_text }}"
          parse_mode: Markdown
        status_code: 200
      register: telegram_topic_pins_send
      delegate_to: localhost
      become: false
      no_log: true
      when: not telegram_topic_pins_cache.stat.exists

    # Recorded before pinChatMessage runs, so a failed pin leaves a state
    # file that says "sent, not pinned" and the next run retries only the
    # pin.
    - name: "Record the sent message_id for {{ telegram_topic_pins_key }}"
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/telegram-pins/{{ telegram_topic_pins_key }}"
        content: "{{ telegram_topic_pins_send.json.result.message_id }} unpinned\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: not telegram_topic_pins_cache.stat.exists

    - name: "Read back the recorded state for {{ telegram_topic_pins_key }}"
      ansible.builtin.slurp:
        path: "{{ project_root }}/ansible/files/telegram-pins/{{ telegram_topic_pins_key }}"
      delegate_to: localhost
      become: false
      register: telegram_topic_pins_cache_read

    - name: "Parse the recorded state for {{ telegram_topic_pins_key }}"
      ansible.builtin.set_fact:
        telegram_topic_pins_message_id: "{{ (telegram_topic_pins_cache_read.content | b64decode).split()[0] }}"
        telegram_topic_pins_pinned: "{{ 'unpinned' not in (telegram_topic_pins_cache_read.content | b64decode).split()[1:] }}"

    - name: "Pin the header message for {{ telegram_topic_pins_key }}"
      ansible.builtin.uri:
        url: "{{ telegram_topic_pins_api_base }}/bot{{ telegram_token }}/pinChatMessage"
        method: POST
        body_format: json
        body:
          chat_id: "{{ telegram_chat_id }}"
          message_id: "{{ telegram_topic_pins_message_id }}"
          disable_notification: true
        status_code: 200
      delegate_to: localhost
      become: false
      no_log: true
      when: not telegram_topic_pins_pinned

    - name: "Record that the header is pinned for {{ telegram_topic_pins_key }}"
      ansible.builtin.copy:
        dest: "{{ project_root }}/ansible/files/telegram-pins/{{ telegram_topic_pins_key }}"
        content: "{{ telegram_topic_pins_message_id }} pinned\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: not telegram_topic_pins_pinned
  always:
    - name: "Release the pin-state lock for {{ telegram_topic_pins_key }}"
      ansible.builtin.file:
        path: "{{ project_root }}/ansible/files/telegram-pins/.lock-{{ telegram_topic_pins_key }}"
        state: absent
      delegate_to: localhost
      become: false
