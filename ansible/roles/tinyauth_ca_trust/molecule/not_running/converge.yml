---
- name: Converge
  hosts: all
  become: true
  vars:
    ansible_user: root
  tasks:
    # Deliberately no tinyauth target started at all — that's the whole
    # point of this scenario, unlike default's. The guard this tests is
    # the very first task in tinyauth_ca_trust/tasks/main.yaml, before
    # anything CA-bundle-related runs, so a throwaway step-ca isn't
    # needed here either.
    - name: "Run tinyauth_ca_trust [block / rescue] (no running tinyauth target, failure is deliberate and expected)"
      block:
        - name: Run tinyauth_ca_trust against a host with no tinyauth container
          ansible.builtin.include_role:
            name: tinyauth_ca_trust
          vars:
            tinyauth_ca_trust_container_name: tinyauth-test
      rescue:
        # A bare rescue: accepts ANY failure inside the block as "the
        # guard worked" — a Docker hiccup or an unrelated task erroring
        # out would leave the same halt marker behind and pass just as
        # happily as the real guard catching the missing container.
        # Assert on the exact task and reason before trusting the
        # "expected" label at all.
        - name: Confirm the failure came from the "no running tinyauth" guard itself
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Fail loudly if tinyauth isn't running yet"
              - "'No running \"tinyauth-test\" container found' in ansible_failed_result.msg"
            fail_msg: >-
              tinyauth_ca_trust failed, but not for the reason this
              scenario exists to test. Expected the "Fail loudly if
              tinyauth isn't running yet" task to fail naming
              "tinyauth-test"; got task
              "{{ ansible_failed_task.name | default('unknown') }}" with
              message: {{ ansible_failed_result.msg | default('(no msg)') }}

        - name: Leave a marker proving the guard actually caught the missing container
          ansible.builtin.copy:
            dest: /tmp/tinyauth_ca_trust_not_running_halt_marker
            content: "missing tinyauth target caught as expected\n"
            mode: "0644"
