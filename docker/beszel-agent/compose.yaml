name: beszel-agent

services:
  beszel-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:0.21-alpine@sha256:00612f32da51d84117a299d4ce18f7c661d51a8f1f2592d4f359cbcef3a94aa7
    container_name: beszel-agent
    volumes:
      - data:/var/lib/beszel-agent
    environment:
      DOCKER_HOST: tcp://localhost:2375
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/agent", "health" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: beszel-agent-dockerproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
    ports:
      - '127.0.0.1:2375:2375'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2375/version" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  data:
    external: true
    name: beszel-agent_data
