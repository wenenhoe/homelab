name: beszel-hub

services:
  beszel-hub:
    image: ghcr.io/henrygd/beszel/beszel:0.21@sha256:020d80f5974e66356e6d6440736952edc9b9ea59978ac9f98418b5fb643dc0e2
    container_name: beszel-hub
    volumes:
      - data:/beszel_data
    env_file:
      - .env
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      # Value must match this app's name in app_catalog.yaml exactly —
      # ansible/roles/backup_agent keys each app's stop label on it.
      - docker-volume-backup.stop-during-backup=beszel-hub
    cap_drop:
      - ALL
    expose:
      - '8090'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: beszel-hub_data
