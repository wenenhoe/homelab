name: cobalt

services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: cobalt
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/serverInfo" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - '9000'
    init: true
    read_only: true
networks:
  caddy-proxy:
    external: true
