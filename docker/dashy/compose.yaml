name: dashy

services:
  dashy:
    image: ghcr.io/lissy93/dashy:4.8.3@sha256:a877dd3d182b8d6b57aedbd879f2d1c0e76771be3ee54ff1ef4a8a725a09ed11
    container_name: dashy
    volumes:
      - data:/app/user-data
    environment:
      - NODE_ENV=production
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - /app/services/healthcheck.js
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: 1000:1000
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: dashy_data
