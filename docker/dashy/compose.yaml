name: dashy

services:
  dashy:
    image: ghcr.io/lissy93/dashy:4.9.0@sha256:e8725dc24acc9a1d6f09c2ed0499b596af5a1b4eac8c83e912c213da06011356
    container_name: dashy
    volumes:
      - data:/app/user-data
    environment:
      - NODE_ENV=production
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - /app/services/healthcheck.js
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: 1000:1000
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: dashy_data
