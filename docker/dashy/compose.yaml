name: dashy

services:
  dashy:
    image: ghcr.io/lissy93/dashy:4.9.12@sha256:0751a76392c1a171fe5b6c4e574c363ac6e24fc9d23df31d7c545ffc94ce44de
    container_name: dashy
    volumes:
      - data:/app/user-data
    environment:
      - NODE_ENV=production
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - /app/services/healthcheck.js
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: 1000:1000
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: dashy_data
