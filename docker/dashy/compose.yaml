name: dashy

services:
  dashy:
    image: ghcr.io/lissy93/dashy:4.9.8@sha256:a20a506fa6d77c06be2f4a83f7e7267d6ccd9fde3fd6d7f6aad7a0969ad0fe4a
    container_name: dashy
    volumes:
      - data:/app/user-data
    environment:
      - NODE_ENV=production
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - /app/services/healthcheck.js
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    user: 1000:1000
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: dashy_data
