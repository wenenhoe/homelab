name: gatus

services:
  gatus:
    image: ghcr.io/wenenhoe/gatus:5.38.0@sha256:ceaf187a1f19f2a8a07598de729e1f46342432f0c062c73caa3a8acbb1a38e0f
    container_name: gatus
    volumes:
      - data:/data
      - config:/config:ro
    env_file: .env
    networks:
      - caddy-proxy
    restart: unless-stopped
    # docker/gatus/Dockerfile adds the /wget this needs.
    healthcheck:
      test: [ "CMD", "/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Matches the image's own USER — see docker/gatus/Dockerfile.
    user: 10001:10001
    # Non-root with no file capabilities, and no ICMP check is configured, so
    # it needs no capability.
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: gatus_data
  config:
    external: true
    name: gatus_config
