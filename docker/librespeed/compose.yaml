name: librespeed

services:
  librespeed:
    image: ghcr.io/librespeed/speedtest:6.3.1@sha256:bc34bf69b6c102b23ab81b6e77beb7cce321fb0d3be33ec6e80edef3e9dd8bab
    container_name: librespeed
    environment:
      - MODE=standalone
      - TELEMETRY=false
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The entrypoint runs `rm -rf /var/www/html/*` on every start, then copies
    # the web root back and chowns it to www-data. When the container restarts
    # those files belong to www-data in a sticky directory, so root needs
    # FOWNER to remove the top level and DAC_OVERRIDE for the subdirectories;
    # without them the entrypoint exits and the container restarts forever.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
