name: minecraft

services:
  restore-backup:
    image: ghcr.io/itzg/mc-backup:2026.10.0
    volumes:
      - data:/data
      - backups:/backups:ro
    environment:
      UID: "1000"
      GID: "1000"
    network_mode: none
    entrypoint: restore-tar-backup
    restart: no
    # tar runs as root and restores owner and mode on every file. The image
    # resets an empty /data to root, but a world wiped with `rm -rf data/*`
    # leaves uid 1000's dotfiles, and then root needs DAC_OVERRIDE to write.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  data:
    external: true
    name: minecraft_data
  backups:
    external: true
    name: minecraft_backups
