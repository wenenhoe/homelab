name: minecraft

services:
  test-upgrade:
    image: ghcr.io/itzg/minecraft-server:java25@sha256:29d72be20e5287f84bc9927b03b3b80d813ba5a9e4e686b0e1817930c723d2dc
    volumes:
      - extras:/extras:ro
    environment:
      EULA: "TRUE"
      SETUP_ONLY: true
      VERSION: ${VERSION}
      TYPE: FABRIC
      MODRINTH_LOADER: fabric
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE: beta
      MODRINTH_MODPACK: simply-optimized-up-to-date
      MODRINTH_PROJECTS: "@/extras/modrinth-mods.txt"
    # Starts as uid 1000, the user mc runs as, so the image never needs
    # CHOWN, SETUID or SETGID to switch to it.
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  extras:
    external: true
    name: minecraft_extras
