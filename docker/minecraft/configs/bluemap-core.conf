# Every other core.conf key is left to BlueMap's own defaults (see
# https://bluemap.bluecolored.de/wiki/configs/Core.html) — omitted keys
# fall back to those defaults, not to nothing.
#
# accept-download defaults to false: BlueMap refuses to fetch the
# Mojang client jar it needs for textures/resources without this,
# which blocks it indefinitely on a fresh volume with no one present
# to edit the config interactively. True here is the operator (this
# repo's owner) accepting Mojang's EULA on BlueMap's behalf, once, for
# every future deploy.
accept-download: true
