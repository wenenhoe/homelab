name: shlink

services:
  shlink:
    image: ghcr.io/shlinkio/shlink:5.1.9@sha256:248d38c8d7fdba90d9e0c3c7ea9e73ef73ec9f54f7f46faf8f369153cc889aab
    container_name: shlink
    environment:
      DEFAULT_DOMAIN: ${APP_URL}
      DEFAULT_BASE_URL_REDIRECT: ${WEB_APP_URL}
      # Whether short URLs are generated with an https:// scheme, not
      # whether this container terminates TLS itself - Caddy does that in
      # front of it (see docker/caddy). Every APP_URL here is fronted by
      # Caddy over HTTPS, so this should say so.
      IS_HTTPS_ENABLED: true
      INITIAL_API_KEY: ${API_KEY}
      # GEOLITE_LICENSE_KEY:
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://shlink:8080/rest/v3/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
  shlink-web-client:
    image: ghcr.io/shlinkio/shlink-web-client:4.9.1@sha256:732c291bcc099d6ff51038bcfba374be87494fa2916683a44d3135ea57cbe935
    container_name: shlink-web-client
    environment:
      SHLINK_SERVER_URL: https://${APP_URL}
      SHLINK_SERVER_API_KEY: ${API_KEY}
    networks:
      - caddy-proxy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://shlink-web-client:8080/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    expose:
      - '8080'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
