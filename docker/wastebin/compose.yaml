name: wastebin

services:
  wastebin:
    image: ghcr.io/wenenhoe/wastebin:3.8.0@sha256:6b473386a935f52f8b9005c080671119025b4f1983df9b1e0ada0e7692e65336
    container_name: wastebin
    volumes:
      - data:/data
    environment:
      - WASTEBIN_DATABASE_PATH=/data/state.db
    networks:
      - caddy-proxy
    restart: always
    # docker/wastebin/Dockerfile adds the /wget this needs — see docs/topics/services/wastebin.md
    healthcheck:
      test: [ "CMD", "/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Matches the image's own USER (app:app, UID/GID 10001) — see
    # docker/wastebin/Dockerfile for why this has to match exactly.
    user: 10001:10001
    cap_drop:
      - ALL
    expose:
      - '8088'
    security_opt:
      - no-new-privileges:true
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: wastebin_data
