name: wastebin

services:
  wastebin:
    image: ghcr.io/wenenhoe/wastebin:3.7.2
    container_name: wastebin
    volumes:
      - data:/data
    environment:
      - WASTEBIN_DATABASE_PATH=/data/state.db
    networks:
      - caddy-proxy
    restart: always
    # docker/wastebin/Dockerfile adds the /wget this needs — see docs/wastebin.md
    healthcheck:
      test: [ "CMD", "/wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Matches the image's own USER (app:app, UID/GID 10001) — see
    # docker/wastebin/Dockerfile for why this has to match exactly.
    user: 10001:10001
    expose:
      - '8088'
networks:
  caddy-proxy:
    external: true
volumes:
  data:
    external: true
    name: wastebin_data
