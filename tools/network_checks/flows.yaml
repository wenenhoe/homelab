  # The desktops reach the Minecraft server and the KMS host, and no other zone does (the play's flows from the desktops to `play` and `services`).
  # The control of each deny is the desktops' own allow flow. The services zone holds both hosts, so its own traffic is
  # switched on the bridge and never reaches the gateway. Each passes only while something listens on the host, so they carry
  # the `listener` tag, which a run that must not depend on the service being up leaves out.
  - id: desktops-play-minecraft
    from: desktops
    to: {address: 192.168.20.4, port: 25565}
    kind: connect
    expect: allow
    tags: [desktops, listener]
  - id: management-to-play-minecraft-denied
    from: management
    to: {address: 192.168.20.4, port: 25565}
    kind: connect
    expect: deny
    control: desktops-play-minecraft
    tags: [cross-zone, listener]
  - id: isolated-to-play-minecraft-denied
    from: isolated
    to: {address: 192.168.20.4, port: 25565}
    kind: connect
    expect: deny
    control: desktops-play-minecraft
    tags: [cross-zone, listener]
  - id: experimental-to-play-minecraft-denied
