    to: {address: 192.168.55.8, port: 22}
    kind: connect
    expect: allow
    tags: [experimental]
  - id: dmz-canary-ssh
    from: dmz
    to: {address: 192.168.35.8, port: 22}
    kind: connect
    expect: allow
    tags: [dmz]

  # Internet over 443 from the zones that have it. The isolated zone has none, and its control is a zone that does.
  - id: services-internet-https
    from: services
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: allow
    tags: [smoke, services]
  - id: management-internet-https
    from: management
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: allow
    tags: [management]
  - id: desktops-internet-https
    from: desktops
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: allow
    tags: [desktops]
  - id: isolated-internet-denied
    from: isolated
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: deny
    control: services-internet-https
    tags: [cross-zone]
  - id: experimental-internet-https
    from: experimental
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: allow
    tags: [experimental]
  - id: dmz-internet-https
    from: dmz
    to: {address: 1.1.1.1, port: 443}
    kind: connect
    expect: allow
    tags: [dmz]

  # Default-deny between zones: no zone's canary reaches another zone's canary. The control is that canary reaching itself.
  - id: services-to-management-canary-denied
